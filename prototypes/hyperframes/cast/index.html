<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The starting file for a beat on the shared cast kit (videos/_shared/web/cast/cast.js),
         and the sign-off frame for the look: the human, the agent and the janitor on one floor,
         the three layer props under them (agent notes, the human's board, the curated case),
         and the model with its four pipes beside the map card. Copy this file for a beat and
         keep only the parts the beat needs. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.0;
  const { seg } = ISO;
  const { PAL } = CAST;
  const root = document.getElementById("root");
  const svg = CAST.layer(root);
  const E = ISO.E();
  // ---- the cast, on one floor (feet at y 760) ----
  const FLOOR = 760, FIG = 0.92;
  CAST.line(svg, 90, FLOOR + 6, 930, FLOOR + 6, { stroke: PAL.muted, "stroke-width": 5, "stroke-linecap": "round" });
  const human = CAST.human(svg, { x: 230, y: FLOOR, s: FIG });
  const agent = CAST.agent(svg, { x: 507, y: FLOOR, s: FIG });
  const janitor = CAST.janitor(svg, { x: 760, y: FLOOR, s: FIG });
  // ---- the three layers ----
  const notes = CAST.page(svg, { x: 80, y: 900, s: 0.95 });
  const board = CAST.board(svg, { x: 372, y: 900, s: 0.9 });
  const vit = CAST.vitrine(svg, { x: 700, y: 900, s: 0.85 });
  // ---- the model and the map ----
  const model = CAST.blob(svg, { x: 230, y: 1420, s: 0.5, pipe: 90 });
  const map = CAST.mapCard(svg, { x: 560, y: 1360, s: 0.75, ghost: 0 });
  // ---- labels (DOM text, 60 px) ----
  const lab = (t, cx, top) => ISO.label(root, t, { size: 60, left: cx - 150, top, width: 300 });
  lab("Human", 230, 790); lab("Agent", 507, 790); lab("Janitor", 790, 790);
  lab("Notes", 203, 1235); lab("Board", 516, 1235); lab("Rules", 823, 1235);
  ISO.guides(root);
  function render(t) {
    const wave = E.io(seg(t, 0.1, 0.9));                              // the human waves at the agent
    CAST.pose(human, { armR: 22 + 118 * wave, tilt: 6 * wave });
    CAST.blink(agent, seg(t, 0.95, 1.05) > 0 && seg(t, 0.95, 1.05) < 1 ? 1 : 0);
    const sweep = Math.sin(Math.PI * E.io(seg(t, 0.2, 1.4)));         // one sweep, back to rest by 1.4 s
    CAST.pose(janitor, { lean: 7 * sweep, armR: 24 + 8 * sweep });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
