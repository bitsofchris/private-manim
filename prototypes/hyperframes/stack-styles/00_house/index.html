<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Control for the stack-styles exploration: the current house style
         (videos/005-transformer-short/06_stack.py) rebuilt in HyperFrames.
         Palette from videos/_shared/style.py. Offline: GSAP and Inter are vendored. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0b0b14; --panel: #14142b; --text: #ecebe4; --dim: #8a8fb0; --data: #2dd4bf; --hero: #c084fc; --muted: #4a5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      .block { position: absolute; left: 90px; width: 835px; border-radius: 26px; background: var(--panel);
               border: 5px solid var(--dim); }
      .tag { position: absolute; left: 36px; font-size: 60px; line-height: 70px; color: var(--dim); }
      #b1 { top: 250px; height: 520px; }
      #b1 .tag { top: 8px; }
      #b2 { top: 800px; height: 110px; }
      #b3 { top: 940px; height: 110px; }
      #b2 .tag, #b3 .tag { top: 15px; }
      #matrix { position: absolute; left: 163px; top: 340px; width: 688px; }
      .words, .row { display: flex; justify-content: space-between; }
      .words div { width: 220px; height: 70px; text-align: center; font-size: 64px; line-height: 70px; }
      .cell { position: relative; width: 220px; height: 96px; margin-top: 14px; border-radius: 8px;
              background: #23233f; overflow: hidden; font-variant-numeric: tabular-nums; }
      .cell i { position: absolute; inset: 0; background: var(--data); }
      .cell b { position: absolute; inset: 0; font-size: 64px; line-height: 96px; text-align: center; font-weight: 800; }
      #brackets { position: absolute; left: 0; top: 0; }
      #flow { position: absolute; left: 110px; top: 0; width: 795px; height: 12px; border-radius: 6px; background: var(--hero); }
      #guides { position: absolute; inset: 0; display: none; pointer-events: none; }
      #guides.on { display: block; }
      #guides div { position: absolute; background: rgba(255, 60, 60, 0.18); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-fps="30" data-width="1080" data-height="1920">
      <div class="block" id="b1"><div class="tag" id="t1">block 1</div></div>
      <div class="block" id="b2"><div class="tag" id="t2">block 2</div></div>
      <div class="block" id="b3"><div class="tag" id="t3">block 3</div></div>
      <div id="matrix"><div class="words"></div></div>
      <svg id="brackets" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#8a8fb0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M150 416H134V754H150" /><path d="M864 416H880V754H864" />
        </g>
      </svg>
      <div id="flow"></div>
      <div id="guides">
        <div style="left:0;top:0;width:1080px;height:230px"></div>
        <div style="left:0;top:1536px;width:1080px;height:384px"></div>
        <div style="left:950px;top:230px;width:130px;height:1306px"></div>
        <div style="left:0;top:230px;width:65px;height:1306px"></div>
      </div>
    </div>
    <script>
(() => {
  // ---- the contract: same data and cues in every style ----
  const BEAT_SECONDS = 5.0;
  const DATA = {
    tokens: ["my", "name", "is"],
    before: [[0.4, 0.6, -0.4], [-0.6, -0.2, 0.8], [0.1, 0.4, -0.5]],
    after:  [[0.0, 0.3, 0.2], [-0.2, -0.6, 0.1], [0.6, -0.2, 0.1]],
  };
  // VO: "Now each block receives the previous block's output / and continues to refine it further."
  const CUE = {
    blocks: 1.1,  /* "previous block's output": blocks 2 and 3 stack in */
    refine: 2.6,  /* "refine": the flow line sweeps down the stack */
    still: 4.4,   /* nothing moves after this */
  };
  const SWEEP = 1.2;                         // seconds the flow line takes
  const FLOW_Y = { from: 410, to: 1056 };    // matrix top -> block 3 bottom
  // the line is inside block 1 / 2 / 3 at these fractions of the sweep
  const PASS = [0.28, 0.66, 0.92];

  const $ = (id) => document.getElementById(id);
  if (/[?&]guides/.test(location.search)) $("guides").classList.add("on");
  const fmt = (v) => (v > -0.05 ? "+" : "−") + Math.abs(v).toFixed(1);
  const lerp = (a, b, u) => a + (b - a) * u;
  const clamp01 = (u) => Math.max(0, Math.min(1, u));
  const smooth = (u) => { u = clamp01(u); return u * u * (3 - 2 * u); };

  const m = $("matrix"), words = m.querySelector(".words"), cells = [];
  DATA.tokens.forEach((w) => { const d = document.createElement("div"); d.textContent = w; words.appendChild(d); });
  for (let r = 0; r < 3; r++) {
    const row = document.createElement("div"); row.className = "row"; m.appendChild(row);
    for (let c = 0; c < 3; c++) {
      const d = document.createElement("div"); d.className = "cell";
      const fill = document.createElement("i"), num = document.createElement("b");
      d.append(fill, num); row.appendChild(d); cells.push({ fill, num, c, r });
    }
  }

  // every frame is a pure function of t
  function render(tRaw) {
    const t = Math.min(tRaw, CUE.still);
    const s = (t - CUE.refine) / SWEEP;       // sweep progress
    // three refinements, one as the line passes each block
    const u = PASS.reduce((acc, p) => acc + smooth((s - p + 0.1) / 0.2), 0) / 3;
    cells.forEach(({ fill, num, c, r }) => {
      const v = Math.round(lerp(DATA.before[c][r], DATA.after[c][r], u) * 10) / 10;
      num.textContent = fmt(v);
      fill.style.opacity = (Math.max(0, v) / 0.9 * 0.55).toFixed(3); // teal = how positive; capped so the ink keeps 3:1
    });
  }

  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  // block 1 closes around the matrix
  tl.fromTo("#b1", { scale: 1.08, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "power2.out" }, 0);
  // "previous block's output": two more blocks stack below
  tl.fromTo(["#b2", "#b3"], { y: -50, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, stagger: 0.25, ease: "power2.out" }, CUE.blocks);
  // "refine it further": the flow sweeps down; each block's tag lights as the line passes
  tl.fromTo("#flow", { y: FLOW_Y.from, opacity: 0 }, { y: FLOW_Y.to, opacity: 1, duration: SWEEP, ease: "none" }, CUE.refine);
  tl.fromTo("#flow", { scaleX: 0.9 }, { scaleX: 1, duration: 0.2 }, CUE.refine);
  tl.to("#flow", { opacity: 0, duration: 0.2 }, CUE.refine + SWEEP - 0.1);
  ["#t1", "#t2", "#t3"].forEach((id, i) => {
    const at = CUE.refine + SWEEP * PASS[i] - 0.1;
    tl.to(id, { color: "#ecebe4", duration: 0.15 }, at);
    tl.to(id, { color: "#2dd4bf", duration: 0.3 }, at + 0.3);
  });
  tl.set({}, {}, BEAT_SECONDS);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
  render(0);
})();
    </script>
  </body>
</html>
