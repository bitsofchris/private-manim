<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Style 04: editorial precision (light mode), "the layer slider".
         Depth is a parameter you scrub: a slider steps the matrix through the blocks.
         Everything sits on one 740 px measure (x 140-880). Offline: GSAP and Inter are vendored. -->
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --paper: #fff1e5; --ink: #33302e; --hair: #cfc6ba; --claret: #990f3d; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--paper);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--ink);
              font-variant-numeric: tabular-nums; }
      .rule { position: absolute; left: 140px; width: 740px; height: 2px; background: var(--hair); }
      .rule.ink { background: var(--ink); }
      #fig { position: absolute; left: 140px; top: 250px; font-size: 60px; line-height: 70px; letter-spacing: -1px; }
      #words { position: absolute; left: 140px; top: 340px; width: 740px;
               display: grid; grid-template-columns: repeat(3, 238px); column-gap: 13px; }
      #words div { font-size: 72px; line-height: 84px; text-align: center; letter-spacing: -1px; }
      #grid { position: absolute; left: 140px; top: 446px; width: 740px;
              display: grid; grid-template-columns: repeat(3, 238px); grid-auto-rows: 120px; gap: 13px; }
      .cell { border-radius: 12px; border: 2px solid var(--hair); font-size: 72px; line-height: 116px;
              text-align: center; letter-spacing: -1px; }
      #label { position: absolute; left: 140px; top: 850px; font-size: 60px; line-height: 70px; letter-spacing: -1px; }
      #track { position: absolute; left: 140px; top: 961px; width: 740px; height: 2px; background: var(--ink); }
      #fill { position: absolute; left: 140px; top: 958px; width: 740px; height: 8px; background: var(--ink);
              transform-origin: left center; }
      .tick { position: absolute; top: 946px; width: 2px; height: 32px; margin-left: -1px; background: var(--ink); }
      .tnum { position: absolute; top: 1000px; width: 120px; margin-left: -60px; text-align: center;
              font-size: 60px; line-height: 70px; }
      #knob { position: absolute; left: 112px; top: 934px; width: 56px; height: 56px; border-radius: 50%;
              background: var(--claret); border: 4px solid var(--paper); }
      #guides { position: absolute; inset: 0; display: none; pointer-events: none; }
      #guides.on { display: block; }
      #guides div { position: absolute; background: rgba(255, 60, 60, 0.18); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-fps="30" data-width="1080" data-height="1920">
      <div class="rule ink" style="top: 238px"></div>
      <div id="fig">Fig. 6</div>
      <div id="words"></div>
      <div class="rule" style="top: 430px"></div>
      <div id="grid"></div>
      <div id="label">block</div>
      <div id="track"></div>
      <div id="fill"></div>
      <div id="ticks"></div>
      <div id="knob"></div>
      <div class="rule" style="top: 1090px"></div>
      <div id="guides">
        <div style="left:0;top:0;width:1080px;height:230px"></div>
        <div style="left:0;top:1536px;width:1080px;height:384px"></div>
        <div style="left:950px;top:230px;width:130px;height:1306px"></div>
        <div style="left:0;top:230px;width:65px;height:1306px"></div>
      </div>
    </div>
    <script>
(() => {
  // ---- the contract: same data and cues in every style ----
  const BEAT_SECONDS = 5.0;
  const DATA = {
    tokens: ["my", "name", "is"],
    // values[col][row]: before = what block 1 receives, after = what the stack hands on
    before: [[0.4, 0.6, -0.4], [-0.6, -0.2, 0.8], [0.1, 0.4, -0.5]],
    after:  [[0.0, 0.3, 0.2], [-0.2, -0.6, 0.1], [0.6, -0.2, 0.1]],
  };
  // VO: "Now each block receives the previous block's output / and continues to refine it further."
  const CUE = {
    blocks: 1.1,  /* "previous block's output": the stack is established */
    refine: 2.6,  /* "refine": the matrix passes through, numbers change */
    still: 4.4,   /* nothing moves after this */
  };
  const $ = (id) => document.getElementById(id);
  if (/[?&]guides/.test(location.search)) $("guides").classList.add("on");
  const fmt = (v) => { const r = Math.round(v * 10) / 10; return (r >= 0 ? "+" : "−") + Math.abs(r).toFixed(1); };
  const lerp = (a, b, u) => a + (b - a) * u;
  const clamp01 = (u) => Math.max(0, Math.min(1, u));

  // ---- style constants ----
  const PAPER = "#FFF1E5", INK = "#33302E";
  const BLUE = "#2C6FBB", MID = "#F3EEE6", ORANGE = "#E4572E";
  const DOMAIN = 0.8;                       // |value| that reaches the end of the diverging scale
  const TRACK_X = 140, TRACK_W = 740, STEP = TRACK_W / 3;
  const toBlue = gsap.utils.interpolate(MID, BLUE), toOrange = gsap.utils.interpolate(MID, ORANGE);
  const colour = (v) => { const n = Math.max(-1, Math.min(1, v / DOMAIN)); return n < 0 ? toBlue(-n) : toOrange(n); };
  const lum = (css) => {
    const [r, g, b] = gsap.utils.splitColor(css).map((c) => { c /= 255; return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const L_INK = lum(INK), L_PAPER = lum(PAPER);
  const digitOn = (fill) => { const l = lum(fill); return (l + 0.05) / (L_INK + 0.05) >= (L_PAPER + 0.05) / (l + 0.05) ? INK : PAPER; };

  // ---- build ----
  DATA.tokens.forEach((w) => { const d = document.createElement("div"); d.textContent = w; $("words").appendChild(d); });
  const cells = [];
  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
    const d = document.createElement("div"); d.className = "cell"; $("grid").appendChild(d);
    cells.push({ el: d, b: DATA.before[c][r], a: DATA.after[c][r] });
  }
  const nums = [];
  for (let i = 0; i < 4; i++) {
    const x = TRACK_X + i * STEP;
    const tk = document.createElement("div"); tk.className = "tick"; tk.style.left = x + "px"; $("ticks").appendChild(tk);
    const n = document.createElement("div"); n.className = "tnum"; n.style.left = x + "px"; n.textContent = i; $("ticks").appendChild(n);
    nums.push(n);
  }

  // ---- state the timeline scrubs: p = slider position in blocks, g = ghost strength ----
  const S = { p: 0, g: 1 };

  // every frame is a pure function of the timeline state
  function render() {
    const p = S.p, k = Math.min(3, Math.floor(p + 1e-6)), frac = Math.max(0, p - k);
    $("knob").style.transform = "translateX(" + (p * STEP).toFixed(2) + "px)";
    $("fill").style.transform = "scaleX(" + (p / 3).toFixed(4) + ")";
    nums.forEach((n, i) => { n.style.opacity = Math.abs(p - i) < 0.5 ? 1 : 0.42; });
    cells.forEach(({ el, b, a }) => {
      const v = lerp(b, a, p / 3);
      const fill = colour(v);
      // ghost ring = the previous block's output; while the knob travels it hands over to the block being left
      const older = colour(lerp(b, a, Math.max(k - 1, 0) / 3)), leaving = colour(lerp(b, a, k / 3));
      const ghost = gsap.utils.interpolate(older, leaving, clamp01(frac * 2));
      const [gr, gg, gb] = gsap.utils.splitColor(ghost);
      el.textContent = fmt(v);
      el.style.backgroundColor = fill;
      el.style.color = digitOn(fill);
      el.style.boxShadow = "inset 0 0 0 6px " + fill + ", inset 0 0 0 10px rgba(" + gr + "," + gg + "," + gb + "," + S.g.toFixed(3) + ")";
    });
  }

  const tl = gsap.timeline({ paused: true, onUpdate: render });
  tl.to(S, { p: 1, duration: 0.8, ease: "power2.inOut" }, 0);                 // block 1 refines; settled before CUE.blocks
  tl.to(S, { p: 2, duration: 0.5, ease: "power2.inOut" }, CUE.refine);        // 2.6 - 3.1
  tl.to(S, { p: 3, duration: 0.5, ease: "power2.inOut" }, CUE.refine + 0.7);  // 3.3 - 3.8
  tl.to(S, { g: 0.3, duration: 0.5, ease: "power2.out" }, CUE.still - 0.5);   // ghosts settle, then still
  tl.set({}, {}, BEAT_SECONDS);

  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
  render();
})();
    </script>
  </body>
</html>
