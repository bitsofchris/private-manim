<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 beat 2 "Layer" (master 6.185–14.250): opens on the hook's end (network still, grid lit, y all done, hero chip).
         "layer" (7.14): y empties and the hero becomes the network's first layer (its 16 edges and 4 output nodes).
         "y equals x times W": y, x, W swell once each in turn. "output" (9.80): hero ycell, pick 6: output node 2 and
         y cell 6 (an empty magenta outline); "row" (11.16): x's row 1 goes magenta; "column" (12.00): W's column 2 and
         the 4 edges into node 2 go magenta and the cell fills. "None" (12.87 onset): every y cell fills at once,
         hero y. Still from there to the end. Opens SC.SEAM[1], ends SC.SEAM[2]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0;
              --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.065" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.065, MASTER = 6.185;
  // cues (beat-local = master - MASTER; "None" checked on the vo_final envelope: onset 12.87)
  const CUE = {
    layer: 0.955,    /* "layer" (7.14): y empties, hero -> layer (the network's first layer) */
    y: 1.575,        /* "y" (7.76): the y letter swells */
    x: 2.035,        /* "x" (8.22): the x letter swells */
    W: 2.595,        /* "W" (8.78): the W letter swells */
    output: 3.615,   /* "output" (9.80): hero ycell, output node 2 + y cell 6 outlined magenta (still empty) */
    row: 4.975,      /* "row" (11.16): x's row 1 goes magenta */
    column: 5.815,   /* "column" (12.00): W's column 2 + node 2's incoming edges go magenta, cell 6 fills */
    none: 6.685,     /* "None" (12.87 onset; words.json 12.96): every y cell fills at once, hero y = SEAM[2] */
  };
  const PICK = 6, PW = 0.4;      // y cell 6 = row 1 of x, column 2 of W; letter swell width
  const ALL = "1".repeat(16), NONE = "0".repeat(16);
  const ONE = NONE.slice(0, PICK) + "1" + NONE.slice(PICK + 1);
  const root = document.getElementById("root");
  const kit = EP.mount(root);
  const { PAL } = SC;
  const pulse = (t, t0, w) => (t <= t0 || t >= t0 + w ? 0 : Math.sin(Math.PI * (t - t0) / w));   // local helper
  // local helper: scale one DOM label about its centre; s === 1 clears exactly
  function swell(el, s) {
    if (s === 1) { el.style.transform = ""; el.style.transformOrigin = ""; return; }
    el.style.transformOrigin = "50% 50%"; el.style.transform = `scale(${s.toFixed(4)})`;
  }
  function state(t) {
    if (t <= 0 || t < CUE.layer) return SC.SEAM[1];
    if (t >= CUE.none) return SC.SEAM[2];
    if (t < CUE.output) return Object.assign({}, SC.SEAM[1], { hero: "layer", fill: NONE });
    return Object.assign({}, SC.SEAM[1], { hero: "ycell", pick: PICK, fill: t >= CUE.column ? ONE : NONE });
  }
  // local helper: stage the ycell hero word by word. The kit lights row, column and cell together;
  // before "row" / "column" the row / column (and node 2's incoming edges) stay grey, and before "column" the cell is an empty magenta outline.
  function stage(t) {
    const yc = kit.mats.y[PICK];
    const on = t >= CUE.output && t < CUE.none;
    yc.setAttribute("stroke", on && t < CUE.column ? PAL.hero : "none");
    yc.setAttribute("stroke-width", 4);
    if (!on) return;
    if (t < CUE.column) yc.setAttribute("fill", PAL.off);
    const i = Math.floor(PICK / 4), j = PICK % 4;
    if (t < CUE.row) kit.mats.x.forEach((r, n) => { if (Math.floor(n / 4) === i) r.setAttribute("fill", PAL.muted); });
    if (t < CUE.column) {
      kit.mats.W.forEach((r, n) => { if (n % 4 === j) r.setAttribute("fill", PAL.muted); });
      kit.net.edges[0].forEach((e) => { if (e.j === j) e.el.setAttribute("stroke", PAL.muted); });   // as drawn with flow 0
    }
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(state(t));
    stage(t);
    const L = kit.letters;   // [y, =, x, @, W]
    swell(L[0], 1 + 0.25 * pulse(t, CUE.y, PW));
    swell(L[2], 1 + 0.25 * pulse(t, CUE.x, PW));
    swell(L[4], 1 + 0.25 * pulse(t, CUE.W, PW));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
