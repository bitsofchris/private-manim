<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 00_layout: ep 1's frame 0 and every seam state, one per second (SEAM[k] at k–k+1 s;
         0–1 s runs frame 0 with its shimmer), then beat 2's two network states: 7–8 s "one layer", 8–9 s
         "row times column" (output node 2, its incoming weights, x row 1, W column 2, y cell 6). Not in the Short. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 9;
  const kit = EP.mount(document.getElementById("root"));
  function render(t) {
    SC.clock = t;
    const net = { net: 1, cpu4: 0, lit: 1 };
    if (t < 7) kit.draw(SC.SEAM[Math.floor(t)]);
    else if (t < 8) kit.draw({ ...net, hero: "layer" });
    else kit.draw({ ...net, hero: "ycell", pick: 6, fill: "0000001000000000" });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
