<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_layout: ep 2's frame 0 and every seam state, then the new parts mid-move, 1 s each. Not in the Short.
         0–9 s   SEAM[0] … SEAM[9]
         10 s    core op: 3.0 carried, `3.0 + 0.5 = 3.5`, 2 FLOPs     11 s  acro mid-unpack
         12 s    stream, memory the hero                             13 s  count rolling
         14 s    rate clock half-swept                               15 s  core dot, pair 2 adding -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 16;
  const kit = EP.mount(document.getElementById("root"));
  const M = (n, o) => Object.assign({}, SC.SEAM[n], o);
  const extra = [
    M(0, { core: Object.assign({}, SC.SEAM[0].core, { mul: 1, carry: 1, add: 1, n: 2, lit: "add" }) }),
    M(1, { hero: "acronym", acro: { o: 1, u: 0.55 } }),
    M(5, { stream: { o: 1, phase: 1.3 } }),
    M(6, { card: { o: 1, A: { kind: "count", o2: 1, v: 0.62 }, B: null, mix: 0 } }),
    M(7, { card: { o: 1, A: { kind: "rate", clock: 0.5, clockO: 1 }, B: null, mix: 0 } }),
    M(8, { hero: "expr", lit: SC.REST.lit, core: { o: 1, grow: 1, mode: "dot", step: 1.6 } }),
  ];
  function render(t) {
    SC.clock = t;
    const i = Math.min(15, Math.floor(t));
    kit.draw(i < 10 ? SC.SEAM[i] : extra[i - 10]);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
