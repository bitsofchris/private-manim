<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 07_rate (cut 6 → 7, master 26.685–29.865): "FLOPS with a capital S is per second. This is a rate."
         "FLOPS": the card crossfades to `FLOPS` / `per second`, the capital S the hero; the code line goes ink.
         "second": the 1 s clock appears at the card's right (0.2 s) and sweeps once (1.0 s), the hero.
         Still (SEAM[7]) from 2.80 s. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.18" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.180, MASTER = 26.685;
  const kit = EP.mount(document.getElementById("root"));
  const { seg } = SC;
  // beat-local cues (master − 26.685), from words.json, checked on a 20 ms RMS envelope
  const CUE = {
    rate: 0.30,    /* "FLOPS" 32.62: card → FLOPS / per second, hero the S, code line unlit */
    sec: 1.74,     /* "second" 34.06: the 1 s clock appears and sweeps, hero the clock */
  };
  const MIX = 0.3, POP = 0.2, SWEEP = 1.0;
  const STILL = CUE.sec + SWEEP + 0.06;            // 2.80: SC.SEAM[7] from here, untouched (last 0.38 s)
  const ease = (u) => u * u * (3 - 2 * u);
  const COUNT = SC.SEAM[6].card.A, CODE = SC.SEAM[6].code;

  function state(t) {
    if (t <= 0) return SC.SEAM[6];
    if (t >= STILL) return SC.SEAM[7];
    const S = { cpu: 0, queueO: 0, strip: 0, shimmer: 1 };
    const RATE = { kind: "rate", clockO: ease(seg(t, CUE.sec, CUE.sec + POP)), clock: seg(t, CUE.sec, CUE.sec + SWEEP) };
    const m = ease(seg(t, CUE.rate, CUE.rate + MIX));
    S.card = t < CUE.rate ? { o: 1, A: COUNT, B: null, mix: 0 }
           : m < 1 ? { o: 1, A: COUNT, B: RATE, mix: m }
           : { o: 1, A: RATE, B: null, mix: 0 };
    S.hero = t < CUE.rate ? null : t < CUE.sec ? "S" : "clock";
    S.code = Object.assign({}, CODE, { lit: t < CUE.rate ? "count" : null });
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
