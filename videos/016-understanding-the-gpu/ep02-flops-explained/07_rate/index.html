<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 07_rate (cut 6 → 7, master 32.320–41.955): "FLOPS with a capital S is per second. This is a rate.
         A B200 peaks near 2,250 teraFLOPS in bf16. Tera is a trillion."
         "FLOPS": the card crossfades to `FLOPS` / `per second`, the capital S the hero; the code line goes ink.
         "B200": the chip title GPU → B200 (hero the chip). "2,250": the card crossfades to `2,250 TFLOPS` / `bf16`,
         the number the hero. "Tera": the second line becomes `tera = a trillion`, the hero narrows to the T.
         Still (SEAM[7]) from 8.90 s. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.635" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 9.635, MASTER = 32.320;
  const kit = EP.mount(document.getElementById("root"));
  const { seg } = SC;
  // beat-local cues (master − 32.320), from words.json, checked on a 20–40 ms RMS envelope
  const CUE = {
    rate: 0.30,    /* "FLOPS" 32.62: card → FLOPS / per second, hero the S, code line unlit */
    b200: 3.62,    /* "B200" 35.94: chip title GPU → B200, hero the chip */
    spec: 5.14,    /* "2,250" 37.46 (words.json 37.26 is the end of "near"; the "t" lands at 37.46) */
    tera: 8.52,    /* "Tera" 40.84: second line → tera = a trillion, hero the T */
  };
  const MIX = 0.3;
  const STILL = CUE.tera + MIX + 0.08;             // 8.90: SC.SEAM[7] from here, untouched
  const ease = (u) => u * u * (3 - 2 * u);
  const COUNT = SC.SEAM[6].card.A, CODE = SC.SEAM[6].code;
  const R = [{ kind: "rate", step: 0 }, { kind: "rate", step: 1 }, { kind: "rate", step: 2 }];
  // one crossfade from content `from` to `to`, starting at `at`
  function swap(t, at, from, to) {
    const m = ease(seg(t, at, at + MIX));
    return m <= 0 ? { o: 1, A: from, B: null, mix: 0 } : m < 1 ? { o: 1, A: from, B: to, mix: m } : { o: 1, A: to, B: null, mix: 0 };
  }

  function state(t) {
    if (t <= 0) return SC.SEAM[6];
    if (t >= STILL) return SC.SEAM[7];
    const S = { cpu: 0, queueO: 0, strip: 0, shimmer: 1 };
    S.card = t < CUE.spec ? swap(t, CUE.rate, COUNT, R[0]) : t < CUE.tera ? swap(t, CUE.spec, R[0], R[1]) : swap(t, CUE.tera, R[1], R[2]);
    S.hero = t < CUE.rate ? null : t < CUE.b200 ? "S" : t < CUE.spec ? "chip" : t < CUE.tera ? "spec" : "tera";
    if (t >= CUE.b200) S.title = "B200";
    S.code = Object.assign({}, CODE, { lit: t < CUE.rate ? "count" : null });
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
