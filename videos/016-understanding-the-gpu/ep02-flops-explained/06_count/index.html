<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_count (cut 5 → 6, master 23.190–32.320): "FLOPs with a small s is a count. Training an 8 billion
         parameter model on 15,000 tokens costs about 720 trillion FLOPs."
         "FLOPs": the card crossfades `gradients` → `FLOPs`. "s": hero memory → the small s.
         "Training": the code card grows in under the chip, line 1 types (lit "count": the hero passes
         from the s to the line, S.hero → null), its last keystroke on "720"; under `FLOPs` the count fades in
         and rolls up (card.A.v = typed share, mono digits) one step per keystroke, landing on "720" as
         `720 trillion = 7.2 × 10¹⁴`. Still (SEAM[6]) from 7.00 s. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.13" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 9.130, MASTER = 23.190;
  const kit = EP.mount(document.getElementById("root"));
  const { seg } = SC;
  // beat-local cues (master − 23.190), from words.json; "720" checked on a 20 ms RMS envelope (its s at 30.02–30.10)
  const CUE = {
    flops: 0.33,   /* "FLOPs" 23.52: the card crossfades to FLOPs */
    s: 1.17,       /* "s" 24.36: hero memory → the small s */
    train: 2.75,   /* "Training" 25.94: the code card grows in; the line takes the hero */
    n720: 6.91,    /* "720" 30.10: the rolling count lands, `720 trillion = 7.2 × 10¹⁴` */
  };
  const MIX = 0.3, GROW = 0.2;
  const TYPE_FROM = CUE.train + GROW, CPS = 7.45;  // 35 characters in 3.954 s: the last keystroke lands at 6.904, on "720"
  const LINES = SC.D.code.flops, L1 = LINES[0].t.length;
  const STILL = 7.00;                              // just after "720": SC.SEAM[6] from here, untouched
  const ease = (u) => u * u * (3 - 2 * u);
  const WORD = { kind: "word", word: "gradients" };
  const codeCard = kit.code.card;

  function state(t) {
    if (t <= 0) return SC.SEAM[5];
    if (t >= STILL) return SC.SEAM[6];
    const S = { cpu: 0, queueO: 0, strip: 0, shimmer: 1 };
    // top card: gradients → FLOPs (row 2 off); from "Training" the count fades in with the code card and
    // rolls up one step per keystroke (v = typed / L1); the last keystroke lands on "720" (v 1: the kit's
    // `720 trillion = 7.2 × 10¹⁴`)
    const typed = t < CUE.train ? 0 : Math.min(L1, SC_typedAt(LINES, t - TYPE_FROM, CPS));
    const m = ease(seg(t, CUE.flops, CUE.flops + MIX)), o2 = ease(seg(t, CUE.train, CUE.train + GROW));
    const COUNT = t < CUE.train ? { kind: "count", o2: 0 } : { kind: "count", o2, v: typed / L1 };
    S.card = t < CUE.flops ? { o: 1, A: WORD, B: null, mix: 0 }
           : m < 1 ? { o: 1, A: WORD, B: COUNT, mix: m }
           : { o: 1, A: COUNT, B: null, mix: 0 };
    // hero: memory, then the s, then the code line (code.lit, so S.hero null)
    S.hero = t < CUE.s ? "hbm" : t < CUE.train ? "s" : null;
    if (t >= CUE.train) {
      S.code = { o: ease(seg(t, CUE.train, CUE.train + GROW)), lines: LINES, typed, lit: "count",
                 cursor: typed < L1 ? 1 : 0, blink: t - TYPE_FROM, cy: 1245 };
    }
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(state(t));
    // the code card grows in from 0.85 of its size over GROW (opacity rides along in S.code.o)
    const g = seg(t, CUE.train, CUE.train + GROW);
    codeCard.style.transform = g > 0 && g < 1 ? `scale(${(0.85 + 0.15 * ease(g)).toFixed(4)})` : "";
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
