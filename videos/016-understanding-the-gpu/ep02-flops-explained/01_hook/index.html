<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_hook (0.000–5.640): "A FLOP is one multiply or one add, and it's the unit that all
         AI compute is measured in." Opens on SC.SEAM[0] (a × b + c, counter 0, the counter the hero,
         the chip already working). "multiply" lights × teal and the counter steps to 1; "add" lights + (× back) and
         steps to 2; + back to ink on "and" (by "unit"); SC.SEAM[1] still from there to the end. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.64" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.64, START = 0;
  // cues, beat-local (master - START), from words.json
  const CUE = {
    mul: 1.32,     /* "multiply" 1.32 */
    add: 2.24,     /* "add," 2.24 */
    unlit: 3.04,   /* "and" 3.04: + back to ink, done by "unit" 3.34 */
  };
  // Each change is a one-frame step, not a crossfade: the row is centred and the
  // counter digits differ in width, so a 0.25 s A/B mix ghosted every glyph (review 1).
  const kit = EP.mount(document.getElementById("root"));
  const op = (n, lit) => ({ kind: "op", n, lit });
  function state(t) {
    if (t < CUE.mul) return SC.SEAM[0];
    if (t >= CUE.unlit) return SC.SEAM[1];
    const A = t < CUE.add ? op(1, "mul") : op(2, "add");
    return Object.assign({}, SC.SEAM[0], { card: { o: 1, A, B: null, mix: 0 } });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
