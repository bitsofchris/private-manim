<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_hook (0.000–5.640), v2: "A FLOP is one multiply or one add, and it's the unit that all
         AI compute is measured in." Opens on SC.SEAM[0], inside one core: 1.5 × 2.0, counter 0 (the hero),
         FLOP on the card. "multiply": × teal, = 3.0 slides out, counter 1; the 3.0 is carried down;
         "add": 3.0 + 0.5 = 3.5, + teal, counter 2; lit back to null on "and". "all": the panel shrinks
         into its cell, the hero passes to the chip; SC.SEAM[1] still from 4.44 to the end. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.64" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.64, START = 0;
  // cues, beat-local (master - START), from words.json
  const CUE = {
    mul: 1.32,     /* "multiply" 1.32: core.mul 0 -> 1, lit "mul" */
    carry: 1.80,   /* after "multiply", before "one" 2.10: core.carry 0 -> 1 */
    add: 2.24,     /* "add," 2.24: core.add 0 -> 1, lit "add" */
    unlit: 3.04,   /* "and" 3.04: lit back to null, before "unit" 3.34 */
    shrink: 3.84,  /* "all" 3.84: grow 1 -> 0, hero count -> chip */
  };
  const MUL = 0.5, CARRY = 0.3, ADD = 0.5, SHRINK = 0.6;
  const LAND = 0.8;      // the kit's result tile lands at u 0.8: the counter ticks then
  const HANDOFF = 0.7;   // the core's contents are gone once grow < 0.7: the hero passes then
  const kit = EP.mount(document.getElementById("root"));
  const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
  function state(t) {
    if (t <= 0 || t < CUE.mul) return SC.SEAM[0];
    if (t >= CUE.shrink + SHRINK) return SC.SEAM[1];
    const mul = ease(SC.seg(t, CUE.mul, CUE.mul + MUL));
    const carry = ease(SC.seg(t, CUE.carry, CUE.carry + CARRY));
    const add = ease(SC.seg(t, CUE.add, CUE.add + ADD));
    const n = (add >= LAND ? 1 : 0) + (mul >= LAND ? 1 : 0);
    const lit = t >= CUE.unlit ? null : t >= CUE.add ? "add" : "mul";
    const grow = 1 - ease(SC.seg(t, CUE.shrink, CUE.shrink + SHRINK));
    const core = Object.assign({}, SC.SEAM[0].core, { mul, carry, add, n, lit, grow });
    return Object.assign({}, SC.SEAM[0], { core, hero: grow < HANDOFF ? "chip" : "count" });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
