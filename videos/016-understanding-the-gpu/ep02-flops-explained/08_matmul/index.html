<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 08_matmul (cut 7 -> 8, master 35.500, 9.705 s):
         "A transformer's compute is nearly all matrix multiplies and a matmul is only multiplies
          and adds. GPUs are built to do exactly that, thousands at once."
         0–0.4 s     the code card and the 1 s clock fade out; hero "clock" leaves with the clock
         "matrix"    the card crossfades to `y = x @ W`
         "matmul"    the core panel grows out of its cell (mode "dot": x and w tiles, y = 0.0)
         "only"      the three pairs run `y += x × w`, 0.8 s each; the running line the hero (expr),
                     then the counter (6 FLOPs, hero count) once the last pair lands
         "thousands" the panel shrinks back into its cell, every cell lights, the chip the hero
         still from "thousands" + 0.6 s: SEAM[8] -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.705" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 9.705, START = 35.500;
  // cues (beat-local = master - START; onsets checked on the vo_final.wav envelope)
  const CUE = {
    matrix: 2.12,      /* "matrix" 37.62 */
    matmul: 3.52,      /* "matmul" 39.02 (runs on from "a"; words.json kept) */
    only: 4.14,        /* "only" 39.64 (words.json 39.54 is the end of "is"; the onset follows the gap) */
    thousands: 8.49,   /* "thousands" 43.99 */
  };
  const T = { out: 0.4, fade: 0.3, grow: 0.6, pair: 0.8, shrink: 0.5 };
  T.dotEnd = CUE.only + 3 * T.pair;                 // 6.54: the last pair has landed
  T.litFrom = CUE.thousands + T.fade;               // the cells light as the panel finishes shrinking
  T.still = T.litFrom + T.fade;                     // 9.09: SEAM[8] from here on
  const root = document.getElementById("root");
  const kit = EP.mount(root);
  const { seg, lerp } = SC;
  const io = (u) => u * u * (3 - 2 * u);
  const S7 = SC.SEAM[7], S8 = SC.SEAM[8];
  const RATE = S7.card.A, MM = S8.card.A;

  function state(t) {
    if (t <= 0) return S7;
    if (t >= T.still) return S8;
    const S = Object.assign({}, S7);
    const out = 1 - io(seg(t, 0, T.out));                                  // code card and clock fade together
    S.code = out > 0 ? Object.assign({}, S7.code, { o: out }) : { o: 0 };
    const rate = Object.assign({}, RATE, { clockO: out });
    if (out <= 0) S.hero = null;                                           // the clock (the hero) has gone
    const m = seg(t, CUE.matrix, CUE.matrix + T.fade);
    S.card = m <= 0 ? { o: 1, A: rate, B: null, mix: 0 }
           : m < 1 ? { o: 1, A: rate, B: MM, mix: io(m) } : { o: 1, A: MM, B: null, mix: 0 };
    if (t >= CUE.matmul) {
      const g = t < CUE.thousands ? io(seg(t, CUE.matmul, CUE.matmul + T.grow))
                                  : 1 - io(seg(t, CUE.thousands, CUE.thousands + T.shrink));
      const step = 3 * seg(t, CUE.only, T.dotEnd);
      S.core = g > 0 ? { o: 1, mode: "dot", grow: g, step } : { o: 0 };
    }
    if (t >= CUE.only) S.hero = t < T.dotEnd ? "expr" : "count";
    if (t >= CUE.thousands) {
      S.hero = "chip";
      S.lit = lerp(SC.REST.lit, 1, io(seg(t, T.litFrom, T.still)));
    }
    return S;
  }
  function render(t) {
    SC.clock = START - 1 / 30 + t;   // one frame behind: the cut (35.50) is a shimmer tick (0.25 s), so frame 0 keeps 07's last pattern
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
