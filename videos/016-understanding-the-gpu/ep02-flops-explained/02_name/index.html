<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_name (5.640–8.320), v2: "FLOP stands for floating point operation." Opens on SC.SEAM[1]
         (the chip, FLOP on the card, the chip the hero). "FLOP": hero -> acronym (F L O P magenta).
         "floating": acro.u 0 -> 1 over 0.9 s, the letters glide apart and FLOATING-POINT / OPERATION
         types in around them; SC.SEAM[2] still from 7.52 to the end. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.68" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 2.68, START = 5.64;
  // cues, beat-local (master - START), from words.json
  const CUE = {
    flop: 0.28,    /* "FLOP" 5.92: hero chip -> acronym */
    fl: 0.98,      /* "floating" 6.62: acro.u 0 -> 1 */
  };
  const UNPACK = 0.9;    // the kit eases the glide (u 0-0.6) and paces the typing (0.45-1) itself
  const kit = EP.mount(document.getElementById("root"));
  function state(t) {
    if (t <= 0 || t < CUE.flop) return SC.SEAM[1];
    if (t >= CUE.fl + UNPACK) return SC.SEAM[2];
    const u = SC.seg(t, CUE.fl, CUE.fl + UNPACK);
    return Object.assign({}, SC.SEAM[1], { hero: "acronym", acro: { o: 1, u } });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
