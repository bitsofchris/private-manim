<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_name (5.640–8.320): "FLOP stands for floating point operation." Opens on SC.SEAM[1]
         (a × b + c, 2 FLOPs, the counter the hero). "FLOP" crossfades the card to floating-point /
         operation; "floating" passes the hero to the acronym (fl, op magenta); SC.SEAM[2] still
         from there to the end. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.68" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 2.68, START = 5.64;
  // cues, beat-local (master - START), from words.json
  const CUE = {
    flop: 0.28,    /* "FLOP" 5.92: the card crossfades to the name */
    fl: 0.98,      /* "floating" 6.62: hero count -> acronym */
  };
  const XF = 0.3;    // card crossfade (s)
  const kit = EP.mount(document.getElementById("root"));
  const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
  const OP = SC.SEAM[1].card.A, NAME = SC.SEAM[2].card.A;
  function state(t) {
    if (t < CUE.flop) return SC.SEAM[1];
    if (t >= CUE.fl) return SC.SEAM[2];
    const m = ease(SC.seg(t, CUE.flop, CUE.flop + XF));
    const card = m >= 1 ? { o: 1, A: NAME, B: null, mix: 0 } : { o: 1, A: OP, B: NAME, mix: m };
    return Object.assign({}, SC.SEAM[1], { card });          // hero stays "count" until "floating"
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
