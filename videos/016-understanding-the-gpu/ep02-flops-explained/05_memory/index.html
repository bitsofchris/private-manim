<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_memory (cut 4 -> 5), master 20.160-23.190: "Every weight, activation, and gradient is one
         of these numbers."
         From frame 0 the float panel shrinks back into cell (row 5, col 5) over 0.5 s (03's grow in
         reverse); once its contents are gone, memory is the hero: where these numbers live. The
         card crossfades one word per word: weights -> activations -> gradients. Still from 1.65;
         ends on SEAM[5]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.03" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.03, START = 20.16;
  // cues, beat-local (master - START), from words.json (onsets agree on the vo_final.wav envelope)
  const CUE = {
    weights: 0.38,      /* "weight," 20.54 */
    activations: 0.76,  /* "activation," 20.92 */
    gradients: 1.42,    /* "gradient" 21.58 */
  };
  const SHRINK = 0.5, MIX = 0.25, LEAD = 0.05;   // each word's crossfade starts LEAD before its word
  const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const ramp = (t, a, d) => ease(SC.seg(t, a, a + d));
  const root = document.getElementById("root");
  const kit = EP.mount(root);
  // local: the card's two layers overlap on purpose while they crossfade word to word; flops.js
  // does not hand them out, so find its card rows (the divs holding the 8 spans) and waive them
  [...root.children].filter((d) => d.tagName === "DIV" && d.children.length === 8 &&
    [...d.children].every((c) => c.tagName === "SPAN"))
    .forEach((d) => [d, ...d.children].forEach((e) => e.setAttribute("data-layout-allow-overlap", "")));
  const NAME = SC.SEAM[4].card.A;
  const WORDS = [["weights", CUE.weights], ["activations", CUE.activations], ["gradients", CUE.gradients]];
  function card(t) {
    let A = NAME;
    for (const [word, c] of WORDS) {
      const B = { kind: "word", word }, m = ramp(t, c - LEAD, MIX);
      if (m <= 0) break;
      if (m < 1) return { o: 1, A, B, mix: m };
      A = B;
    }
    return { o: 1, A, B: null, mix: 0 };
  }
  function state(t) {
    if (t <= 0) return SC.SEAM[4];
    if (t >= CUE.gradients - LEAD + MIX) return SC.SEAM[5];
    const grow = 1 - ramp(t, 0, SHRINK);
    const float = grow > 0 ? Object.assign({}, SC.SEAM[4].float, { grow }) : { o: 0 };
    const hero = grow > 0.7 ? "exp" : "hbm";       // the panel's contents are gone below 0.7 (flops.js)
    return Object.assign({}, SC.SEAM[5], { hero, card: card(t), float });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
