<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 03_float (cut 2 -> 3), master 8.320-14.525: "Computers store decimals as a floating point,
         scientific notation in binary, a sign, digits, and an exponent."
         "floating" grows the float panel out of cell (row 5, col 5) over the chip and memory (0.6 s),
         the acronym letters back to ink. "scientific": row 1 (0.0000001 -> +1.0 x 10^-7) and the
         anatomy boxes fade in. The hero passes sign -> digits -> exponent, each label on its word.
         Still from 5.74; ends on SEAM[3]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/flops.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.205" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.205, START = 8.32;
  // cues, beat-local (master - START), from words.json (onsets agree on the vo_final.wav envelope)
  const CUE = {
    grow: 1.74,    /* "floating" 10.06 */
    sci: 2.72,     /* "scientific" 11.04 */
    sign: 4.52,    /* "sign," 12.84 */
    digits: 4.96,  /* "digits," 13.28 */
    exp: 5.54,     /* "exponent." 13.86 */
  };
  const GROW = 0.6, FADE = 0.3, LAB = 0.2;
  const ease = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
  const ramp = (t, a, d) => ease(SC.seg(t, a, a + d));
  const kit = EP.mount(document.getElementById("root"));
  function state(t) {
    if (t <= 0) return SC.SEAM[2];
    if (t >= CUE.exp + LAB) return SC.SEAM[3];
    const hero = t >= CUE.exp ? "exp" : t >= CUE.digits ? "digits" : t >= CUE.sign ? "sign" : t >= CUE.grow ? null : "acronym";
    const grow = ramp(t, CUE.grow, GROW), inner = ramp(t, CUE.sci, FADE);
    const lab = [CUE.sign, CUE.digits, CUE.exp].map((c) => ramp(t, c, LAB));
    const float = grow > 0 ? { o: 1, grow, row1: inner, row2: 0, glide1: 0, glide2: 0, anat: 1, anatO: inner, lab } : { o: 0 };
    return Object.assign({}, SC.SEAM[2], { hero, float });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
