<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_layer (8.660–14.160 master): "Almost every parameter sits in a weight matrix. Here's a tiny
         one, 3 inputs, 2 outputs, 6 weights."
         Opens on SEAM[1]. The bar and readout fade out; on "weight" the matrix W grows in under the
         layer with "y = W x" (hero: matrix); "3" the input dots swell, "2" the output dots; "6" the
         six lines flash in order w11..w23 with their cells (hero: lines); SEAM[2] held still. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/layer.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.5" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.5, START = 8.66;
  // cues, beat-local (master − START), from words.json
  const CUE = {
    clear: 0.48,   /* "Almost" 9.14: bar and readout fade */
    mat: 1.72,     /* "weight" 10.38: W grows in, y = W x fades in (hero: matrix) */
    ins: 3.69,     /* "3" 12.35: input dots swell */
    outs: 4.21,    /* "2" 12.87: output dots swell */
    six: 4.74,     /* "6" 13.40: the six lines flash in order (hero: lines) */
  };
  const CLEAR = 0.5, GROW = 0.5, BUMP = 0.45, FLASH = 0.07;
  const STILL = CUE.six + 6 * FLASH;                   // 5.16: SC.SEAM[2] from here (0.34 s still)
  const kit = SC.mount(document.getElementById("root"));
  const { seg, lerp } = SC, P = kit.parts, M = SC.LAYER.L.mat;
  const MC = { x: M.x + (2 * M.pitch + M.cell) / 2, y: M.y + (M.pitch + M.cell) / 2 };   // matrix centre
  const ease = (u) => u * u * (3 - 2 * u);
  const pulse = (t, a) => Math.sin(Math.PI * seg(t, a, a + BUMP));
  const S1 = SC.SEAM[1], S2 = SC.SEAM[2];
  function state(t) {
    if (t <= 0) return S1;
    if (t >= STILL) return S2;
    const c = ease(seg(t, CUE.clear, CUE.clear + CLEAR)), g = ease(seg(t, CUE.mat, CUE.mat + GROW));
    const ly = Object.assign({}, S2.ly, {
      bar: Object.assign({}, S1.ly.bar, { o: 1 - c }),
      rd: Object.assign({}, S1.ly.rd, { o: 1 - c }),
      mat: Object.assign({}, S2.ly.mat, { o: g }),
      eq: Object.assign({}, S2.ly.eq, { o: g }),
      bumpIn: pulse(t, CUE.ins), bumpOut: pulse(t, CUE.outs),
    });
    let hero = c < 1 ? "readout" : null;
    if (t >= CUE.mat) hero = "matrix";
    if (t >= CUE.six) { hero = "lines"; ly.flash = Math.min(5, Math.floor((t - CUE.six) / FLASH)); }
    return Object.assign({}, S2, { hero, ly });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
    // the matrix grows from its centre (cells only; the kit fades it by mat.o)
    const s = lerp(0.3, 1, ease(seg(t, CUE.mat, CUE.mat + GROW)));
    const tr = s < 1 ? `translate(${MC.x} ${MC.y}) scale(${s.toFixed(4)}) translate(${-MC.x} ${-MC.y})` : "";
    P.cells.forEach((cell) => (tr ? cell.setAttribute("transform", tr) : cell.removeAttribute("transform")));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
