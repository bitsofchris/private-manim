<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_hook (0.000–8.660 master): "Training an LLM costs about 6 FLOPs per parameter per token.
         You spend 2 FLOPs on the forward pass and about 4 on the backward pass."
         Opens on SEAM[0] (layer working, value pulses running; bar full, split 0; readout
         "6 × params" the hero). On "2" the forward segment swells; on "4" the two backward
         segments. The pulses fade out after "backward"; SEAM[1] (run 0) held still from STILL. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/layer.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.66" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.66, START = 0;
  // cues, beat-local (master − START), from words.json (RMS on vo_final.wav: "2" voiced from ~4.75)
  const CUE = {
    fwd: 4.85,     /* "2" 4.92 ("2 FLOPs on the forward pass", pass ends 6.58) */
    fwdEnd: 6.40,  /* "pass" 6.28 */
    back: 6.85,    /* "4" 6.88 ("about 4 on the backward pass") */
    backEnd: 7.95, /* "pass." 7.93 */
    runOff: 7.90,  /* the value pulses fade out over "pass." */
  };
  const RISE = 0.18, FALL = 0.32, RUN_FADE = 0.4;
  const STILL = 8.30;                                  // SC.SEAM[1] from here (0.36 s still)
  const kit = SC.mount(document.getElementById("root"));
  const { seg } = SC;
  const ease = (u) => u * u * (3 - 2 * u);
  // a swell: up over RISE from a, held to b, down over FALL
  const swell = (t, a, b) => ease(seg(t, a, a + RISE)) * (1 - ease(seg(t, b, b + FALL)));
  function state(t) {
    if (t <= 0) return SC.SEAM[0];
    if (t >= STILL) return SC.SEAM[1];
    const f = swell(t, CUE.fwd, CUE.fwdEnd), b = swell(t, CUE.back, CUE.backEnd);
    return Object.assign({}, SC.SEAM[0], { ly: Object.assign({}, SC.SEAM[0].ly, { barBump: [f, 0.75 * b, 0.75 * b] }) });
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
    // the pulses fade instead of popping off (run is 0|1 in the kit)
    const k = 1 - ease(seg(t, CUE.runOff, CUE.runOff + RUN_FADE));
    if (t < STILL && k < 1) kit.parts.runDots.forEach((d) => SC.show(d, parseFloat(d.style.opacity || 0) * k));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
