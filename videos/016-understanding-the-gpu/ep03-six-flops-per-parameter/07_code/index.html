<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 07_code (34.890–38.960, 4.070 s): "So training compute is 6 times parameters times tokens."
         Opens on SC.SEAM[6] (the layer, bar, readout `36 = 6 × 6`). On "So" the bar and readout clear
         and the layer shrinks into one core cell as the chip fades in (CPU, queue, chip, GPU memory,
         cells lit, shimmering). The code card grows in and types line 1 of code.sixN, landing by
         "tokens" (magenta hero: the line). Ends on SC.SEAM[7], held. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/layer.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.070" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.070, START = 34.890;
  const kit = SC.mount(document.getElementById("root"));
  const { seg } = SC;
  // beat-local cues (master − 34.890), from words.json, checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    so: 0.25,       /* "So" 35.14: bar and readout clear, the layer shrinks into the chip */
    tokens: 3.39,   /* "tokens." 38.28: line 1 has landed */
  };
  const CLEAR = 0.3, SHRINK = 0.9, GROW = 0.2, CPS = 14;
  const SHRINK_END = CUE.so + SHRINK;              // 1.15: layer gone, chip at rest
  const CARD_IN = CUE.so + 0.8;                    // 1.05: the card grows in as the shrink lands
  const TYPE_FROM = CARD_IN + GROW + 0.05;         // 1.30: 31 characters at 14 cps land at 3.27
  const S6 = SC.SEAM[6], S7 = SC.SEAM[7];
  const LINES = S7.code.lines, L1 = S7.code.typed;
  const STILL = TYPE_FROM + SC_typingSeconds([LINES[0]], CPS) + 0.05;   // ≈ 3.32: SEAM[7] from here
  const ease = (u) => u * u * (3 - 2 * u);
  const codeCard = kit.code.card;

  function state(t) {
    if (t <= 0) return S6;
    if (t >= STILL) return S7;
    if (t < CUE.so) return S6;
    const c = ease(seg(t, CUE.so, SHRINK_END)), k = 1 - ease(seg(t, CUE.so, CUE.so + CLEAR));
    const S = Object.assign({}, S7, { cpu: c, queueO: c, chip: c, hbm: c });
    S.ly = Object.assign({}, S6.ly, {
      shrink: seg(t, CUE.so, SHRINK_END),          // layer.js eases it
      bar: Object.assign({}, S6.ly.bar, { o: k }),
      rd: Object.assign({}, S6.ly.rd, { o: k }),
    });
    if (t < CARD_IN) S.code = { o: 0 };
    else {
      const typed = Math.min(L1, SC_typedAt(LINES, t - TYPE_FROM, CPS));
      S.code = Object.assign({}, S7.code, { o: ease(seg(t, CARD_IN, CARD_IN + GROW)), typed,
                                            cursor: typed < L1 ? 1 : 0, blink: t - TYPE_FROM });
    }
    return S;
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(state(t));
    // the card grows in from 0.85 of its size (opacity rides in S.code.o)
    const g = seg(t, CARD_IN, CARD_IN + GROW);
    if (codeCard) codeCard.style.transform = g > 0 && g < 1 ? `scale(${(0.85 + 0.15 * ease(g)).toFixed(4)})` : "";
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
