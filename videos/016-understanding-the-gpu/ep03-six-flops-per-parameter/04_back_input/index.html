<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 04_back_input (master 20.485, 6.255 s): SEAM[3] -> SEAM[4]. "Coming backwards now, the error
         has to reach the layer before. So the same weights in reverse, another multiply and add each."
         On "Coming" the labels go x/y -> dx/dy and "y = W x" -> "dx = Wᵀ dy" (a fade through, 0.4 s),
         the hero moves to the backward pass and the lines fade to muted. From "error" the pass "back"
         runs right to left over w11..w23 (x then + on each), lines and segment 2 filling magenta,
         the readout 12 -> 24 two per line, landing on "add each". Still from STILL. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/layer.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.255" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.255, MASTER = 20.485;
  const kit = SC.mount(document.getElementById("root"));
  const { seg, lerp } = SC, EP = window.EP, P = kit.parts;
  // beat-local cues (master − 20.485), from words.json, onsets checked on a 20 ms RMS envelope
  const CUE = {
    coming: 0.235, /* "Coming" 20.72 (voice from 20.72): labels and formula swap, hero → back */
    error: 1.115,  /* "error" 21.60: the backward pass starts at the outputs */
    each: 5.60,    /* "add each" 26.00–26.30: the sixth line lands, readout 24 FLOPs */
  };
  const SWAP = 0.4, STILL = CUE.each;                 // 5.60: SC.SEAM[4] from here (0.655 s still)
  const ease = (u) => u * u * (3 - 2 * u);
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, u) => { const A = hex(a), B = hex(b);
    return "#" + A.map((x, i) => Math.round(lerp(x, B[i], u)).toString(16).padStart(2, "0")).join(""); };
  const TEAL = SC.PAL.data, MUTED = SC.PAL.muted;

  function state(t) {
    if (t <= 0 || t < CUE.coming) return SC.SEAM[3];
    if (t >= STILL) return SC.SEAM[4];
    const A = SC.SEAM[3], B = SC.SEAM[4];
    const p = 6 * seg(t, CUE.error, CUE.each);
    const m = seg(t, CUE.coming, CUE.coming + SWAP);
    const labs = m < 0.5 ? { inLab: SC.LAYER.LREST.inLab, outLab: SC.LAYER.LREST.outLab, eq: A.ly.eq } : {};   // old text until mid-fade
    const ly = Object.assign({}, B.ly, labs, {
      prog: p,
      bar: { o: 1, f: [1, p / 6, 0], split: 1 },
      rd: { o: 1, text: EP.count(12 + 2 * Math.floor(p + 1e-9)) },
    });
    return Object.assign({}, B, { ly });
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(state(t));
    // fade through for the label and formula swaps: out to the midpoint, in after it
    const m = seg(t, CUE.coming, CUE.coming + SWAP);
    if (m > 0 && m < 1) {
      const o = Math.abs(1 - 2 * m);
      P.labIn.concat(P.labOut, [P.eq]).forEach((el) => (el.style.opacity = o.toFixed(3)));
      // the lines fade teal → muted as the backward pass is set up (the kit swaps them hard)
      P.lines.forEach((ln) => ln.setAttribute("stroke", mix(TEAL, MUTED, ease(m))));
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
