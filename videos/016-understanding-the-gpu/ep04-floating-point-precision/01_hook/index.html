<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 01_hook: SEAM[0] → SEAM[1]. "half the bits": a dashed ghost of the 16 missing boxes trails bf16's row to fp32's width, then fades. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.01" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.010, MASTER = 0.000;
  const root = document.getElementById("root");
  const kit = EP.mount(root);
  const { seg, lerp, node, show, PAL } = SC;
  const ease = (u) => u * u * (3 - 2 * u);
  // beat-local cues (master − 0.000), from words.json, checked on a 30 ms RMS envelope of vo_final.wav
  const CUE = {
    half: 3.40,      /* "half" (words.json 3.36; the soft h rises at 3.40): the ghost trails out, box 17 → box 32 */
    fp32: 4.62,      /* "fp32" (4.61 on the envelope): the ghost brightens dim → ink, the width of fp32's row above */
    fade: 5.10,      /* after "fp32" ends (5.62 in words.json, voiced to ~4.75 then the tail): the ghost fades */
  };
  const STEP = 0.04, GROW = 0.2;       // one ghost box every 40 ms, each grows in over 0.2 s (16 boxes: 3.40–4.24)
  const BRIGHT = 0.2, FADE = 0.5;
  const HOLD = CUE.fade + FADE;        // 5.60: SC.SEAM[1] still from here (0.41 s)

  // Local prop (ghost): bf16's missing 16 bits, boxes 17–32, dashed, on bf16's small row in EP.SMALL geometry,
  // so the row plus its ghost is exactly fp32's 32-box width.
  const SM = EP.SMALL, Y = EP.FMT.bf16.small, N16 = 16;
  const svg = node("svg", { width: SC.W, height: SC.H, viewBox: `0 0 ${SC.W} ${SC.H}` });
  svg.style.cssText = "position:absolute;left:0;top:0;overflow:visible;";
  svg.setAttribute("data-layout-allow-overflow", "");
  root.appendChild(svg);
  const ghostG = node("g", {}, svg);
  const ghost = [...Array(N16)].map((_, k) => node("rect", {
    x: SM.x0 + (N16 + k) * SM.pitch + 1.5, y: Y + 1.5, width: SM.w - 3, height: SM.h - 3, rx: 4,
    fill: "none", stroke: PAL.dim, "stroke-width": 3, "stroke-dasharray": "7 5" }, ghostG));
  const DIM = [0x8A, 0x8F, 0xB0], INK = [0xEC, 0xEB, 0xE4];
  const mixHex = (a, b, u) => "#" + a.map((v, i) => Math.round(lerp(v, b[i], u)).toString(16).padStart(2, "0")).join("");

  function drawGhost(t) {
    const out = 1 - ease(seg(t, CUE.fade, CUE.fade + FADE));
    const col = mixHex(DIM, INK, ease(seg(t, CUE.fp32, CUE.fp32 + BRIGHT)));
    show(ghostG, out > 0.001 && t >= CUE.half ? out : 0);
    ghost.forEach((b, k) => {
      const u = ease(seg(t, CUE.half + k * STEP, CUE.half + k * STEP + GROW));
      b.setAttribute("width", ((SM.w - 3) * u).toFixed(1));
      b.setAttribute("stroke", col);
      show(b, u);
    });
  }

  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(t >= HOLD ? SC.SEAM[1] : SC.SEAM[0]);   // SEAM[0] and SEAM[1] are the same state
    drawGhost(Math.min(t, HOLD));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
