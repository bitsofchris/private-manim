<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 04_fp16: "fp16 is also 16 bits, but it spends them on precision. So anything past 65,504 will overflow."
         master 16.790–24.990; opens SEAM[3], ends SEAM[4]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.2" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.200, MASTER = 16.790;
  const root = document.getElementById("root");
  const kit = EP.mount(root);
  const { seg } = SC;
  const ease = (u) => u * u * (3 - 2 * u);
  // beat-local cues (master − 16.790), from words.json, checked on a 40 ms RMS envelope of vo_final.wav
  const CUE = {
    fp16: 0.19,      /* "fp16" (16.98 onset): the chip fades, the four rows grow into the bits view over 0.8 s, split 2 → 1 under it, hero row:fp16 */
    prec: 3.61,      /* "precision" (20.40 onset): the 1/3 column writes in over 0.4 s, hero man:fp16 (its mantissa + 0.33325195) */
    max: 5.59,       /* "65,504" (22.38): the 70,000 header and fp32's 70,000 fade in over 0.4 s */
    over: 7.45,      /* "overflow" (24.24): fp16's cell lands "inf" in 0.2 s, hero inf */
  };
  const VIEW = 0.8, WRITE = 0.4, POP = 0.2;
  const HOLD = CUE.over + POP;               // 7.65 (24.44 master): SC.SEAM[4] still from here (0.55 s)

  function render(t) {
    SC.clock = MASTER + t;
    if (t >= HOLD) { kit.draw(SC.SEAM[4]); return; }
    if (t < CUE.fp16) { kit.draw(SC.SEAM[3]); return; }
    const v = ease(seg(t, CUE.fp16, CUE.fp16 + VIEW));
    let S;
    if (v < 1) {
      // chip view → bits view; the ladder fades with the chip (drawLadder multiplies by 1 − view)
      S = Object.assign({}, SC.SEAM[3], { view: v, split: 2 - v, hero: "row:fp16" });
    } else {
      S = Object.assign({}, SC.SEAM[4], { colA: 0, big: 0, inf: 0, hero: "row:fp16" });
    }
    if (t >= CUE.prec) { S.colA = ease(seg(t, CUE.prec, CUE.prec + WRITE)); S.hero = "man:fp16"; }
    if (t >= CUE.max) S.big = ease(seg(t, CUE.max, CUE.max + WRITE));
    if (t >= CUE.over) { S.inf = seg(t, CUE.over, CUE.over + POP); S.hero = "inf"; }
    kit.draw(S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
