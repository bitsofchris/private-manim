<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 06_fp8: "fp8 keeps just 3 bits, so training in it needs a scaling library like NVIDIA's Transformer Engine." SEAM[5] → SEAM[6] -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.730" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.730, MASTER = 31.510;
  const kit = EP.mount(document.getElementById("root"));
  const { seg } = SC;
  const ease = (u) => u * u * (3 - 2 * u);
  // beat-local cues (master − 31.510), words.json checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    fp8: 0.25,       /* "fp8" (31.82 in words.json; onset 31.74): exponent outlines fade over 0.4 s; fp8's row the hero */
    three: 1.27,     /* "3" (32.78): fp8's mantissa and its 0.34375 the hero */
    scaling: 3.89,   /* "scaling" (35.38): fp8's 70,000 cell "max 448" writes in, 0.4 s */
    tag: 4.19,       /* still "scaling" (vowel 35.70): the "× scale" tag clips on, 0.4 s; the tag the hero */
    te: 5.67,        /* "Transformer" (37.16; onset 37.18): "Transformer Engine" fades in under the tag, 0.3 s */
  };
  const FADE = 0.4, WRITE = 0.4, CLIP = 0.4, TE = 0.3;
  const HOLD = CUE.te + TE;            // 5.97: SC.SEAM[6] still from here (master 37.48 ≤ 37.94)

  // Local override (teFade): the kit shows "Transformer Engine" with the tag (from scale > 0);
  // this beat holds it back to "Transformer" by scaling kit.teLab's opacity after the draw.
  function teFade(a) {
    if (a >= 1) return;
    SC.show(kit.teLab, (parseFloat(kit.teLab.style.opacity) || 0) * a);
  }

  function hero(t) {
    if (t < CUE.fp8) return "exp:bf16";
    if (t < CUE.three) return "row:fp8";
    if (t < CUE.tag) return "man:fp8";
    return "scale";
  }

  function render(t) {
    SC.clock = MASTER + t;
    if (t >= HOLD) { kit.draw(SC.SEAM[6]); return; }
    kit.draw(Object.assign({}, SC.SEAM[5], {
      same: 1 - ease(seg(t, CUE.fp8, CUE.fp8 + FADE)),
      big8: ease(seg(t, CUE.scaling, CUE.scaling + WRITE)),
      scale: ease(seg(t, CUE.tag, CUE.tag + CLIP)),
      hero: hero(t),
    }));
    teFade(ease(seg(t, CUE.te, CUE.te + TE)));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
