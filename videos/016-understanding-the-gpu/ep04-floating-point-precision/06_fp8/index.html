<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 06_fp8: "fp8 keeps just 3 bits, so training in it needs a scaling library like NVIDIA's Transformer Engine." SEAM[5] → SEAM[6] -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/chip.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.730" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.730, MASTER = 31.510;
  const root = document.getElementById("root");
  const kit = EP.mount(root);
  const { seg, lerp } = SC;
  const ease = (u) => u * u * (3 - 2 * u);
  // beat-local cues (master − 31.510), words.json checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    fp8: 0.25,       /* "fp8" (31.82 in words.json; onset 31.74): range bars, marker, inf and outlines fade
                        while the fp8 row grows in, 0.6 s; fp8's row the hero */
    three: 1.27,     /* "3" (32.78): fp8's mantissa the hero (spec reads "4 exponent · 3 mantissa") */
    scaling: 3.89,   /* "scaling" (35.38, the s; vowel 35.70): the "× scale" tag clips on, 0.4 s; the tag the hero */
    te: 5.67,        /* "Transformer" (37.16; onset 37.18): "Transformer Engine" fades in under the tag, 0.3 s */
  };
  const SWAP = 0.6, CLIP = 0.4, TE = 0.3;
  const HOLD = CUE.te + TE;            // 5.97: SC.SEAM[6] still from here (master 37.48 ≤ 37.94)

  // Local override (teFade): the kit shows "Transformer Engine" with the tag (from scale > 0);
  // this beat holds it back to "Transformer". EP.mount does not return the label, so find it once.
  const teLab = [...root.children].find((el) => el.textContent === "Transformer Engine");
  function teFade(a) {
    if (!teLab || a >= 1) return;
    const o = (parseFloat(teLab.style.opacity) || 0) * a;
    SC.show(teLab, o);
  }

  function hero(t) {
    if (t < CUE.fp8) return "exp:bf16";
    if (t < CUE.three) return "row:fp8";
    if (t < CUE.scaling) return "man:fp8";
    return "scale";
  }

  function render(t) {
    SC.clock = MASTER + t;
    if (t >= HOLD) { kit.draw(SC.SEAM[6]); return; }
    const u = ease(seg(t, CUE.fp8, CUE.fp8 + SWAP));
    const S = Object.assign({}, SC.SEAM[5], {
      nl: 1 - u, same: 1 - u, inf: 1 - u, o8: u,
      scale: ease(seg(t, CUE.scaling, CUE.scaling + CLIP)),
      hero: hero(t),
    });
    // bars and marker hold their places while they fade, then switch off (SEAM[6]: marker −1, nl16 / nlb 0)
    if (u >= 1) Object.assign(S, { nl: 0, nl16: 0, nlb: 0, marker: -1, same: 0, inf: 0 });
    kit.draw(S);
    teFade(ease(seg(t, CUE.te, CUE.te + TE)));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
