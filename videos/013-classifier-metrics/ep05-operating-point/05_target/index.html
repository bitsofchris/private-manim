<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_target: beat 5 of 013 ep05. SEAM[4] → SEAM[5]: cards out, the 2 : 1 target, "at least 1 flag in 3" (hero), Model A readout. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.35" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.35;
  const MASTER = 28.00;
  // beat-local seconds (words.json master − 28.50), checked on the vo_final.wav RMS envelope
  const CUE = {
    so: 0.29,     /* "So say" (words 28.32, onset ~0.03 earlier) */
    two: 1.17,    /* "two blocked users" (29.17) */
    one: 3.72,    /* "one flag in three" (31.72) */
    real: 5.60,   /* "real attack" (33.60) */
  };
  const HOLD = 6.05;  // still from here; S(t) === SEAM[5]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[4];
    if (t >= HOLD) return SEAM[5];
    const cardsOp = 1 - E.io(seg(t, CUE.so, CUE.so + 0.5));          // cost cards leave on "So say"
    const tok = E.out(seg(t, CUE.two, CUE.two + 0.6));               // 2 : 1 tokens and the rate line
    const rule = E.out(seg(t, CUE.one, CUE.one + 0.6));              // "at least 1 flag in 3" + outline, the hero
    const readout = E.out(seg(t, CUE.real, CUE.real + 0.4));         // Model A's readout
    return {
      thr: 1, flag: 1, bars: SEAM[4].bars,
      cards: { opacity: cardsOp, lit: { fn: 1 } },
      target: { opacity: 1, tokens: tok, rate: tok, rule, ruleHero: 1, readout },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
