<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_harmonic: "Average 0.9 and 0.1 and you get 0.5. F1 will give you 0.18. It's a harmonic mean."
         Opens on SC.SEAM[1], ends on SC.SEAM[2]. Hero: the F1 line. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.65" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.65;
  const MASTER = 11.30;
  // beat-local = master − MASTER (words.json). VO: "It's a harmonic mean." then a 1.2 s pause
  // added to vo_final.wav (master 12.75–13.95) so the formula can be read.
  const CUE = {
    its: 0.16,      /* "It's a" (11.46) */
    harm: 0.46,     /* "harmonic" (11.76) */
    mean: 1.04,     /* "mean" (12.34; speech ends ~12.54) */
  };
  const STILL = 2.55;  // S(t ≥ STILL) is SEAM[2] itself: the bars are back
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // The bars step aside, the formula comes in on "harmonic", the example (0.18) on "mean",
  // and in the pause the formula leaves and the bars come back: SEAM[2] again.
  function S(t) {
    const s = clone(SEAM[2]);
    if (t <= 0 || t >= STILL) return s;
    const barsOut = E.io(seg(t, CUE.its - 0.1, CUE.its + 0.2));
    const formIn = E.io(seg(t, CUE.its + 0.15, CUE.harm + 0.1));
    const plug = E.io(seg(t, CUE.mean - 0.1, CUE.mean + 0.2));
    const formOut = E.io(seg(t, 2.00, 2.25));
    const barsBack = E.io(seg(t, 2.20, 2.50));
    s.bars.opacity = (1 - barsOut) + barsBack * barsOut;
    s.formula = { opacity: formIn * (1 - formOut), plug };
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
