<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 04_costs (master 18.90, 9.60 s): "But F1 treats both mistakes the same, and here they aren't. A false
         positive blocks a real user who can try again. A false negative would let an attack hijack your agent
         and leak your data." Opens on SC.SEAM[3], ends on SC.SEAM[4]. Hero: the card being named. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.75" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 9.75;
  const MASTER = 17.05;
  // beat-local = master − MASTER (words.json; onsets checked on the vo_final.wav 20 ms RMS envelope)
  const CUE = {
    butF1: 0.29,   /* "But F1" (17.34) bars out, then the cards in */
    fp: 3.39,      /* "false positive" (20.44) fp card lit, flagged users ring */
    fn: 6.43,      /* "false negative" (23.48) hero moves to the fn card, missed attacks ring */
  };
  const STILL = 7.50;  // last ring ends at 7.21; S(t >= STILL) is SEAM[4] itself
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, pulse, SEAM, BARS_A } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[3];
    if (t >= STILL) return SEAM[4];
    // bars fully out (0.26 -> 0.86) before the cards are past ~10 % (0.80 -> 1.40): no text overlap
    const barsOut = E.io(seg(t, CUE.butF1, CUE.butF1 + 0.6));
    const cardsIn = E.io(seg(t, CUE.butF1 + 0.54, CUE.butF1 + 1.14));
    const fpOn = E.io(seg(t, CUE.fp - 0.05, CUE.fp + 0.25));
    const fpOff = E.io(seg(t, CUE.fn - 0.1, CUE.fn + 0.2));   // old hero to rest in the same ~0.3 s
    const fnOn = E.io(seg(t, CUE.fn, CUE.fn + 0.3));
    return {
      thr: 1, flag: 1,
      fpRing: pulse(t, CUE.fp, 1.0),
      fnRing: pulse(t, CUE.fn, 1.0),
      bars: Object.assign({}, BARS_A, { opacity: 1 - barsOut }),
      cards: { opacity: cardsIn, lit: { fp: fpOn * (1 - fpOff), fn: fnOn } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
