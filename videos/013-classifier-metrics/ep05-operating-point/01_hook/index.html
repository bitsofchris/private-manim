<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_hook: "The F1 score is precision and recall in one number, and it punishes whichever is worse.
         It's a prompt injection detector." Opens on SC.SEAM[1] (plus motion), ends on SC.SEAM[1]. Hero: the F1 line. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.3" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 5.3;
  const MASTER = 0.00;
  // beat-local = master − MASTER (words.json; onsets checked on the vo_final.wav 20 ms RMS envelope)
  const CUE = {
    one: 2.30,      /* "one number" (2.30) */
    which: 3.88,    /* "whichever" (3.88) through "worse" (4.66) */
  };
  const STILL = 4.90;  // S(t ≥ STILL) is SEAM[1] itself
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  // Frame 0 is the finished picture (the hook rule): SEAM[1], with the F1 line already swelling.
  function S(t) {
    const s = clone(SEAM[1]);
    if (t >= STILL) return s;
    const swell = 0.5 * pulse(t, -0.15, 0.75);              // already rising at frame 0, gone by 0.6
    const one = pulse(t, CUE.one, 0.6);                     // "one number": the F1 line once
    s.bars.f1Pulse = Math.max(swell, one);
    s.bars.pulseR = pulse(t, CUE.which, 0.8);               // "whichever is worse": the 0.1 bar
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
