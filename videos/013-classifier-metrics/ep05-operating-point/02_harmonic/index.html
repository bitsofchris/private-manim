<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_harmonic: "Average 0.9 and 0.1 and you get 0.5. F1 will give you 0.18. It's a harmonic mean."
         Opens on SC.SEAM[1], ends on SC.SEAM[2]. Hero: the F1 line. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.00;
  const MASTER = 5.30;
  // beat-local = master − MASTER. words.json lumps "zero" into the word before it here
  // ("Average" 7.68, "0.9" 7.80); the 20 ms RMS envelope puts each number's "zero" just after
  // a clear gap, and each "point" after a stop closure, so the cues are the envelope onsets.
  const CUE = {
    nine: 0.64,     /* "0.9" (words 5.84, +0.10 to the "zero" onset) */
    one: 1.46,      /* "0.1" (words 6.66 +0.10) */
    five: 2.56,     /* "0.5" (words 7.76 +0.10) */
    f118: 4.88,     /* "0.18" (words 10.08 +0.10) */
  };
  const STILL = 5.60;  // S(t ≥ STILL) is SEAM[2] itself
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  function S(t) {
    if (t <= 0) return clone(SEAM[1]);
    if (t >= STILL) return clone(SEAM[2]);
    const s = clone(SEAM[1]);
    s.bars.pulseP = 0.5 * pulse(t, CUE.nine, 0.6);                         // "0.9": precision bar, small
    s.bars.pulseR = 0.5 * pulse(t, CUE.one, 0.6);                         // "0.1": recall bar, small
    s.bars.mean = E.out(seg(t, CUE.five, CUE.five + 0.8));                // "0.5": dashed mean draws left → right
    s.bars.f1Pulse = pulse(t, CUE.f118, 0.6);                              // "0.18" ("harmonic mean" is beat 2b)
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
