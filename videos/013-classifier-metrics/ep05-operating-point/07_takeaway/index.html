<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 07_takeaway: the last beat of ep05. Opens on SEAM[6], ends on SEAM[7] (still).
         "threshold": the line swells once. "costs": the "1 in 3" rule swells once (stays white). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.807" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 5.807;           // final beats table
  const MASTER = 37.10;                // master start
  const CUE = {
    threshold: 1.62,   /* "threshold" (38.72) */
    costs: 3.57,       /* "costs" (40.67) */
    put: 4.16,         /* "put the line there" (41.26-41.78): hold */
  };
  const LEAD = 0.08;                   // a swell starts just before its word so its peak sits on it
  const SWELL = 0.7;                   // one pulse, up and down
  const HOLD_FROM = CUE.costs - LEAD + SWELL;   // 4.13: still from here to the end
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { pulse, SEAM } = SC;
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  function S(t) {
    const s = clone(SEAM[6]);
    if (t >= HOLD_FROM) return s;      // SEAM[6] and SEAM[7] are the same picture
    const tp = pulse(t, CUE.threshold - LEAD, SWELL);
    const rp = pulse(t, CUE.costs - LEAD, SWELL);
    if (tp > 0) s.thrPulse = tp;
    if (rp > 0) s.target.rulePulse = rp;
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
