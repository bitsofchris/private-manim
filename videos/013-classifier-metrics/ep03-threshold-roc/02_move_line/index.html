<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 2, context: tag brightens on "prompt injection detector"; the line nudges 0.70 → 0.62 → 0.70 on "move this line". SEAM[1] → SEAM[2]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.06" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.06;
  const MASTER = 3.00;
  const CUE = {                 // beat-local = master − 3.00 (words.json; shifted −1.44 s when the context line was cut)
    you: 0.63,         /* "You just" (master 3.63) */
    move: 0.91,        /* "move" (master 3.91) */
    line: 1.46,        /* "line." (master 4.46) */
    still: 1.76,       /* hold SEAM[2] from here */
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const NUDGE = 0.62;
  const L1 = [CUE.you - 0.07, CUE.you + 0.53], L2 = [CUE.you + 0.53, CUE.still];   // 0.60 s and 0.60 s
  function S(t) {
    if (t >= CUE.still) return clone(SEAM[2]);
    const s = clone(SEAM[1]);
    // "move this line": out to 0.62 and back, each leg eased, the box and dot following
    s.t = lerp(lerp(SC.T_BOX, NUDGE, E.io(seg(t, L1[0], L1[1]))), SC.T_BOX, E.io(seg(t, L2[0], L2[1])));
    s.thr = { pulse: pulse(t, CUE.line - 0.2, 0.45) };   // on "line", done by the still
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
