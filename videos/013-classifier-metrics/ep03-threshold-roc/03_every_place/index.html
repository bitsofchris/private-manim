<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 3, every place: the curve takes the hero on "ROC curve"; the line sweeps 0.70 → 0.95 → 0.20 → 0.70 on "every place", the dot tracing the curve. SEAM[2] → SEAM[3]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.15" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.15;
  const MASTER = 6.50;
  const CUE = {                 // beat-local = master − 6.50 (words.json, checked on the envelope)
    roc: 0.30,         /* "An ROC" (master 6.74–6.82; onset 6.74) */
    curve: 1.08,       /* "curve" (envelope 7.58; words.json 7.20 lands on the "C" of ROC) */
    shows: 1.34,       /* "shows" (envelope 7.84; words.json 7.46) */
    every: 1.72,       /* "every" (envelope 8.22; words.json 8.12) */
    place: 2.12,       /* "place" (envelope 8.62; words.json 8.48) */
    put: 2.72,         /* "put" (envelope 9.22; words.json 9.12) */
    still: 2.85,       /* hold SEAM[3] from here */
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const HI = 0.95, LO = 0.20;
  // three eased legs: right on "curve shows", the long left leg on "every place", back by "put"
  const R = [0.95, 1.55], Lf = [1.55, 2.25], B = [2.25, CUE.still];
  function S(t) {
    if (t >= CUE.still) return clone(SEAM[3]);
    const s = clone(SEAM[2]);
    // "ROC curve": the curve takes the hero, the line and its dot rest; handed back on the last leg
    const h = E.io(seg(t, CUE.roc, CUE.roc + 0.5)) * (1 - E.io(seg(t, B[0] + 0.1, CUE.still)));
    s.curve = { hero: h };
    s.thr = { dim: 0.6 * h };
    // the dot comes back to full for the trace (a dimmed dot vanishes on the lit curve), rests again with the hand-back
    s.dot = { dim: 0.6 * Math.min(h, 1 - E.io(seg(t, CUE.roc + 0.5, R[0]))) };
    s.t = lerp(lerp(lerp(SC.T_BOX, HI, E.io(seg(t, R[0], R[1]))), LO, E.io(seg(t, Lf[0], Lf[1]))), SC.T_BOX, E.io(seg(t, B[0], B[1])));
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
