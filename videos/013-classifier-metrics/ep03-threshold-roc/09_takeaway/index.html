<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 09_takeaway: the closer. Opens on SC.SEAM[8] (the corner), ends on SC.SEAM[9] (the ledger box), still from 7.55 s. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.35" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.35;           // 09_takeaway, the last beat
  const MASTER = 33.75;                // master start
  // word starts (master − MASTER), from words.json, checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    roc: 0.49,        /* "ROC" 34.24 */
    picking: 1.25,    /* "picking" 35.00 */
    thresholds: 1.49, /* "thresholds" 35.24 */
    decide: 2.37,     /* "decide" 36.12 */
    rather: 3.65,     /* "rather" 37.40 (envelope; words.json 37.41) */
    avoid: 3.81,      /* "avoid" 37.56 (envelope; words.json 37.54) */
    fals: 4.35,       /* "false" 38.10 */
    pos1: 4.65,       /* "positives" 38.40 (envelope: p burst after the dip at 38.40) */
    get: 5.23,        /* "get" 38.98 */
    all: 5.41,        /* "all" 39.16 */
    pos2: 5.71,       /* "positives" 39.46 (envelope: splice dip 39.42–39.44; words.json says 39.62) */
    depending: 6.11,  /* "depending" 39.86 (envelope; words.json 39.78) */
    problem: 6.71,    /* "problem" 40.46 */
    solving: 7.23,    /* "solving" 40.98; speech ends 41.32 (7.57) */
  };
  const T = {
    cornerOff: [CUE.roc, CUE.roc + 0.7],          // the corner fades on "ROC"
    pointsOff: [0.8, 1.4],                         // the stop points go
    heroBack: [CUE.picking, CUE.picking + 0.65],   // "picking thresholds": line + dot back to full
    left: [5.05, 6.05],                            // "get all the positives": 0.85 → 0.20, lands on the 2nd "positives"
    home: [6.25, 7.25],                            // "problem you're solving": 0.20 → 0.70, lands on "solving"
    still: 7.55,                                   // nothing moves from here (SEAM[9])
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t >= T.still) return SEAM[9];
    const corner = 1 - E.io(seg(t, ...T.cornerOff));
    const pa = 1 - E.io(seg(t, ...T.pointsOff));
    const dim = 1 - E.io(seg(t, ...T.heroBack));
    const th = lerp(lerp(0.85, 0.2, E.io(seg(t, ...T.left))), SC.T_BOX, E.io(seg(t, ...T.home)));
    const s = { t: th, code: { opacity: 1 } };
    if (pa > 0) s.points = SC.STOPS.map((v) => ({ t: v, a: pa, dim: 1 }));
    if (corner > 0) s.corner = corner;
    const thrPulse = pulse(t, CUE.decide - 0.1, 0.6);                 // "you decide": the line is the choice
    s.thr = { dim, pulse: thrPulse };
    s.dot = { dim, pulse: pulse(t, T.home[1] - 0.1, 0.4) };         // lands on "solving"
    s.boxHi = { fp: pulse(t, CUE.fals - 0.05, 0.9), tp: pulse(t, 5.75, 0.6) };
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
