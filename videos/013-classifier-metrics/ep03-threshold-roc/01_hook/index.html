<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 1, hook: the line mid-slide 0.55 → 0.70 from frame 0, lands by "retraining"; ends SEAM[1]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.00" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.00;
  const MASTER = 0.00;
  const CUE = {                 // beat-local = master − 0.00 (words.json, checked on the envelope)
    you: 0.45,         /* "You" (master 0.45; onset 0.46) */
    retraining: 2.34,  /* "retraining" (words.json 2.18; envelope: "without" 1.94–2.28, "retraining" onset 2.34) */
    still: 2.70,       /* hold SEAM[1] from here */
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const LAND = CUE.retraining - 0.04;   // the slide lands as "retraining" starts
  function S(t) {
    if (t >= CUE.still) return clone(SEAM[1]);
    const s = clone(SEAM[1]);
    // already mid-slide at frame 0 (ease-out: moving at full speed, settling onto the ledger box)
    s.t = lerp(0.55, SC.T_BOX, E.out(seg(t, 0, LAND)));
    s.dot = { pulse: pulse(t, LAND - 0.1, 0.5) };   // one pulse as it lands, done by 2.7
    return s;
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
