<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_precision_40: beat 5 of 013 ep02, "We flagged 100, 40 were attacks, precision is 40%."
         The flagged row lifts into precision's denominator, TP's 40 flies up, 40% lands magenta.
         Opens on SEAM[4], ends still on SEAM[5]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.8" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.80;
  const MASTER = 17.50;   // v3: 0.15 s earlier; beat-local cues unchanged (comment times are v2 master)
  // beat-local = master − MASTER (v2 VO; words.json, onsets checked on the vo_final.wav RMS envelope)
  const CUE = {
    we: 0.20,        /* "We"        (17.82, onset 17.85) the lift starts at once */
    hundred: 0.65,   /* "100,"      (18.30) the lift lands */
    forty: 1.07,     /* "40"        (18.72, "f" from 18.72, vowel 18.84) TP's 40 flies */
    precision: 2.07, /* "precision" (19.72, onset 19.72) */
    pct: 2.77,       /* "40%."      (20.30; "is" ends 20.26, onset 20.42) the 40% lands magenta */
  };
  const HOLD = 3.50;  // still from here (VO ends 3.47); S(t >= HOLD) is SEAM[5]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, SEAM } = SC;
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[4];
    if (t >= HOLD) return SEAM[5];
    const u = seg(t, 0.15, 0.85);                              // the row lifts (0.7 s), lands on "100"
    const den = seg(t, 0.75, 1.00);                            // 100 drops in as it lands
    const a = 1 - seg(t, 0.90, 1.15);                          // then the lift frame goes
    const f = seg(t, CUE.forty - 0.03, CUE.forty + 0.57);      // the 40 flies (0.6 s)
    const num = seg(t, CUE.forty + 0.45, CUE.forty + 0.65);    // and lands as the numerator
    const pct = seg(t, CUE.pct - 0.05, CUE.pct + 0.20);
    const off = 1 - seg(t, 3.20, HOLD);                        // pctHero and "precision" back to rest
    return {
      ring: { tp: 1 - u, fp: 1 - u },
      box: { lit: { tp: 1 - u, fp: 1 - u } },
      lift: { kind: "row", u, a },
      bars: { r: { num: 1, den: 1, pct: 1 },
              p: { lit: off, den, num, pct, pctHero: off },
              flyNum: { row: "p", u: f } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
