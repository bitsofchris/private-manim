<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_no_tn: beat 6 of 013 ep02, "Neither one uses the true negatives. In this case, there's almost
         10,000 of them. That's why they still work when the attacks are rare."
         TN lights, its 9,890 swells, then it ghosts and is struck through; the 50 attacks ring.
         Opens on SEAM[5], ends still on SEAM[6]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.35" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.35;
  const MASTER = 21.45;
  // beat-local = master − MASTER (v2 VO; words.json, onsets checked on the vo_final.wav RMS envelope)
  const CUE = {
    neither: 0.17,   /* "Neither"   (21.62, onset 21.55) both row labels pulse once, half lit */
    tru: 0.93,       /* "true"      (22.38, "t" from ~22.40, vowel 22.52) TN lights */
    negatives: 1.11, /* "negatives" (22.56, onset 22.52) */
    tenK: 3.06,      /* "10,000"    (24.51, onset 24.56) the 9,890 swells */
    them: 3.77,      /* end of "them." (25.22) TN ghosts and is struck through */
    rare: 5.71,      /* "rare."     (27.16, onset 27.10, ends 27.46) the 50 gold dots ring */
  };
  const HOLD = 6.05;  // still from here (VO ends 6.01); S(t >= HOLD) is SEAM[6]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, pulse, SEAM } = SC;
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[5];
    if (t >= HOLD) return SEAM[6];
    const both = 0.5 * pulse(t, 0.05, 0.80);                   // "Neither one": both labels, down by 0.85
    const on = seg(t, CUE.tru - 0.05, CUE.tru + 0.25);         // TN lit (0.3 s)
    const out = seg(t, CUE.them - 0.07, CUE.them + 0.58);                 // lit off, ghost and strike in (0.65 s)
    return {
      attackRing: pulse(t, CUE.rare - 0.26, 0.55),             // peaks on "rare", gone by 6.00
      box: { lit: { tn: on * (1 - out) }, bright: { tn: pulse(t, CUE.tenK - 0.05, 0.6) },
             ghost: { tn: out }, strike: { tn: out } },
      bars: { r: { num: 1, den: 1, pct: 1, lit: both }, p: { num: 1, den: 1, pct: 1, lit: both } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
