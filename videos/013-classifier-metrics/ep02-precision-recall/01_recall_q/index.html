<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_recall_q (beat 1, master 0.00–4.35, v2 VO): "Recall is asking, of all the positives, how many did I actually catch?"
         Opens on SEAM[0] (first frame of the Short), ends still on SEAM[1]. Hero: the attack column. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.35" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.35;
  const MASTER = 0.00;
  // beat-local seconds (words.json master − 0.00), checked on the vo_final.wav RMS envelope
  const CUE = {
    recall: 0.40,     /* "Recall" (envelope onset 0.40) */
    positives: 1.92,  /* "positives" (envelope onset 1.90) */
    catch_: 3.80,     /* "catch?" (3.80–4.18) */
  };
  const HOLD = 4.02;  // still from here (0.33 s); S(t) === SEAM[1]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[0];
    if (t >= HOLD) return SEAM[1];
    // hook rule: frame 0 is the finished picture, motion from frame 1; "recall" is lit as the word lands
    const rLit = E.out(seg(t, 0, CUE.recall + 0.12));
    const col = E.io(seg(t, CUE.positives - 0.08, CUE.positives + 0.32));   // column + its 50 dots (0.4 s)
    const br = pulse(t, CUE.catch_ - 0.22, 0.44);                             // the 40 swells, peak on "catch"
    return {
      ring: { tp: col, fn: col },
      box: { lit: { tp: col, fn: col }, bright: { tp: br } },
      bars: { r: { lit: rLit } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
