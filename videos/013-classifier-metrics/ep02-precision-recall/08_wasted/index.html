<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 08_wasted: beat 8 of 013 ep02 (the last), "and precision is about what you wasted. These
         are real users that you ended up blocking." Opens on SEAM[7], ends still on SEAM[8], the
         last frame of the Short. Hero: the FP cell, then none. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.732" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.732;
  const MASTER = 31.06;
  // beat-local = master − MASTER (words.json v2 VO; onsets checked on the vo_final.wav RMS envelope)
  const CUE = {
    precision: 0.16, /* "precision" (31.22, onset 31.20) precision's label pulses up, down before "wasted" */
    wasted: 1.22,    /* "wasted"    (32.28) FP lit, "FP" crossfades to "wasted" */
    real: 2.34,      /* "real"      (33.40) the 60 ringed users right of the threshold get their halo */
    blocking: 3.53,  /* "blocking"  (34.59; VO ends 34.94) FP and its dots back to rest */
  };
  const HOLD = 4.04;   // 35.10 master: still from here to the end, S(t) === SEAM[8]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const FULL = { num: 1, den: 1, pct: 1 };

  function S(t) {
    if (t <= 0) return SEAM[7];
    if (t >= HOLD) return SEAM[8];
    // first: FN and its rings to rest ("missed" stays)
    const fnOff = 1 - E.io(seg(t, 0.0, 0.24));
    // one hero at a time: "precision" up on the word, down before the cell lights
    const pUp = E.io(seg(t, 0.20, 0.48)), pDn = E.io(seg(t, 0.85, 1.15));
    const fpOn = E.io(seg(t, CUE.wasted - 0.05, CUE.wasted + 0.35));
    const ringOn = E.out(seg(t, CUE.real - 0.1, CUE.real + 0.4));
    // "blocking": hold through the word, then everything back to rest
    const off = 1 - E.io(seg(t, CUE.blocking + 0.12, HOLD));
    return {
      ring: { fn: fnOff, fp: ringOn * off },
      box: { ghost: { tn: 1 }, strike: { tn: 1 }, lit: { fn: fnOff, fp: fpOn * off }, alt: { fn: 1, fp: fpOn } },
      bars: { r: FULL, p: { ...FULL, lit: pUp * (1 - pDn) } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
