<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_context (beat 2, master 4.35–6.90, v2 VO): "10,000 requests come in, but only 50 are attacks."
         Opens on SEAM[1], ends still on SEAM[2] (rest). Hero: none (the tag brightens white). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.55" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.55;
  const MASTER = 4.35;
  // beat-local seconds (words.json master − 4.35), checked on the vo_final.wav RMS envelope
  const CUE = {
    tenk: 0.15,       /* "10,000" (4.50; envelope 4.48) */
    requests: 0.53,   /* "requests" (4.88) */
    only: 1.31,       /* "only" (5.66) */
    fifty: 1.45,      /* "50" (5.80) */
    attacks: 1.95,    /* "attacks." (6.30–6.70) */
  };
  const HOLD = 2.2;   // still from here (0.35 s); S(t) === SEAM[2]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  // up on a, hold, down by b (fades: 0.3 s each)
  const bump = (t, a, b, w = 0.3) => E.io(seg(t, a, a + w)) * (1 - E.io(seg(t, b - w, b)));
  function S(t) {
    if (t <= 0) return SEAM[1];
    if (t >= HOLD) return SEAM[2];
    const out = 1 - E.io(seg(t, 0, 0.4));                    // beat 1's column, rings, label back to rest
    return {
      ring: { tp: out, fn: out },
      box: { lit: { tp: out, fn: out } },
      bars: { r: { lit: out } },
      tag: { bright2: bump(t, CUE.tenk - 0.05, 1.25),
             atk: bump(t, CUE.fifty - 0.10, HOLD) },
      userPulse: pulse(t, CUE.tenk, 0.7),
      attackRing: pulse(t, CUE.fifty, 0.65),
    };
  }
  // Local helper (not in the kit): the tag line being named swells 1 → 1.04 → 1, the DOM
  // motion `sweep_static` needs (the kit's tag fields are colour only). Reset to none by HOLD.
  const span = K.tag.l2.querySelector("span");
  span.style.display = "inline-block";
  const swell = (e, s) => { e.style.transformOrigin = "50% 50%"; e.style.transform = s > 1e-4 ? `scale(${1 + 0.04 * s})` : "none"; };
  function render(t) {
    K.draw(g, S(t));
    const on = t > 0 && t < HOLD;
    swell(K.tag.l2, on ? pulse(t, CUE.tenk - 0.05, 0.9) : 0);
    swell(span, on ? pulse(t, CUE.fifty - 0.10, 0.75) : 0);
  }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
