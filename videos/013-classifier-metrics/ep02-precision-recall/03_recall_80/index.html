<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 03_recall_80: "If there were 50 attacks and we only caught 40, recall is about 80%."
         Opens on SC.SEAM[2], ends on SC.SEAM[3]. Hero: the lift (attack column into recall's
         denominator), then recall's row and its 80%. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.25" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.25;
  const MASTER = 6.90;
  // beat-local seconds (words.json master − 6.90), v2 VO, checked on the vo_final.wav RMS envelope
  const CUE = {
    fifty: 0.44,    /* "50" (7.34) */
    attacks: 0.82,  /* "attacks" (envelope onset ~7.68) */
    caught: 1.66,   /* "caught" (8.56) */
    forty: 1.86,    /* "40," (8.76; voiced onset ~8.94) */
    recall: 2.73,   /* "recall" (9.63; envelope onset ~9.62) */
    eighty: 3.32,   /* "80%." (10.22; ends 10.84) */
  };
  const HOLD = 3.95;  // still from here; S(t) === SEAM[3]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[2];
    if (t >= HOLD) return SEAM[3];
    const LIFT0 = CUE.fifty + 0.31, LIFT1 = LIFT0 + 0.9;             // the column leaves (0.9 s)
    const on = E.out(seg(t, CUE.fifty, CUE.fifty + 0.25));            // column frames + rings on "50"
    const leave = E.io(seg(t, LIFT0, LIFT0 + 0.45));                  // ...and off as the lift leaves
    const col = on * (1 - leave);
    const u = seg(t, LIFT0, LIFT1);
    const a = t < LIFT0 ? 0 : 1 - seg(t, LIFT1 - 0.05, LIFT1 + 0.3);
    const den = E.out(seg(t, LIFT1 - 0.15, LIFT1 + 0.15));            // 50 lands as the frame arrives
    const F0 = CUE.caught, F1 = CUE.caught + 0.75;                    // the 40 flies (0.75 s)
    const fly = seg(t, F0, F1);
    const num = E.out(seg(t, F1 - 0.12, F1 + 0.15));
    const lit = E.out(seg(t, CUE.recall, CUE.recall + 0.3)) * (1 - E.io(seg(t, HOLD - 0.4, HOLD)));
    const pct = E.out(seg(t, CUE.eighty, CUE.eighty + 0.25));
    const pctHero = 1 - E.io(seg(t, HOLD - 0.4, HOLD));   // 80% magenta 3.32–3.55, then back (0.4 s)
    return {
      ring: { tp: col, fn: col },
      box: { lit: { tp: col, fn: col } },
      lift: { kind: "col", u, a },
      bars: { r: { lit, den, num, pct, pctHero }, flyNum: { row: "r", u: fly } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
