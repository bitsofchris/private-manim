<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 04_precision_q: "Now precision is saying, of the ones that I did predict were positive, how many
         actually were positive?" Opens on SC.SEAM[3], ends on SC.SEAM[4]. Hero: the flagged row (tp + fp). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.4" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.40;
  const MASTER = 12.90;
  // beat-local seconds (words.json master − 12.90), checked on the vo_final.wav RMS envelope
  const CUE = {
    now: 0.18,        /* "Now" (13.08) */
    precision: 0.32,  /* "precision" (envelope onset ~13.22) */
    predict: 2.72,    /* "predict" (15.62) */
    positive: 3.35,   /* "positive," (16.25) */
    actually: 4.74,   /* "actually" (17.64) */
    end: 6.02,        /* end of "positive?" (18.92) */
  };
  const HOLD = 6.10;  // still from here; S(t) === SEAM[4]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const FULL = { num: 1, den: 1, pct: 1 };
  function S(t) {
    if (t <= 0) return SEAM[3];
    if (t >= HOLD) return SEAM[4];
    const lit = E.out(seg(t, CUE.now + 0.1, CUE.precision + 0.3));    // "precision" label lights
    const row = E.io(seg(t, CUE.predict, CUE.predict + 0.4));         // the flagged row frames
    const ring = E.io(seg(t, CUE.predict + 0.1, CUE.positive + 0.35)); // its 100 dots ring / grow
    // TP's 40 swells and settles; peak 0.85 (scale 1.10), since at 1.12 its line box touches the "TP" tag (content_overlap)
    const br = 0.85 * pulse(t, CUE.actually, 0.8);
    return {
      ring: { tp: ring, fp: ring },
      box: { lit: { tp: row, fp: row }, bright: { tp: br } },
      bars: { r: FULL, p: { lit } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
