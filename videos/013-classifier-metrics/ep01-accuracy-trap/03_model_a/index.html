<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 03_model_a: "Now, here's a real model. It flags 100 requests and catches 40 of the 50 attacks,
         but its accuracy goes down to 99.3%." Opens on SC.SEAM[2], ends on SC.SEAM[3]. Hero: the threshold. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.105" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.105;
  const MASTER = 7.85;
  // beat-local seconds (master − 7.85); carried from the first cut's envelope-checked cues by the exact cut shift
  const CUE = {
    real: 0.23,     /* "real model" */
    catches: 0.975, /* "catches" (the flagged dots light up here; "flags 100" was cut) */
    attacks: 2.555, /* end of "50 attacks," */
    down: 4.185,    /* "down" */
    acc: 4.515,     /* "99.3%." */
  };
  const HOLD = 5.0;  // still from here; S(t) === SEAM[3]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM, LEDGER } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t <= 0) return SEAM[2];
    if (t >= HOLD) return SEAM[3];
    const thr = E.out(seg(t, CUE.real, CUE.real + 0.7));      // threshold drops in on "real model"
    const flag = E.io(seg(t, CUE.catches, CUE.catches + 0.6)); // the 100 right of it light up
    const caught = Math.floor(40 * E.out(seg(t, CUE.catches, CUE.attacks)) + 1e-9);
    const value = t >= CUE.acc ? LEDGER.accA : t >= CUE.down ? "99.4%" : LEDGER.accNever;
    return {
      thr, flag,
      counter: { value, caught, pulseCaught: 0.6 * pulse(t, CUE.attacks, 0.5) },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
