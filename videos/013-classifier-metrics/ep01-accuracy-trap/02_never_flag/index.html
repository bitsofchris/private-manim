<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_never_flag (master 5.20–13.30): "It's a prompt injection detector. 10,000 requests come in, but only
         50 are attacks. It never flags anything, and you're still right 99.5% of the time."
         Opens on SEAM[1], ends on SEAM[2] (compact counter + code card, output shown, nothing lit). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.1" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.10;
  const MASTER = 5.20;
  const CUE = {                 // beat-local = master − 5.20
    prompt: 0.44,    /* "prompt" (master 5.64; envelope onset 5.64) */
    detector: 1.68,  /* end of "detector." (master 6.88) */
    requests: 1.96,  /* "10,000" (master 7.16; onset 7.18) */
    fifty: 3.26,     /* "50" of "only 50" (master 8.46) */
    never: 4.70,     /* "never" (master 9.90; "It never" onset 9.84) */
    right: 6.16,     /* "right" (master 11.36) */
    acc: 6.42,       /* "99.5%" (master 11.62; onset 11.64) */
    time: 7.30,      /* "of the time" (master 12.50–13.04): output goes back to teal */
    still: 7.70,     /* hold SEAM[2] from here */
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, pulse, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  const clone = (o) => JSON.parse(JSON.stringify(o));

  const CARD_IN = CUE.never + 0.6;   // the counter is compact (and its label/caught line gone) before the card shows

  function S(t) {
    if (t >= CUE.still) return clone(SEAM[2]);
    const s = clone(SEAM[1]);
    // "prompt injection detector": the tag's first line brightens, then settles
    s.tagBright = E.io(seg(t, CUE.prompt, CUE.prompt + 0.3)) * (1 - E.io(seg(t, CUE.detector, CUE.detector + 0.4)));
    s.userPulse = pulse(t, CUE.requests, 0.7);      // "10,000 requests"
    s.attackRing = pulse(t, CUE.fifty, 0.7);        // "only 50"
    // "never flags": the counter goes compact; the caught line leaves first
    s.counter.compact = E.io(seg(t, CUE.never + 0.05, CUE.never + 0.65));
    s.counter.subOpacity = 1 - seg(t, CUE.never - 0.1, CUE.never + 0.15);
    const card = E.out(seg(t, CARD_IN, CARD_IN + 0.3));
    if (card > 0) {
      const sw = seg(t, CUE.right, CUE.right + 0.15);            // "right": line 3 -> line 4
      const l4 = sw * (1 - seg(t, CUE.acc, CUE.acc + 0.15));     // line 4 off as the output arrives
      s.code = {
        opacity: card,
        lit: [0, 0, 1 - sw, l4],
        out: E.out(seg(t, CUE.acc, CUE.acc + 0.25)),
        // magenta only once line 4's bar is gone (one hero at a time), back to teal by the end
        outHero: E.io(seg(t, CUE.acc + 0.15, CUE.acc + 0.35)) * (1 - E.io(seg(t, CUE.time, CUE.still))),
      };
    }
    return s;
  }
  // Local helper (not in the kit): the "accuracy" label leaves before the value rises into it
  // (the kit fades it with 1 − compact, which overlaps the value mid-move).
  function labelOut(t) {
    const a = Math.min(1 - seg(t, CUE.never - 0.1, CUE.never + 0.1), parseFloat(K.counter.lab.style.opacity));
    K.counter.lab.style.opacity = a; K.counter.lab.style.visibility = a > 0.001 ? "visible" : "hidden";
  }
  function render(t) { K.draw(g, S(t)); labelOut(t); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
