<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_box_misses (master 31.20, 6.50 s): "A false negative, I said user, but it was an attack. And a true
         negative, I said user, and it was a user." Opens on SC.SEAM[4], ends on SC.SEAM[5]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.5" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.50;
  const MASTER = 31.20;
  // beat-local = master − MASTER (words.json; onsets checked on the vo_final.wav RMS envelope)
  const CUE = {
    falseNeg: 0.28, /* "false" (31.48, onset 31.49 on the envelope) FN lit, the 10 gold dots fly */
    trueNeg: 3.72,  /* "true"  (34.92, onset 34.92) TN lit, the teal pile streams in */
  };
  const STILL = 5.80;  // everything settled before this; S(t ≥ STILL) is SEAM[5] itself
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);

  function S(t) {
    if (t <= 0) return SEAM[4];
    if (t >= STILL) return SEAM[5];
    // FN: the hero moves from FP to FN, the 10 gold dots fly (1.2 s), "FN 10" lands as they arrive
    const fpOff = seg(t, CUE.falseNeg - 0.1, CUE.falseNeg + 0.1);
    const fnOn = seg(t, CUE.falseNeg, CUE.falseNeg + 0.2);
    const flyFn = seg(t, CUE.falseNeg, CUE.falseNeg + 1.2);
    const showFn = E.out(seg(t, CUE.falseNeg + 0.6, CUE.falseNeg + 1.2));
    // TN: the hero moves to TN, the 9,890 teal dots stream in (1.6 s), "TN 9,890" lands as they settle
    const fnOff = seg(t, CUE.trueNeg - 0.1, CUE.trueNeg + 0.1);
    const tnOn = seg(t, CUE.trueNeg, CUE.trueNeg + 0.2);
    const flyTn = seg(t, CUE.trueNeg, CUE.trueNeg + 1.6);
    const showTn = E.out(seg(t, CUE.trueNeg + 1.1, CUE.trueNeg + 1.6));
    return {
      thr: 1, thrDim: 1, flag: 1, counter: { opacity: 0 },
      fly: { tp: 1, fp: 1, fn: flyFn, tn: flyTn },
      box: { opacity: 1, show: { tp: 1, fp: 1, fn: showFn, tn: showTn },
             lit: { fp: 1 - fpOff, fn: fnOn * (1 - fnOff), tn: tnOn } },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
