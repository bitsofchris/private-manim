<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_where_accuracy: "Now look where the accuracy comes from. Almost all of it is true
         negatives. These are the easy ones." The TN cell swells (split 0.5 -> 0.22), the slim
         cells lose their labels, "of 9,930" lands under 9,890. SEAM[5] -> SEAM[6]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.85" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.85;
  const MASTER = 37.70;
  const CUE = {
    accuracy: 0.58,   /* "accuracy"  38.28 — hold */
    almost: 1.68,     /* "Almost"    39.38 — the swell starts, landing on "negatives" */
    trueNeg: 2.48,    /* "true"      40.18 */
    easy: 4.04,       /* "easy"      41.74 — hold */
  };
  const SWELL = [CUE.almost, CUE.almost + 1.2];   // split 0.5 -> 0.22
  const LABELS_OUT = [CUE.almost, CUE.almost + 0.3]; // tp/fp/fn labels + row labels, before the cells get slim
  const SUB_IN = [SWELL[1] - 0.15, SWELL[1] + 0.35]; // "of 9,930"
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, SEAM } = SC, E = SC.E();
  const K = SC.mount(root);
  function S(t) {
    if (t <= SWELL[0]) return SEAM[5];
    if (t >= SUB_IN[1]) return SEAM[6];
    const sp = lerp(0.5, 0.22, E.io(seg(t, SWELL[0], SWELL[1])));
    const out = 1 - seg(t, LABELS_OUT[0], LABELS_OUT[1]);
    const sub = E.out(seg(t, SUB_IN[0], SUB_IN[1]));
    return {
      thr: 1, thrDim: 1, flag: 1, counter: { opacity: 0 }, fly: { tp: 1, fp: 1, fn: 1, tn: 1 },
      box: { opacity: 1, split: { cx: sp, cy: sp }, show: { tp: out, fp: out, fn: out, tn: 1 }, lit: { tn: 1 },
             sub: { tn: ["of 9,930", sub] }, rowOpacity: out },
    };
  }
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
