<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_swap (10.60 s, master 26.00): ROC -> PR. The readout notes leave, "false positive rate"
         becomes "precision", the unflagged users mute, "true positive rate" becomes "recall", both names
         swap axes together on opposite arcs, then the curve (hero) morphs to (recall, precision) and the
         good corner (top right) glows. Opens on SC.SEAM[4], ends on SC.SEAM[5]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.6" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 10.6;
  const CUE = {
    swap: 0.36,       /* "swap"       26.36 */
    fpr: 0.88,        /* "false"      26.88 — x name lights */
    prec: 1.72,       /* "precision"  27.72 — x name becomes "precision" */
    trueNeg: 3.53,    /* "true"       29.53 */
    neg: 3.66,        /* "negatives"  29.66 */
    recall: 4.76,     /* "Recall"     30.76 — y name becomes "recall" */
    across: 5.16,     /* "across"     31.16 */
    up: 6.54,         /* "up"         32.54 */
    curve: 7.92,      /* "curve"      33.92 */
    drops: 8.08,      /* "drops"      34.08 — the morph lands */
    good: 9.42,       /* "good"       35.42 */
    right: 10.17,     /* "right"      36.17 — corner fully lit */
  };
  const OUT = [0, 0.6];                              // readout notes, ring, ROC area leave
  const B_LIT = [CUE.fpr, CUE.fpr + 0.3];            // "false positive rate" brightens
  const B_TXT = [CUE.prec - 0.15, CUE.prec + 0.3];   // ... becomes "precision"
  const B_UNLIT = [2.0, 2.4];
  const TN = [CUE.trueNeg - 0.15, CUE.neg + 0.5];    // unflagged pile mutes (0.78 s)
  const A_TXT = [CUE.recall - 0.16, CUE.recall + 0.19]; // done before the move starts
  const MOVE = [5.0, 6.5];                           // both names, together, opposite arcs
  const HERO = [6.5, 6.9];                           // threshold + point -> curve
  const MORPH = [6.6, 8.3];                          // m 0 -> 1, lands on "drops"
  const CORNER = [CUE.good, CUE.right];
  const HOLD = CORNER[1];                            // still from here (0.43 s) = SEAM[5]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, SEAM, LEDGER } = SC, E = SC.E();
  const K = SC.mount(root);
  const SUB4 = SEAM[4].notes.sub;
  function S(t) {
    if (t <= 0) return SEAM[4];
    if (t >= HOLD) return SEAM[5];
    const out = 1 - E.out(seg(t, OUT[0], OUT[1]));
    const bLit = E.out(seg(t, B_LIT[0], B_LIT[1])) * (1 - E.io(seg(t, B_UNLIT[0], B_UNLIT[1])));
    const mv = E.io(seg(t, MOVE[0], MOVE[1]));
    const h = E.io(seg(t, HERO[0], HERO[1]));
    return {
      t: LEDGER.tP, thr: { u: 1, dim: h }, fpLit: 1, tnDim: E.io(seg(t, TN[0], TN[1])),
      m: E.io(seg(t, MORPH[0], MORPH[1])), curve: { hero: h },
      rocArea: { o: 0.5 * out }, point: { o: 1, hero: 1 - h, ring: out },
      corner: E.out(seg(t, CORNER[0], CORNER[1])),
      names: { aText: E.io(seg(t, A_TXT[0], A_TXT[1])), aMove: mv,
               bText: E.io(seg(t, B_TXT[0], B_TXT[1])), bMove: mv, aLit: 0, bLit },
      notes: { roc: { o: 0 }, ptLab: { o: out }, sub: [[SUB4[0][0], out], [SUB4[1][0], out, SUB4[1][2]]] },
    };
  }
  window.__S = S;   // for the seam check

  // Local helper passNames: the kit's arcs bow both names in y, but they travel the same diagonal in
  // opposite directions, so they still meet mid-move. While 0 < move < 1 this re-places the two boxes
  // on horizontal arcs instead: "recall" swings right through the empty plot, "precision" hugs the left
  // edge, so at the moment they share a row they sit ~125 px apart. At move 0 and 1 the kit's own
  // placement stands (the paths start and end exactly on the kit's slots).
  const nameBox = (w) => [...root.querySelectorAll("div")].find((e) => e.firstChild && e.firstChild.textContent === w);
  const BOX_A = nameBox("true positive rate"), BOX_B = nameBox("false positive rate");
  const SWING_A = 340, SWING_B = -90;   // px, peak sideways bow at mid-move
  function passNames(mv) {
    if (!(mv > 0 && mv < 1)) return;
    const k = Math.sin(Math.PI * mv);
    const wA = BOX_A.children[1].offsetWidth, wB = BOX_B.children[1].offsetWidth;   // both already show the new word
    const ax = lerp(SC.PL, (SC.PL + SC.PR) / 2 - wA / 2, mv) + SWING_A * k, ay = lerp(700, 1210, mv);
    const bx = lerp((SC.PL + SC.PR) / 2 - wB / 2, SC.PL, mv) + SWING_B * k, by = lerp(1210, 700, mv);
    BOX_A.style.left = ax + "px"; BOX_A.style.top = ay + "px";
    BOX_B.style.left = bx + "px"; BOX_B.style.top = by + "px";
  }
  function render(t) { const s = S(t); K.draw(g, s); passNames(s.names ? s.names.aMove || 0 : 0); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
