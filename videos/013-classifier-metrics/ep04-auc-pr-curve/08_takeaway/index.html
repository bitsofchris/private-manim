<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 08_takeaway (last beat of the Short): "When positives are rare, we want to compare models
         on the precision-recall curve." The 50 gold dots ring once on "rare"; on "compare models"
         the score line fades and the code card takes its place; the PR area hands the magenta to
         the card's second line by "precision". Still from ~2.95 s. SEAM[7] -> SEAM[8]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.85" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.85;
  const CUE = {
    positives: 0.32, /* "positives" 47.92 */
    rare: 0.94,      /* "rare"      48.54 — the gold ring peaks */
    compare: 1.65,   /* "compare"   49.25 — the score line fades */
    models: 1.96,    /* "models"    49.56 — the code card comes in */
    precision: 2.88, /* "precision" 50.48 — line 2 lit (hero) */
    curve: 3.62,     /* "curve"     51.22 — hold */
  };
  const RING = [CUE.rare - 0.3, 0.6];                  // pulse(start, width): peaks on "rare"
  const LINE_OUT = [CUE.compare - 0.1, CUE.compare + 0.5];  // line 1->0 (0.6 s)
  const CARD_IN = [CUE.models - 0.05, CUE.models + 0.55];   // code.o 0->1; ~25% in when the line is gone
  const HAND = [CUE.precision - 0.4, CUE.precision + 0.05]; // prArea.hero 1->0, code.lit[1] 0->1
  const STILL = HAND[1];
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM, LEDGER } = SC, E = SC.E();
  const K = SC.mount(root);
  const PRN = SEAM[8].names;
  function S(t) {
    if (t <= 0) return SEAM[7];
    if (t >= STILL) return SEAM[8];
    const L = 1 - E.io(seg(t, LINE_OUT[0], LINE_OUT[1]));
    const lit = E.io(seg(t, HAND[0], HAND[1]));
    const on = L > 0 ? 1 : 0;   // fpLit / tnDim end at their rest 0, switched only once the line is gone
    return { t: LEDGER.tP, thr: { u: 1, dim: 1 }, fpLit: on, tnDim: on, attackRing: pulse(t, RING[0], RING[1]),
             line: L, m: 1, point: { o: 1 }, names: PRN,
             base: { o: 1, v: SEAM[8].base.v }, prArea: { o: 1, hero: 1 - lit },
             notes: { pr: { o: 1 }, prSub: 1 },
             code: { o: E.io(seg(t, CARD_IN[0], CARD_IN[1])), lit: [0, lit], out: [1, 1] } };
  }
  // Local helper (kit gap): makeNotes draws the baseline's label from notes.base, but draw() passes only
  // S.notes and the seams keep base at the top level, so the label never shows. Mirror S.base into
  // notes.base at draw time; S(t) itself still equals the seam states.
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
