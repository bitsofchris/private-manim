<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 04_the_point (master 17.70, 8.30 s): "Now look at this point. False positive rate 2.3 percent.
         Sounds small. It's 233 real users blocked just to catch 44 attacks."
         Opens on SC.SEAM[3], ends on SC.SEAM[4]. Hero: the threshold and its point. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/dots.js"></script>
    <script src="kit/score.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.3" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.30;
  // beat-local = master − 17.70 (words.json)
  const CUE = {
    now: 0.22,      /* "Now"      the ROC readout, pair, diagonal and subs leave */
    thisW: 0.54,    /* "this"     hero hand-off: area -> threshold, the point appears */
    point: 0.76,    /* "point"    the threshold slides 0.70 -> 0.55, the point runs down the curve */
    fpr: 2.36,      /* "2.3%"     "FPR 2.3%" by the point */
    n233: 4.56,     /* "233"      the 233 flagged users brighten */
    blocked: 6.04,  /* "blocked"  "233 users blocked" is in by here */
    n44: 7.12,      /* "44"       "44 attacks caught" (gold) */
    attacks: 7.54,  /* "attacks"  the attack rings pulse */
  };
  const STILL = 8.00;  // everything settled before this; the last 0.3 s is SEAM[4]
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, pulse, SEAM, LEDGER } = SC, E = SC.E();
  const K = SC.mount(root);

  // S-BEGIN
  const SUB3 = SEAM[3].notes.sub, SUB4 = SEAM[4].notes.sub;
  function S(t) {
    t = Math.min(t, STILL);
    const out = E.io(seg(t, 0.05, 0.50));                  // ROC readout, pair, diagonal, subs out; area to 0.5
    const heroOut = E.io(seg(t, 0.20, 0.60));              // the area hands the hero over ...
    const hand = E.io(seg(t, CUE.thisW - 0.14, CUE.thisW + 0.26));  // ... to the threshold and the point
    const move = E.io(seg(t, CUE.point, CUE.point + 1.30)); // 0.70 -> 0.55
    const ring = E.out(seg(t, CUE.point + 1.14, CUE.point + 1.64));  // rings as it lands
    const lab = E.out(seg(t, CUE.fpr - 0.16, CUE.fpr + 0.34));
    const lit = E.io(seg(t, CUE.n233 - 0.06, CUE.n233 + 0.74));
    const s0 = E.out(seg(t, CUE.blocked - 0.74, CUE.blocked - 0.14));
    const s1 = E.out(seg(t, CUE.n44 - 0.22, CUE.n44 + 0.28));
    const ar = pulse(t, CUE.attacks - 0.24, 0.6);
    // subs: the beat-3 lines fade out first; the new strings only appear once those are at 0
    const sub = out < 1
      ? [[SUB3[0][0], 1 - out], [SUB3[1][0], 1 - out]]
      : [[SUB4[0][0], s0], [SUB4[1][0], s1, SUB4[1][2]]];
    return {
      t: lerp(LEDGER.tA, LEDGER.tP, move),
      thr: { u: 1, dim: 1 - hand },
      fpLit: lit, pair: 1 - out, diag: 1 - out, attackRing: ar,
      rocArea: { o: lerp(1, 0.5, out), hero: 1 - heroOut },
      point: { o: hand, hero: 1, ring },
      notes: { roc: { o: 1 - out }, ptLab: { o: lab }, sub },
    };
  }
  // S-END
  window.__S = S;
  function render(t) { K.draw(g, S(t)); }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => render(tl.time()));
})();
    </script>
  </body>
</html>
