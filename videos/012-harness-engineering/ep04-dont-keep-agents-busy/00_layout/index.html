<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frame of Harness ep 4, for Chris's sign-off before beats are built.
         0–2 s: the opening (agents throwing finished pages onto the pile beside the human's own sheet).
         2–4 s: the code card (the Karpathy beat). 4–6 s: the day strip with the blocked slot (the closer). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.0;
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  function render(t) {
    if (t < 2) {
      scene.draw({ flow: 3 + t * 1.6, stream: 1, pile0: 4, sheet: { ink: 2 }, write: 0 }, t);
    } else if (t < 4) {
      scene.draw({ flow: 0, stream: 0, pileOut: 1, sheet: { ink: 3 }, write: 1, agents: { rest: 1 },
                   code: { a: 1, plumb: 1, core: 1, coreHero: 1 } }, t);
    } else {
      scene.draw({ flow: 0, stream: 0, pileOut: 1, sheet: { ink: 5 }, write: 1, agents: { rest: 1 },
                   day: { a: 1, slot: 1 } }, t);
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
