<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 3: "the bottleneck". The pile turns magenta and towers; the human leans back, frowns; the sheet goes muted. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.1" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 3, BEAT_SECONDS = 3.10;
  const T0 = DESK.START[BEAT];                                   // 10.00
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM[BEAT - 1], B = SEAM[BEAT];                       // open on A, end on B
  const CUE = {
    neck: 10.30 - T0,   /* "bottleneck" : the pile turns magenta */
    review: 11.30 - T0, /* "reviewing"  : the human leans back, frowns; the sheet goes muted */
  };
  const HOLD_FROM = BEAT_SECONDS - 0.3;                           // short beat: 0.3 s still
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  function render(t) {
    // the stream carries on from beat 2 at full speed and keeps climbing, easing to a stop at the hold
    const f = E.out(seg(t, 0, HOLD_FROM));
    const back = E.io(seg(t, CUE.review, CUE.review + 0.7));      // lean back
    const S = {
      flow: lerp(A.flow, B.flow, f),                              // 16.5 -> 24
      stream: 1, pile0: 4, pileOut: 0,
      pileHero: E.io(seg(t, CUE.neck, CUE.neck + 0.4)),           // 0 -> 1
      sheet: { ink: 2, hero: 0, dim: E.io(seg(t, CUE.review, CUE.review + 0.6)) },
      human: { armR: 22, armL: 22, lean: lerp(0, B.human.lean, back), tilt: lerp(A.human.tilt, B.human.tilt, back),
               face: t < CUE.review ? A.human.face : B.human.face },
      write: 0, wiggle: 0, agents: { rest: 0 },
    };
    scene.draw(S, T0 + t);                                        // master time
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
