<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 1 (01_hook), master 0.00–5.50. Opens on DESK.SEAM[0], ends on DESK.SEAM[1].
         Agents throw pages onto the small pile while the human writes; on "understand things" the sheet
         turns magenta as its 2nd line writes in; the writing stops before the hold. Hero: the sheet. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.50" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 1, BEAT_SECONDS = 5.50;
  const T0 = DESK.START[BEAT];                                   // 0.00
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM[BEAT - 1], B = SEAM[BEAT];
  const CUE = {
    busy: 2.06 - T0,        /* "busy" — the stream keeps coming (no change, it never stops) */
    understand: 4.52 - T0,  /* "understand" — the sheet starts turning magenta */
    things: 4.90 - T0,      /* "things" — magenta full, the 2nd line nearly written */
  };
  const HOLD_FROM = BEAT_SECONDS - 0.4;                          // 5.10
  // flow: constant rate from frame 0, decelerating to rest over the last DECEL s before the hold.
  const DECEL = 0.7, CRUISE = HOLD_FROM - DECEL;
  const V = (B.flow - A.flow) / (CRUISE + DECEL / 2);           // pages per second while cruising
  function flowAt(t) {
    if (t <= CRUISE) return A.flow + V * t;
    const s = Math.min(t, HOLD_FROM) - CRUISE;
    return A.flow + V * CRUISE + V * s - (V / (2 * DECEL)) * s * s;
  }
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  function render(t) {
    const hero = E.io(seg(t, CUE.understand, CUE.things));                 // 0 -> 1 on "understand"
    const ink = A.sheet.ink + E.io(seg(t, CUE.understand - 0.12, CUE.things + 0.05)) * (B.sheet.ink - A.sheet.ink);
    const wiggle = E.io(seg(t, 0, 0.25)) * (1 - E.io(seg(t, 4.85, 5.05)));  // up from frame 0, down before the hold
    const write = lerp(A.write, B.write, E.io(seg(t, 4.70, HOLD_FROM)));     // pencil off the sheet
    const S = {
      flow: t >= HOLD_FROM ? B.flow : flowAt(t),
      stream: 1, pile0: 4,
      sheet: { ink: t >= HOLD_FROM ? B.sheet.ink : ink, hero: t >= HOLD_FROM ? B.sheet.hero : hero },
      write: t >= HOLD_FROM ? B.write : write,
      wiggle: t >= HOLD_FROM ? 0 : wiggle,
    };
    scene.draw(S, T0 + t);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
