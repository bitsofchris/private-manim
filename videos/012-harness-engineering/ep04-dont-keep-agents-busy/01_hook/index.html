<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 1 (01_hook), master 0.00–2.50. Opens on DESK.SEAM[0], ends on DESK.SEAM[1].
         "The goal is not to keep agents busy." Agents throw pages onto the small pile while the human
         writes; the stream runs through the cut into 01b_meters. No hero. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.50" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 1, BEAT_SECONDS = 2.50;
  const T0 = DESK.START[BEAT];                                   // 0.00
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM[BEAT - 1], B = SEAM[BEAT];
  const CUE = { busy: 2.06 - T0 /* "busy" — agent B's toss lands about here */ };
  // flow runs at one rate straight through the cut (01b_meters keeps it while the desk fades)
  const V = (B.flow - A.flow) / BEAT_SECONDS;                    // 1.12 pages/s
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  function render(t) {
    const wiggle = E.io(seg(t, 0, 0.25)) * (1 - E.io(seg(t, BEAT_SECONDS - 0.35, BEAT_SECONDS - 0.05)));
    scene.draw({ flow: t >= BEAT_SECONDS ? B.flow : A.flow + V * t, stream: 1, pile0: 4,
                 sheet: { ink: 1 }, write: 1, wiggle }, T0 + t);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
