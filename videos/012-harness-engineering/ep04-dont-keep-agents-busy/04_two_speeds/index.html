<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 4: "two speeds". Output: the stream runs. Go slow: the stream stops, the pile leaves. Understand: the sheet, magenta, gets line 3. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.75" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 4, BEAT_SECONDS = 5.75;
  const T0 = DESK.START[BEAT];                                   // 13.10
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM[BEAT - 1], B = SEAM[BEAT];                       // open on A, end on B
  const CUE = {
    opt: 14.24 - T0,    /* "optimize"     : the stream runs */
    out: 14.70 - T0,    /* "output" */
    go: 16.34 - T0,     /* "go"           : stream stops, agents lower their arms */
    slow: 16.48 - T0,   /* "slow"         : the pile slides off the desk and fades */
    delib: 17.36 - T0,  /* "deliberately" : the sheet turns magenta, the human writes */
    under: 17.78 - T0,  /* "understand"   : line 3 writing in */
  };
  const HOLD_FROM = BEAT_SECONDS - 0.4;
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  const R = DESK.HUMAN_REST;
  function render(t) {
    const calm = E.io(seg(t, 0, 0.7));                            // human back to rest, sheet un-dims
    const write = E.io(seg(t, CUE.delib - 0.5, CUE.delib));       // arm to the sheet, ready on "deliberately"
    const wig = Math.min(seg(t, CUE.delib - 0.2, CUE.delib + 0.05), 1 - seg(t, HOLD_FROM - 0.35, HOLD_FROM - 0.05));
    const S = {
      // the stream runs through "optimize for output" and is still going when "go slow" stops it
      flow: lerp(A.flow, B.flow, E.io(seg(t, 0.4, CUE.go + 0.6))),  // 24 -> 26.5
      stream: 1 - E.io(seg(t, CUE.go, CUE.go + 0.6)),
      pile0: 4,
      pileHero: 1 - E.io(seg(t, 0, 0.5)),                          // the pile back to teal, early
      pileOut: E.io(seg(t, CUE.slow, CUE.slow + 0.8)),
      agents: { rest: E.io(seg(t, CUE.go, CUE.go + 0.6)) },
      sheet: { ink: lerp(2, 3, E.io(seg(t, CUE.delib, CUE.under + 0.5))),
               dim: 1 - calm, hero: E.io(seg(t, CUE.delib, CUE.delib + 0.4)) },
      human: { armR: R.armR, armL: R.armL, lean: lerp(A.human.lean, R.lean, calm), tilt: lerp(A.human.tilt, R.tilt, calm),
               face: t < 0.35 ? A.human.face : R.face },
      write, wiggle: Math.max(0, wig),
    };
    scene.draw(S, T0 + t);                                        // master time
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
