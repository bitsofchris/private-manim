<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 8 (08_block_a_slot), 4.75 s, master 37.05.
         Opens on DESK.SEAM[7], ends on DESK.SEAM[8]. The sheet goes back to ink while the day strip
         slides in ("carve out time"); slot 2 fills magenta ("Block a slot"); the human keeps writing
         ("do the work"). Hero: the slot. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0;
              --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.75" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 8, BEAT_SECONDS = 4.75;
  const T0 = DESK.START[BEAT];                         // 37.05
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM[BEAT - 1], B = SEAM[BEAT];
  const CUE = {
    carve: 37.66 - T0,   /* "carve" (out @38.00, time @38.10) */
    time:  38.10 - T0,   /* "time" */
    block: 39.62 - T0,   /* "Block" */
    slot:  40.00 - T0,   /* "slot" */
    work:  41.08 - T0,   /* "do" (the work) */
  };
  const HOLD_FROM = BEAT_SECONDS - 0.4;                // 4.35: S equals SEAM[8] from here
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);

  function S(t) {
    const unhero = E.io(seg(t, 0, 0.6));                                // the sheet back to ink
    const dayIn  = E.io(seg(t, CUE.carve, CUE.carve + 0.7));             // day strip slides in
    const slot   = E.io(seg(t, CUE.block, CUE.slot + 0.25));             // slot 2 fills magenta
    // the pencil keeps moving from frame 0, swells on "do the work", stops before the hold
    const wig = 0.55 * E.out(seg(t, 0, 0.2))
              + 0.45 * E.io(seg(t, CUE.work - 0.2, CUE.work))
              - E.io(seg(t, CUE.work + 0.02, HOLD_FROM - 0.05));
    return {
      flow: A.flow, stream: 0, pile0: 4, pileOut: 1, agents: { rest: 1 },
      sheet: { ink: lerp(A.sheet.ink, B.sheet.ink, 1), hero: lerp(A.sheet.hero, 0, unhero) },
      write: 1, wiggle: Math.max(0, wig),
      day: { a: dayIn, slot },
    };
  }
  function render(t) { scene.draw(S(t), T0 + t); }
  window.__beatS = S;                                   // for the seam self-check
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
