<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 2 (02_obsidian), master 5.50–10.00. Opens on DESK.SEAM["1b"], ends on DESK.SEAM[2].
         "A while back I made a video about how I use Obsidian to keep agents working for me." The two
         meters only: understood back to ink; on "keep agents working" the output bar shoots to the top
         while understood stays put. No hero. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.50" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 2, BEAT_SECONDS = 4.50;
  const T0 = DESK.START[BEAT];                                   // 5.50
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM["1b"], B = SEAM[BEAT];
  const CUE = {
    obsidian: 7.94 - T0,    /* "Obsidian" 2.44 */
    keep: 8.55 - T0,        /* "keep" 3.05: the output bar shoots up */
    working: 9.06 - T0,     /* "working" 3.56 */
  };
  const HOLD_FROM = BEAT_SECONDS - 0.4;                          // 4.10
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  function render(t) {
    // the desk stays hidden in beat 3's opening state; only the meters move
    const creep = 0.06 * E.io(seg(t, 0, CUE.keep));               // output keeps creeping up while he talks
    const shoot = E.io(seg(t, CUE.keep, CUE.working + 0.45));     // then shoots to the top
    const meters = {
      a: 1, und: A.meters.und,
      out: lerp(A.meters.out + creep, B.meters.out, shoot),
      hero: lerp(A.meters.hero, 0, E.io(seg(t, 0, 0.5))),        // understood back to ink, early
    };
    scene.draw(Object.assign({}, A, { meters }), T0 + Math.min(t, HOLD_FROM));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
