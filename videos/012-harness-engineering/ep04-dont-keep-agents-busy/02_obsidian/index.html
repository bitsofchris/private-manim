<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 4, beat 2 (02_obsidian), master 5.50–10.00. Opens on DESK.SEAM[1], ends on DESK.SEAM[2].
         The sheet goes back to ink early; on "keep agents working for me" the stream speeds up, the pile
         climbs past the human's head and the human turns to it (head tilt, flat face). No magenta hero. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/desk.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.50" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT = 2, BEAT_SECONDS = 4.50;
  const T0 = DESK.START[BEAT];                                   // 5.50
  const { seg, lerp, E, SEAM } = DESK;
  const A = SEAM[BEAT - 1], B = SEAM[BEAT];
  const CUE = {
    obsidian: 7.94 - T0,    /* "Obsidian" — the stream starts to speed up */
    keep: 8.55 - T0,        /* "keep" — the human starts turning to the pile */
    working: 9.06 - T0,     /* "working" — the face goes flat mid-turn */
  };
  const HOLD_FROM = BEAT_SECONDS - 0.4;                          // 4.10
  // flow: the same cruise rate beat 1 ran at, then from "Obsidian" a Hermite rush to B.flow that
  // starts at the cruise rate and lands at rest on HOLD_FROM (most of it after "keep", 8.55).
  const V = 5.5 / (4.4 + 0.35);                                  // beat 1's cruise rate, pages/s
  const T1 = CUE.obsidian + 0.26;                                // 2.70 (master 8.20)
  const P1 = A.flow + V * T1, D = HOLD_FROM - T1;
  function flowAt(t) {
    if (t <= T1) return A.flow + V * t;
    const s = Math.min(1, (t - T1) / D), m0 = V * D;
    const h10 = s * s * s - 2 * s * s + s, h01 = -2 * s * s * s + 3 * s * s;
    return P1 + h10 * m0 + h01 * (B.flow - P1);
  }
  const root = document.getElementById("root");
  const scene = DESK.mount(root);
  ISO.guides(root);
  function render(t) {
    const hero = lerp(A.sheet.hero, 0, E.io(seg(t, 0, 0.4)));               // back to ink, early
    const turn = E.io(seg(t, CUE.keep, CUE.keep + 0.7));                    // 0.7 s head turn
    const S = {
      flow: t >= HOLD_FROM ? B.flow : flowAt(t),
      stream: 1, pile0: 4,
      sheet: { ink: 2, hero },
      write: 0, wiggle: 0,
      human: { tilt: lerp(0, B.human.tilt, turn), face: t >= CUE.working ? B.human.face : "smile" },
    };
    scene.draw(S, T0 + t);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
