<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Harness ep 2, beat 7 (07_navigate): the agent turns to the map card and points;
         on "navigate" an ink dot runs up each arrow in turn and each file pulses. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/ep02.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.45" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.45;            // master 29.95 -> 33.40
  // Cues, beat-local (master - 29.95), checked on a 20 ms RMS envelope of vo_final.wav.
  const CUE = {
    agent: 1.82,     /* "agent"    (onset 31.77 on the envelope; words.json 31.78) */
    nav: 2.07,       /* "navigate" (32.02; envelope dip 32.03, rise 32.05) */
    go: 3.28,        /* "go."      (33.24; envelope onset 33.23) */
  };
  const HOLD_FROM = 3.12;               // last 0.33 s exactly SEAM[7], still
  const DOT_LEN = 0.40, DOT_GAP = 0.23; // each dot's run, and the stagger between arrows
  const PULSE_UP = 0.07, PULSE_DOWN = 0.13;
  const { seg } = ISO;
  const E = ISO.E();
  const root = document.getElementById("root");
  const W = EP2.build(root);
  ISO.guides(root);
  const { lerp, mixHex, GRID, TARGET_FILES } = EP2;
  const PAL = CAST.PAL;

  // Local part: the agent's gaze, a small ink dot that runs up one arrow.
  const dots = W.arrows.map(() => CAST.node("circle", { cx: 0, cy: 0, r: 11, fill: PAL.ink, opacity: 0 }, W.svg));

  const S6 = EP2.SEAM[6], S7 = EP2.SEAM[7];
  function render(t) {
    if (t >= HOLD_FROM) { W.set(S7); dots.forEach((d) => d.setAttribute("opacity", 0)); return; }
    // the agent turns to the card from frame 0, and points on "agent"
    const turn = E.out(seg(t, 0, CUE.agent + 0.3));
    const pt = E.io(seg(t, CUE.agent - 0.12, CUE.agent + 0.38));
    W.set(Object.assign({}, S6, { agent: { tilt: lerp(0, -8, turn), armR: lerp(22, 115, pt) } }));
    // on "navigate": one dot per arrow, in turn; each file pulses as its dot arrives
    W.arrows.forEach((ar, i) => {
      const t0 = CUE.nav + i * DOT_GAP, u = seg(t, t0, t0 + DOT_LEN), d = dots[i];
      if (u > 0 && u < 1) {
        const p = ar.p.getPointAtLength(ar.len * E.io(u));
        d.setAttribute("cx", p.x); d.setAttribute("cy", p.y);
        d.setAttribute("opacity", Math.min(seg(u, 0, 0.12), 1 - seg(u, 0.88, 1)));
      } else d.setAttribute("opacity", 0);
      const ta = t0 + DOT_LEN;
      const k = t < ta ? E.out(seg(t, ta - PULSE_UP, ta)) : 1 - E.io(seg(t, ta, ta + PULSE_DOWN));
      if (k > 0) {
        const f = W.files[TARGET_FILES[i]], s = 1 + 0.16 * k;
        const cx = f.home.x + GRID.w / 2, cy = f.home.y + GRID.h / 2;
        f.g.setAttribute("transform", `translate(${cx} ${cy}) scale(${s}) translate(${-GRID.w / 2} ${-GRID.h / 2})`);
        f.rect.setAttribute("stroke", mixHex(PAL.data, PAL.ink, 0.45 * k));
        f.rect.setAttribute("stroke-width", 6 + 3 * k);
      }
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
