<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frame of Harness ep 2, and the world's other states for sign-off:
         0–2 s the map (beats 1, 6–8: the card in the window, arrows to three files),
         2–4 s the empty world with the human and the wander trail (beat 2),
         4–6 s the stuffed window (beats 3–4), 6–8 s the giant AGENTS.md (beat 5).
         All parts come from kit/ep02.js on top of cast/cast.js. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/ep02.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.0;
  const { seg } = ISO;
  const E = ISO.E();
  const root = document.getElementById("root");
  const W = EP2.build(root);
  ISO.guides(root);
  // the stuffed window: every file piled into the window, fixed offsets
  const PILE = W.files.map((f, i) => [EP2.WIN.x + 20 + (i % 4) * 118 + ((i * 37) % 23), EP2.WIN.y + 30 + Math.floor(i / 4) * 78 + ((i * 53) % 29)]);
  function render(t) {
    if (t < 2) {
      const u = E.out(seg(t, 0, 1.0));
      W.set(Object.assign({}, EP2.MAP, { arrows: [u, u, u], cardHero: 1 }));
    } else if (t < 4) {
      const u = seg(t, 2, 3.9);
      W.set({ win: 0.3, labelAlpha: 0.3, point: 1, trail: u, trailHero: 1,
              agent: { x: EP2.AGENT_BESIDE.x }, human: { alpha: 1, armR: 140, tilt: -6 } });
    } else if (t < 6) {
      W.set({ fileXY: PILE, winHero: 1, agent: { lean: -8, blink: 1 } });
    } else {
      W.set({ files: "muted", page: 1, pageTop: 250, pageLines: 22, agent: { tilt: 10 } });
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
