<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_close (beat 6, master 53.05–58.82): the building at rest (SEAM[5] = SEAM[6]); on "all four layers"
         the four light once each in the ledger order (0.45 s each, 2.57–4.37), then none; still from 4.37 to the
         last frame of the Short. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/wiki.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.067" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.067;
  const MASTER = 53.05;
  const CUE = {
    all: 0.25,      /* "all" (four layers), master 53.30 */
  };
  const LIT = 0.45;                                              // each layer lit this long, ledger order, from "all"
  const ORDER = ["pages", "board", "case", "janitor"];
  const { merge, SEAM } = WIKI;
  const root = document.getElementById("root");
  const K = WIKI.mount(root);
  ISO.guides(root);
  // Only the hero changes: the building is SEAM[5] (= SEAM[6]) throughout; still after the last layer goes out.
  const heroAt = (t) => { const i = Math.floor((t - CUE.all) / LIT); return t >= CUE.all && i < ORDER.length ? ORDER[i] : null; };
  function S(t) { return merge(SEAM[5], { hero: heroAt(t) }); }
  // Check workaround: hero swaps change only stroke colours, which `check`'s seek sweep does not fingerprint
  // (sweep_static; it reads only box, opacity and text of visible elements). A 4 px marker in the top dead zone, filled
  // with the background colour, whose opacity follows the lit layer gives it one DOM change; it paints nothing new.
  const mark = document.createElement("div");
  mark.setAttribute("aria-hidden", "true");
  mark.style.cssText = "position:absolute;left:8px;top:8px;width:4px;height:4px;background:#0b0b14;opacity:0.4;";
  root.appendChild(mark);
  function frame(t) {
    const s = S(t);
    K.draw(s);
    mark.style.opacity = s.hero ? 0.4 + 0.15 * (ORDER.indexOf(s.hero) + 1) : 0.4;
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, frame);
})();
    </script>
  </body>
</html>
