<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_layout: the canonical frame (SEAM[0]) and the episode's middle looks. Not in the Short.
         0–2 s the building at rest, agents writing · 2–3.6 s the callout card (beat 2) ·
         3.6–6 s the link and the kanban card (beat 3), the case's rules, the janitor sweeping the conflict (beat 5). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/wiki.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6;
  const { seg, pulse, merge, SEAM } = WIKI, E = WIKI.E();
  const root = document.getElementById("root");
  const K = WIKI.mount(root);
  ISO.guides(root);
  function S(t) {
    const s = merge(SEAM[0], { pen: t * 1.6, write: 1 - seg(t, 5.4, 5.8) });
    s.fill = [0.55 + 0.25 * seg(t, 0, 5.4), 0.35 + 0.3 * seg(t, 0, 5.4)];
    // beat 2 look: the callout
    const c = E.out(seg(t, 2.0, 2.5)) * (1 - E.io(seg(t, 3.3, 3.6)));
    s.callout = c; s.lines = 3 * seg(t, 2.3, 2.9); if (c > 0) s.hero = "callout";
    // beat 3–5 looks
    if (t >= 3.6) {
      s.hero = t < 4.6 ? "board" : t < 5.0 ? "rules" : "broom";
      s.link = E.io(seg(t, 3.6, 4.1)) * (1 - seg(t, 4.6, 4.8));
      s.kanban = E.io(seg(t, 3.9, 4.4));
      s.conflict = [seg(t, 4.6, 4.9), seg(t, 4.8, 5.1)];
      s.swept = seg(t, 5.3, 5.6);
      s.old = seg(t, 5.2, 5.7);
      s.jan = { x: 700, y: WIKI.B.floor, lean: 9 * pulse(seg(t, 5.2, 5.7)), armR: 24 + 14 * pulse(seg(t, 5.2, 5.7)), tilt: 0 };
      s.human = { armL: 22, armR: 22 + 78 * seg(t, 3.9, 4.3), tilt: 6 * seg(t, 3.9, 4.3), lean: 0, face: "smile" };
    }
    return s;
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, (t) => K.draw(S(t)));
})();
    </script>
  </body>
</html>
