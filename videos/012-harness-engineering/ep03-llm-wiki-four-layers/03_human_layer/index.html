<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 03_human_layer (12.20 s, master 25.35): "The human layer is the clean, distilled view that you
         link out and that goes to these detailed agent notes when necessary. Think of a dashboard or a
         Kanban board. It's less about reviewing what the agent's up to and more about managing your own
         context." Opens on WIKI.SEAM[2], ends on WIKI.SEAM[3] (board hero, link 1, kanban 1, human at rest). The basement stays still. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/wiki.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12.2" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 12.2;
  const MASTER = 25.35;
  const CUE = {                       // beat-local seconds (master − 25.35), words.json
    human: 0.29,     /* "human" (layer) 25.64 */
    link: 3.01,      /* "link" (out) 28.36 */
    notes: 5.37,     /* "notes" 30.72 */
    necessary: 6.17, /* "necessary." ends 31.52 */
    kanban: 7.67,    /* "Kanban" 33.02 */
    reviewing: 9.39, /* "reviewing" 34.74 */
    upto: 10.29,     /* "up to" ends 35.66 */
    managing: 10.85, /* "managing" 36.20 */
    context: 11.49,  /* "context." 36.84 */
  };
  const HOLD = 11.9;                  // still from here to the end (SEAM[3])
  const { seg, merge, SEAM } = WIKI, E = WIKI.E();
  const root = document.getElementById("root");
  const K = WIKI.mount(root);
  ISO.guides(root);
  // "reviewing what the agent's up to": 0 → 1 → 0, a glance down at the basement and back
  const look = (t) => E.io(seg(t, CUE.reviewing - 0.1, CUE.reviewing + 0.4)) * (1 - E.io(seg(t, CUE.upto - 0.25, CUE.upto + 0.35)));
  function S(t) {
    const s = merge(SEAM[2], {});
    // the basement stays still in this beat (only the layer the VO discusses moves): write 0, pen 0, fill as SEAM[2]
    // "human layer": the board is the hero for the rest of the beat
    if (t >= CUE.human) s.hero = "board";
    // "link out" → "agent notes": the dashed link draws down to page B, which pulses teal on "notes"
    s.link = E.io(seg(t, CUE.link, CUE.notes));
    if (t > CUE.notes && t < CUE.notes + 0.8) s.glow = ["pageB", seg(t, CUE.notes, CUE.notes + 0.8)];
    // "Kanban": one card slides from column 1 to column 2
    s.kanban = E.io(seg(t, CUE.kanban, CUE.kanban + 0.7));
    const glance = look(t);
    // "managing your own context": point at the board (arm up by ~11.3), then back to rest by HOLD
    const point = E.io(seg(t, CUE.managing, CUE.managing + 0.45)) * (1 - E.io(seg(t, 11.45, HOLD)));
    s.human = Object.assign({}, s.human, { armR: 22 + 78 * point, tilt: 6 * point - 12 * glance });
    if (glance === 0) s.human.tilt = 6 * point;          // no −0 at the ends
    if (point === 0) s.human.armR = 22;
    return s;
  }
  // Local helper (the kit has no eye direction): the human's eyes drop while it glances down.
  const eyes = K.parts.human.face.eyes;
  function draw(t) {
    K.draw(S(t));
    const u = look(t);
    eyes.setAttribute("transform", u > 0 ? `translate(0 ${12 * u})` : "");
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, draw);
})();
    </script>
  </body>
</html>
