<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_janitor (beat 5, master 45.05, 8.00 s). Opens on WIKI.SEAM[4], ends on WIKI.SEAM[5].
         "janitor": it goes magenta, side-steps left along the landing onto the ladder and climbs down rung by rung,
         then steps off right · "conflicting": a magenta line on page B · "before they spread": its copy draws on
         page A and the broom sweeps both out · "old material": a step right, a second sweep, the old pages go ·
         "human layer stays useful": the board pulses teal once · hold.
         Local helpers (the kit lacks them): feet() + legs() place each foot on the landing / a rung / the floor,
         grip() works the left hand on the rail and slides the broom up its own handle while climbing. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/wiki.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.0;            // storyboard "Final beats", row 5
  const MASTER = 45.05;                // master start
  const CUE = {                        // words.json master − MASTER
    janitor: 0.81,                     /* "janitor." 45.86 */
    conflicting: 2.33,                 /* "conflicting" 47.38 */
    before: 4.29,                      /* "before" 49.34 */
    spread: 4.65,                      /* "spread." 49.70 */
    old: 5.89,                         /* "old" 50.94 */
    human: 6.79,                       /* "human" 51.84 */
    useful: 7.49,                      /* "useful." 52.54 */
  };
  const HOLD_FROM = 7.7;               // still from here (S deep-equals SEAM[5])
  const { seg, pulse, merge, lerp, SEAM, LADDER } = WIKI, E = WIKI.E();
  const root = document.getElementById("root");
  const K = WIKI.mount(root);
  ISO.guides(root);
  const JS = 0.5;                      // the janitor's scale (kit S_FIG.jan)

  // ---- feet: each foot is always on the landing, a rung, or the floor ----
  // Rungs are every LADDER.rung (44) px from the slab; the rails are x 600 / 648,
  // exactly the janitor's stance (±24), so on the ladder each foot sits on a rail.
  const R0 = LADDER.x0, R1 = LADDER.x1, FL = WIKI.B.floor;
  const rung = (k) => LADDER.top + LADDER.rung * k;          // k 7 = 1008 … 13 = 1272
  const STEP = 0.16;
  const MOVES = [];                    // [foot, x, y, t0, t1, kind]
  const mv = (f, x, y, t0, d, kind) => { MOVES.push([f, x, y, t0, t0 + d, kind]); return t0 + d; };
  let c = CUE.janitor;
  // walk left along the landing (side-steps: the figures face us), the last two onto rung 7
  c = mv("L", 646, 1000, c, STEP, "walk"); c = mv("R", 694, 1000, c, STEP, "walk");
  c = mv("L", R0, rung(7), c, STEP, "walk"); c = mv("R", R1, rung(7), c, STEP, "walk");
  // climb down, one foot at a time, two rungs per move
  c += 0.05;
  [["R", 8], ["L", 9], ["R", 10], ["L", 11], ["R", 12], ["L", 13]].forEach(([f, k]) => { c = mv(f, f === "L" ? R0 : R1, rung(k), c, STEP, "climb"); });
  c = mv("R", R1, FL, c, STEP, "climb"); c = mv("L", R0, FL, c, STEP, "climb");
  const CLIMB = [MOVES[4][3], c];      // first rung move → both feet on the floor
  // step off to the right
  c += 0.07;
  c = mv("R", 684, FL, c, 0.2, "walk"); c = mv("L", 636, FL, c, 0.2, "walk");      // body (660, 1310)
  // "old material": two more steps right
  c = mv("R", 724, FL, CUE.old, 0.23, "walk"); c = mv("L", 676, FL, c, 0.23, "walk");  // body (700, 1310)

  function feet(t) {
    const P = { L: [692, 1000], R: [740, 1000] };            // SEAM[4] stance: jan (716, 1000)
    MOVES.forEach(([f, x, y, t0, t1, kind]) => {
      const u = seg(t, t0, t1);
      if (u <= 0) return;
      const a = P[f], e = E.io(u), k = u < 1 ? pulse(u) : 0;
      const nx = lerp(a[0], x, e), ny = lerp(a[1], y, e);
      // a walking foot lifts; a climbing foot swings out from its rail as it goes down
      P[f] = kind === "walk" ? [nx, ny - 12 * k] : [nx + (f === "L" ? -14 : 14) * k, ny];
      if (u >= 1) P[f] = [x, y];
    });
    return P;
  }
  // a pose keyframe track, eased between keys
  function track(t, keys) {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) {
      if (t < keys[i][0]) return lerp(keys[i - 1][1], keys[i][1], E.io(seg(t, keys[i - 1][0], keys[i][0])));
    }
    return keys[keys.length - 1][1];
  }
  // two broom sweeps: backswing right, stroke left toward page B, recover
  const sw = (t0) => [[t0, 0], [t0 + 0.26, 1], [t0 + 0.62, 2], [t0 + 1.12, 0]];
  const SWEEP1 = CUE.before, SWEEP2 = CUE.old + 0.42;
  const LEAN = { 0: 0, 1: 5, 2: -14 }, ARM = { 0: 24, 1: 34, 2: -24 };
  const sweepKeys = (map) => sw(SWEEP1).concat(sw(SWEEP2)).map(([tt, k]) => [tt, map[k]]);
  const LEANK = sweepKeys(LEAN), ARMK = sweepKeys(ARM);
  // climbing: grip envelope (left hand up on the rail, broom carried higher)
  const grip = (t) => E.io(seg(t, CLIMB[0] - 0.25, CLIMB[0])) * (1 - E.io(seg(t, CLIMB[1] - 0.05, CLIMB[1] + 0.3)));

  function S(t) {
    if (t >= HOLD_FROM) return merge(SEAM[5], {});
    const write = E.out(seg(t, 0, 0.3)) * (1 - E.io(seg(t, 7.0, 7.6)));
    const P = feet(t), g = grip(t);
    const wob = g * Math.sin(2 * Math.PI * (t - CLIMB[0]) / (2 * STEP));
    const s = merge(SEAM[4], {
      write, pen: write > 0 ? t * 1.6 : 0,
      conflict: [E.out(seg(t, CUE.conflicting, CUE.conflicting + 0.42)), E.out(seg(t, CUE.before, CUE.spread + 0.1))],
      swept: E.io(seg(t, CUE.spread - 0.03, CUE.spread + 0.5)),
      old: E.io(seg(t, SWEEP2 + 0.15, SWEEP2 + 0.97)),
      jan: {
        x: (P.L[0] + P.R[0]) / 2, y: (P.L[1] + P.R[1]) / 2,
        lean: track(t, LEANK) + 3 * wob,
        armR: track(t, ARMK),
        // notices the conflict, looks back once it is swept
        tilt: -9 * E.io(seg(t, CUE.conflicting, CUE.conflicting + 0.5)) * (1 - E.io(seg(t, 5.2, 5.8))),
      },
    });
    s.hero = t < CUE.janitor ? "rules" : t < CUE.conflicting ? "janitor" : t < CUE.human ? "broom" : null;
    const gu = seg(t, CUE.human, CUE.useful + 0.06);
    s.glow = gu > 0 && gu < 1 ? ["board", gu] : null;
    s._local = { P, g, wob };          // for the local helpers only (stripped before draw)
    return s;
  }
  // ---- local helpers on the janitor part (the kit does not move legs or the left arm) ----
  const jan = K.parts.jan, broomG = jan.broom.handle.parentNode;
  // draw the janitor above the old pages it walks in front of (still below the agents and their pages)
  K.svg.insertBefore(jan.el, K.parts.agentA.el);
  function legs(P, J) {
    const set = (el, [x, y]) => { el.setAttribute("x2", (x - J.x) / JS); el.setAttribute("y2", (y - J.y) / JS); };
    set(jan.legL, P.L); set(jan.legR, P.R);
  }
  function gripPose(g, wob) {
    CAST.pose(jan, { armL: 22 + g * (12 + 12 * wob) });     // left hand on the rail, hand over hand with the steps
    // the broom slides up along its own handle (it stays in the right hand), carried off the rungs
    const h = jan.broom.handle, x1 = +h.getAttribute("x1"), y1 = +h.getAttribute("y1"), x2 = +h.getAttribute("x2"), y2 = +h.getAttribute("y2");
    const n = Math.hypot(x1 - x2, y1 - y2) || 1, d = 90 * g;
    broomG.setAttribute("transform", `translate(${(x1 - x2) / n * d} ${(y1 - y2) / n * d})`);
  }
  function frame(t) {
    const s = S(t);
    const L = s._local || { P: { L: [s.jan.x - 24, s.jan.y], R: [s.jan.x + 24, s.jan.y] }, g: 0, wob: 0 };
    delete s._local;
    K.draw(s);
    legs(L.P, s.jan);
    gripPose(L.g, L.wob);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, frame);
})();
    </script>
  </body>
</html>
