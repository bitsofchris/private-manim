<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_context: "Context is what goes into the model on this turn. It's your
         instructions, the files that opened the last error."
         Hero loop -> context on "Context"; a dot slides down the feed line into the head
         on "goes into the model"; three icons (instructions page, teal file page with a
         hash, ink error card) drop onto the stack and slide down into the head.
         Ends [1,0,0,0], all labels, no icons. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/rig.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0;
              --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.28" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.28;
  const CUE = {
    ctx: 0.23,     /* "Context" */
    goes: 0.81,    /* "goes" */
    model: 1.31,   /* "model" */
    instr: 2.43,   /* "instructions," */
    files: 3.17,   /* "files" */
    last: 3.79,    /* "last" */
    error: 4.00,   /* "error." */
  };
  const HOLD_FROM = 4.18;         // last frame still from here
  const { seg, lerp } = ISO, E = ISO.E();
  const { PAL, node, line, ink } = CAST;
  const root = document.getElementById("root");
  const svg = CAST.layer(root);
  const rig = RIG.make(svg, root);
  ISO.guides(root);

  // Path into the model: from the stack to the centre of the head.
  const [sx, sy] = RIG.partAt(rig, 0);            // (500, 340) at home
  const [hx, hy] = RIG.headAt(rig);               // (500, 545)
  const headTop = RIG.at(rig, RIG.AT.headTop)[1];

  // ---- local helpers: the context icons (not in the kit) ----
  // A page with lines: your instructions (ink).
  function instrIcon() {
    const g = node("g", {}, svg);
    node("rect", { x: -50, y: -65, width: 100, height: 130, rx: 10, fill: PAL.panel, stroke: PAL.ink, "stroke-width": 7 }, g);
    [-35, -12, 11, 34].forEach((yy, i) => line(g, -28, yy, i % 2 ? 14 : 28, yy, ink(6, PAL.ink)));
    return g;
  }
  // A teal page with a short monospace hash: a file it opened.
  function fileIcon() {
    const g = node("g", {}, svg);
    node("rect", { x: -66, y: -70, width: 132, height: 140, rx: 10, fill: PAL.panel, stroke: PAL.data, "stroke-width": 7 }, g);
    const t = node("text", { x: 0, y: -8, "text-anchor": "middle", "font-size": 60, "font-weight": 800, fill: PAL.data }, g);
    t.textContent = "a3f"; t.style.fontFamily = "monospace";
    [22, 44].forEach((yy, i) => line(g, -44, yy, i ? 18 : 44, yy, { stroke: PAL.data, "stroke-width": 6, "stroke-linecap": "round", "stroke-opacity": 0.5 }));
    return g;
  }
  // An ink card with "!": the last error.
  function errIcon() {
    const g = node("g", {}, svg);
    node("rect", { x: -70, y: -52, width: 140, height: 104, rx: 12, fill: PAL.panel, stroke: PAL.ink, "stroke-width": 7 }, g);
    const t = node("text", { x: 0, y: 30, "text-anchor": "middle", "font-size": 84, "font-weight": 800, fill: PAL.ink }, g);
    t.textContent = "!";
    return g;
  }
  // [element, appear at, slide from, slide length]. Each drops onto the stack on its
  // word, then slides down the line into the head, shrinking and fading as it enters.
  const ICONS = [
    [instrIcon(), CUE.instr - 0.08, CUE.instr + 0.15, 0.52],
    [fileIcon(),  CUE.files - 0.08, CUE.files + 0.13, 0.50],
    [errIcon(),   CUE.last - 0.07,  CUE.last + 0.04,  0.34],   // quick: gone before the hold
  ];
  const DROP = 0.18, LAND_Y = sy - 30;

  // "goes into the model": a small dot down the feed line into the head.
  const dot = node("circle", { r: 12, cx: sx, cy: sy, fill: PAL.ink }, svg);

  function render(tIn) {
    const t = Math.min(tIn, HOLD_FROM);
    // Hero: loop -> context on "Context"; the context label swells once.
    const h = E.io(seg(t, CUE.ctx, CUE.ctx + 0.15));
    RIG.part(rig, 3, 1 - h);
    RIG.part(rig, 0, h, seg(t, CUE.ctx, CUE.ctx + 0.3));
    [1, 2].forEach((i) => RIG.part(rig, i, 0));

    // The dot: shows on the stack at "goes", slides into the head by "model".
    const d = E.io(seg(t, CUE.goes, CUE.model + 0.1));
    const dy = lerp(sy + 40, hy, d);
    const dIn = seg(dy, headTop - 10, hy - 10);       // fades as it enters the head
    dot.setAttribute("cy", dy.toFixed(1));
    dot.setAttribute("opacity", (E.out(seg(t, CUE.goes - 0.1, CUE.goes + 0.05)) * (1 - dIn)).toFixed(3));

    ICONS.forEach(([g, a, s0, len]) => {
      const pop = E.back(seg(t, a, a + DROP));
      const slide = E.inn(seg(t, s0, s0 + len));
      const y = lerp(LAND_Y - 50, LAND_Y, E.out(seg(t, a, a + DROP))) + (hy - LAND_Y) * slide;
      const inHead = seg(y, headTop - 80, headTop + 30);   // gone before it reaches the eyes
      const sc = (0.6 + 0.4 * pop) * (1 - 0.6 * inHead);
      const op = seg(t, a, a + DROP * 0.6) * (1 - inHead);
      g.setAttribute("transform", `translate(${sx} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`);
      g.setAttribute("opacity", op.toFixed(3));
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
