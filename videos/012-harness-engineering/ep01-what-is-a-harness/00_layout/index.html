<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_layout: ep 1's canonical frame. Not in the Short.
         0–3 s the agent wearing the harness at its ledger place, context named (beats 1–5, 7) ·
         3–6 s two agents, same model, one missing tools and memory (beat 6). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/rig.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6;
  const { seg } = ISO, E = ISO.E();
  const root = document.getElementById("root");
  const svg = CAST.layer(root);
  const H = RIG.HOME;
  const rig = RIG.make(svg, root);
  const twin = RIG.make(svg, root, { x: 760, y: 1010, s: 0.65, missing: [1, 2], labels: false });
  const ok = RIG.check(svg, 290, 450), loop = RIG.circling(svg, 760, 450);
  ISO.guides(root);
  function render(t) {
    const split = E.io(seg(t, 3, 3.6));
    RIG.place(rig, ISO.lerp(H.x, 290, split), ISO.lerp(H.y, 1010, split), ISO.lerp(H.s, 0.65, split), 1 - split);
    twin.g.setAttribute("opacity", split); ok.el.setAttribute("opacity", split); loop.el.setAttribute("opacity", split);
    RIG.parts(rig, [1 - split, 0, 0, 0]);
    RIG.parts(twin, [0, split, split, 0]);
    RIG.spin(loop, -360 * E.io(seg(t, 3.6, 5.5)));
    CAST.blink(rig.agent, seg(t, 1.0, 1.1) > 0 && seg(t, 1.0, 1.1) < 1 ? 1 : 0);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
