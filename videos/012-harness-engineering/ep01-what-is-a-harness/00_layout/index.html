<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_layout: ep 1's canonical frame. Not in the Short.
         0–3 s the rig at its ledger place, context named (beats 1–5, 7) ·
         3–6 s two rigs, same model, two pipes missing (beat 6). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="cast/cast.js"></script>
    <script src="kit/rig.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6;
  const { seg } = ISO, E = ISO.E();
  const root = document.getElementById("root");
  const svg = CAST.layer(root);
  const H = RIG.HOME;
  const rig = RIG.make(svg, root);
  const twin = RIG.make(svg, root, { x: 770, y: 600, s: 0.6, missing: [2, 3], labels: false });
  const human = RIG.human(svg);
  const ok = RIG.check(svg, 340, 860), loop = RIG.circling(svg, 770, 860);
  ISO.guides(root);
  function render(t) {
    const split = E.io(seg(t, 3, 3.6));
    RIG.place(rig, ISO.lerp(H.x, 340, split), ISO.lerp(H.y, 600, split), ISO.lerp(H.s, 0.6, split), 1 - split);
    twin.g.setAttribute("opacity", split); ok.el.setAttribute("opacity", split); loop.el.setAttribute("opacity", split);
    RIG.pipes(rig, [1 - split, 0, 0, 0]);
    RIG.pipes(twin, [0, 0, split, split]);
    RIG.flow(rig, Math.min(t, 2.5)); RIG.flow(twin, Math.min(t, 5.5));
    RIG.spin(loop, -360 * E.io(seg(t, 3.6, 5.5)));
    CAST.pose(human, { armR: 22 + 70 * E.io(seg(t, 0.2, 0.9)), tilt: 8 });
    CAST.face(human, t < 3 ? "smile" : "flat");
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
