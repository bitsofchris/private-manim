<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep06 beat 7, 07_bias (master 37.35, 2.40 s). Opens SHAPES, ends CANON.
         The code beat, part 2: " + b" types into the card's line 1 and b fades in above Y on
         "the bias"; on "broadcasts across every row" five copies of b slide down Y's columns,
         one per row, and each row retypes to its biased value as its copy lands. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep06.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.40" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.40;
  // Cues, beat-local seconds (master 37.35 + t), from words.json checked on a 50 ms RMS envelope
  // of vo_final.wav. Speech: 0.25-0.80 "Then the bias" ("bias" 0.55-0.80), 0.90-1.40 "broadcasts",
  // 1.45-1.70 "across", 1.75-2.10 "every row"; silence from 2.15.
  const CUE = {
    plus: 0.45,     // "the bias" (0.50-0.80): " + b" types into line 1, magenta (0.3 s)
    bIn: 0.50,      // "bias": b [ 0.1, −0.2 ] fades in above Y, magenta (0.35 s)
    bcast: 0.95,    // "broadcasts" (0.90): five copies of b slide down Y's columns as a train (0.8 s), rows retype 0.03 s apart from 1.75
    rest: 1.85,     // "every row" (1.75-2.10): + b to --text, b to rest (by 2.10)
    still: 2.15,    // CANON, still, from here to the end
  };
  const SLIDE = 0.8, STAG = 0.03, POP = 0.18, WAIT = 0.75;   // WAIT: how far a row still waiting for b dims
  const { COL, css, seg, mix, lerp } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  const C = P.card, PLUS = C.line1[1], PLUS_TXT = PLUS.textContent;
  // ---- local helpers ----
  // the copies of b's two numbers (b's own text, so they lift cleanly off b), one pair per row of Y;
  // they pass over Y's label and digits on purpose, and the rows still waiting are dimmed under them
  const copies = EP.Y.map(() => EP.B.map((v, c) => {
    const cl = VEC.cell(root, VEC.vtxt(v, c, 2), { left: EP.YM.left + c * EP.YM.cw, top: EP.W_TOP, width: EP.YM.cw,
                                              height: EP.RH, size: EP.SIZE, col: COL.hero, alpha: 0 });
    cl.el.setAttribute("data-layout-allow-overlap", ""); cl.el.setAttribute("data-layout-allow-occlusion", "");
    return cl;
  }));
  ISO.guides(root);

  function render(t) {
    PLUS.textContent = PLUS_TXT;
    copies.flat().forEach((cl) => cl.home({ alpha: 0 }));
    if (t >= CUE.still) { EP.state(P, g, "CANON"); return; }
    if (t < CUE.plus) { EP.state(P, g, "SHAPES"); return; }
    EP.state(P, g, "CANON");
    const rest = E.io(seg(t, CUE.rest, CUE.rest + 0.25));
    const hero = mix(COL.hero, COL.text, rest);

    // "Then the bias": " + b" types in, magenta; the card re-centres
    PLUS.textContent = PLUS_TXT.slice(0, Math.floor(seg(t, CUE.plus, CUE.plus + 0.3) * PLUS_TXT.length + 1e-6));
    PLUS.style.color = css(hero);
    C.at();
    // ... and b fades in above Y
    const a = E.out(seg(t, CUE.bIn, CUE.bIn + 0.35));
    P.b[0].forEach((cl) => { cl.home({ alpha: a }); cl.color(hero); });
    P.bB.at(0, 0, { alpha: a });
    P.names.b.el.style.opacity = a.toFixed(3);

    // "broadcasts across every row": the copies leave b as one train, a row apart, deepest row first,
    // so they never overlap each other and all reach their rows together; each row then retypes
    const D = (EP.rowY(EP.X_TOP, 4) - EP.W_TOP) * E.io(seg(t, CUE.bcast, CUE.bcast + SLIDE));
    const fadeC = 1 - seg(t, CUE.bcast + SLIDE - 0.08, CUE.bcast + SLIDE + 0.08);
    P.y.forEach((row, r) => {
      const lag = (4 - r) * EP.RH, target = EP.rowY(EP.X_TOP, r);
      const top = Math.min(target, EP.W_TOP + Math.max(0, D - lag));
      copies[r].forEach((cl) => cl.at(cl.left0, top, { alpha: D > lag ? fadeC : 0 }));
      const land = CUE.bcast + SLIDE + STAG * r;
      row.forEach((cl, c) => {
        if (t < land) { cl.set(VEC.fmtv(EP.XW[r][c])); cl.home({ alpha: 1 - WAIT * E.io(seg(t, CUE.bcast - 0.1, CUE.bcast + 0.15)) }); return; }
        const p = E.out(seg(t, land, land + POP));
        cl.home({ scale: lerp(1.15, 1, p) }); cl.color(mix(COL.hero, COL.text, p));
      });
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
