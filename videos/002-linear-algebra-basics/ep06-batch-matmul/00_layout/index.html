<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frames of ep06 (one matmul, whole batch).
         t < 1: CANON (the end of beats 7 and 9): W above the gap, b above Y, X (5, 3) and
         Y (5, 2) side by side (row i of X on the same line as row i of Y), and the code card
         at the band top: Y = X @ W + b  # (5,3) @ (3,2) → (5,2).
         1 <= t < 2: the sweep (beat 5): row 1 of X boxed, its weights at W's rows, Y row 1 filled;
         the card is one line, Y = X @ W.
         t >= 2: BIG (end of beat 8): the comment reads # (batch,seq,3) @ (3,2).
         Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep06.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.0;
  const { COL, css, seg, mix } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  // beat 5's weights at W's rows ("1 ×", "2 ×", "−1 ×"), right-aligned to W's left bracket
  const wts = EP.X[0].map((v, i) => ISO.label(root, VEC.fmtv(v) + " ×", { size: EP.SIZE, color: css(VEC.SLOT[i]), width: 220, align: "right" }));
  ISO.guides(root);
  function render(t) {
    wts.forEach((el) => EP.put(el, 0, 0, 0));
    if (t < 1) {
      EP.state(P, g, "CANON");
      // the one moving thing: row 1 going through W
      const k = E.out(seg(t, 0.05, 0.5));
      P.hl.rect(EP.RECT.xRow(0), k); P.arrows[0].style.color = css(mix(COL.dim, COL.hero, k));
    } else if (t < 2) {
      EP.state(P, g, "INPUTS");
      P.hl.rect(EP.RECT.xRow(0), 1);
      wts.forEach((el, i) => EP.put(el, EP.WM.left - 40 - 220, EP.rowY(EP.W_TOP, i) + 2, E.out(seg(t, 1.05 + 0.1 * i, 1.4 + 0.1 * i))));
      P.arrows[0].style.color = css(COL.hero);
      P.y[0].forEach((c) => c.home({ alpha: 1 }));
    } else {
      EP.state(P, g, "BIG");
      P.hl.rect(EP.RECT.xRow(0), E.out(seg(t, 2.05, 2.5)));
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
