<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep06 beat 1, 01_hook (master 0.00 → 6.35).
         Frame 0: INPUTS with row 1 of X already going through W (box up, numbers flashing).
         Rows 1–5 go through W one at a time, faster each time, Y filling row by row (never
         pre-filled); all five done by "batch". "layer": W's brackets pulse. "X is data": X's
         brackets teal + tag data. "W is the map": W's brackets magenta + tag map.
         Ends PRODUCT, still. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep06.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.35" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.35;
  // beat-local = master (start 0.00). words.json, checked on a 50 ms RMS envelope of
  // vo_final.wav 0–6.5 (words.json's times after "because" are evenly spaced; the envelope wins).
  const CUE = {
    batch: 2.42,    /* "batch" (2.15–2.50): all five rows done by here */
    layer: 2.80,    /* "layer" (2.75–3.00) */
    x: 3.65,        /* "X is data" (3.65–4.10; words.json 3.69) */
    w: 4.50,        /* "W is the map" (4.35–5.95; words.json 4.94) */
    map: 5.70,      /* "map" (5.70–5.95) */
  };
  const T = { rest: 5.85, still: 6.17 };   // tags and brackets back to rest 5.85–6.17; still after
  // the sweep: row r goes through W from ROWS[r][0] for ROWS[r][1] s, faster each time.
  // Row 1 started 0.3 s before frame 0, so frame 0 is mid-flash.
  const ROWS = [[-0.30, 0.80], [0.50, 0.60], [1.10, 0.45], [1.55, 0.35], [1.90, 0.30]];   // ends 2.20
  const { COL, css, seg, mix } = ISO;
  const { SLOT } = VEC;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);
  const pulse = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));   // 0 → 1 → 0
  // the flashing cells swell over their neighbours on purpose
  [...P.x.flat(), ...P.w.flat(), ...P.y.flat()].forEach((c) => c.el.setAttribute("data-layout-allow-overlap", ""));

  // one row going through W, u = 0..1 over its duration:
  //   u 0.00–0.60 its three numbers flash in turn with W's matching rows
  //   u 0.50      its → turns magenta (back to dim over 0.25 s after the row ends)
  //   u 0.62/0.80 Y's first / second number pops in (scale 1.3, magenta → white, 0.15 s)
  function sweep(t, r) {
    const [t0, d] = ROWS[r], at = (u) => t0 + u * d;
    for (let i = 0; i < 3; i++) {
      const k = pulse(t, at(0.04 + 0.17 * i), Math.max(0.22 * d, 0.12));
      if (k <= 0) continue;
      const xc = P.x[r][i];
      xc.color(mix(SLOT[i], COL.text, 0.6 * k)); xc.home({ scale: 1 + 0.25 * k });
      P.w[i].forEach((wc) => { wc.color(mix(SLOT[i], COL.text, 0.5 * k)); wc.home({ scale: 1 + 0.15 * k }); });
    }
    const ka = E.out(seg(t, at(0.5), at(0.5) + 0.08)) * (1 - E.io(seg(t, t0 + d, t0 + d + 0.25)));
    P.arrows[r].style.color = css(mix(COL.dim, COL.hero, ka));
    [0.62, 0.80].forEach((u, j) => {
      const c = P.y[r][j], k = seg(t, at(u), at(u) + 0.15);
      if (t < at(u)) { c.home({ alpha: 0 }); return; }
      const e = E.out(k);
      c.home({ alpha: Math.min(1, k * 3), scale: 1.3 - 0.3 * e }); c.color(mix(COL.hero, COL.text, e));
    });
  }
  // where the box sits at time t: on the current row, sliding to the next as it starts
  function boxRect(t) {
    let r = 0;
    while (r < 4 && t >= ROWS[r + 1][0]) r++;
    const a = EP.RECT.xRow(r);
    if (r === 0) return a;
    const p = EP.RECT.xRow(r - 1), k = E.io(seg(t, ROWS[r][0] - 0.1, ROWS[r][0] + 0.02));
    return p.map((v, i) => v + (a[i] - v) * k);
  }

  function render(t) {
    if (t >= T.still) { EP.state(P, g, "PRODUCT"); return; }   // the last frames: PRODUCT exactly
    EP.state(P, g, "INPUTS");                                     // Y empty; it fills row by row below
    for (let r = 0; r < 5; r++) sweep(t, r);
    const end = ROWS[4][0] + ROWS[4][1];
    P.hl.rect(boxRect(t), 1 - E.io(seg(t, end, end + 0.25)));

    // "layer": W's brackets pulse once (dim → magenta → dim)
    const kl = pulse(t, CUE.layer - 0.1, 0.5);
    // "X is data": X's brackets teal, tag data; "W is the map": W's brackets magenta, tag map
    const back = E.io(seg(t, T.rest, T.still));
    const kx = E.out(seg(t, CUE.x, CUE.x + 0.3)) * (1 - back);
    const kw = E.out(seg(t, CUE.w, CUE.w + 0.3)) * (1 - back);
    P.xB.color(mix(COL.dim, COL.data, kx));
    P.wB.color(mix(COL.dim, COL.hero, Math.max(kl, kw)));
    const [dl, dt] = EP.tagAt(P, "x"), [ml, mt] = EP.tagAt(P, "w");
    EP.put(P.tags.data, dl - 20 * (1 - kx), dt, kx);
    EP.put(P.tags.map, ml - 20 * (1 - kw), mt, kw);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
