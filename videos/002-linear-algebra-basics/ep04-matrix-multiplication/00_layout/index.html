<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frame: x @ W finished. Top: x turned sideways beside W, each row
         weighted, the sum row [4, −1] (the hero). Bottom: the weighted rows laid tip to
         tail on the plane and the output arrow to (4, −1). Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.0;
  const { COL, seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  VEC.headers(root); VEC.arrows(root);
  VEC.xColumn(root); VEC.wGrid(root); VEC.pGrid(root);
  const sum = VEC.sumRow(root);
  VEC.xBr(root); VEC.wBr(root); VEC.pBr(root);
  const sumB = VEC.sumBr(root, COL.dim);
  ISO.guides(root);
  function render(t) {
    const u = E.out(seg(t, 0.1, 1.2));
    VEC.floor(g);
    VEC.axes(g);
    const C = VEC.CHAIN;
    VEC.arrow(g, [0, 0], VEC.SUM, { col: COL.hero, u, width: 40 });   // under the chain: the teal head stays readable
    for (let i = 0; i < 3; i++) VEC.arrow(g, C[i], C[i + 1], { col: VEC.ROWCOL[i], u });
    VEC.puck(g, 0, 0);
    sumB.color(ISO.mix(COL.dim, COL.hero, u));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
