<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 beat 2, sends: opens on beat 1's last frame (FAR, landed, spots, x at (2, 4)),
         pushes in to NEAR while e1, e2 go home, then W sends e1 and e2 to their landing spots.
         Ends on the canonical frame (00_layout) without the card. Started from 00_layout. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.04" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.04;
  // Cues, beat-local seconds (master 6.33 + t), from a 50 ms RMS envelope of vo_final.wav
  // and MacWhisper sub-clips (speech 0.20-1.19, pause 1.19-1.60, 1.60-3.87).
  const CUE = {
    home: 0.00,   // the push to NEAR and e1, e2 going home start on frame 0 ("Here's", 0.20)
    near: 1.40,   //  NEAR reached, e1 and e2 at home
    e1: 0.47,     // "e1" (master 6.80): label "e1" fades in
    e2: 0.85,     // "e2" (master 7.18): label "e2" fades in
    send1: 2.02,  // "matrix sends" (master 8.31-8.58): e1 starts its swing (0.82 s) ...
    here1: 2.84,  // "here" (master 9.19, local 2.86): ... e1 lands, its spot rings
    send2: 2.88,  //  e2 starts as soon as e1 has landed (0.68 s: the VO gives no more) ...
    here2: 3.56,  // "and e2 here" ("here" master ~9.85, local 3.52): ... e2 lands, its spot rings
    still: 3.70,  // nothing moves after this (last 0.34 s)
  };
  const { COL, css, seg, lerp } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const l1 = VEC.label(root, "e1", { color: css(VEC.SLOT[0]), width: 120 });
  const l2 = VEC.label(root, "e2", { color: css(VEC.SLOT[1]), width: 120 });
  ISO.guides(root);
  const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
  function render(t) {
    if (t >= CUE.still) t = CUE.still;
    // the push: FAR -> NEAR, and beat 1's landed picture goes home
    const u = E.io(seg(t, CUE.home, CUE.near));
    VEC.setView(1 - u);
    const back = u;                                           // 1 = beat 1's swing undone
    const out = E.out(seg(t, 0, 0.5));                        // x, its ghost, the spots leave
    // where e1 and e2 are: home after the push, then each swings on its own "here"
    const s1 = E.io(seg(t, CUE.send1, CUE.here1)), s2 = E.io(seg(t, CUE.send2, CUE.here2));
    const B0 = t < CUE.send1 ? lerp2(VEC.W[0], VEC.E1, back) : lerp2(VEC.E1, VEC.W[0], s1);
    const B1 = t < CUE.send2 ? lerp2(VEC.W[1], VEC.E2, back) : lerp2(VEC.E2, VEC.W[1], s2);
    const sb = 1 - back;                                      // beat 1's s, for x and the lattice
    VEC.floor(g, { alpha: lerp(0.14, 0.42, E.io(seg(t, 0.05, 1.2))) });
    VEC.lattice(g, VEC.basis(sb), { alpha: 0.35 * (1 - E.out(seg(t, 0, 0.6))) });
    VEC.axes(g);
    VEC.arrow(g, [0, 0], VEC.E1, { col: COL.muted }); VEC.arrow(g, [0, 0], VEC.E2, { col: COL.muted });
    VEC.arrow(g, [0, 0], VEC.X, { col: COL.muted, alpha: 0.8 * (1 - out) });
    VEC.arrow(g, [0, 0], VEC.map(VEC.X, sb), { col: COL.text, alpha: 1 - out });
    VEC.arrow(g, [0, 0], B0, { col: VEC.SLOT[0] }); VEC.arrow(g, [0, 0], B1, { col: VEC.SLOT[1] });
    // spots: beat 1's fade out; each new one rings on its landing (a pop, k 1 -> 0)
    const ring = (a) => ({ alpha: seg(t, a - 0.06, a + 0.06), k: 1 - E.out(seg(t, a - 0.06, a + 0.14)) });
    const sp1 = t < 1 ? { alpha: 1 - out, k: 0 } : ring(CUE.here1);
    const sp2 = t < 1 ? { alpha: 1 - out, k: 0 } : ring(CUE.here2);
    VEC.spot(g, B0[0], B0[1], sp1); VEC.spot(g, B1[0], B1[1], sp2);
    VEC.puck(g, 0, 0, { half: 14 });
    // labels ride with the tips, a fixed px offset in either view (00_layout's k)
    const k = lerp(2, 1, u);
    VEC.place(l1, B0[0] + 0.32 * k, B0[1] - 0.16 * k, { alpha: seg(t, CUE.e1, CUE.e1 + 0.3) });
    VEC.place(l2, B1[0] - 0.3 * k, B1[1] + 0.12 * k, { alpha: seg(t, CUE.e2, CUE.e2 + 0.3) });
  }
  // HyperFrames' static lint looks for this registration in the beat file itself.
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
