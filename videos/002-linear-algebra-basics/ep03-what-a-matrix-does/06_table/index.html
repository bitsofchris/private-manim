<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 6 "table": opens on beat 5's end (FAR, the rebuilt recipe, spots on). "That's why the
         table of numbers": the recipe fades, the camera pushes in to NEAR, the W card drops in where
         the x card was: the canonical frame. "Each row is one landing spot": row 1 + spot 1, then
         row 2 + spot 2. "row i of W": row 1 magenta, dashed guides from e1's landed tip. "is where the
         input direction i lands": the e1 ghost brightens, its tag lights, a thin teal arc traces from
         (1, 0) to the landed tip. Ends on the canonical frame (00_layout). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.59" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
      <div id="code" style="position:absolute;left:0;top:0;font-family: monospace;font-size:60px;font-weight:700;line-height:72px;white-space:pre;padding:14px 20px;background:#14142B;border:6px solid #8A8FB0;border-radius:22px;color:#ECEBE4;opacity:0;visibility:hidden;"><div>y = x @ W</div><div><span id="w0">W[0]</span><span style="color:#8A8FB0">   # where e1 lands</span></div></div>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.59;
  // Cues, beat-local seconds (master 27.61 + t), from a 50 ms RMS envelope of vo_final.wav and
  // MacWhisper sub-clips. Speech: 0.20-1.75 "That's why the table of numbers isn't random",
  // 1.90-3.40 "Each row is one landing spot", 3.73-5.85 "In PyTorch, row i of W",
  // 6.15-8.40 "is where the input direction i lands" (6.15-6.50 "is where", 6.75-7.00 "the input",
  // 7.05-7.60 "direction", 7.70-7.95 "i", 7.95-8.40 "lands").
  const CUE = {
    why: 0.20,      // "That's why": the recipe starts to fade, the push follows
    table: 0.45,    // "the table": the W card drops in where the x card was
    row1: 1.90,     // "Each row": row 1 magenta + spot 1 pulses
    row2: 2.65,     // "is one landing spot": row 2 magenta + spot 2 pulses
    rowI: 4.75,     // "row" (row i of W): row 1 magenta again
    ofW: 4.95,      // "i of W": dashed guides from e1's landed tip to 1 and 0.5 on the axes
    torch: 3.73,    // "In PyTorch": the code card fades in (0.4 s, 20 px rise) and stays to the end
    input: 6.75,    // "the input direction": the e1 ghost brightens, the card's "e1" tag lights
    arc: 7.05,      // "direction i lands": the teal arc traces (1, 0) -> the landed tip ...
    lands: 7.95,    // "lands": ... and arrives; then everything returns to the canonical frame
    still: 8.19,    // nothing moves after this (last 0.40 s still)
  };
  const { COL, css, mix, lerp, seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const xcard = VEC.vecCard(root, VEC.X, { name: "x =", cols: VEC.SLOT });
  const card = VEC.matCard(root, VEC.W);
  const l1 = VEC.label(root, "e1", { color: css(VEC.SLOT[0]), width: 120 });
  const l2 = VEC.label(root, "e2", { color: css(VEC.SLOT[1]), width: 120 });
  const show = (el, a) => { el.style.opacity = a.toFixed(3); el.style.visibility = a < 0.001 ? "hidden" : "visible"; };
  const code = document.getElementById("code"), w0 = document.getElementById("w0");
  // monospace set from script, as ep01 05/06 do (a stylesheet or static style rule rendered in Inter)
  [code, ...code.querySelectorAll("div, span")].forEach((el) => { el.style.fontFamily = "monospace"; el.style.fontWeight = "700"; });
  const CODE_TOP = 1115;                                               // top of the caption band (captions anchored bottom)
  ISO.guides(root);

  // ---- local helpers ----
  const pulse = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));     // 0 -> 1 -> 0 from a, lasting d
  const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
  const B1 = VEC.basis(1), W0 = VEC.W[0], W1 = VEC.W[1];
  const C = VEC.comb([3, 0], VEC.W), P = VEC.XW;                         // the corner (3, 1.5) and x @ W = (2, 4)
  // 04_rebuild's hop tick, landed (k = 1), with an alpha
  function tick(p, dir, col, alpha) {
    const n = Math.hypot(dir[0], dir[1]), h = 22 / VEC.w(1, 0)[0] / n;
    const q = [-dir[1] * h, dir[0] * h];
    VEC.line(g, [p[0] - q[0], p[1] - q[1]], [p[0] + q[0], p[1] + q[1]], { col: mix(col, COL.text, 0.45), alpha, width: 7 });
  }
  // 04_rebuild's e1 / e2 label offsets (px from the tip); s = 1 (landed), k = 1 FAR .. 0 NEAR
  function labelOffsets(s, k) {
    const near = [[0.32 * 300, 0.16 * 300], [-0.3 * 300, -0.12 * 300]];
    const farLanded = [[102, 15], [-40, -75]];
    const home = [[70, -62], [-93, -37]];
    return [0, 1].map((i) => lerp2(home[i], lerp2(near[i], farLanded[i], k), s));
  }
  // beat 5's recipe, split around the landed arrows as 04_rebuild / 05_amounts draw it; a: 0..1 fade
  function oldRecipe(g, a) {
    if (a <= 0.001) return;
    VEC.arrow(g, [0, 0], [3, 0], { col: COL.muted, alpha: 0.6 * a });
    VEC.arrow(g, [3, 0], [3, 2], { col: COL.muted, alpha: 0.6 * a });
    VEC.arrow(g, [0, 0], VEC.X, { col: COL.muted, alpha: 0.8 * a, width: 52 });
  }
  function newRecipe(g, a) {
    if (a <= 0.001) return;
    VEC.arrow(g, [0, 0], C, { col: VEC.SLOT[0], alpha: 0.9 * a });
    VEC.arrow(g, C, P, { col: VEC.SLOT[1], alpha: 0.9 * a });
    [1, 2].forEach((i) => tick([W0[0] * i, W0[1] * i], W0, VEC.SLOT[0], a));
    tick([C[0] + W1[0], C[1] + W1[1]], W1, VEC.SLOT[1], a);
    VEC.arrow(g, [0, 0], P, { col: COL.text, width: 52, alpha: a });
  }
  // the arc: a thin teal curve from where e1 was (1, 0) to where it lands (1, 0.5), bowing
  // outward so it does not sit on the vertical guide; u = draw progress, a = alpha
  const ARC = { p0: [1, 0], c: [1.28, 0.18], p1: [B1[0][0], B1[0][1]] };
  const bez = (s) => {
    const a = (1 - s) * (1 - s), b = 2 * (1 - s) * s, d = s * s;
    return [a * ARC.p0[0] + b * ARC.c[0] + d * ARC.p1[0], a * ARC.p0[1] + b * ARC.c[1] + d * ARC.p1[1]];
  };
  function arc(g, u, a) {
    if (u <= 0.001 || a <= 0.001) return;
    const n = 32, end = lerp(0, 0.86, u);                               // stop at the spot's ring
    g.save(); g.strokeStyle = css(VEC.SLOT[0], 1, a); g.lineWidth = 7; g.lineCap = "round"; g.beginPath();
    for (let i = 0; i <= n; i++) { const p = VEC.at(...bez(end * i / n)); i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]); }
    g.stroke();
    const p = VEC.at(...bez(end)), q = VEC.at(...bez(Math.max(0, end - 0.05)));   // a small head at the tip
    const dx = p[0] - q[0], dy = p[1] - q[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hl = 26, hw = 14;
    ISO.poly(g, [[p[0] + ux * 4, p[1] + uy * 4], [p[0] - ux * hl + uy * hw, p[1] - uy * hl - ux * hw], [p[0] - ux * hl - uy * hw, p[1] - uy * hl + ux * hw]],
      css(VEC.SLOT[0], 1, a));
    g.restore();
  }

  function render(t) {
    if (t >= CUE.still) t = CUE.still;
    // the push: the recipe fades, the plane comes back to full, the camera FAR -> NEAR
    const fade = E.io(seg(t, 0, 0.8));                                  // moving from frame 0
    const push = E.io(seg(t, 0.35, 1.65));
    VEC.setView(1 - push);
    VEC.floor(g, { alpha: lerp(0.14, 0.42, E.io(seg(t, 0.2, 1.5))) });
    VEC.lattice(g, B1, { alpha: 0.35 * (1 - fade) });
    VEC.axes(g);
    // the e1 ghost brightens on "input direction" and goes back on "lands"
    const back = E.io(seg(t, CUE.lands + 0.03, CUE.still - 0.01));
    const gl = E.out(seg(t, CUE.input, CUE.input + 0.35)) * (1 - back);
    VEC.arrow(g, [0, 0], VEC.E1, { col: mix(COL.muted, VEC.SLOT[0], 0.75 * gl) });
    VEC.arrow(g, [0, 0], VEC.E2, { col: COL.muted });
    oldRecipe(g, 1 - fade);
    VEC.arrow(g, [0, 0], B1[0], { col: VEC.SLOT[0] }); VEC.arrow(g, [0, 0], B1[1], { col: VEC.SLOT[1] });
    newRecipe(g, 1 - fade);
    // guides from e1's landed tip on "i of W"
    const gu = E.io(seg(t, CUE.ofW, CUE.ofW + 0.6));
    if (gu > 0.001) VEC.guides(g, B1[0], { u: gu, alpha: 0.9 * (1 - back) });
    arc(g, E.io(seg(t, CUE.arc, CUE.lands)), 1 - back);
    VEC.puck(g, 0, 0, { half: 14 });

    // which row is being read: r1 / r2 0..1 (the hero group is the row and its own spot)
    const r1a = E.out(seg(t, CUE.row1 - 0.05, CUE.row1 + 0.15)) * (1 - E.io(seg(t, CUE.row2 - 0.05, CUE.row2 + 0.15)));
    const r2 = E.out(seg(t, CUE.row2 - 0.05, CUE.row2 + 0.15)) * (1 - E.io(seg(t, CUE.row2 + 0.6, CUE.row2 + 0.8)));
    const r1b = E.out(seg(t, CUE.rowI - 0.05, CUE.rowI + 0.15)) * (1 - back);
    const r1 = Math.max(r1a, r1b);
    // the spot not being read recedes (toward muted) so one group stays magenta
    VEC.spot(g, B1[0][0], B1[0][1], { col: mix(COL.hero, COL.muted, 0.7 * r2), k: pulse(t, CUE.row1, 0.6) });
    VEC.spot(g, B1[1][0], B1[1][1], { col: mix(COL.hero, COL.muted, 0.7 * r1), k: pulse(t, CUE.row2, 0.6) });

    // labels ride the tips (04_rebuild's FAR offsets -> 00_layout's NEAR ones)
    const of = labelOffsets(1, 1 - push);
    VEC.place(l1, B1[0][0], B1[0][1], { dx: of[0][0], dy: of[0][1] });
    VEC.place(l2, B1[1][0], B1[1][1], { dx: of[1][0], dy: of[1][1] });

    // the cards: x leaves, W drops in at the same corner
    const xa = 1 - E.io(seg(t, 0.1, 0.5));
    xcard.at(VEC.cardLeft(xcard.el), VEC.CARD_TOP, { alpha: xa }); show(xcard.el, xa);
    const drop = E.out(seg(t, CUE.table, CUE.table + 0.7));
    card.at(VEC.cardLeft(card.el), VEC.CARD_TOP - 60 * (1 - drop), { alpha: drop }); show(card.el, drop);
    card.light(0, r1); card.light(1, r2);
    // the PyTorch code card: in on "In PyTorch", W[0] magenta with row 1, stays on to the end
    const ci = E.out(seg(t, CUE.torch, CUE.torch + 0.4));
    code.style.transform = `translate(${((ISO.SAFE.x0 + ISO.SAFE.x1) / 2 - code.offsetWidth / 2).toFixed(1)}px, ${(CODE_TOP + 20 * (1 - ci)).toFixed(1)}px)`;
    show(code, ci);
    w0.style.color = css(mix(COL.text, COL.hero, r1b));
    card.tagEls[0].style.color = css(mix(VEC.SLOT[0], COL.hero, gl), 1, lerp(0.75, 1, gl));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
