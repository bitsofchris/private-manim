<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 3, 03_recipe: "Now take a vector, three of e1 plus two of e2. The vector is a recipe."
         Opens on the canonical frame (00_layout end, W card on). The spots and the W card fade,
         e1 and e2 ease home, the camera pulls out to FAR; three teal hops, two blue hops, the
         magenta x draws to (3, 2); the x card drops in. Hero: the vector x. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0;
              --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.86" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.86;
  // Beat-local seconds (master = 10.37 + t), from a 50 ms RMS envelope of vo_final.wav
  // 10.37-15.23 and MacWhisper sub-clip transcriptions.
  const CUE = {
    now:    0.20,  /* "Now take a vector"  : spots and the W card fade (0-0.40), e1 e2 ease home, camera pulls out to FAR */
    three:  1.45,  /* "three"              : first teal hop starts */
    e1:     1.85,  /* "of e1"              : hops 2-3 (land 2.05, 2.33) */
    plus:   2.30,  /* "plus"               */
    two:    2.55,  /* "two"                : blue hops start (land 2.84, 3.12) */
    e2:     2.80,  /* "of e2"              */
    vector: 3.50,  /* "The vector"         : magenta x has drawn from 3.20, lands 3.85 */
    recipe: 4.10,  /* "recipe"             : the x card drops in (3.95-4.40) */
    still:  4.44,  /*  nothing moves after this (last 0.42 s still) */
  };
  const T = {
    spotsOut: [0.0, 0.40], home: [0.08, 1.30], cam: [0.10, 1.35],
    hopsE1: [[1.45, 1.77], [1.77, 2.05], [2.05, 2.33]],
    hopsE2: [[2.52, 2.84], [2.84, 3.12]],
    xDraw: [3.20, 3.85], card: [3.95, 4.40],
  };
  const { COL, css, seg, lerp } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const card = VEC.matCard(root, VEC.W);                      // the W card, as 00_layout leaves it; fades out with the spots
  const xcard = VEC.vecCard(root, VEC.X, { name: "x =", cols: VEC.SLOT });
  const l1 = VEC.label(root, "e1", { color: css(VEC.SLOT[0]), width: 120 });
  const l2 = VEC.label(root, "e2", { color: css(VEC.SLOT[1]), width: 120 });
  ISO.guides(root);

  // ---- local helpers (same in 04_rebuild) ----
  const lerp2 = (p, q, u) => [lerp(p[0], q[0], u), lerp(p[1], q[1], u)];
  // progress along a chain of hops: each [a, b] window adds one eased step
  const hops = (t, wins) => wins.reduce((n, [a, b]) => n + E.io(seg(t, a, b)), 0);
  // a hop tick: a short cross-bar over the leg where a hop lands (dir = the hop's grid
  // direction), in the leg colour lifted toward off-white; it grows in as the hop lands.
  // Only at intermediate landings: the leg's arrowhead marks the last one.
  function tick(p, dir, land, t, col, alpha = 1) {
    const k = E.back(seg(t, land - 0.02, land + 0.16));
    if (k <= 0.001) return;
    const n = Math.hypot(dir[0], dir[1]), h = 22 * k / VEC.w(1, 0)[0] / n;   // half-length 22 px, in grid units
    const q = [-dir[1] * h, dir[0] * h];
    VEC.line(g, [p[0] - q[0], p[1] - q[1]], [p[0] + q[0], p[1] + q[1]], { col: ISO.mix(col, COL.text, 0.45), alpha: Math.min(1, k) * alpha, width: 7 });
  }
  // e1 / e2 label offsets in screen px from the tip. Landed in NEAR = 00_layout's exact
  // placement (0.32, -0.16 steps; -0.3, +0.12 steps). Landed in FAR: tucked so they stay
  // out of the caption band and the left dead zone. At home (FAR): e1 above-right of its
  // tip (below would sit in the band), e2 up-left as in 00_layout.
  function labelOffsets(s, k) {
    const near = [[0.32 * 300, 0.16 * 300], [-0.3 * 300, -0.12 * 300]];
    const farLanded = [[102, 15], [-40, -75]];
    const home = [[70, -62], [-93, -37]];
    return [0, 1].map((i) => lerp2(home[i], lerp2(near[i], farLanded[i], k), s));
  }

  function render(t) {
    if (t >= CUE.still) t = CUE.still;
    const k = E.io(seg(t, ...T.cam));                          // camera NEAR -> FAR
    const s = 1 - E.io(seg(t, ...T.home));                     // e1, e2 ease home (W -> identity)
    const B = VEC.basis(s);
    VEC.setView(k);
    VEC.floor(g); VEC.axes(g);
    // muted ghosts stay at (1, 0) and (0, 1)
    VEC.arrow(g, [0, 0], VEC.E1, { col: COL.muted }); VEC.arrow(g, [0, 0], VEC.E2, { col: COL.muted });
    VEC.arrow(g, [0, 0], B[0], { col: VEC.SLOT[0] }); VEC.arrow(g, [0, 0], B[1], { col: VEC.SLOT[1] });
    const sp = 1 - E.out(seg(t, ...T.spotsOut));
    VEC.spot(g, B[0][0], B[0][1], { alpha: sp }); VEC.spot(g, B[1][0], B[1][1], { alpha: sp });

    // the recipe: three teal hops of e1, then two blue hops of e2 (tip to tail)
    const n1 = hops(t, T.hopsE1), n2 = hops(t, T.hopsE2);
    VEC.arrow(g, [0, 0], [3, 0], { col: VEC.SLOT[0], alpha: 0.9, u: n1 / 3 });
    VEC.arrow(g, [3, 0], [3, 2], { col: VEC.SLOT[1], alpha: 0.9, u: n2 / 2 });
    [1, 2].forEach((i) => tick([i, 0], VEC.E1, T.hopsE1[i - 1][1], t, VEC.SLOT[0]));
    tick([3, 1], VEC.E2, T.hopsE2[0][1], t, VEC.SLOT[1]);
    // the vector x, the hero
    VEC.arrow(g, [0, 0], VEC.X, { col: COL.hero, width: 52, u: E.io(seg(t, ...T.xDraw)) });
    VEC.puck(g, 0, 0, { half: 14 });

    const off = labelOffsets(s, k);
    VEC.place(l1, B[0][0], B[0][1], { dx: off[0][0], dy: off[0][1] });
    VEC.place(l2, B[1][0], B[1][1], { dx: off[1][0], dy: off[1][1] });

    card.at(VEC.cardLeft(card.el), VEC.CARD_TOP - 20 * (1 - sp), { alpha: sp });
    const c = E.out(seg(t, ...T.card));
    xcard.at(VEC.cardLeft(xcard.el), VEC.CARD_TOP - 50 * (1 - c), { alpha: c });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
