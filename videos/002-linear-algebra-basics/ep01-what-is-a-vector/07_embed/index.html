<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 7, 07_embed: "Every embedding in AI is one of these, a list of numbers we treat as directions
         in space with thousands of dimensions." Opens on 06_views' last frame. The card regrows into a
         wrapped list of VEC.EMBED values ending in "…"; a fan of teal arrows grows on the floor; the hero
         "4,096 numbers" lands under the card. The final frame of the Short. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.908" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.908;
  // Cues, beat-local seconds (master 41.80 + t), from a 50 ms RMS envelope of vo_final.wav.
  // Speech: 0.18-2.28 "Every embedding in AI is one of these", 2.38-3.38 "a list of numbers",
  // 3.43-5.08 "we treat as directions in space", 5.18-6.38 "with thousands of dimensions".
  const CUE = {
    every: 0.00,     // "Every embedding" (0.18): the card hands back its hero colour and starts to regrow
    fill: 0.60,      // "embedding in AI is one of these" (0.6-2.3): the slots fill one by one
    dots: 2.80,      // "numbers" (2.80, in "a list of numbers"): the "…" closes the list
    dirs: 4.00,      // "directions in space" (4.03): the fan of arrows grows from the origin
    dims: 5.20,      // "thousands" (5.18): "4,096 numbers" lands, the hero
    still: 6.35,     // nothing moves after this (last 0.55 s still)
  };
  const OY = 600;    // the floor y for 06/07 (06_views pans up to it)
  const { P, COL, css, mix, lerp, seg, clamp01, hash } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  // ---- local helpers (identical in 06_views and 07_embed, so 06's last frame is 07's first) ----
  // VEC.floor / VEC.arrow / VEC.puck draw at the kit's fixed VEC.FLOOR (960). These two beats need
  // the figure higher (the card sits under it), so these are the same drawings with the floor y `oy`
  // as an argument.
  const atY = (e, n, oy, z = 0) => { const [x, y] = VEC.w(e, n); return P(x, y, z, oy); };
  function floorAt(g, oy, alpha) {
    g.clearRect(0, 0, ISO.W, ISO.H); g.fillStyle = css(COL.bg); g.fillRect(0, 0, ISO.W, ISO.H);
    g.strokeStyle = `rgba(74, 80, 112, ${alpha})`; g.lineWidth = 3; g.beginPath();
    for (let k = -30; k <= 30; k++) {
      let p = P(k * VEC.STEP, -6000, 0, oy), q = P(k * VEC.STEP, 6000, 0, oy); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
      p = P(-6000, k * VEC.STEP, 0, oy); q = P(6000, k * VEC.STEP, 0, oy); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
    }
    g.stroke();
  }
  function arrowAt(g, a, b, oy, o = {}) {
    const u = o.u == null ? 1 : clamp01(o.u), a1 = o.alpha == null ? 1 : o.alpha;
    if (u <= 0.001 || a1 <= 0.001) return;
    const [x0, y0] = VEC.w(a[0], a[1]), [xb, yb] = VEC.w(b[0], b[1]);
    const x1 = lerp(x0, xb, u), y1 = lerp(y0, yb, u);
    const len = Math.hypot(x1 - x0, y1 - y0); if (len < 1) return;
    const dx = (x1 - x0) / len, dy = (y1 - y0) / len, nx = -dy, ny = dx;
    const hw = (o.width || 44) / 2, hl = Math.min(o.head || 90, len * 0.6), hh = hw * 2.6;
    const sx = x1 - dx * hl, sy = y1 - dy * hl;
    const q = (x, y) => P(x, y, 2, oy), col = o.col || COL.data;
    if (o.glow > 0.001) {
      [2.4, 1.7].forEach((k) => {
        const gw = hw * k;
        ISO.poly(g, [q(x0 + nx * gw, y0 + ny * gw), q(x1 + nx * gw, y1 + ny * gw), q(x1 - nx * gw, y1 - ny * gw), q(x0 - nx * gw, y0 - ny * gw)], css(col, 1, 0.09 * o.glow * a1));
      });
    }
    ISO.poly(g, [q(x0 + nx * hw, y0 + ny * hw), q(sx + nx * hw, sy + ny * hw), q(sx - nx * hw, sy - ny * hw), q(x0 - nx * hw, y0 - ny * hw)], css(col, 1, a1));
    ISO.poly(g, [q(sx + nx * hh, sy + ny * hh), q(x1, y1), q(sx - nx * hh, sy - ny * hh)], css(col, 1, a1));
  }
  function puckAt(g, e, n, oy, alpha = 1) {
    const [x, y] = VEC.w(e, n), h = 16;
    ISO.box(g, x - h, y - h, x + h, y + h, 0, 14, oy, COL.text, { alpha });
  }
  const show = (el, a) => { el.style.opacity = a.toFixed(3); el.style.visibility = a < 0.001 ? "hidden" : "visible"; };

  // listCard: the vector card built token by token (absolutely placed spans on a panel), so 07 can
  // regrow "[ −2, 2 ]" into a wrapped list. Base type is 96 px (the canonical card); 07 scales the
  // tokens to 64 px. A slot = value span + its trailing comma (display:none until it is needed).
  const LC = { top: 716, border: 6,
               A: { padX: 38, padY: 19, line: 110 },                       // "[ −2, 2 ]" at 96 px
               B: { scale: 64 / 96, padX: 30, padY: 14, pitch: 76, gap: 30, cols: 3 } };   // 07's grid
  const MID_X = (ISO.SAFE.x0 + ISO.SAFE.x1) / 2;
  function listCard(root, vals) {
    const mk = (tag, css0) => { const d = document.createElement(tag); d.style.cssText = css0; return d; };
    const wrap = mk("div", "position:absolute;left:0;top:0;");
    const panel = mk("div", `position:absolute;left:0;top:0;box-sizing:border-box;background:${css(COL.panel)};` +
      `border:${LC.border}px solid ${css(COL.dim)};border-radius:24px;`);
    wrap.appendChild(panel);
    const tok = (s, col) => {
      const d = mk("div", `position:absolute;left:0;top:0;white-space:pre;font-size:96px;line-height:${LC.A.line}px;` +
        `transform-origin:0 0;font-variant-numeric:tabular-nums;color:${col};`);
      d.textContent = s; wrap.appendChild(d); return d;
    };
    const open = tok("[", css(COL.dim)), close = tok("]", css(COL.dim));
    const sp = tok(" ", "transparent"); sp.style.visibility = "hidden";
    const slots = vals.map((v, i) => {
      const d = tok("", css(COL.text));
      const val = document.createElement("span"); val.textContent = v; d.appendChild(val);
      const com = document.createElement("span"); com.textContent = ","; com.style.color = css(COL.dim);
      if (i < vals.length - 1) d.appendChild(com);
      return { el: d, val, com };
    });
    root.appendChild(wrap);
    return { wrap, panel, open, close, sp, slots };
  }
  // layout A: one row, 96 px, centred, top LC.top. Returns screen positions + the panel rect.
  function layoutA(c) {
    const ow = (el) => el.offsetWidth, sp = ow(c.sp);
    const s0 = c.slots[0], s1 = c.slots[1];
    let x = 0; const pos = { open: 0 };
    x = ow(c.open) + sp; pos.s0 = x;
    x += ow(s0.val) + ow(s0.com) + sp; pos.s1 = x;
    x += ow(s1.val) + sp; pos.close = x;
    x += ow(c.close);
    const W = x + 2 * (LC.A.padX + LC.border), H = LC.A.line + 2 * (LC.A.padY + LC.border);
    const left = MID_X - W / 2, ox = left + LC.border + LC.A.padX, oy = LC.top + LC.border + LC.A.padY;
    return { rect: [left, LC.top, W, H], open: [ox, oy], slots: [[ox + pos.s0, oy], [ox + pos.s1, oy]], close: [ox + pos.close, oy] };
  }
  const placeTok = (el, p, s = 1) => { el.style.transform = `translate(${p[0].toFixed(1)}px, ${p[1].toFixed(1)}px) scale(${s.toFixed(4)})`; };
  const placePanel = (c, r) => {
    c.panel.style.transform = `translate(${r[0].toFixed(1)}px, ${r[1].toFixed(1)}px)`;
    c.panel.style.width = r[2].toFixed(1) + "px"; c.panel.style.height = r[3].toFixed(1) + "px";
  };
  // the whole card swells about its centre by k (1 = rest)
  const swell = (c, r, k) => {
    const cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
    c.wrap.style.transform = `translate(${(cx * (1 - k)).toFixed(1)}px, ${(cy * (1 - k)).toFixed(1)}px) scale(${k.toFixed(4)})`;
  };
  // colours: values toward `num`, border toward `edge` (RGB triples)
  const tint = (c, num, edge) => {
    c.slots.forEach((s) => { s.val.style.color = css(num); });
    c.panel.style.borderColor = css(edge);
  };

  // ---- the card: [ −2, 2 ] regrows into the list −2, 2, then six VEC.EMBED values, then "…" ----
  const VALS = VEC.V.map(VEC.fmtv).concat(VEC.EMBED.slice(0, 6), ["…"]);   // 9 cells: 3 rows of 3
  const card = listCard(root, VALS);
  const FILL = VALS.map((_, k) => (k < 2 ? -1 : k < 8 ? CUE.fill + (k - 2) * 0.35 : CUE.dots));   // arrival of cell k
  const MOVE = 0.25;                                   // "]" steps aside over this, then the cell fades in
  // the hero: "4,096 numbers" under the card
  const dims = ISO.label(root, VEC.DIMS + " numbers", { size: 84, width: ISO.SAFE.x1 - ISO.SAFE.x0, left: ISO.SAFE.x0, align: "center", color: css(COL.hero) });
  dims.style.transformOrigin = "50% 50%";
  ISO.guides(root);

  // layout B: the 3-column grid at 64 px, values right-aligned. Cell k at row k/3, column k%3; "[" before row 0; the "]"
  // follows the last arrived cell. Positions are offsets from the content origin, in screen px.
  function layoutB(c) {
    const ow = (el) => el.offsetWidth, s = LC.B.scale, sp = ow(c.sp) * s;
    const vw = c.slots.map((sl) => ow(sl.val) * s), cw = ow(c.slots[0].com) * s;
    const x0 = ow(c.open) * s + sp, nc = LC.B.cols;
    // each column as wide as its widest value; values right-aligned in their column, like a matrix
    const colW = [...Array(nc)].map((_, j) => Math.max(...vw.filter((_, k) => k % nc === j)));
    const colX = colW.map((_, j) => x0 + colW.slice(0, j).reduce((a, w) => a + w + cw + LC.B.gap, 0));
    const cell = (k) => [colX[k % nc] + colW[k % nc] - vw[k], Math.floor(k / nc) * LC.B.pitch];
    const after = (k) => { const p = cell(k); return [p[0] + vw[k] + sp, p[1]]; };   // where "]" sits after cell k
    const last = VALS.length - 1, rows = Math.ceil(VALS.length / LC.B.cols);
    let right = after(last)[0] + ow(c.close) * s;
    VALS.forEach((_, k) => { if (k < last) right = Math.max(right, cell(k)[0] + vw[k] + cw); });
    const W = right + 2 * (LC.B.padX + LC.border);
    const H = (rows - 1) * LC.B.pitch + LC.A.line * s + 2 * (LC.B.padY + LC.border);
    const left = MID_X - W / 2;
    return { s, vw, cw, cell, after, closeW: ow(c.close) * s, W, H, left,
             ox: left + LC.border + LC.B.padX, oy: LC.top + LC.border + LC.B.padY };
  }

  // the fan: thin teal arrows from the origin in many directions (ISO.hash, not Math.random).
  // Kept on the stage: screen dx = 207.8 (e + n) within ±415 px of the origin, dy = 72 (e − n) at most
  // 72 px below it (the card starts at y 716), and clear of the NW arrow's own direction.
  const FAN = [];
  for (let i = 0, N = 15; i < N; i++) {
    const ang = (i + 0.7 * (hash(i + 3) - 0.5)) * 2 * Math.PI / N;
    if (Math.abs(((ang - 0.75 * Math.PI + 3 * Math.PI) % (2 * Math.PI)) - Math.PI) < 0.22) continue;   // near NW
    let L = 1.3 + 1.4 * hash(i + 41), e = L * Math.cos(ang), n = L * Math.sin(ang);
    const k = Math.min(1, 2.0 / Math.max(1e-6, Math.abs(e + n)), (e - n) > 0 ? 1.0 / (e - n) : 1);
    e *= k; n *= k;
    FAN.push({ b: [e, n], t0: CUE.dirs + hash(i + 77) * 0.55 });
  }

  function render(t) {
    if (t >= CUE.still) t = CUE.still;
    floorAt(g, OY, 0.30);
    // "directions in space": the fan grows under the NW arrow, which stays teal among them
    FAN.forEach((f) => arrowAt(g, [0, 0], f.b, OY, { col: COL.data, width: 18, head: 50, alpha: 0.5, u: E.out(seg(t, f.t0, f.t0 + 0.6)) }));
    arrowAt(g, [0, 0], [-2, 2], OY, { col: COL.data, width: 52 });
    puckAt(g, 0, 0, OY);

    // the card: 06's hero colours hand back (numbers to ink, border to teal)
    const calm = E.out(seg(t, CUE.every, CUE.every + 0.5));
    tint(card, mix(COL.hero, COL.text, calm), mix(COL.hero, COL.data, calm));
    // morph A (one row, 96 px) -> B (grid, 64 px), from frame 0
    const A = layoutA(card), B = layoutB(card), m = E.io(seg(t, CUE.every, CUE.every + 0.7));
    const sc = lerp(1, B.s, m);
    const arrive = FILL.map((t0) => (t0 < 0 ? 1 : E.io(seg(t, t0, t0 + MOVE))));      // "]" has stepped past cell k
    const shown = FILL.map((t0) => (t0 < 0 ? 1 : seg(t, t0 + 0.2, t0 + 0.42)));       // cell k visible (after "]" has moved)
    // "]" glides along behind the newest cell
    let ci = 1; while (ci + 1 < VALS.length && arrive[ci + 1] >= 1) ci++;
    const nxt = Math.min(ci + 1, VALS.length - 1), fr = ci + 1 < VALS.length ? arrive[ci + 1] : 0;
    const pa = B.after(ci), pb = B.after(nxt);
    const closeB = [B.ox + lerp(pa[0], pb[0], fr), B.oy + lerp(pa[1], pb[1], fr)];
    const at2 = (pA, pB) => [lerp(pA[0], pB[0], m), lerp(pA[1], pB[1], m)];
    placeTok(card.open, at2(A.open, [B.ox, B.oy]), sc);
    placeTok(card.close, at2(A.close, closeB), sc);
    card.slots.forEach((sl, k) => {
      const cb = B.cell(k), pB = [B.ox + cb[0], B.oy + cb[1]];
      const pA = k < 2 ? A.slots[k] : pB;
      const a = shown[k], dy = 18 * (1 - E.out(a));
      placeTok(sl.el, [lerp(pA[0], pB[0], k < 2 ? m : 1), lerp(pA[1], pB[1], k < 2 ? m : 1) + dy], k < 2 ? sc : B.s);
      show(sl.el, a);
      // a cell's trailing comma appears once the next cell is on its way
      if (k < VALS.length - 1) {
        const ca = k === 0 ? 1 : seg(t, FILL[k + 1] + 0.12, FILL[k + 1] + 0.3);
        sl.com.style.display = ca > 0.001 ? "inline" : "none";
        sl.com.style.opacity = ca.toFixed(3);
      }
    });
    // the panel hugs what has arrived: right edge = the "]" or the widest filled row; bottom = the "]" row
    let right = closeB[0] - B.ox + B.closeW;
    card.slots.forEach((sl, k) => { if (shown[k] > 0 && k < VALS.length - 1) right = Math.max(right, B.cell(k)[0] + B.vw[k] + (arrive[k + 1] > 0 ? B.cw : 0)); });
    const rB = [B.left, LC.top, right + 2 * (LC.B.padX + LC.border), closeB[1] - B.oy + LC.A.line * B.s + 2 * (LC.B.padY + LC.border)];
    placePanel(card, [lerp(A.rect[0], rB[0], m), LC.top, lerp(A.rect[2], rB[2], m), lerp(A.rect[3], rB[3], m)]);
    card.wrap.style.transform = "none";

    // "thousands of dimensions": the hero count lands under the card
    const p = seg(t, CUE.dims, CUE.dims + 0.45);
    const top = LC.top + B.H + 14;
    dims.style.transform = `translateY(${(top + 24 * (1 - E.out(p))).toFixed(1)}px) scale(${(0.8 + 0.2 * E.back(p)).toFixed(4)})`;
    show(dims, seg(p, 0, 0.5));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
