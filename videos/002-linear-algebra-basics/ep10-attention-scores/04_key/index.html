<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep10 beat 4, 04_key (6.77 s): opens QUERIES, ends QK. W_K (magenta) moves each token into a key: K = X @ W_K. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep10.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.77" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.77;
  // Cues, beat-local seconds (master 13.65 + t), from words.json checked on a 20 ms RMS
  // envelope of vo_final.wav (speech 0.20-1.08 "Another matrix", 1.18-1.80 "W_K",
  // 2.20-3.82 "moves each one into a key", 4.22-6.52 "What question can this token help answer?").
  const CUE = {
    matrix: 0.53,   // "matrix" (master 14.18): W_K starts to fade in at the right slot, magenta; the old card goes
    wk: 1.20,       // "W_K" (master 14.85 on the envelope; words.json 14.94): W_K is in; the card types K = X @ W_K
    moves: 2.20,    // "moves" (master 15.85): outline keys ride from the X ghosts to K; the ghosts fade
    key: 3.55,      // "key" (master 17.20): the ride lands; W_K cross-fades into K
    my: 4.46,       // "question" (master 18.11): key "my" pulses
    name: 5.44,     // "can" (master 19.09 on the envelope): key "name" pulses
    is: 5.97,       // "help" (master 19.62): key "is" pulses
    still: 6.50,    // nothing moves after this (last 0.27 s, on QK)
  };
  const PULSE = 0.5;
  const { COL, css, mix, seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);

  // ---- local helpers ----
  const pulse = (t, t0, d) => Math.sin(Math.PI * seg(t, t0, t0 + d));
  // typeCard: a code card typed on at the card line, n of its characters shown (Infinity = all).
  // The card is measured with every character in, then held at that width, so the panel does not
  // grow and the finished card sits exactly where EP.placeCard puts it. (Same block as 03_query.)
  function typeCard(card, a, n = Infinity) {
    const spans = card.spans.flat(), full = spans.map((s) => s.dataset.full || (s.dataset.full = s.textContent));
    spans.forEach((s, i) => { s.textContent = full[i]; });
    card.el.style.width = "";
    const left = VEC.centreLeft(card.el), wd = card.el.offsetWidth;
    if (n < full.join("").length) {
      card.el.style.width = `${wd}px`;
      let left_n = n;
      spans.forEach((s, i) => { s.textContent = full[i].slice(0, Math.max(0, left_n)); left_n -= full[i].length; });
    }
    card.at(left, EP.CARD_TOP, { alpha: a });
  }
  const NCH = EP.CODE.k[0].map((s) => s[0]).join("").length;
  const KP = [CUE.my, CUE.name, CUE.is];
  [P.cards.q.el, P.cards.k.el, P.names.WK, P.names.K].forEach((el) => {   // cross-fades in place
    el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", "");
  });
  P.m.WK.flat().concat(P.m.K.flat()).forEach((c) => { c.el.setAttribute("data-layout-allow-overlap", ""); c.el.setAttribute("data-layout-allow-occlusion", ""); });

  function render(t) {
    if (t >= CUE.still) { typeCard(P.cards.k, 0); EP.state(P, g, "QK"); return; }
    const u = E.io(seg(t, CUE.moves, CUE.key));               // the ride, X ghosts -> K
    const xf = seg(t, CUE.key - 0.15, CUE.key + 0.45);        // W_K -> K cross-fade
    const base = xf >= 1 ? "QK" : "QUERIES";
    EP.state(P, null, base);

    // the card: Q = X @ W_Q goes as W_K comes, then K = X @ W_K types on with "W_K"
    if (base === "QUERIES") EP.placeCard(P.cards.q, 1 - E.io(seg(t, CUE.wk - 0.25, CUE.wk)));
    typeCard(P.cards.k, E.out(seg(t, CUE.wk, CUE.wk + 0.15)), Math.round(NCH * seg(t, CUE.wk + 0.05, CUE.wk + 0.5)));

    // W_K, the hero: in on "matrix" .. "W_K"; on "key" its digits go white as it cross-fades into K
    if (base === "QUERIES") {
      const wa = E.out(seg(t, CUE.matrix, CUE.wk)) * (1 - E.io(seg(xf, 0, 0.7)));
      const wh = E.io(seg(xf, 0, 0.5));
      EP.placeM(P, "WK", wa, { col: mix(COL.hero, COL.text, wh), bcol: mix(COL.hero, COL.dim, wh) });
      EP.placeM(P, "K", E.io(seg(xf, 0.3, 1)));
    }

    // "What question can this token help answer?": each key's row brightens with its arrow
    const kp = KP.map((t0) => pulse(t, t0, PULSE));
    if (base === "QK") kp.forEach((p, r) => P.m.K[r].forEach((c, k) => {
      if (p > 0.001) { c.color(mix(c.col0, COL.text, 0.5 * p)); c.at(EP.RL + k * EP.CW, EP.rowTop(r), { scale: 1 + 0.12 * p }); }
    }));

    // the plane: outline keys appear over the X ghosts, ride to K; the ghosts fade under them
    const ka = E.out(seg(t, CUE.moves - 0.2, CUE.moves + 0.1));
    const gh = 0.5 * (1 - E.io(seg(t, CUE.moves + 0.3, CUE.key)));
    EP.plane(g, {
      ghost: [gh, gh, gh], q: [1, 1, 1], k: [ka, ka, ka],
      kPos: EP.X.map((p, i) => EP.lerp2(p, EP.K[i], u)),
      after: (gg) => {
        if (!kp.some((p) => p > 0.001)) return;
        kp.forEach((p, i) => { if (p > 0.001) EP.keyArrow(gg, [0, 0], EP.K[i], mix(VEC.SLOT[i], COL.text, 0.45 * p), { line: 6 + 5 * p, width: 60 * (1 + 0.25 * p), head: 90 * (1 + 0.25 * p) }); });
        VEC.puck(gg, 0, 0);
      },
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
