<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep10 beat 3, 03_query (6.22 s): opens TOKENS, ends QUERIES. W_Q (magenta) moves each token into a query: Q = X @ W_Q. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep10.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.22" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.22;
  // Cues, beat-local seconds (master 7.43 + t), from words.json checked on a 20 ms RMS
  // envelope of vo_final.wav (speech 0.20-1.04 "A learned matrix", 1.08-1.80 "W_Q",
  // 1.84-4.14 "moves each one into a query", 4.52-6.00 "which is the question this token asks").
  const CUE = {
    matrix: 0.55,   // "matrix" (master 7.98): W_Q starts to fade in at the right slot, magenta
    wq: 1.12,       // "W_Q" (master 8.55 on the envelope; words.json 8.62): W_Q is in; the card types Q = X @ W_Q
    moves: 1.84,    // "moves" (master 9.27): the arrows start to ride X -> Q, muted ghosts stay at X
    query: 3.81,    // "query" (master 11.24): the ride lands; X's digits have ticked to Q's, X is named Q
    queryEnd: 4.14, // end of "query," (master 11.57): W_Q fades out (0.6 s)
    question: 4.87, // "question" (master 12.30): the three query heads pulse once (0.7 s)
    still: 5.70,    // nothing moves after this (last 0.52 s, on QUERIES)
  };
  const { COL, css, mix, seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);

  // ---- local helpers ----
  const pulse = (t, t0, d) => Math.sin(Math.PI * seg(t, t0, t0 + d));
  // typeCard: a code card typed on at the card line, n of its characters shown (Infinity = all).
  // The card is measured with every character in, then held at that width, so the panel does not
  // grow and the finished card sits exactly where EP.placeCard puts it.
  function typeCard(card, a, n = Infinity) {
    const spans = card.spans.flat(), full = spans.map((s) => s.dataset.full || (s.dataset.full = s.textContent));
    spans.forEach((s, i) => { s.textContent = full[i]; });
    card.el.style.width = "";
    const left = VEC.centreLeft(card.el), wd = card.el.offsetWidth;
    if (n < full.join("").length) {
      card.el.style.width = `${wd}px`;
      let left_n = n;
      spans.forEach((s, i) => { s.textContent = full[i].slice(0, Math.max(0, left_n)); left_n -= full[i].length; });
    }
    card.at(left, EP.CARD_TOP, { alpha: a });
  }
  const NCH = EP.CODE.q[0].map((s) => s[0]).join("").length;
  const nameAt = (el, a) => EP.put(el, EP.LL + EP.CW - 100, EP.NAME_TOP, a, COL.dim);

  function render(t) {
    if (t >= CUE.still) { typeCard(P.cards.q, 0); EP.state(P, g, "QUERIES"); return; }
    const u = E.io(seg(t, CUE.moves, CUE.query));             // the ride, X -> Q
    EP.state(P, null, t < CUE.query ? "TOKENS" : "QUERIES");

    // the card types on with "W_Q"
    const ca = E.out(seg(t, CUE.wq, CUE.wq + 0.15));
    typeCard(P.cards.q, ca, Math.round(NCH * seg(t, CUE.wq + 0.05, CUE.wq + 0.5)));

    // W_Q, the hero: in on "matrix" .. "W_Q", out after "query"
    const wa = E.out(seg(t, CUE.matrix, CUE.wq)) * (1 - E.io(seg(t, CUE.queryEnd, CUE.queryEnd + 0.6)));
    EP.placeM(P, "WQ", wa, { col: COL.hero, bcol: COL.hero });

    // on the ride: X's digits tick to Q's (mid-ride) and the name X becomes Q
    if (t < CUE.query) {
      const tick = CUE.moves + (CUE.query - CUE.moves) / 2;
      P.m.X.forEach((row, r) => row.forEach((c, k) => {
        const changed = EP.X[r][k] !== EP.Q[r][k];
        c.set(VEC.fmtv(t < tick ? EP.X[r][k] : EP.Q[r][k]));
        if (changed) {
          const p = pulse(t, tick - 0.2, 0.45);
          c.at(EP.LL + k * EP.CW, EP.rowTop(r), { scale: 1 + 0.18 * p });
          c.color(mix(c.col0, COL.text, 0.6 * p));
        }
      }));
      const nk = E.io(seg(t, tick - 0.2, tick + 0.2));
      nameAt(P.names.X, 1 - nk); nameAt(P.names.Q, nk);
    }

    // the plane: X's arrows ride to the queries, leaving muted ghosts; heads pulse on "question"
    const gh = 0.5 * E.out(seg(t, CUE.moves, CUE.moves + 0.5));
    const hp = pulse(t, CUE.question, 0.7);
    EP.plane(g, {
      ghost: [gh, gh, gh], q: [1, 1, 1],
      qPos: EP.X.map((p, i) => EP.lerp2(p, EP.Q[i], u)),
      after: (gg) => {
        if (hp <= 0.001) return;
        EP.Q.forEach((p, i) => VEC.arrow(gg, [0, 0], p, { col: mix(VEC.SLOT[i], COL.text, 0.4 * hp), width: 44 * (1 + 0.3 * hp), head: 90 * (1 + 0.3 * hp) }));
        VEC.puck(gg, 0, 0);
      },
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
