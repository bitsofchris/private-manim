<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep07 beat 3 (03_stack): CHAIN -> ASSOC. "So if you stack two layers, x @ W1,
         then @ W2, the order matters, but it's associative." The card lights x @ W1 then
         @ W2 with each matrix's box and hop; the hops pulse in order; the card becomes
         (x @ W1) @ W2. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep07.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.29" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.29;               // master 10.55 -> 16.84 in vo_final.wav
  const { COL, seg, css, mix } = ISO;
  // beat-local = master - 10.55; words.json checked on a 30 ms RMS envelope (x and the
  // "@ W2" phrase run ~0.15-0.5 s early of words.json; "associative" ~0.07 s early)
  const CUE = {
    stack: 0.51,       /* "stack" (11.06-11.24) */
    layers: 0.87,      /* "two layers" (11.30-12.00) */
    x: 1.48,           /* "x @ W1" (12.03-12.93) */
    then: 2.78,        /* "then @ W2" (13.33-14.48) */
    w2: 3.30,          /* "W2" (13.85) */
    order: 4.40,       /* "the order matters" (14.88-15.55) */
    matters: 4.65,     /* "matters" */
    assoc: 5.28,       /* "associative" (15.83-16.60) */
    still: 6.08,       /* ASSOC from here (last 6 frames still) */
  };
  const T = {
    bright: [0.00, 0.55, 0.85, 1.35],   // card W1 / W2 and the names brighten (rising from frame 0)
    lit1: [1.40, 1.58],                 // x @ W1 + W1's box + hop 1
    pass: [2.68, 2.90],                 // light passes to @ W2 + W2's box + hop 2
    off: [4.05, 4.30],                  // lights to rest (each hop is lit with its light)
    order1: [4.32, 4.72], order2: [4.62, 5.02],      // "the order matters": 1 then 2, quick
    xfade: [5.20, 5.60],                // stack -> assoc, in place
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);
  const WHITE = [255, 255, 255];

  // ---- local helpers ----
  const pulse = (t, a, b) => Math.sin(Math.PI * seg(t, a, b));        // 0 -> 1 -> 0
  const inOut = (t, a, b, c, d) => E.out(seg(t, a, b)) * (1 - E.io(seg(t, c, d)));
  // CHAIN's plane with each hop lit by k (dim -> magenta, a little thicker), hops under x
  function planeLit(k1, k2) {
    const f = EP.stage(EP.S.W);
    EP.bg(g);
    EP.plane(g, { f, x: false });
    g.save(); g.beginPath(); g.rect(0, EP.PLANE.top, ISO.W, ISO.SAFE.stageBottom - EP.PLANE.top); g.clip();
    EP.TRAIL2.forEach(([a, b], i) => {
      const k = i ? k2 : k1;
      VEC.line(g, a, b, { col: mix(COL.dim, COL.hero, k), alpha: 0.9 + 0.1 * k, width: 5 + 4 * k, dash: [14, 12] });
      VEC.puck(g, a[0], a[1], { half: 11 + 4 * k, col: mix(COL.dim, COL.hero, k) });
    });
    VEC.arrow(g, [0, 0], f(EP.X), { col: COL.data, width: 40 });
    VEC.puck(g, 0, 0);
    g.restore();
  }
  // colour the code spans: lit1 lights x @ W1, lit2 lights @ W2, br brightens W1 and W2
  function paint(spans, idx, lit1, lit2, br) {
    const base = { x: COL.data };
    Object.entries(idx).forEach(([key, i]) => {
      const rest = base[key] || COL.text;
      let c = (key === "W1" || key === "W2") ? mix(rest, WHITE, br) : rest;
      const k = (key === "x" || key === "at1" || key === "W1") ? lit1 : (key === "at2" || key === "W2") ? lit2 : 0;
      spans[0][i].style.color = css(mix(c, COL.hero, k));
    });
  }
  const IDX = {
    stack: { x: 0, at1: 1, W1: 2, at2: 3, W2: 4 },
    assoc: { x: 1, at1: 2, W1: 3, at2: 5, W2: 6 },
  };

  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "ASSOC"); return; }
    EP.state(P, null, "CHAIN");             // DOM at rest; the canvas is drawn below
    const br = E.out(seg(t, T.bright[0], T.bright[1])) * (1 - E.io(seg(t, T.bright[2], T.bright[3])));
    const on = 1 - E.io(seg(t, ...T.off));
    const lit1 = E.out(seg(t, ...T.lit1)) * (1 - E.io(seg(t, ...T.pass)));
    const lit2 = E.io(seg(t, ...T.pass)) * on;
    // the card: stack, cross-fading in place to assoc on "associative"
    const xf = E.io(seg(t, ...T.xfade));
    EP.placeCard(P.cards.stack, 1 - xf); EP.placeCard(P.cards.assoc, xf);
    paint(P.cards.stack.spans, IDX.stack, lit1, lit2, br);
    paint(P.cards.assoc.spans, IDX.assoc, 0, 0, 0);
    // names brighten with the card's W1 / W2
    [P.names.W1, P.names.W2].forEach((el) => { el.style.color = css(mix(COL.dim, COL.text, br)); });
    // the boxes
    P.hl.rect(EP.RECT.mat("W1"), lit1); P.hl2.rect(EP.RECT.mat("W2"), lit2);
    // the hops: with the lights, then 1 then 2 on "the order matters"
    const k1 = Math.max(lit1, pulse(t, ...T.order1));
    const k2 = Math.max(lit2, pulse(t, ...T.order2));
    planeLit(k1, k2);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
