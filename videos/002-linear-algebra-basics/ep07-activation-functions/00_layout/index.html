<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frames of ep07, the three looks of the Short.
         t < 1: CHAIN (beats 2-4): x @ W1 @ W2, W1 beside W2, the grid through both, x's two hops.
         1 <= t < 2: MERGED (beats 5-6, the end): x @ W, the one matrix W (magenta), the shortcut hop.
         t >= 2: BENT (beats 9-10): the nn.Sequential card with nn.ReLU(), the grid bent by relu.
         Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep07.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.0;
  const { COL, seg, css, mix } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);
  function render(t) {
    if (t < 1) {
      EP.state(P, g, "CHAIN");
      P.hl.rect(EP.RECT.mat("W1"), E.out(seg(t, 0.05, 0.5)));          // the one moving thing
    } else if (t < 2) {
      EP.state(P, g, "MERGED");
      P.names.W.style.color = css(mix(COL.dim, COL.text, E.out(seg(t, 1.05, 1.5))));
    } else {
      EP.state(P, g, "BENT");
      P.cards.seq.spans[EP.SEQ_RELU][1].style.color = css(mix(COL.text, COL.hero, E.out(seg(t, 2.05, 2.5))));
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
