<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep07 beat 10, 10_close (master 44.91, 8.43 s). Opens BENT, ends END (the Short's last
         frame, still from T.still). Hero: nn.ReLU(), then W.
         VO: "That's why every layer in a model is a matrix multiply followed by some
         nonlinearity. Without activations, a deep network is just one matrix."
         "every layer ... matrix multiply": both nn.Linear(2, 2) lines brighten (glow; the
         nn.Sequential( / ) lines step down to --dim). "some nonlinearity": nn.ReLU() pulses.
         "Without activations": the nn.ReLU() line fades and its gap closes; the plane un-bends
         (relu 1 -> 0) onto the straight W grid; the hero line goes to grid colour and out.
         "just one matrix": the card becomes `x @ W`, W fades in centred, magenta, named. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep07.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.43" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.43;
  // beat-local cues (master − 44.91), words.json checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    every: 0.57,        /* "every (layer)" */
    matrix: 2.03,       /* "matrix (multiply)" */
    followed: 2.80,     /* "followed" (envelope: onset ~2.76) */
    nonlin: 4.05,       /* "nonlinearity" */
    without: 5.30,      /* "Without" (envelope: onset ~5.30) */
    just: 6.91,         /* "just (one matrix)" */
  };
  // Every motion ends by T.still; still on END from there (8.43 − 7.55 = 0.88 s).
  const T = {
    reluOut: [5.25, 5.85],      // the nn.ReLU() line fades and its gap closes
    unbend: [5.30, 6.30],       // relu 1 -> 0 (1.0 s)
    heroOut: [6.05, 6.65],      // the hero line to grid colour, then out
    cardSwap: [6.85, 7.35],     // nn.Sequential card -> x @ W
    wIn: [6.95, 7.50],          // W fades in, magenta digits, name
    still: 7.55,
  };
  const GRID = [74, 80, 112];   // the warped grid's colour (EP.warp default)
  const { COL, seg, mix, css } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const pulse = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));   // 0 -> 1 -> 0

  // local: handles on the nn.Sequential card's rows
  const seq = P.cards.seq, rows = seq.spans.map((ln) => ln[0].parentElement);
  const LIN = [1, 3], FRAME = [0, 4], RH = rows[0].offsetHeight || 72;
  const reluSpan = seq.spans[EP.SEQ_RELU][1];
  reluSpan.style.display = "inline-block"; reluSpan.style.transformOrigin = "0% 60%";
  rows[EP.SEQ_RELU].style.overflow = "hidden";
  rows[EP.SEQ_RELU].setAttribute("data-layout-allow-overflow", "");   // the gap closes on purpose
  seq.spans[EP.SEQ_RELU].forEach((s) => s.setAttribute("data-layout-allow-overlap", ""));   // the pulse swells over the comma
  [seq.el, P.cards.merged.el].forEach((el) => el.setAttribute("data-layout-allow-overlap", ""));   // the cards cross-fade

  function render(t) {
    EP.state(P, null, "BENT");                     // DOM at BENT; the plane is drawn below

    // "every layer ... matrix multiply": the two nn.Linear lines brighten; back on "followed"
    const kLin = Math.max(0.5 * E.out(seg(t, 0.0, CUE.every + 0.3)), E.out(seg(t, CUE.matrix - 0.1, CUE.matrix + 0.3)))
      * (1 - E.io(seg(t, CUE.followed, CUE.followed + 0.5)));
    LIN.forEach((i) => {
      rows[i].style.color = css(mix(COL.text, [255, 255, 255], kLin));
      rows[i].style.textShadow = kLin > 0.001 ? `0 0 ${(22 * kLin).toFixed(1)}px rgba(236,235,228,${(0.75 * kLin).toFixed(3)})` : "none";
    });
    FRAME.forEach((i) => { rows[i].style.color = css(mix(COL.text, COL.dim, 0.6 * kLin)); });

    // "some nonlinearity": nn.ReLU() pulses (swell, toward white, a magenta glow)
    const kR = pulse(t, CUE.nonlin - 0.1, 0.8);
    reluSpan.style.transform = `scale(${(1 + 0.14 * kR).toFixed(4)})`;
    reluSpan.style.color = css(mix(COL.hero, COL.text, 0.35 * kR));
    reluSpan.style.textShadow = kR > 0.001 ? `0 0 ${(26 * kR).toFixed(1)}px rgba(192,132,252,${(0.9 * kR).toFixed(3)})` : "none";

    // "Without activations": the nn.ReLU() line fades and the gap closes
    const kOut = E.io(seg(t, ...T.reluOut));
    rows[EP.SEQ_RELU].style.opacity = (1 - E.out(seg(t, T.reluOut[0], T.reluOut[0] + 0.35))).toFixed(3);
    rows[EP.SEQ_RELU].style.height = `${(RH * (1 - kOut)).toFixed(1)}px`;

    // "just one matrix": the card becomes x @ W; W fades in centred, magenta, named
    const kC = E.io(seg(t, ...T.cardSwap));
    EP.placeCard(seq, 1 - kC);
    EP.placeCard(P.cards.merged, kC, { scale: 0.96 + 0.04 * kC });
    const kW = E.out(seg(t, ...T.wIn));
    EP.placeM(P, "W", EP.ML.W, kW, COL.hero, kW);

    // the plane: un-bend (relu 1 -> 0) onto p @ W; the hero line to grid colour and out
    const relu = 1 - E.io(seg(t, ...T.unbend));
    const kH = E.io(seg(t, ...T.heroOut));
    EP.bg(g);
    EP.plane(g, { f: EP.stage({ w1: 1, relu, w2: 1 }), hero: 1 - kH, heroCol: mix(COL.hero, GRID, Math.min(1, 1.6 * kH)) });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
