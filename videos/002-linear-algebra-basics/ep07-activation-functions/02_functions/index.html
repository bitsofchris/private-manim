<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep07 beat 2 (02_functions): STACK -> CHAIN. "Matrices are functions, and
         multiplying matrices combines those functions." W1 (box) turns the grid, then W2
         (box) squishes it; x rides along, its two hops dashed behind it. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep07.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.64" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.64;               // master 5.91 -> 10.55 in vo_final.wav
  const { COL, seg, lerp } = ISO;
  // beat-local = master - 5.91; words.json checked on a 30 ms RMS envelope (it runs ~0.2 s late here)
  const CUE = {
    matrices: 0.15,  /* "Matrices" (onset 6.06) */
    functions: 0.72, /* "functions" (6.63-7.50) */
    multiply: 1.84,  /* "multiplying" (onset 7.75) */
    combines: 3.14,  /* "combines" (onset ~9.05) */
    end: 4.44,       /* end of "functions" (10.35) */
    still: 4.30,     /* CHAIN from here (last ~10 frames still) */
  };
  const T = {
    boxIn: [0.00, 0.30],      // W1's box (moving from frame 0)
    w1: [0.25, 1.55],         // grid turns by W1, x rides (1, 2) -> (-1, 3)
    pass: [1.65, 2.10],       // the box slides from W1 to W2 on "multiplying"
    w2: [1.95, 3.25],         // grid squishes by W2, x rides on to (-1, 1.5); lands on "combines"
    boxOut: [3.75, 4.15],
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);

  // ---- local helpers ----
  // the plane through f with x's hops drawn as far as u (each hop: [a, b, u]); hops under x,
  // the same layers and order as EP.plane's trail
  function planeHops(f, hops) {
    EP.bg(g);
    EP.plane(g, { f, x: false });
    g.save(); g.beginPath(); g.rect(0, EP.PLANE.top, ISO.W, ISO.SAFE.stageBottom - EP.PLANE.top); g.clip();
    hops.forEach(([a, b, u]) => {
      if (u <= 0.001) return;
      EP.hop(g, a, b, { u });
      VEC.puck(g, a[0], a[1], { half: 11, col: COL.dim, alpha: Math.min(1, u * 6) });
    });
    VEC.arrow(g, [0, 0], f(EP.X), { col: COL.data, width: 40 });
    VEC.puck(g, 0, 0);
    g.restore();
  }
  const lerpR = (a, b, u) => a.map((v, i) => lerp(v, b[i], u));

  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "CHAIN"); return; }
    EP.state(P, null, "STACK");             // DOM at rest; the canvas is drawn below
    const s1 = E.io(seg(t, ...T.w1)), s2 = E.io(seg(t, ...T.w2));
    planeHops(EP.stage({ w1: s1, w2: s2 }), [[EP.X, EP.XW1, s1], [EP.XW1, EP.XW, s2]]);
    // the box: on W1, slides to W2, goes before the hold
    const a = E.out(seg(t, ...T.boxIn)) * (1 - E.io(seg(t, ...T.boxOut)));
    P.hl.rect(lerpR(EP.RECT.mat("W1"), EP.RECT.mat("W2"), E.io(seg(t, ...T.pass))), a);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
