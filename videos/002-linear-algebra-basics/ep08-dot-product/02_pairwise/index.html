<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep08 beat 2, 02_pairwise (master 6.07, 6.51 s). Opens ALIGNED, ends NUMS: the plane goes, rows a and b fill digit by digit on the spoken numbers; torch.dot(a, b) drops in on "The way the math works" and its dot is the hero for "multiply pairwise and then sum". -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep08.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.51" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.51;
  // Cues, beat-local seconds (master 6.07 + t). Word times from words.json, digit onsets
  // checked on a 20 ms RMS envelope of vo_final.wav; each pop sits ~0.03 s before its onset.
  const CUE = {
    out: 0.00,                  // (beat 1's end) plane, arrows and readout fade out; names + brackets fade in
    card: 0.30,                 // "The way the math works" (math 6.54, works 6.76): torch.dot(a, b) drops in
    dot: 1.03,                  // "multiply" (7.12): `dot` in the card turns magenta ...
    dotOff: 2.05,               // ... "and then sum" (8.34): ... and back (~1 s)
    a: [3.10, 3.38, 4.00],      // "One" 9.20, "two" 9.48, "three" 10.10: a's digits pop
    dotPulse: 4.55,             // "dot" (10.64): the card's `dot` pulses once
    b: [4.80, 5.37, 5.96],      // "four" 10.90, "minus one" 11.46, "zero" 12.06: b's digits pop
    still: 6.30,                // nothing moves after this (NUMS)
  };
  const POP = 0.30;             // a digit's pop: scale 1.25 -> 1, magenta -> its row colour
  const { COL, css, mix, seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  // the readout fades out where row a fades in; popping digits (scale 1.25) brush their commas and brackets
  [P.ro[0].lead, P.ro[0].num, P.names.a, P.br.a[0], P.br.a[1], ...P.cells.a, ...P.commas.a, P.br.b[0], P.br.b[1], ...P.cells.b, ...P.commas.b]
    .forEach((el) => el.setAttribute("data-layout-allow-overlap", ""));
  ["a", "b"].forEach((k) => P.cells[k].forEach((el) => { el.style.transformOrigin = "80% 55%"; }));
  ISO.guides(root);

  // ---- local helpers ----
  const pulse = (t, t0, d) => Math.sin(Math.PI * seg(t, t0, t0 + d));
  // row k with its digits popping on their cues (commas ride with the digit before them)
  function row(k, t, rowA, cues) {
    const ks = cues.map((c) => seg(t, c, c + POP));
    EP.placeRow(P, k, { alpha: rowA, cell: ks.map((u) => (u > 0 ? 1 : 0)), commaA: 0 });
    P.cells[k].forEach((el, i) => {
      const u = ks[i];
      if (u <= 0) return;
      EP.put(el, EP.NUM.colX[i] - EP.NUM.cellW, EP.NUM.rowY[k], rowA * E.out(Math.min(1, u * 3)), 1.25 - 0.25 * E.out(u));
      el.style.color = css(u >= 1 ? VEC.SLOT[k === "a" ? 0 : 1] : mix(COL.hero, VEC.SLOT[k === "a" ? 0 : 1], E.io(u)));
    });
    P.commas[k].forEach((el, i) => { el.style.opacity = (rowA * (ks[i] > 0 ? 1 : 0)).toFixed(3); });
  }

  function render(t) {
    if (t >= CUE.still) t = CUE.still;
    EP.state(P, g, "NUMS");                       // bg, rows a, b, card line 1 (redrawn below)

    // ALIGNED fades out while the empty rows fade in
    const fo = 1 - E.out(seg(t, CUE.out, CUE.out + 0.4));     // moving from frame 0
    if (fo > 0.001) {
      EP.plane(g, { alpha: fo });
      EP.pair(g, EP.TH.ALIGNED, { alpha: fo });
      P.ro[0].set("dot product = ", EP.dotAt(EP.TH.ALIGNED), { alpha: fo });
    }
    const rin = E.io(seg(t, CUE.out + 0.2, CUE.out + 0.6));
    row("a", t, rin, CUE.a);
    row("b", t, rin, CUE.b);

    // the code card drops in on "the math works"
    const c = E.out(seg(t, CUE.card, CUE.card + 0.45));
    EP.placeCode(P, c, 0, { dy: -40 * (1 - c) });
    // `dot` is the hero from "multiply" to "sum", and pulses once on the spoken "dot"
    const h = Math.max(E.io(seg(t, CUE.dot, CUE.dot + 0.25)) * (1 - E.io(seg(t, CUE.dotOff, CUE.dotOff + 0.3))),
                       pulse(t, CUE.dotPulse, 0.28));
    P.code.spans[0][1].style.color = css(h > 0.001 ? mix(COL.text, COL.hero, h) : COL.text);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
