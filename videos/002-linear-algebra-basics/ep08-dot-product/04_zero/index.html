<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep08 beat 4 (04_zero), revision 2: from ALIGNED_N (numbers on the pair every frame), b turns to 90 on "ninety degrees" (0), the right-angle
         mark draws on "perpendicular", 0 swells on "exactly zero", the mark pulses on "overlap";
         on "Pointing opposite" the mark fades and b turns to 180, landing on "negative" (−4). Ends OPPOSITE_N.
         Started from 00_layout, whose notes follow:
         t < 1  CANON: the plane, a (1, 1) teal and b blue turning about the origin, the angle arc,
                "dot product = 2" with the number magenta (the hero). Frame 0 of the Short looks like this.
         t < 2  SUM: the pairwise numbers a = [ 1, 2, 3 ], b = [ 4, −1, 0 ], products 4 + −2 + 0, "= 2",
                and the code card torch.dot(a, b) / # 4 − 2 + 0 = 2.
         t >= 2 WORDS: king, queen, banana on the plane; "king · queen = 5", "king · banana = 0".
         Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep08.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.44" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 7.44;
  // Cues, beat-local = master - 13.16 (unchanged from the first build: the audio shifted -6.918 s).
  // Checked on a 20 ms RMS envelope of the first build's vo_final.wav, local times + 20.08:
  // "At" onset 20.27, "ninety" 20.40, "degrees" ends 20.96, "they're" 21.52, "perpendicular" 21.62,
  // "orthogonal" 22.40, "exactly" 23.10, "zero" 23.50, "No" 24.62, "overlap" 24.80, "Pointing" 26.08,
  // "opposite" 26.36, "negative" 26.94 (ends 27.36).
  const CUE = {
    turn90: 0.00,   // b leaves a on frame 0 ...
    at90: 0.88,     // ... and lands at 90 on "ninety degrees" (end of "degrees"), readout 0
    perp: 1.54,     // "perpendicular": the right-angle mark draws in (0.35 s)
    zero: 3.42,     // "exactly zero": the 0 swells (0.4 s)
    overlap: 4.72,  // "No overlap at all": the mark pulses once (0.4 s)
    opp: 6.00,      // "Pointing opposite": the mark fades (0.3 s), b turns 90 -> 180 ...
    at180: 6.86,    // ... landing on "negative", readout −4, with a swell (0.4 s)
    still: 7.26,    // nothing moves after this: state OPPOSITE_N exactly
  };
  const { seg, COL, css, lerp } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const bump = (t, t0, d = 0.4) => Math.sin(Math.PI * seg(t, t0, t0 + d));
  // Local helper: the right-angle mark drawn along its path to progress u (0..1), with a width.
  // EP.rightMark only fades; "draws in" needs a partial path.
  function markU(g, d0, u, o = {}) {
    if (u <= 0.001 || (o.alpha != null && o.alpha <= 0.001)) return;
    const s = 0.32, r0 = d0 * Math.PI / 180, r1 = (d0 + 90) * Math.PI / 180;
    const pu = [Math.cos(r0) * s, Math.sin(r0) * s], pv = [Math.cos(r1) * s, Math.sin(r1) * s];
    const pts = [pu, [pu[0] + pv[0], pu[1] + pv[1]], pv].map((p) => VEC.at(p[0], p[1]));
    const k = Math.min(u, 1) * 2;                       // two legs
    g.save(); g.strokeStyle = css(COL.text, 1, o.alpha == null ? 1 : o.alpha);
    g.lineWidth = o.width || 6; g.lineJoin = "round"; g.lineCap = "round";
    g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    const l1 = Math.min(k, 1); g.lineTo(lerp(pts[0][0], pts[1][0], l1), lerp(pts[0][1], pts[1][1], l1));
    if (k > 1) g.lineTo(lerp(pts[1][0], pts[2][0], k - 1), lerp(pts[1][1], pts[2][1], k - 1));
    g.stroke(); g.restore();
  }
  // Local helper: EP.pair with the mark drawn by markU (under the arrows, as EP.pair does).
  function pairM(g, th, mark) {
    EP.arc(g, EP.A_DEG, EP.A_DEG + th, { alpha: 0.8, col: COL.muted });
    markU(g, EP.A_DEG, mark.u, mark);
    VEC.arrow(g, [0, 0], EP.bAt(th), { col: VEC.SLOT[1], width: 40 });
    VEC.arrow(g, [0, 0], EP.A2, { col: VEC.SLOT[0], width: 40 });
    VEC.puck(g, 0, 0);
  }
  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "OPPOSITE_N"); return; }  // the last frames are OPPOSITE_N, untouched
    const th = 90 * E.io(seg(t, CUE.turn90, CUE.at90)) + 90 * E.io(seg(t, CUE.opp, CUE.at180));
    const mark = {
      u: E.out(seg(t, CUE.perp, CUE.perp + 0.35)),
      alpha: 1 - E.io(seg(t, CUE.opp, CUE.opp + 0.3)),
      width: 6 + 5 * bump(t, CUE.overlap),
    };
    const sc = 1 + 0.15 * (bump(t, CUE.zero) + bump(t, CUE.at180));
    EP.state(P, g, "ALIGNED_N");
    EP.plane(g); pairM(g, th, mark); EP.nums(P, th);
    P.ro[0].set("dot product = ", EP.dotAt(th), { scale: sc });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
