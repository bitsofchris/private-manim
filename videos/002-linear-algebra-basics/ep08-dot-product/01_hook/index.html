<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep08 beat 1 (01_hook), 6.07 s. Hero: the readout number.
         Frame 0: CANON layout with b already turning toward a (th 140, readout -3.1), ticking up through 0,
         landing at th 0 / "4" on "same way" with a swell; on "measure similarity" b leans out to 25 and back.
         Still from 5.6 s on state ALIGNED (beat 2 opens on it). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep08.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.07" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.07;
  // Cues, beat-local = master (start 0.00). Checked on a 20 ms RMS envelope of vo_final.wav:
  // "same" onset 2.96 (the s), "way" 3.12-3.45, pause 3.56-3.86, "measure" 4.34, "similarity" 4.50-5.08,
  // "models." ends 5.88.
  const CUE = {
    turn0: -0.60,   // b's turn toward a began before frame 0 (so frame 0 is already moving)
    land: 3.05,     // "same way": b lies under a, the readout reads 4
    swell: 3.05,    // the number swells 1 -> 1.15 -> 1 (done 3.45, "way")
    out: 4.35,      // "measure similarity": b eases out to th 25 ...
    back: 4.95,     // ... and back to th 0 (lands 5.55)
    still: 5.60,    // nothing moves after this: state ALIGNED exactly
  };
  const TH0 = 142.5, TH_OUT = 25;           // th at turn0 (power2 = cubic: 140 at t 0, readout −3.1); the "similarity" lean
  const { seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  function render(t) {
    EP.state(P, g, "ALIGNED");
    if (t >= CUE.still) return;               // the last frames are ALIGNED, untouched
    const th = TH0 * (1 - E.io(seg(t, CUE.turn0, CUE.land)))
      + TH_OUT * (E.io(seg(t, CUE.out, CUE.back)) - E.io(seg(t, CUE.back, CUE.back + 0.6)));
    const k = seg(t, CUE.swell, CUE.swell + 0.4), sc = 1 + 0.15 * Math.sin(Math.PI * k);
    EP.bg(g); EP.plane(g); EP.pair(g, th);
    P.ro[0].set("dot product = ", EP.dotAt(th), { scale: sc });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
