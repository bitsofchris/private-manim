<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frames of ep08 (the dot product), one per second:
         t < 1  MATH: the plane, a [1, 1] teal and b [2, 2] blue aligned, "dot product = 4" (the hero),
                the pairwise sum 1 × 2 + 1 × 2 under it, the code card at the band top.
         t < 2  b turning to th 90: the right-angle mark, b [−2, 2], 1 × −2 + 1 × 2, "dot product = 0".
         t >= 2 OPPOSITE_N: b [−2, −2], 1 × −2 + 1 × −2, "dot product = −4".
         Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep08.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.0;
  const { seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);
  function render(t) {
    if (t < 1) {
      EP.state(P, g, "MATH");
      P.code.spans[0][1].style.color = ISO.css(ISO.mix(ISO.COL.text, ISO.COL.hero, 1 - E.out(seg(t, 0, 0.8))));
    } else if (t < 2) {
      // th 90: the right-angle mark, b's label [ −2, 2 ], 1 × −2 + 1 × 2, readout 0
      const th = 80 + 10 * E.out(seg(t, 1, 1.6));
      EP.state(P, g, "ALIGNED_N");
      EP.plane(g); EP.pair(g, th, { right: seg(t, 1.6, 1.8) }); EP.nums(P, th);
      P.ro[0].set("dot product = ", EP.dotAt(th));
    } else {
      EP.state(P, g, "OPPOSITE_N");
      P.ro[0].num.style.transform += ` scale(${(1 + 0.15 * (1 - E.out(seg(t, 2, 2.5)))).toFixed(3)})`;
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
