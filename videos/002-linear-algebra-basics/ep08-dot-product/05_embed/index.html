<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep08 beat 5 (05_embed), master 20.60, 6.69 s (revision 2).
         VO: "That's why it's everywhere in AI. Embeddings that mean similar things point in
         similar directions, and the dot product is how you check."
         Opens on OPPOSITE_N (beat 4's end), ends exactly on WORDS (which carries the muted
         king–queen arc). Hero: the king–queen arc, then the 5. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep08.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.69" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.69;
  // beat-local cues (master − 20.60), from words.json checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    everywhere: 0.70, /* "everywhere (in AI)" 21.30 */
    similar: 2.18,    /* "(mean) similar things" 22.78 */
    point: 2.98,      /* "point (in similar directions)" 23.58 */
    directions: 3.46, /* "similar directions" 24.06 */
    dot: 5.03,        /* "the dot product" 25.63 */
    check: 6.14,      /* "check" 26.74 (envelope; words.json 26.68) */
  };
  const T = {
    out: [0, 0.45],                       // a, b, half-turn arc, readout, pairwise sum, tip labels fade (frame 0 moving)
    grow: CUE.everywhere - 0.12,          // king, then queen, then banana grow from the origin, 0.15 s apart
    growLen: 0.7,
    lift: [CUE.similar - 0.05, CUE.similar + 0.75],     // "similar things": king and queen brighten once
    arc: [CUE.point + 0.02, CUE.directions + 0.3],      // the magenta arc draws, landing on "similar directions"
    mute: [CUE.dot - 0.1, CUE.dot + 0.5],             // "the dot product": arc goes muted, readout in
    swell: [CUE.dot + 0.15, CUE.dot + 0.7],
    kb: [CUE.check - 0.15, CUE.check + 0.3],             // "check": king · banana = 0
    still: 6.45,
  };
  const { COL, seg, mix, css, clamp01 } = ISO;
  const { SLOT } = VEC;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const pulse = (t, a, b) => Math.sin(Math.PI * seg(t, a, b));   // 0 → 1 → 0
  const KQ_ARC = [26.57, 53.13];                                // king's and queen's directions (deg)

  // local: EP.words with a brighten k per word (arrow toward off-white, a little wider)
  function drawWords(t, o) {
    Object.keys(EP.WORDS).forEach((w, i) => {
      const p = EP.WORDS[w], u = o.u[w], k = o.k[w] || 0;
      VEC.arrow(g, [0, 0], p, { col: mix(SLOT[i], COL.text, 0.35 * k), u, width: 40 * (1 + 0.25 * k) });
      const s = clamp01(u);
      VEC.place(P.words[w], p[0] * s, p[1] * s, { dx: EP.WORD_OFF[w].dx, dy: EP.WORD_OFF[w].dy, alpha: s });
    });
    VEC.puck(g, 0, 0);
  }

  function render(t) {
    if (t >= T.still) { EP.state(P, g, "WORDS"); return; }   // the end state, exactly (muted arc included)
    EP.state(P, g, "OPPOSITE_N");          // resets every DOM part
    EP.plane(g);                           // (clears the canvas)

    // "That's why": OPPOSITE fades out (the plane stays)
    const out = 1 - E.io(seg(t, ...T.out));
    if (out > 0.001) {
      EP.pair(g, EP.TH.OPPOSITE, { alpha: out });
      P.ro[0].set("dot product = ", EP.dotAt(EP.TH.OPPOSITE), { alpha: out });
      EP.nums(P, EP.TH.OPPOSITE, { alpha: out });   // [ 1, 1 ], [ −2, −2 ], 1 × −2 + 1 × −2
    } else {
      P.ro[0].set("", "", { alpha: 0 });
      EP.nums(P, EP.TH.OPPOSITE, { alpha: 0 });
    }

    // "everywhere in AI": the three words grow from the origin, labels riding the tips
    const u = {}, k = {};
    Object.keys(EP.WORDS).forEach((w, i) => { u[w] = E.out(seg(t, T.grow + 0.15 * i, T.grow + 0.15 * i + T.growLen)); });
    const lift = pulse(t, ...T.lift);
    k.king = k.queen = lift;
    if (u.king > 0.001) drawWords(t, { u, k });

    // "point in similar directions": the magenta arc king → queen draws; "the dot product": it goes muted
    const ua = E.io(seg(t, ...T.arc)), m = E.io(seg(t, ...T.mute));
    if (ua > 0.001) {
      EP.arc(g, KQ_ARC[0], KQ_ARC[0] + (KQ_ARC[1] - KQ_ARC[0]) * ua,
        { r: 1.6 - 0.7 * m, col: mix(COL.hero, COL.muted, m), width: 11 - 5 * m });   // as hero: out where it reads; settles to the rest arc
    }

    // "the dot product": king · queen = 5 (the 5 magenta, swelling); "check": king · banana = 0
    if (m > 0.001) {
      P.ro[0].set("king · queen = ", EP.KQ, { alpha: m, scale: 1 + 0.18 * pulse(t, ...T.swell) });
    }
    const kb = E.out(seg(t, ...T.kb));
    if (kb > 0.001) P.ro[1].set("king · banana = ", EP.KB, { row: 1, col: COL.text, alpha: kb });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
