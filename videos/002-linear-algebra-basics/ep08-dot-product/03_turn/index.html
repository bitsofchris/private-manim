<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep08 beat 3 (03_turn), revision 2: from MATH, the code card fades; b swings out to th 70 on
         "as this arrow turns" (readout and pairwise sum ticking down) and back onto a on "direction" (4);
         the number swells on "number" and "positive". Ends ALIGNED_N.
         Started from 00_layout, whose notes follow:
         t < 1  CANON: the plane, a (1, 1) teal and b blue turning about the origin, the angle arc,
                "dot product = 2" with the number magenta (the hero). Frame 0 of the Short looks like this.
         t < 2  SUM: the pairwise numbers a = [ 1, 2, 3 ], b = [ 4, −1, 0 ], products 4 + −2 + 0, "= 2",
                and the code card torch.dot(a, b) / # 4 − 2 + 0 = 2.
         t >= 2 WORDS: king, queen, banana on the plane; "king · queen = 5", "king · banana = 0".
         Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep08.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.17" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.17;
  // Cues, beat-local = master - 8.99 (unchanged from the first build: the audio shifted -6.918 s).
  // Checked on a 20 ms RMS envelope of the first build's vo_final.wav (same samples):
  // "Watch" onset 0.19, "number" 0.53, "arrow" 1.29, "turns" ends 2.01, "Pointing" 2.40,
  // "same" 2.92, "direction" 3.05-3.51, "positive" 3.57-3.97.
  const CUE = {
    card: 0.00,     // frame 0: the code card starts fading out (0.4 s)
    number: 0.53,   // "number": the readout swells once
    out0: 1.20,     // "as this arrow turns": b swings out from th 0 ...
    out1: 2.30,     // ... to th 70 (1.1 s), readout and sum ticking down
    back0: 2.40,    // "Pointing the same direction": b turns back ...
    land: 3.05,     // ... landing at th 0 on "direction", readout 4
    pos: 3.57,      // "positive": the number swells (done 3.97)
    still: 3.97,    // nothing moves after this: state ALIGNED_N exactly
  };
  const TH_OUT = 70;                        // how far b swings out (readout 1.4)
  const { seg } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const swell = (t, t0) => 1 + 0.15 * Math.sin(Math.PI * seg(t, t0, t0 + 0.4));
  function render(t) {
    EP.state(P, g, "ALIGNED_N");
    if (t >= CUE.still) return;                                  // the last frames are ALIGNED_N, untouched
    const th = TH_OUT * (E.io(seg(t, CUE.out0, CUE.out1)) - E.io(seg(t, CUE.back0, CUE.land)));
    EP.placeCode(P, 1 - E.io(seg(t, CUE.card, CUE.card + 0.4)));   // MATH's card (line 2 full) fades out
    EP.plane(g); EP.pair(g, th); EP.nums(P, th);
    P.ro[0].set("dot product = ", EP.dotAt(th), { scale: swell(t, CUE.number) * swell(t, CUE.pos) });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
