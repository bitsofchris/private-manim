<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_basis: the point and readout leave; x y z are named the basis, each leaves the plane of the other two, the lattice grows out to span the space. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/basis.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.17" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 9.17, MASTER_START = 6.66;
  // Beat-local cue times (master = local + 6.66), from vo_final.wav envelope + sub-clip transcription.
  const CUE = {
    clear: 0.0,         /* "Those directions..." : hero + readout out, lattice dims */
    basis: 1.80,        /* "are THE BASIS" */
    independent: 3.86,  /* "a set of INDEPENDENT vectors" */
    span: 5.62,         /* "that SPAN the whole space" */
    choose: 7.24,       /* "It's the COORDINATE system that you choose": hold */
  };
  const T = {
    clearDur: 0.6,      // hero, readout out; lattice to 0.1
    dimLattice: 0.1,
    step: 0.7,          // one "independent" check per arrow
    growDur: 1.7,       // lattice grows out from the origin
    still: 8.62,        // everything, camera drift included, still from here
  };
  const VIEW0 = { s: BK.VIEW.s, centre: BK.VIEW.centre.slice() };
  const ZOOM = { s: 230, centre: [0.45, 0.45, 0.55] };  // origin-centred close-up
  const ORDER = [0, 1, 2];  // x pierces the yz plane, then y the xz, then z the floor

  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, bump, rgba, COL, E: EB, ADDR_E } = BK, E = BK.ease();
  BK.setMaster(MASTER_START);
  const readout = BK.makeReadout(root);
  const labels = BK.makeBasisLabels(root);
  BK.guides(root);

  // local helper (BK.plane is symmetric, +/-ext): a plane patch from -0.6 to 1.8 along each vector,
  // so the patch below the floor never reaches the caption band
  function planeQ(b1, b2, alpha, lo = -0.6, hi = 1.8) {
    const pts = [[lo, lo], [hi, lo], [hi, hi], [lo, hi]].map(([i, j]) => BK.S(BK.add(BK.scale(b1, i), BK.scale(b2, j))));
    g.globalAlpha = alpha; g.fillStyle = rgba(COL.dim);
    g.beginPath(); pts.forEach((p, k) => (k ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]))); g.closePath(); g.fill();
    g.globalAlpha = 1;
  }

  function render(tRaw) {
    const t = Math.min(tRaw, T.still);
    const c = E.io(seg(t, CUE.clear, CUE.clear + T.clearDur));
    const gr = E.io(seg(t, CUE.span, CUE.span + T.growDur));   // 0..1
    // the world (BK.world's draw order, split so a dim full lattice can sit under the growing one)
    // camera: push in on the basis for "the basis" / "independent" (the unit arrows are ~80 px in the
    // canonical view), pull back out as the lattice spans the space; z = 0 is the canonical view
    const z = E.io(seg(t, 0.3, 1.7)) * (1 - E.io(seg(t, CUE.span, CUE.span + T.growDur)));
    BK.VIEW.s = lerp(VIEW0.s, ZOOM.s, z);
    BK.VIEW.centre = BK.lerp3(VIEW0.centre, ZOOM.centre, z);
    BK.setTime(t); BK.clear(g);
    const dim = lerp(1, T.dimLattice, c) * (1 - gr);
    BK.lattice(g, EB, { alpha: 0.6 * dim });
    // grow 0.7 already reaches every line in BOX, so the grown lattice equals the canonical one
    if (gr > 0) BK.lattice(g, EB, { alpha: 0.6 * gr, grow: gr >= 1 ? 1 : 0.7 * gr });
    const hero = 1 - c;
    if (hero > 0) {
      BK.arrow(g, [0, 0, 0], BK.P, rgba(COL.hero), { width: BK.ARROW_W.hero, head: 40, alpha: hero });
      BK.dot(g, BK.P, 14, rgba(COL.hero), hero);
    }
    // "independent": for each arrow in turn, the faint plane through the other two, the arrow pulses through it
    const w = [0, 0, 0];
    ORDER.forEach((i, n) => {
      const a = CUE.independent + n * T.step;
      const env = Math.min(seg(t, a, a + 0.15), 1 - seg(t, a + T.step - 0.15, a + T.step));
      if (env > 0) planeQ(EB[(i + 1) % 3], EB[(i + 2) % 3], 0.28 * env);
      w[i] = Math.max(w[i], bump(t, a + 0.08, T.step - 0.16));
    });
    // "the basis": one pulse of all three
    const pb = bump(t, CUE.basis, 0.6);
    EB.forEach((v, i) => {
      const b = Math.max(pb, w[i]);
      if (b > 0) BK.arrow(g, [0, 0, 0], v, rgba(COL.slots[i]), { width: 12 + 18 * b, head: 30 + 14 * b, alpha: 0.35 * b });
      BK.arrow(g, [0, 0, 0], v, rgba(COL.slots[i]), { width: 12 + 4 * b, head: 30 + 6 * b });
    });
    labels.place(EB, 0);
    labels.ls.forEach((l, i) => { l.el.style.transform += ` scale(${1 + 0.18 * Math.max(pb, w[i])})`; });
    readout.set(ADDR_E, { alpha: 1 - c });
  }

  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
})();
    </script>
  </body>
</html>
