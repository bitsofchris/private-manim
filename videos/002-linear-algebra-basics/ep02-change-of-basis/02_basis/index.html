<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_basis: the point leaves; the camera pushes in on x y z, each leaves the plane of the other two; the floor grid grows out as the camera pulls back. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/basis.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.17" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 9.17, MASTER_START = 6.66;
  // Beat-local cue times (master = local + 6.66), from vo_final.wav envelope + sub-clip transcription.
  const CUE = {
    clear: 0.0,         /* "Those directions..." : hero, stalk, route, readout out */
    basis: 1.80,        /* "are THE BASIS" */
    independent: 3.86,  /* "a set of INDEPENDENT vectors" */
    span: 5.62,         /* "that SPAN the whole space" */
    choose: 7.24,       /* "It's the COORDINATE system that you choose": hold */
  };
  const T = {
    clearDur: 0.6,      // hero, stalk, route, readout out
    push: [0.45, 1.8],  // camera pushes in on the origin
    pullDur: 1.75,      // from CUE.span: grid grows out while the camera pulls back
    step: 0.7,          // one "independent" check per arrow
    still: 8.62,        // everything still from here
  };
  // the close-up: VIEW.s / VIEW.centre (canonical values restored by the end)
  const CLOSE = { s: 280, centre: [0.4, 0.3, 0.5] };
  const DIM = { floor: 0.35, grid: 0.15 };  // floor and grid during the close-up
  const FADE = [960, 1100];  // y range of the soft stage-bottom fade during the close-up
  const ORDER = [0, 1, 2];  // x leaves the yz plane, then y the xz, then z the floor
  const PLANE = { lo: -0.3, hi: 1.4, alpha: 0.3 };  // small enough to stay out of the band in the close-up

  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, lerp3, bump, rgba, COL, ADDR_E } = BK, EB = BK.E, E = BK.ease();
  const CANON = { s: BK.VIEW.s, centre: BK.VIEW.centre.slice() };
  BK.setMaster(MASTER_START);
  const readout = BK.makeReadout(root);
  const labels = BK.makeBasisLabels(root);
  BK.guides(root);
  // the stage ends at y 1100: the zoomed floor must not spill into the caption band
  g.beginPath(); g.rect(0, 0, BK.W, BK.SAFE.stageBottom); g.clip();

  function render(tRaw) {
    const t = Math.min(tRaw, T.still);
    const c = E.io(seg(t, CUE.clear, CUE.clear + T.clearDur));      // 0..1 fade out
    const zin = E.io(seg(t, T.push[0], T.push[1]));                  // 0..1 push in
    const gr = E.io(seg(t, CUE.span, CUE.span + T.pullDur));         // 0..1 grow + pull back
    const z = zin * (1 - gr);                                        // closeness
    BK.VIEW.s = lerp(CANON.s, CLOSE.s, z);
    BK.VIEW.centre = lerp3(CANON.centre, CLOSE.centre, z);
    const d = zin;  // floor and grid dim with the push
    const floor = lerp(1, DIM.floor, d * (1 - gr)) ;
    const gridDim = lerp(1, DIM.grid, d);
    // grid: before "span" one full grid dimming; then a fresh grid grows from the origin while the dim
    // full one (drawn as world's ghost: 0.3*ghost == 0.9*grid alpha) fades under it.
    // grow 0.7 already reaches every line on the floor, so the grown grid equals the canonical one.
    const opts = gr > 0
      ? { grid: gr, grow: gr >= 1 ? 1 : 0.7 * gr, ghost: 3 * DIM.grid * (1 - gr) }
      : { grid: gridDim };
    const hero = 1 - c;
    BK.world(g, t, 0, Object.assign(opts, {
      floor, hero, stalk: 1, basis: 0,
      route: hero > 0 ? { c: ADDR_E, alpha: hero } : null,
    }));
    // in the close-up the zoomed floor is clipped at the stage bottom: soften that cut (scaled by closeness,
    // so the canonical frame is untouched)
    if (z > 0) {
      const fb = g.createLinearGradient(0, FADE[0], 0, FADE[1]);
      fb.addColorStop(0, rgba(COL.bg, 0)); fb.addColorStop(1, rgba(COL.bg, 1));
      g.globalAlpha = z; g.fillStyle = fb; g.fillRect(0, FADE[0], BK.W, FADE[1] - FADE[0]); g.globalAlpha = 1;
    }
    // "independent": for each arrow in turn, the faint plane through the other two; the arrow pulses out of it
    const em = [0, 0, 0];
    ORDER.forEach((i, n) => {
      const a = CUE.independent + n * T.step;
      const env = Math.min(seg(t, a, a + 0.15), 1 - seg(t, a + T.step - 0.15, a + T.step));
      if (env > 0) BK.plane(g, EB[(i + 1) % 3], EB[(i + 2) % 3], rgba(COL.dim), PLANE.alpha * env, PLANE.lo, PLANE.hi);
      em[i] = Math.max(em[i], bump(t, a + 0.08, T.step - 0.16));
    });
    // "the basis": one pulse of all three
    const pb = bump(t, CUE.basis, 0.6);
    for (let i = 0; i < 3; i++) em[i] = Math.max(em[i], pb);
    // the basis arrows, over the planes (same strokes as BK.world's, emph included)
    EB.forEach((b, i) => {
      if (em[i] > 0) BK.arrow(g, [0, 0, 0], b, rgba(COL.slots[i]), { width: BK.ARROW_W.basis + 20 * em[i], head: 34 + 14 * em[i], alpha: 0.35 * em[i] });
      BK.arrow(g, [0, 0, 0], b, rgba(COL.slots[i]), { width: BK.ARROW_W.basis + 4 * em[i], head: 34 + 6 * em[i] });
    });
    labels.place(EB, 0, 1, em.map((e) => 1 + 0.18 * e));
    readout.set(ADDR_E, { alpha: 1 - c });
  }

  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
})();
    </script>
  </body>
</html>
