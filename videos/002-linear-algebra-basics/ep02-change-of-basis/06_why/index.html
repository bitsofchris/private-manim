<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_why: same arrow, new address; the address is the route, how much of each basis vector (tip to tail). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/basis.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0;
              --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.74" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.74;
  // Beat-local seconds (master 28.29 + t), from vo_final.wav envelope + sub-clip transcription.
  const CUE = {
    didnt:   0.55, /* "didn't move" (move ~0.85-1.10) */
    address: 1.65, /* "address changed" (address ~1.65, changed ~2.05) */
    leg1:    3.70, /* "are how much" (starts in the pause before "are", 3.95) */
    leg2:    4.50, /* "of each" -> "basis" (~4.95) */
    leg3:    5.30, /* "vector you need" */
    land:    6.10, /* "get there" (get ~6.05, there ~6.2) */
  };
  const LEG = 0.80;          // each tip-to-tail leg draws over 0.8 s
  const HOLD_FROM = 6.36;    // everything still from here (the camera is fixed: drift 0)

  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, rgba, COL, P, ADDR_E, ADDR_V, bump } = BK, E = BK.ease();
  BK.setMaster(28.29);

  // Old address (small, dim) above; new address slides down under it.
  const OLD = { size: 68, top: 240, lift: 22, alpha: 0.5 };  // 240..318
  const NEW_SLIDE = 62;                                      // new: 262..388 -> 324..450
  const oldR = BK.makeReadout(root, { size: OLD.size, top: OLD.top });
  const newR = BK.makeReadout(root);
  const labels = BK.makeBasisLabels(root);
  BK.guides(root);

  const O = [0, 0, 0];
  const LEG_T = [CUE.leg1, CUE.leg2, CUE.leg3];  // -2 v1 (backwards), 3 v2 to the foot, 2 v3 up the stalk

  function render(tIn) {
    const t = Math.min(tIn, HOLD_FROM);
    const prog = LEG_T.map((t0) => E.io(seg(t, t0, t0 + LEG)));
    const B = BK.world(g, t, 1, { ghost: 1, route: { c: ADDR_V, prog } });

    // "didn't move": the hero brightens in place (a soft wide glow), no motion
    const glow = bump(t, 0.0, 1.9);
    if (glow > 0) {
      BK.arrow(g, O, P, rgba(COL.hero), { width: 38, head: 70, alpha: 0.35 * glow });
      BK.dot(g, P, 34, rgba(COL.hero), 0.35 * glow);
    }
    // "get there": P pulses once as the gold leg lands
    const land = bump(t, CUE.land, 0.26);
    if (land > 0) {
      BK.ring(g, P, 24 + 18 * land, rgba(COL.hero), 0.9 * land, 6);
      BK.dot(g, P, 15, rgba(COL.hero));
    }

    labels.place(B, 1);

    // "address changed": new readout slides down, old (3, 5, 2) appears dim above
    const slide = E.io(seg(t, CUE.address, CUE.address + 0.8));
    const oa = E.out(seg(t, CUE.address + 0.2, CUE.address + 0.9));
    oldR.set(ADDR_E, { alpha: OLD.alpha * oa, dy: -OLD.lift * (1 - oa) });

    // each leg lights its number (others dimmed); all lit again once P is reached
    const inLegs = seg(t, CUE.leg1 - 0.2, CUE.leg1) * (1 - seg(t, CUE.land, CUE.land + 0.25));
    const active = LEG_T.map((t0, k) => seg(t, t0 - 0.12, t0) * (1 - (k < 2 ? seg(t, t0 + LEG - 0.02, t0 + LEG + 0.1) : 0)));
    const lit = active.map((a) => lerp(1, lerp(0.25, 1, a), inLegs));
    const pulse = LEG_T.map((t0) => 1 + 0.12 * bump(t, t0, 0.6));
    newR.set(ADDR_V, { lit, pulse, dy: NEW_SLIDE * slide });
  }

  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
})();
    </script>
  </body>
</html>
