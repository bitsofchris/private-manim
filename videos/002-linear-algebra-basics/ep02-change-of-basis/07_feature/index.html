<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 07_feature: the 2D cut. u = (1, 1) in x, y becomes (1, 0) in the diagonal basis d1, d2. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/basis.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.38" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 10.38;
  // Beat-local seconds (master = 35.03 + t), from the vo_final.wav envelope + sub-clip transcription.
  const CUE = {
    interp: 0.80,  /* "interpretability" : u brightens once */
    oneOne: 2.27,  /* "One, one"         : both numbers pulse */
    legX:   2.75,  /* "a little x"       : teal leg 1·x draws (lands ~"x" 3.15) */
    x:      3.15,  /* "x"                : first number pulses */
    legY:   3.50,  /* "and a little y"   : blue leg 1·y draws */
    y:      3.92,  /* "y"                : second number pulses */
    diag:   4.75,  /* "diagonal"         : x, y -> d1, d2, lattice rotates + stretches */
    diagEnd: 6.10, /*  (morph lands before "just one") */
    one:    6.47,  /* "one"              : first number pulses, teal leg 1·d1 draws under u */
    zero:   6.76,  /* "zero"             : second number ticks 1 -> 0 */
    clean:  7.50,  /* "One clean feature": the 0 dims, glow on u */
    still:  8.60,  /*  everything frozen from here to the end */
  };

  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, lerp, rgba, bump, COL } = BK, E = BK.ease();

  // ---- local 2D world: screen = O + UNIT * (x, -y) ----
  const O = [507, 1010], UNIT = 240;
  const SX = (p) => [O[0] + UNIT * p[0], O[1] - UNIT * p[1]];
  const BOX = { x0: 100, x1: 915, y0: 470, y1: 1090 };          // lattice clip, screen px
  const WB = { lo: [(BOX.x0 - O[0]) / UNIT, (O[1] - BOX.y1) / UNIT],
               hi: [(BOX.x1 - O[0]) / UNIT, (O[1] - BOX.y0) / UNIT] };
  const U = BK.U2, X = [1, 0], Y = [0, 1], D = BK.D2;              // u = (1,1); d1 = (1,1), d2 = (-1,1)
  const lerp2 = (p, q, s) => [lerp(p[0], q[0], s), lerp(p[1], q[1], s)];

  // Liang-Barsky clip of o + t*d to the world box
  function clip(o, d) {
    let t0 = -1e9, t1 = 1e9;
    for (let i = 0; i < 2; i++) {
      if (Math.abs(d[i]) < 1e-9) { if (o[i] < WB.lo[i] || o[i] > WB.hi[i]) return null; continue; }
      let a = (WB.lo[i] - o[i]) / d[i], b = (WB.hi[i] - o[i]) / d[i];
      if (a > b) [a, b] = [b, a];
      t0 = Math.max(t0, a); t1 = Math.min(t1, b);
    }
    return t1 - t0 > 1e-6 ? [t0, t1] : null;
  }
  // the lattice of basis B (two families), clipped to BOX
  function lattice(B, alpha) {
    if (alpha <= 0) return;
    g.strokeStyle = rgba(COL.grid, alpha); g.lineWidth = 2; g.lineCap = "round";
    g.beginPath();
    [0, 1].forEach((a) => {
      const b = 1 - a;
      for (let n = -10; n <= 10; n++) {
        const o = [B[b][0] * n, B[b][1] * n], r = clip(o, B[a]);
        if (!r) continue;
        const p = SX([o[0] + B[a][0] * r[0], o[1] + B[a][1] * r[0]]);
        const q = SX([o[0] + B[a][0] * r[1], o[1] + B[a][1] * r[1]]);
        g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]);
      }
    });
    g.stroke();
  }
  // arrow from world a to world b, drawn to fraction prog (same shape as BK.arrow)
  function arrow(a, b, color, o = {}) {
    const prog = o.progress == null ? 1 : o.progress, w = o.width || 12, head = o.head || 34;
    if (prog <= 0) return;
    const p = SX(a), q = SX(lerp2(a, b, prog));
    const dx = q[0] - p[0], dy = q[1] - p[1], L = Math.hypot(dx, dy);
    if (L < 1) return;
    const ux = dx / L, uy = dy / L, h = Math.min(head, L * 0.6);
    g.save();
    g.globalAlpha = o.alpha == null ? 1 : o.alpha;
    if (o.glow) { g.shadowColor = color; g.shadowBlur = o.glow; }
    g.strokeStyle = color; g.fillStyle = color; g.lineWidth = w; g.lineCap = "round";
    g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0] - ux * h * 0.8, q[1] - uy * h * 0.8); g.stroke();
    g.beginPath(); g.moveTo(q[0], q[1]);
    g.lineTo(q[0] - ux * h - uy * h * 0.5, q[1] - uy * h + ux * h * 0.5);
    g.lineTo(q[0] - ux * h + uy * h * 0.5, q[1] - uy * h - ux * h * 0.5);
    g.closePath(); g.fill();
    g.restore();
  }
  // a tip-to-tail leg: a wide soft band under a basis-weight arrow
  function leg(a, b, color, prog, alpha) {
    if (prog <= 0 || alpha <= 0) return;
    const p = SX(a), q = SX(lerp2(a, b, prog));
    g.save(); g.globalAlpha = 0.35 * alpha; g.strokeStyle = color; g.lineWidth = 34; g.lineCap = "round";
    g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); g.restore();
    arrow(a, b, color, { progress: prog, alpha, head: 30 });
  }

  // ---- DOM: readout (kit), basis labels (kit labels, placed in 2D) ----
  const readout = BK.makeReadout(root, { n: 2 });
  // a pulsing number swells into its neighbours by design
  [readout.el, ...readout.el.children].forEach((e) => e.setAttribute("data-layout-allow-overlap", ""));
  const labels = [BK.makeLabel(root, "x", COL.slots[0]), BK.makeLabel(root, "y", COL.slots[1])];
  // label sizes measured once at build time (no DOM measurement inside the timeline)
  const SIZE = {};
  ["x", "y", "d1", "d2"].forEach((txt) => { labels[0].el.textContent = txt; SIZE[txt] = [labels[0].el.offsetWidth, labels[0].el.offsetHeight]; });
  function placeLabel(l, tipW, dirW, text) {
    l.el.textContent = text;
    const q = SX(tipW), n = Math.hypot(dirW[0], dirW[1]);
    const ux = dirW[0] / n, uy = -dirW[1] / n;                     // screen direction of the arrow
    const [w, h] = SIZE[text], off = 30 + 0.5 * Math.hypot(w * ux, h * uy);
    l.el.style.transform = `translate(${Math.round(q[0] + ux * off - w / 2)}px, ${Math.round(q[1] + uy * off - h / 2)}px)`;
  }
  BK.guides(root);

  function render(t) {
    const tt = Math.min(t, CUE.still);                             // frozen after CUE.still
    const s = E.io(seg(tt, CUE.diag, CUE.diagEnd));                // basis morph 0 -> 1
    const B = [lerp2(X, D[0], s), lerp2(Y, D[1], s)];              // x -> d1, y -> d2 (rotate 45° + stretch)

    g.fillStyle = rgba(COL.bg); g.fillRect(0, 0, BK.W, BK.H);
    lattice([X, Y], 0.25 * seg(tt, CUE.diag, CUE.diag + 0.4));    // the old square grid, left as a ghost
    lattice(B, 0.6);                                               // the lattice of the current basis

    // legs: 1·x then 1·y, tip to tail; fade as the grid starts to turn
    const legA = 1 - seg(tt, CUE.diag, CUE.diag + 0.5);
    leg([0, 0], X, rgba(COL.slots[0]), E.io(seg(tt, CUE.legX, CUE.legX + 0.7)), legA);
    leg(X, U, rgba(COL.slots[1]), E.io(seg(tt, CUE.legY, CUE.legY + 0.7)), legA);
    // the single teal leg 1·d1, under u
    const d1Leg = E.io(seg(tt, CUE.one, CUE.one + 0.65));
    if (d1Leg > 0) {
      const p = SX([0, 0]), q = SX(lerp2([0, 0], D[0], d1Leg));
      g.save(); g.globalAlpha = 0.35; g.strokeStyle = rgba(COL.slots[0]); g.lineWidth = 34; g.lineCap = "round";
      g.beginPath(); g.moveTo(p[0], p[1]); g.lineTo(q[0], q[1]); g.stroke(); g.restore();
    }

    // basis arrows (under the hero: d1 lands exactly under u)
    arrow([0, 0], B[1], rgba(COL.slots[1]), { head: 30 });
    arrow([0, 0], B[0], rgba(COL.slots[0]), { head: 30 });

    // the hero u: never moves; brightens once on "interpretability", soft glow on "clean feature"
    const glow = 34 * bump(tt, CUE.interp, 0.9) + 26 * E.io(seg(tt, CUE.clean + 0.25, CUE.still));
    arrow([0, 0], U, rgba(COL.hero), { head: 40, glow: glow > 0.5 ? glow : 0 });
    arrow([0, 0], U, rgba(COL.hero), { head: 40 });

    placeLabel(labels[0], B[0], B[0], s < 0.5 ? "x" : "d1");
    placeLabel(labels[1], B[1], B[1], s < 0.5 ? "y" : "d2");

    // readout: (1, 1) -> (1, 0); pulses on the spoken numbers; the 0 dims on "clean"
    const pulse = (a) => 1 + 0.28 * bump(tt, a, 0.4);
    const second = lerp(1, 0, seg(tt, CUE.zero, CUE.zero + 0.2));
    readout.set([1, second], {
      pulse: [pulse(CUE.oneOne) * pulse(CUE.x) * pulse(CUE.one), pulse(CUE.oneOne + 0.25) * pulse(CUE.y) * pulse(CUE.zero)],
      lit: [1, 1 - 0.85 * E.io(seg(tt, CUE.clean, CUE.clean + 0.6))],
    });
  }

  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
})();
    </script>
  </body>
</html>
