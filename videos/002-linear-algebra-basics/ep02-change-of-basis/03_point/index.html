<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 03_point: "Here's the point three, five, two in the usual x, y, z." Master 15.83, 3.69 s. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/basis.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      :root { --bg: #0b0b14; --panel: #14142b; --text: #ecebe4; --dim: #8a8fb0;
              --data: #2dd4bf; --hero: #c084fc; --muted: #4a5070; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.69" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.69, MASTER_START = 15.83;
  // beat-local seconds (master - 15.83), from the vo_final.wav envelope + sub-clip transcription
  const CUE = {
    point: 0.54, /* "point"  (16.37) */
    three: 1.02, /* "three"  (16.85) */
    five:  1.34, /* "five"   (17.17) */
    two:   1.72, /* "two"    (17.55) */
    x:     2.94, /* "x"      (18.77) */
    y:     3.08, /* "y"      (18.91) */
    z:     3.18, /* "z"      (19.01) */
  };
  // the hero draws on "point" (1.0 s, starting on its plosive); the stalk fades in once it lands
  const HERO = [0.50, 1.50];
  // route legs (3·x, 5·y, 2·z up the stalk): each starts just before its word and lands on it
  const LEG = [[0.66, CUE.three + 0.04], [1.00, CUE.five + 0.04], [1.36, CUE.two + 0.04]];
  const PULSE = 0.24;       // x / y / z emphasis (three words in 0.25 s: a quick ripple)
  const HOLD_FROM = 3.42;   // everything still from here (the camera is fixed)

  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const { seg, bump } = BK, E = BK.ease();
  BK.setMaster(MASTER_START);
  const readout = BK.makeReadout(root);
  const labels = BK.makeBasisLabels(root);
  BK.guides(root);
  const pulseAt = [CUE.x, CUE.y, CUE.z];

  function render(tRaw) {
    const t = Math.min(tRaw, HOLD_FROM);
    const draw = E.io(seg(t, HERO[0], HERO[1]));
    const prog = LEG.map(([a, b]) => E.io(seg(t, a, b)));
    const emph = pulseAt.map((c) => bump(t, c, PULSE));
    const B = BK.world(g, t, 0, {
      hero: draw > 0 ? 1 : 0, heroDraw: draw, stalk: seg(t, HERO[1], HERO[1] + 0.15),
      route: { c: BK.ADDR_E, prog }, emph,
    });
    labels.place(B, 0, 1, emph.map((e) => 1 + 0.3 * e));
    // the readout types each number as its leg lands (brackets + commas with the first)
    const app = LEG.map(([, b]) => seg(t, b - 0.04, b + 0.14));
    readout.set(BK.ADDR_E, { alpha: app[0], visible: app, pulse: app.map((a) => 0.6 + 0.4 * E.back(a)) });
  }
  const tl = gsap.timeline({ paused: true, onUpdate: () => render(tl.time()) });
  tl.to({ p: 0 }, { p: 1, duration: BEAT_SECONDS, ease: "none" }, 0);
  tl.set({}, {}, BEAT_SECONDS);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0); render(0);
})();
    </script>
  </body>
</html>
