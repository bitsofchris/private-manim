<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- The canonical frames of ep05, the two halves of the Short.
         t < 1: OUTPUTS (beats 1-4): nn.Linear(3, 2), weight (2, 3) with one row per neuron,
         the network below (inputs 1, 2, -1 -> two neurons -> 4.1, -1.2).
         t >= 1: CANON (beats 6-9): x @ weight.T + bias, weight beside weight.T (3, 2),
         and weight.T's rows as the landing arrows on the plane. Copy this file to start a beat. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep05.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.0;
  const { COL, seg, mix } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);
  function render(t) {
    if (t < 1) {
      EP.state(P, g, "OUTPUTS");
      // the one moving thing: neuron 1's row of weight boxed, as on "one output neuron per row"
      P.hl.rect(EP.RECT.wRow(0, EP.WL.STORED), E.out(seg(t, 0.05, 0.5)));
      EP.network(g, P, { x: true, out: [1, 1], lit: [E.out(seg(t, 0.05, 0.5)), 0] });
    } else {
      EP.state(P, g, "CANON");
      P.tArrow.dot.style.color = ISO.css(mix(COL.dim, COL.hero, E.out(seg(t, 1.05, 1.5))));
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
