<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep05 beat 9, 09_close (master 45.76 after the 1.0 s insert, 6.581 s). Opens CANON (lifted: no names or shapes, matrices at EP.MAT_UP), ends MODEL (names stay off) (storyboard Revision 1; the
         Short's final frame, still from 5.30 s). Hero: the .T.
         VO: "It's the same idea, just transposed. nn.Linear stores neurons as rows and
         transposes on the way through."
         "same idea": the three arrows pulse once. "just transposed": the ".T →" swells and a
         ghost of each column of weight slides to its row of weight.T and fades. "stores
         neurons as rows": weight's rows box in turn (magenta; the .T steps down to --dim
         meanwhile so one magenta hero is on screen). "transposes on the way through": the
         card's .T and the ".T →" pulse magenta, the plane fades, the card becomes the four-line
         model (nn.Linear line magenta) and the matrices move down as one block; ".T →" stays lit. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep05.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.581" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 6.581;
  // beat-local cues (master − 45.76; were − 44.76 before the 1.0 s insert at 3.60), from words.json checked on a 50 ms RMS envelope
  const CUE = {
    same: 0.56,       /* "same (idea)" */
    transposed: 1.07, /* "just transposed" */
    neurons: 3.16,    /* "neurons" */
    rows: 3.98,       /* "rows" */
    and: 4.29,        /* "and (transposes on the way through)" */
    transposes: 4.52, /* "transposes (on the way through)" */
  };
  // "and transposes on the way through": plane out, card A→model, matrices down one block.
  // Every motion ends by 5.30; still on MODEL from there (1.28 s; the Short's last frame).
  const T = { planeOut: [4.25, 4.65], cardOut: [4.30, 4.60], down: [4.35, 5.05], modelIn: [4.55, 5.20], still: 5.30 };
  const DROP = 220;            // the lifted matrices (top 392, ".T" at 386) move down to clear the four-line card (236-564): top 612
  const { COL, seg, mix, css } = ISO;
  const { SLOT, fmtv } = VEC;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const pulse = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));   // 0 → 1 → 0
  // local: ghost copies of weight's six numbers, (r, c) of weight → (c, r) of weight.T
  const ghosts = EP.WEIGHT.map((row, r) => row.map((v, c) => VEC.cell(root, fmtv(v), {
    width: EP.CW, height: EP.RH, size: EP.SIZE, col: SLOT[c], alpha: 0 })));
  ghosts.flat().forEach((gc) => gc.el.setAttribute("data-layout-allow-overlap", ""));   // they fly over numbers on purpose
  // the card's ".T" span (spans of cardB line 0: x, @, weight, .T, + bias)
  const cardT = P.cardB.spans[0][3];
  P.tArrow.dot.setAttribute("data-layout-allow-overlap", "");   // it swells over the → on purpose
  // local: the MODEL end state's four-line card (EP.MODEL, 60 px), its nn.Linear line magenta
  const model = VEC.codeCard(root, EP.MODEL.map((ln, i) => (i === EP.MODEL_LINE ? [[ln, COL.hero]] : ln)));
  // everything in the matrices block (names, shapes, cells, brackets, ".T →", boxes), shifted as one
  const block = [...P.w.flat(), ...P.wt.flat()].map((c) => c.el)
    .concat(P.wB.els, P.tB.els, Object.values(P.names), [P.tArrow.dot, P.tArrow.arr, P.hl.el, P.hl2.el]);
  const shiftY = (dy) => block.forEach((el) => { el.style.transform = `translateY(${dy.toFixed(1)}px) ${el.style.transform}`; });

  function render(t) {
    EP.state(P, g, "CANON");

    // "same idea": the three landing arrows pulse once (wider, toward white, and back)
    const kA = pulse(t, 0.0, CUE.same + 0.5);
    VEC.view(EP.PLANE);                                          // redraw the plane (EP.plane, with the pulse)
    const pa = 1 - E.io(seg(t, ...T.planeOut));                  // "and": the plane fades
    VEC.floor(g, { alpha: 0.42 * pa }); VEC.axes(g, { alpha: pa });
    EP.WT.forEach((row, i) => VEC.arrow(g, [0, 0], row, { col: mix(SLOT[i], COL.text, 0.35 * kA), width: 40 * (1 + 0.3 * kA), alpha: pa }));
    VEC.puck(g, 0, 0, { alpha: pa });

    // "just transposed": ghosts fly column c of weight → row c of weight.T, then fade
    ghosts.forEach((row, r) => row.forEach((gc, c) => {
      const a = CUE.transposed - 0.05 + 0.1 * c, u = seg(t, a, a + 0.75), k = E.io(u);
      const x0 = EP.WL.LEFT + c * EP.CW, y0 = EP.LAY.top + r * EP.RH;
      const x1 = EP.TL + r * EP.CW, y1 = EP.LAY.top + c * EP.RH;
      const lift = -46 * Math.sin(Math.PI * k);                  // a small arc over the ".T →"
      const al = u <= 0 || u >= 1 ? 0 : 0.8 * Math.min(1, u / 0.12) * (1 - E.inn(seg(u, 0.5, 0.95)));
      gc.at(x0 + (x1 - x0) * k, y0 + (y1 - y0) * k + lift, { alpha: al });
    }));

    // the .T hero: dim while weight's rows are boxed (one magenta at a time), then the pulse
    const down = E.io(seg(t, 2.85, 3.1)) * (1 - E.io(seg(t, 4.3, 4.55)));
    const kT = pulse(t, CUE.transposes - 0.05, 0.8);
    const tCol = mix(mix(COL.hero, COL.dim, down), COL.text, 0.45 * kT);
    cardT.style.color = css(tCol);
    P.tArrow.dot.style.color = css(tCol);
    const swell = pulse(t, CUE.transposed - 0.1, 0.9);           // "just transposed"
    const sT = 1 + 0.35 * swell + 0.28 * kT;
    const sArr = 1 + 0.3 * swell + 0.2 * kT;
    const dyA = EP.LAY.top - EP.MAT_TOP;                         // CANON is lifted (EP.MAT_UP)
    EP.put(P.tArrow.dot, EP.ARROW.x - 60, EP.ARROW.y - 70 + dyA);
    P.tArrow.dot.style.transform += ` scale(${sT.toFixed(4)})`;
    EP.put(P.tArrow.arr, EP.ARROW.x - 60, EP.ARROW.y + dyA);
    P.tArrow.arr.style.transform += ` scale(${sArr.toFixed(4)})`;
    const lit = E.io(seg(t, CUE.transposes - 0.05, CUE.transposes + 0.45));   // the → stays lit with the .T
    P.tArrow.arr.style.color = css(mix(COL.dim, COL.text, Math.max(0.6 * swell, lit)));

    // "stores neurons as rows": weight's two rows box in turn (magenta), then go
    const off = E.io(seg(t, 4.15, 4.45));
    P.hl.rect(EP.RECT.wRow(0), E.out(seg(t, CUE.neurons - 0.15, CUE.neurons + 0.1)) * (1 - off));
    P.hl2.rect(EP.RECT.wRow(1), E.out(seg(t, CUE.rows - 0.4, CUE.rows - 0.15)) * (1 - off));

    // "transposes on the way through": the one-line card gives way to the model; the matrices move down
    P.cardB.at(VEC.centreLeft(P.cardB.el), EP.CARD_TOP, { alpha: 1 - E.io(seg(t, ...T.cardOut)) });
    const kM = E.out(seg(t, ...T.modelIn));
    model.at(VEC.centreLeft(model.el), EP.CARD_TOP, { alpha: kM, scale: 0.96 + 0.04 * kM });
    shiftY(DROP * E.io(seg(t, ...T.down)));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
