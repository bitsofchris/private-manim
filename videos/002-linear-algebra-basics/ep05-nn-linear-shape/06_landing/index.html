<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep05 beat 6, 06_landing (master 24.58, 7.30 s). Opens FLIPPED, ends CANON.
         "The flipped weight is three by two, exactly the W from the last video,
          where each row is where an input direction lands." -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep05.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0;
              --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.30" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 7.30;               // master 24.58 → 31.88 in vo_final.wav
  const { COL, seg, mix, css } = ISO;
  // beat-local = master − 24.58 (cues measured before the +1.0 s shift; local times unchanged); words.json checked on a 30 ms RMS envelope
  const CUE = {
    flipped: 0.42,  /* "The flipped weight" (0.18–1.05) */
    three: 1.27,    /* "three by two" (1.14–1.85) */
    two: 1.62,      /* "two" (1.60–1.85) */
    W: 2.88,        /* "the W" (2.60–3.15): the two-line card W = weight.T is in */
    video: 3.75,    /* "last video" (3.75–4.02), then a pause to 4.40 */
    where: 4.42,    /* "where" (4.42–4.60) */
    row: 5.00,      /* "each row" (4.71–5.30) */
    lands: 6.96,    /* "direction lands" (6.24–7.14) */
    still: 6.95,    /* CANON from here to the end (0.35 s still) */
  };
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);                 // every DOM part, once
  ISO.guides(root);

  // ---- local helpers ----
  const pulse = (t, a, d) => Math.sin(Math.PI * seg(t, a, a + d));     // 0 → 1 → 0
  const inOut = (t, a, b, c, d) => E.out(seg(t, a, b)) * (1 - E.io(seg(t, c, d)));
  // one box per row of weight.T, in the row's own colour (local: the kit has two hboxes)
  const rowBox = [0, 1, 2].map(() => VEC.hbox(root));
  const shapeBox = VEC.hbox(root);
  // "W = weight.T": on "exactly the W from the last video" the one-line card swaps for a
  // two-line card that says ep04's W is this weight.T (swap as in 03_neuron / 04_two:
  // old card gone in the first 45 %, new one in over the rest, no overlap)
  const cardW = VEC.codeCard(root, [[["W = weight"], [".T", COL.hero]], ["x @ W + bias"]]);
  [cardW.el, P.cardB.el].flatMap((c) => [c, ...c.querySelectorAll("*")]).concat([P.names.w, P.names.t]).forEach((el) => {   // swaps in place
    el.setAttribute("data-layout-allow-overlap", ""); el.setAttribute("data-layout-allow-occlusion", "");
  });
  const showCard = (card, a) => card.at(VEC.centreLeft(card.el), EP.CARD_TOP, { alpha: a, scale: 0.96 + 0.04 * a });
  const outk = (k) => seg(k, 0, 0.45), inn = (k) => seg(k, 0.45, 1);
  // the two-line card reaches y ~420: the names (y 372) step out of its way; the shapes (y 440) stay
  // the plane with each arrow drawn on its own clock (EP.plane draws all three at once)
  function planeEach(alpha, us) {
    VEC.view(EP.PLANE);
    VEC.floor(g, { alpha: 0.42 * alpha });
    VEC.axes(g, { alpha });
    EP.WT.forEach((row, i) => VEC.arrow(g, [0, 0], row, { col: VEC.SLOT[i], alpha, u: us[i], width: 40 }));
    VEC.puck(g, 0, 0, { alpha });
  }
  // each row of weight.T: its box and its arrow, ≥ 0.6 s each, on "each row … lands"
  const ROW = [CUE.row + 0.40, CUE.row + 0.875, CUE.row + 1.35];       // 5.40, 5.875, 6.35: the last lands on "lands"
  const DRAW = 0.60;
  // the lift (EP.lift: names and shapes go, matrices rise to MAT_UP), one 0.65 s move once the
  // one-line card and the names are back; the plane fades in as it finishes; rows after
  const SWAP_IN = [CUE.W - 0.43, CUE.W + 0.02];                        // 2.45 → 2.90 (lands on "W")
  const SWAP_BACK = [4.30, 4.75];                                      // after "last video", in the pause
  const LIFT = [SWAP_BACK[1], SWAP_BACK[1] + 0.65];                    // 4.75 → 5.40, once the names are back
  const PLANE_IN = [LIFT[0] + 0.40, LIFT[0] + 0.85];                   // 5.15 → 5.60

  function render(t) {
    if (t >= CUE.still) t = CUE.still;
    EP.state(P, g, "FLIPPED");
    EP.lift(P, E.io(seg(t, LIFT[0], LIFT[1])));
    const cardT = P.cardB.spans[0][3];

    // "The flipped weight": weight.T's brackets brighten once (moving from frame 0)
    const kf = pulse(t, 0, 1.05);
    P.tB.color(mix(COL.dim, COL.text, kf));

    // "three by two": (3, 2) is the hero, magenta with a box; the .T's step down to
    // --dim meanwhile so only one thing is magenta, then come back to rest (CANON).
    const kS = inOut(t, CUE.three - 0.15, CUE.three + 0.10, CUE.two + 0.55, CUE.two + 0.85);
    const kT = inOut(t, CUE.three - 0.30, CUE.three - 0.10, CUE.two + 0.65, CUE.two + 0.95);
    P.names.tShape.style.color = css(mix(COL.dim, COL.hero, kS));
    shapeBox.rect(EP.RECT.shapeT(), kS, COL.hero);
    const tCol = css(mix(COL.hero, COL.dim, kT));
    P.tArrow.dot.style.color = tCol; cardT.style.color = tCol;

    // "exactly the W from the last video": x @ weight.T + bias -> W = weight.T / x @ W + bias,
    // held ~1.4 s through "last video", then back to the one-line card and the names
    const k1 = E.io(seg(t, SWAP_IN[0], SWAP_IN[1])), k2 = E.io(seg(t, SWAP_BACK[0], SWAP_BACK[1]));
    showCard(P.cardB, (1 - outk(k1)) + inn(k2));
    showCard(cardW, inn(k1) * (1 - outk(k2)));
    const an = (1 - outk(k1)) + inn(k2);
    [P.names.w, P.names.t].forEach((el) => { el.style.opacity = (an * EP.LAY.names).toFixed(3); });

    // "where each row is where an input direction lands": the plane, then each row of
    // weight.T boxed in its colour while its arrow draws from the origin
    const kP = E.io(seg(t, PLANE_IN[0], PLANE_IN[1]));
    const us = ROW.map((a) => E.io(seg(t, a, a + DRAW)));
    if (kP > 0.001) planeEach(kP, us);
    ROW.forEach((a, i) => {
      const kb = inOut(t, a - 0.05, a + 0.12, a + DRAW - 0.15, a + DRAW - 0.02);
      rowBox[i].rect(EP.RECT.tRow(i), kb, VEC.SLOT[i]);
      P.wt[i].forEach((c) => c.color(mix(c.col0, COL.text, 0.35 * kb)));
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
