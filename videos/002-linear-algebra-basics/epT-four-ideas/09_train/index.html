<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- epT beat 9, 09_train (master 31.610, 4.270 s): LAYERS -> TRAINED.
         VO: "Training finds which directions to amplify, which to ignore, and which ones to mix." -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/epT.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.27" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.27;
  // Cues, beat-local seconds (master 31.610 + t), from words.json, checked on a 50 ms RMS
  // envelope of vo_final.wav (speech 0.19-0.97 "Training finds", 1.69 "amplify", 2.54 "ignore", 3.54-3.98 "to mix").
  const CUE = {
    train: 0.00,     // frame 0 moves: W2, W3 dim (0-0.6)
    rows: 0.23,      // "Training" (0.23): e1, e2 draw from the origin as W1's rows (0.23-0.9)
    amp: 1.67,       // "amplify" (1.67): W1 -> AMP, the ring stretches along e1, row 1 lights (0.63 s)
    ign: 2.51,       // "ignore" (2.51): W1 -> AMP @ IGN, the ring flattens, e2 shrinks, row 2 lights (0.62 s)
    mix: 3.27,       // "ones to mix" (3.21-3.91): W1 -> W1T, the ring shears, e1 swings to (2, 1);
                     //   the 0.6 s move is centred on "mix" (3.59) so it ends before the still
    still: 3.87,     // TRAINED, still (last 0.40 s)
  };
  const { COL, css, mix, seg, clamp01 } = ISO;
  const E = ISO.E();
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const P = EP.parts(root);
  ISO.guides(root);
  const AI = EP.mmul(EP.AMP, EP.IGN);                   // AMP @ IGN = [[2, 0], [0, 0.2]]

  // the composite map at time t: IDENT -> AMP -> AMP @ IGN -> W1T
  const ua = (t) => E.io(seg(t, CUE.amp, CUE.amp + 0.63));
  const ui = (t) => E.io(seg(t, CUE.ign, CUE.ign + 0.62));
  const um = (t) => E.io(seg(t, CUE.mix, CUE.still));
  function mapAt(t) {
    if (um(t) > 0) return EP.mlerp(AI, EP.W1T, um(t));
    if (ui(t) > 0) return EP.mlerp(EP.AMP, AI, ui(t));
    return EP.mlerp(EP.IDENT, EP.AMP, ua(t));
  }
  // a row swell: 1 -> 1.15 -> 1 over 0.45 s from t0
  const swell = (t, t0) => 1 + 0.15 * Math.sin(Math.PI * seg(t, t0, t0 + 0.45));

  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "TRAINED"); return; }
    const M = mapAt(t);
    EP.strip(P, { layers: 1 });
    // W1: the current map's digits; row 1 turns magenta on "amplify", row 2 on "ignore"
    const W1 = P.layers[0];
    EP.setLayer(W1, M);
    const lit = [seg(t, CUE.amp, CUE.amp + 0.3), seg(t, CUE.ign, CUE.ign + 0.3)];
    const sw = [Math.max(swell(t, CUE.amp), swell(t, CUE.mix + 0.1)), swell(t, CUE.ign)];
    W1.cells.forEach((row, r) => row.forEach((c) => { c.color(mix(COL.text, COL.hero, lit[r])); c.home({ scale: sw[r] }); }));
    // W2, W3 dim
    const d = E.io(seg(t, CUE.train, CUE.train + 0.6));
    P.layers.slice(1).forEach((L) => L.cells.flat().forEach((c) => c.color(mix(COL.text, COL.dim, d))));
    P.hl.rect(EP.RECT.layer(0), 1);
    // the plane: the ring through the map, then e1 and e2 at the map's rows
    EP.bg(g);
    const done = EP.centre(g);
    EP.ring(g, M);
    const u = E.out(seg(t, CUE.rows, CUE.rows + 0.67));
    VEC.arrow(g, [0, 0], M[0], { col: EP.BASIS, u }); VEC.arrow(g, [0, 0], M[1], { col: EP.BASIS, u });
    done();
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
