<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 11 "11_close" (master 40.340, 5.491 s): EASY -> CANON (the Short's last frame).
         VO: "Vectors hold information, matrices reshape it into the forms the model can use." -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/epT.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.491" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 5.491;
  // Cues, beat-local seconds (master 40.340 + t), from words.json, checked on a 50 ms RMS
  // envelope of vo_final.wav (speech 40.53-41.82, pause, 42.20-45.28).
  const CUE = {
    fade: 0.00,    // frame 0: the dots and the boundary fade (0.35 s) ...
    fadeEnd: 0.35,
    cam: 0.05,     //  ... while the camera goes CENTER -> MAIN, clip top 470 -> 566 (0.65 s)
    camEnd: 0.70,
    x: 0.42,       // "Vectors" (0.20-0.50), as the camera settles: x draws off-white and `x [ 3, 2 ]` fades into the strip
    xEnd: 0.98,
    hold: 0.92,    // "hold information" (0.50-1.38, "information" 0.82): x and its numbers pulse teal (0.5 s)
    mat: 1.88,     // "matrices" (1.94): `W (2, 2)`, e1 and e2 (at home) fade in; a magenta box on W
    matEnd: 2.30,
    swing: 2.32,   // "reshape it" (2.32-3.20): e1, e2 swing to W's rows with the lattice; x rides
    swingEnd: 3.52, //  VEC.map(X, s) to (2, 4), turning magenta; a muted ghost stays at (3, 2) (1.2 s)
    still: 4.05,   // CANON, nothing moves after this ("into the forms the model can use", last 1.44 s)
  };
  const { COL, css, seg, lerp, mix, clamp01 } = ISO;
  const E = ISO.E();
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const P = EP.parts(root);
  ISO.guides(root);
  const lerpView = (A, B, u) => ({ step: lerp(A.step, B.step, u), ox: lerp(A.ox, B.ox, u), oy: lerp(A.oy, B.oy, u),
    ax: Object.fromEntries(Object.keys(A.ax).map((d) => [d, lerp(A.ax[d], B.ax[d], u)])), top: lerp(A.top, B.top, u) });
  // local helper: EP.plane's drawing order, with EASY's classes (fading) on the plane and x riding the map.
  // o: view, cls (classes + boundary alpha), s (swing), lattice, ghosts, xGhost (muted x at (3, 2)),
  // e (e1, e2 alpha), xA, xCol, xS (x at VEC.map(X, xS)).
  function scene(o) {
    const Bs = VEC.basisTo(VEC.I2, EP.W, o.s);
    EP.bg(g);
    VEC.view(o.view);
    g.save(); EP.clip(g, EP.PLANE_CLIP(o.view));
    EP.grid(g, 0.42 * lerp(1, 0.33, clamp01(o.lattice / 0.35)));
    if (o.lattice) VEC.lattice(g, Bs, { alpha: o.lattice });
    VEC.axes(g);
    if (o.cls > 0.001) EP.classes(g, EP.EASY, { alpha: o.cls, line: 1 });
    if (o.ghosts) { VEC.arrow(g, [0, 0], [1, 0], { col: COL.muted, alpha: o.ghosts }); VEC.arrow(g, [0, 0], [0, 1], { col: COL.muted, alpha: o.ghosts }); }
    if (o.xGhost) VEC.arrow(g, [0, 0], EP.X, { col: COL.muted, alpha: o.xGhost });
    if (o.e > 0.001) { VEC.arrow(g, [0, 0], Bs[0], { col: VEC.SLOT[0], alpha: o.e }); VEC.arrow(g, [0, 0], Bs[1], { col: VEC.SLOT[1], alpha: o.e }); }
    if (o.xA > 0.001) VEC.arrow(g, [0, 0], VEC.map(EP.X, EP.W, o.xS), { col: o.xCol, alpha: 1, u: o.xA });
    VEC.puck(g, 0, 0, { half: 12 });
    g.restore();
  }
  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "CANON"); return; }          // the last frame, nothing on top
    const cam = E.io(seg(t, CUE.cam, CUE.camEnd));
    const xu = E.out(seg(t, CUE.x, CUE.xEnd));                         // x draws; its strip numbers fade in
    const pulse = Math.sin(Math.PI * seg(t, CUE.hold, CUE.hold + 0.5)); // teal pulse on "hold information"
    const wa = E.out(seg(t, CUE.mat, CUE.matEnd));                     // W, e1, e2 arrive
    const s = E.io(seg(t, CUE.swing, CUE.swingEnd));
    const box = seg(t, CUE.mat, CUE.mat + 0.2) * (1 - seg(t, CUE.swing + 0.1, CUE.swing + 0.4));   // magenta box on W, gone as x takes the hero
    const hero = E.io(seg(t, CUE.swing + 0.2, CUE.swingEnd));        // x turns magenta as it rides
    // DOM: the strip
    EP.strip(P, { x: xu, w: wa });
    P.xc.forEach((c, i) => { c.home({ alpha: xu, scale: 1 + 0.12 * pulse }); c.color(mix(VEC.SLOT[i], COL.data, pulse)); });
    P.xb.color(mix(COL.dim, COL.data, pulse));
    P.hl.rect(EP.RECT.W(), box);
    // canvas
    scene({
      view: lerpView(EP.CENTER, EP.MAIN, cam), cls: 1 - E.io(seg(t, CUE.fade, CUE.fadeEnd)),
      s, lattice: 0.35 * s, ghosts: seg(s, 0, 0.15), xGhost: 0.35 * seg(s, 0, 0.15), e: wa,
      xA: xu, xS: s, xCol: mix(mix(COL.text, COL.data, pulse), COL.hero, hero),
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
