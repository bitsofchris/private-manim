<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 7 (07_attention): DOT -> ATTN. "Attention scores are dot products between queries and keys of your tokens." -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/epT.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.21" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.21;
  // Cues, beat-local seconds (master 23.490 + t), from words.json checked on a 50 ms RMS envelope.
  // Speech: 0.16-0.57 "Attention", 0.57-0.93 "scores", 1.26-1.81 "dot products", 1.85-2.15 "between",
  // 2.26-2.56 "queries", 2.56-2.75 "and", 2.81-3.11 "keys", 3.16-3.46 "of your", 3.51-3.81 "tokens", tail to ~3.9.
  const CUE = {
    out: 0.00,      // frame 0 (before "Attention" 0.16): b, its label and the readout fade (0.00-0.45)
    relabel: 0.20,  // "Attention": a's tip label "a" hands over to "q" (0.20-0.55)
    strip: 0.50,    // "scores" (24.06): `q · k` and the three token words fade in (0.50-0.90)
    query: 2.24,    // "queries" (25.75 on the envelope): q pulses (0.45 s)
    keys: 2.56,     // "and keys" (26.04-26.60): the three keys draw from the origin, gold (0.58 s)
    light: [3.14, 3.34, 3.54],   // "of your tokens" (26.65-27.30): each key lights as its score pops (the, cat, sat)
    still: 3.81,    // nothing moves after this: ATTN exactly (0.40 s)
  };
  const { COL, css, mix, seg } = ISO;
  const { SLOT } = VEC;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const pulse = (t, t0, d) => Math.sin(Math.PI * seg(t, t0, t0 + d));
  // scores pop from 1.3 to 1 on purpose
  P.scores.forEach((c) => c.el.setAttribute("data-layout-allow-overlap", ""));
  // a hands its tip over to q (a cross-fade)
  [P.tip.a, P.tip.q].forEach((el) => el.setAttribute("data-layout-allow-overlap", ""));

  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "ATTN"); return; }
    if (t <= 0) { EP.state(P, g, "DOT"); return; }
    const bOut = 1 - E.io(seg(t, CUE.out, CUE.out + 0.45));
    const rl = E.io(seg(t, CUE.relabel, CUE.relabel + 0.35));
    const sIn = E.io(seg(t, CUE.strip, CUE.strip + 0.4));
    const qp = pulse(t, CUE.query, 0.45);
    const kU = E.out(seg(t, CUE.keys, CUE.keys + 0.58));
    const lit = CUE.light.map((c) => seg(t, c, c + 0.26));
    // per key: 0..1 toward the light colour; cat's stays on, the others go back
    const keyK = lit.map((k, i) => (i === EP.BEST ? E.out(k) : Math.sin(Math.PI * k)));
    const keyCol = keyK.map((k, i) => mix(EP.GOLD, i === EP.BEST ? COL.hero : COL.text, k));

    // the strip: the readout fades out, `q · k` and the tokens fade in; the scores pop in turn
    EP.strip(P, { dot: bOut, scores: sIn });
    P.dotVal.set("−5");
    P.scores.forEach((c, i) => {
      const k = E.out(lit[i]);
      c.at(380 + i * 190, EP.ROW_TOP, { alpha: k, scale: 1.3 - 0.3 * k });
    });
    // the canvas
    EP.bg(g);
    const done = EP.centre(g);
    if (bOut > 0.001) VEC.arrow(g, [0, 0], EP.bAt(1), { col: SLOT[1], alpha: bOut });
    EP.KEYS.forEach((k, i) => VEC.arrow(g, [0, 0], k, { col: keyCol[i], u: kU }));
    VEC.arrow(g, [0, 0], EP.Q, { col: mix(SLOT[0], COL.text, 0.45 * qp), width: 44 * (1 + 0.35 * qp), head: 90 * (1 + 0.2 * qp) });
    done();
    // tip labels: b goes, a hands over to q, the keys come with their arrows
    EP.tipLabel(P.tip.b, EP.bAt(1), -50, -40, bOut);
    EP.tipLabel(P.tip.a, EP.A, 50, -40, 1 - rl);
    EP.tipLabel(P.tip.q, EP.Q, 55, 10, rl);
    P.tip.q.style.transform += ` scale(${(1 + 0.3 * qp).toFixed(4)})`;
    EP.KEYS.forEach((k, i) => {
      EP.tipLabel(P.tip.keys[i], k, EP.KEY_DX[i][0], EP.KEY_DX[i][1], seg(kU, 0.6, 1));
      P.tip.keys[i].style.color = css(keyCol[i]);
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
