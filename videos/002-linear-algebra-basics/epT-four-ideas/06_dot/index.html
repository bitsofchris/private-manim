<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 6 (06_dot): CODE -> DOT. "A dot product measures alignment." -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/epT.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.45" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 2.45;
  // Cues, beat-local seconds (master 21.040 + t), from words.json checked on a 50 ms RMS envelope.
  // Speech: 0.16-0.31 "A", 0.41-0.61 "dot", 0.71-1.06 "product", 1.18-1.56 "measures", 1.58-2.06 "alignment", tail to ~2.2.
  const CUE = {
    fade: 0.00,     // frame 0: CODE's strip, card and MAIN plane fade; CENTER fades in (0.00-0.60)
    fadeEnd: 0.60,
    a: 0.36,        // "dot" (21.45 on the envelope): a draws from the origin (teal)
    b: 0.62,        // "product" (21.75): b draws over a, aligned (blue); "a · b = 5" fades in
    turn: 1.04,     // "measures" (22.16; voiced from 22.25): b turns from aligned to opposed, 5 -> 0 -> −5
    turnEnd: 2.05,  // "alignment" ends (23.10); b opposed
    still: 2.05,    // nothing moves after this: DOT exactly (0.40 s)
  };
  const { COL, css, seg } = ISO;
  const { fmtv, SLOT } = VEC;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const CODE_PLANE = { s: 1, e: 1, ghosts: 1, lattice: 0.35, xA: 0.35, xCol: COL.muted, nu: 1, out: 1 };   // epT.js state CODE's plane
  // local helper: b's tip label rides round the tip with b, landing on the DOT offset (-50, -40) at u = 1
  function bLabel(th, alpha) {
    const f = th - Math.PI, c = Math.cos(f), s = Math.sin(f), o = [-50, -40];
    EP.tipLabel(P.tip.b, EP.rot(EP.A, th), o[0] * c + o[1] * s, -o[0] * s + o[1] * c, alpha);
  }

  function render(t) {
    if (t >= CUE.still) { EP.state(P, g, "DOT"); return; }
    if (t <= 0) { EP.state(P, g, "CODE"); return; }
    const k = E.io(seg(t, CUE.fade, CUE.fadeEnd)), out = 1 - k;
    const aU = E.out(seg(t, CUE.a, CUE.a + 0.4)), bU = E.out(seg(t, CUE.b, CUE.b + 0.4));
    const u = E.io(seg(t, CUE.turn, CUE.turnEnd)), th = EP.B_TURN[0] + (EP.B_TURN[1] - EP.B_TURN[0]) * u, b = EP.bAt(u);
    const rd = E.out(seg(t, CUE.b + 0.1, CUE.b + 0.4));
    // the strip: CODE's parts fade, the readout comes in
    EP.strip(P, { x: out, w: out, beat5: out, card: out, dot: rd });
    P.dotVal.set(fmtv(Math.round(EP.dot(EP.A, b)) || 0));
    // the canvas: MAIN out, CENTER in
    EP.bg(g);
    if (out > 0.001) EP.plane(g, Object.assign({}, CODE_PLANE, { alpha: out }));
    const done = EP.centre(g, { alpha: k });
    VEC.arrow(g, [0, 0], EP.A, { col: SLOT[0], u: aU });
    VEC.arrow(g, [0, 0], b, { col: SLOT[1], u: bU });
    done();
    EP.tipLabel(P.tip.a, EP.A, 50, -40, aU);
    bLabel(th, bU);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
