<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep09 beat 2 (02_dot): CANON -> DOT. "Now, all three start from the same thing: the dot
         product, alignment with the length still in it." Hero: the dot value. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep09.js"></script>
    <style>
      :root { --bg: #0B0B14; --panel: #14142B; --text: #ECEBE4; --dim: #8A8FB0; --data: #2DD4BF; --hero: #C084FC; --muted: #4A5070; }
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg);
              font-family: "Inter", sans-serif; font-weight: 800; color: var(--text); }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.8" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 4.80;
  // Cues, beat-local = master - 9.02, from words.json; onsets checked on a 20 ms RMS envelope of
  // vo_final.wav ("Now" 9.22, "The dot" 10.98, "alignment" 12.12, "the length" 12.74).
  const CUE = {
    now: 0.00,      // "Now, all three" (9.24): the three values pulse in turn from frame 0
    start: 0.72,    // "start (from the same thing)": drop line and shadow fade, proj value off-white
    dot: 2.02,      // "dot (product)": dot value magenta, replaced by 1.5 × 2 + 2 × 0
    back: 2.82,     // the derivation collapses back to 3 before "alignment"
    align: 3.10,    // "alignment": the arc brightens to off-white and back
    length: 3.82,   // "length (still in it)": |u| = 2.5 and |v| = 2 fade on
    still: 4.42,    // nothing moves after this: DOT exactly
  };
  const PULSE = 0.4, PULSE_GAP = 0.25;      // each value's pulse, and the stagger dot -> cos -> proj
  const { seg, lerp, mix, COL } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);

  // local helper: EP.plane with the arc's colour exposed (o.arcCol); the kit's plane fixes it to dim
  function plane(g, o = {}) {
    const u = o.u || EP.U, v = o.v || EP.V, p = EP.shadowOf(u, v);
    VEC.view(o.view || EP.PLANE);
    VEC.floor(g, { alpha: 0.42 });
    VEC.axes(g, {});
    EP.arc(g, u, v, { alpha: 1, col: o.arcCol });
    VEC.arrow(g, [0, 0], v, { col: EP.VCOL, width: 40 });
    VEC.arrow(g, [0, 0], u, { col: EP.UCOL, width: 40 });
    if ((o.dropA == null ? 0.9 : o.dropA) > 0.001) EP.drop(g, u, p, { u: 1, alpha: o.dropA });
    EP.shadow(g, p, { u: 1, alpha: o.shA == null ? 1 : o.shA });
    VEC.puck(g, 0, 0);
  }
  // local helper: a value replaced in place by another (fade and shrink out, fade and grow in)
  function swap(t, t0, a, b, dur = 0.3) {
    const k = seg(t, t0, t0 + dur);
    if (k < 0.5) { const q = E.io(k * 2); return { text: a, alpha: 1 - q, scale: 1 - 0.12 * q }; }
    const q = E.io(k * 2 - 1); return { text: b, alpha: q, scale: 0.88 + 0.12 * q };
  }
  const bump = (t, t0, dur) => Math.sin(Math.PI * seg(t, t0, t0 + dur));   // 0 -> 1 -> 0

  function render(tt) {
    const t = Math.min(tt, CUE.still);
    EP.state(P, null, "CANON");                                   // DOM base: readouts, boxes and cards off

    // "start from the same thing": the shadow and drop line go, the proj value returns to off-white
    const kf = E.io(seg(t, CUE.start, CUE.start + 0.68));
    // "the dot product": the dot value is the hero
    const kd = E.io(seg(t, CUE.dot, CUE.dot + 0.3));
    // "alignment": arc brightens and back
    const ka = E.io(seg(t, CUE.align, CUE.align + 0.3)) * (1 - E.io(seg(t, CUE.align + 0.6, CUE.align + 0.9)));
    // "with the length": length labels on
    const kl = E.io(seg(t, CUE.length, CUE.length + 0.6));

    EP.bg(g);
    plane(g, { dropA: 0.9 * (1 - kf), shA: 1 - kf, arcCol: mix(COL.dim, COL.text, ka) });
    EP.labels(P, { lens: kl });

    // readouts: one pulse each in turn, then the dot derivation
    EP.ROWS.forEach((k, i) => {
      const s = 1 + 0.18 * bump(t, CUE.now + i * PULSE_GAP, PULSE);
      let col = COL.text;
      if (k === "proj") col = mix(COL.hero, COL.text, kf);
      if (k === "dot") col = mix(COL.text, COL.hero, kd);
      if (k !== "dot") { EP.row(P, k, { col, scale: s }); return; }
      let sw = { text: EP.VAL.dot, alpha: 1, scale: 1 };
      if (t >= CUE.dot) sw = t < CUE.back ? swap(t, CUE.dot, EP.VAL.dot, EP.DERIV.dot) : swap(t, CUE.back, EP.DERIV.dot, EP.VAL.dot);
      EP.row(P, k, { col, text: sw.text, scale: s * sw.scale });
      P.rows.dot.val.style.opacity = sw.alpha.toFixed(3);
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
