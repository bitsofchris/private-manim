<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep09 beat 1, the hook: CANON in motion (the shadow falling, the values ticking up), an
         off-white box walking cos -> dot -> cos -> proj with the VO, the length labels on "both
         lengths", |u| gone on "Projection", |v| pulsing on "only". Ends on CANON exactly. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="vec/vec.js"></script>
    <script src="ep/ep09.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.02" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 9.02;
  // Cues, beat-local = master (start 0.00), from words.json; onsets checked on a 20 ms RMS envelope
  // of vo_final.wav ("Cosine" 0.59, "dot" 2.32, "both" 3.55, "Projection" ~5.70, "Here's" 7.96).
  const CUE = {
    cos: 0.59,      // "Cosine (similarity)": the box rings the cos row
    dot: 2.34,      // "dot (product)": the box moves to the dot row
    both: 3.55,     // "both (lengths divided out)": |u| and |v| pop on, the box back on cos
    proj: 5.78,     // "Projection (divides out)": |u| fades, the box to the proj row
    only: 7.03,     // "only (one)": |v| pulses once
    here: 8.00,     // "Here's (when you want each)": box and |v| fade
    still: 8.60,    // nothing moves after this: CANON exactly
  };
  const DROP0 = 0.30, SHADOW0 = 0.20;      // frame 0: the drop line 30 % fallen, the shadow behind it
  const TICK0 = 0.30;                       // frame 0: the values already 30 % of the way up (dot 0.9)
  const TICK = 1.2;                         // the values reach 3, 0.6, 1.5 by here
  const MOVE = 0.6;                         // the box's row-to-row move (centred on the word)
  const BOX_W = 450;                        // narrower than rowRect's 560 so the box clears the u label
  const { seg, lerp, COL } = ISO;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const E = ISO.E();
  const P = EP.parts(root);
  ISO.guides(root);
  const tick = (v) => String(Math.round(v * 10) / 10);   // 0, 0.3 ... 1.5: one decimal, never "2.0"
  const TARGET = { dot: 3, cos: 0.6, proj: 1.5 };
  // local helper: the box's row (fractional while moving) at time t; rows 0 dot, 1 cos, 2 proj
  function boxRow(t) {
    const step = (c, from, to) => lerp(from, to, E.io(seg(t, c - MOVE / 2, c + MOVE / 2)));
    let r = 1;
    if (t > CUE.dot - MOVE / 2) r = step(CUE.dot, 1, 0);
    if (t > CUE.both - MOVE / 2) r = step(CUE.both, 0, 1);
    if (t > CUE.proj - MOVE / 2) r = step(CUE.proj, 1, 2);
    return r;
  }
  function render(t) {
    EP.state(P, g, "CANON");
    if (t >= CUE.still) return;               // the last frames are CANON, untouched
    // the finished visual working: drop line falling, shadow growing behind it
    const kd = lerp(DROP0, 1, E.out(seg(t, 0, 0.6)));
    const ks = lerp(SHADOW0, 1, E.out(seg(t, 0, 1.1)));
    EP.bg(g); EP.plane(g, { drop: kd, shadow: ks });
    const kv = lerp(TICK0, 1, E.out(seg(t, 0, TICK)));
    EP.ROWS.forEach((k) => EP.row(P, k, { text: kv >= 1 ? EP.VAL[k] : tick(TARGET[k] * kv), col: k === "proj" ? COL.hero : COL.text }));
    // the off-white box: in on "Cosine", walks with the VO, out on "Here's"
    const ba = E.out(seg(t, CUE.cos - 0.15, CUE.cos + 0.2)) * (1 - E.io(seg(t, CUE.here, CUE.here + 0.4)));
    const r = boxRow(t), i0 = Math.floor(r), i1 = Math.min(2, i0 + 1), f = r - i0;
    const a = EP.rowRect(i0, BOX_W), b = EP.rowRect(i1, BOX_W);
    P.hl.rect(a.map((x, j) => lerp(x, b[j], f)), ba, COL.text);
    // the length labels: both pop on "both"; |u| out on "Projection"; |v| pulses on "only", out on "Here's"
    const pop = seg(t, CUE.both - 0.05, CUE.both + 0.3), popS = lerp(0.6, 1, E.back(pop));
    const au = E.out(pop) * (1 - E.io(seg(t, CUE.proj, CUE.proj + 0.4)));
    const av = E.out(pop) * (1 - E.io(seg(t, CUE.here, CUE.here + 0.4)));
    const pv = 1 + 0.18 * Math.sin(Math.PI * seg(t, CUE.only, CUE.only + 0.45));
    const U = EP.U, V = EP.V;
    VEC.place(P.lab.lu, U[0] / 2, U[1] / 2, { dx: 175, dy: 50, alpha: au, scale: popS });
    VEC.place(P.lab.lv, V[0] / 2, V[1] / 2, { dx: 0, dy: 70, alpha: av, scale: popS * pv });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
