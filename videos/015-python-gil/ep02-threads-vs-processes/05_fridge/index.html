<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_fridge (015 ep 2, beat 5): SEAM2[4] -> SEAM2[5]. The timer and the wall label fade
         on "fix"; the fridge grows in on "fridge", "fridge / shared memory" on "shared memory";
         the bowl leaves counter 3 and lands on shelf 3 on "put the big tensor in once"; the
         note "shelf 3" (the hero) appears at counter 2 on "pass a note", pulses on "shelf 3",
         and rides the pipe to counter 3 on "the pipe carries the note". Still from HOLD. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.49" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 9.49;
  // beat-local seconds (master - 38.360), from words.json
  const CUE = {
    fix:    0.32,   /* "fix": the timer bar and the wall label fade */
    fridge: 1.42,   /* "fridge": the fridge grows in (starts 0.2 s early) */
    shared: 2.00,   /* "shared memory": the fridge label */
    tensor: 3.72,   /* "tensor": the bowl leaves counter 3 */
    in:     4.04,   /* "in (once)": the bowl lands on shelf 3 */
    pass:   4.66,   /* "pass (a note)": the note appears at counter 2, the hero */
    shelf:  5.52,   /* "shelf": the note pulses */
    three:  5.80,   /* "3": the shelf number goes magenta */
    pipe:   6.64,   /* "pipe (carries the note)": the note travels counter 2 -> pipe -> counter 3 */
  };
  const HOLD = 9.19;               // still from here: SEAM2[5] exactly
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM2[4], B = SC.SEAM2[5];
  const { seg, io, lerp, pulse } = SC;
  function render(t) {
    if (t >= HOLD) { kit.draw(null, SC.state(B, { chop: 0 })); return; }
    const bowlGone = seg(t, CUE.tensor, CUE.tensor + 0.3);           // the counter bowl fades out
    const noteO = seg(t, CUE.pass, CUE.pass + 0.2) * (1 - 0.4 * pulse(t, CUE.shelf, 0.3));   // appears, then dips to 0.6 and back
    const note = io(seg(t, CUE.pipe, CUE.pipe + 0.9));
    const S = SC.state(A, {
      timer: { o: 1 - seg(t, CUE.fix, CUE.fix + 0.3), fill: 0.55 },
      wall: { lab: 1 - seg(t, CUE.fix, CUE.fix + 0.3), bowlO: 1 - bowlGone, bowl: bowlGone >= 1 ? 0 : 1 },
      fridge: {
        o: seg(t, CUE.fridge - 0.2, CUE.fridge + 0.1),
        lab: seg(t, CUE.shared, CUE.shared + 0.2),
        bowl: seg(t, CUE.in, CUE.in + 0.3),
        noteO, noteHero: 1,
        note: note > 0 ? note : (t >= CUE.three ? 0.001 : 0),         // note > 0 is what turns the "3" magenta
      },
      chop: 0,
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
