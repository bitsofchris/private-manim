<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_recap: "The part people often miss is what an additional process actually costs.
         Think of a process as a full kitchen. Threads are its cooks, the GIL is one knife."
         SEAM2[1] -> SEAM2[2]: the price tag on kitchen 2, then the rebuild back to one full
         kitchen (cook 1 takes the knife), slot "cooks / threads" then "knife / GIL". -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.89" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 7.89;
  // Beat-local cues (master - 6.160), from words.json.
  const CUE = {
    process: 2.00,  /* "process" (additional process): the two close lines fade out */
    costs:   2.74,  /* "costs": the magenta price tag hangs on kitchen 2 */
    kitchen: 4.70,  /* "kitchen" (a full kitchen): the rebuild ends, kitchen 1 full size, cook 1 holds the knife */
    cooks:   5.98,  /* "cooks": slot "cooks / threads", cooks 2-4 pulse */
    knife:   7.16,  /* "knife" (one knife): slot "knife / GIL", cook 1 chops once */
  };
  const HOLD = 7.59;                      // still from here (SEAM2[2] exactly)
  const REBUILD = 0.6, T = { start: 4.10, snap: 4.40, hand: 4.40 };   // 4.10 -> 4.70: tag and twin out, panel unsplits, kitchen grows back;
  const SWAP_OUT = 0.15, SWAP_IN = 0.2;   // the slot swap: fade out, change the text, fade in landing on the word
  const NEW_ROW = [[{ a: 0, b: 0.3, k: "py" }], [], [], []];   // Thread 1 has the knife

  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM2[1], B = SC.SEAM2[2];
  const { seg, io, lerp } = SC;

  // the slot: nothing until "cooks" lands, then cooks / threads, then knife / GIL landing on "knife"
  function slotAt(t) {
    const mid = CUE.knife - SWAP_IN, out = mid - SWAP_OUT;
    if (t < CUE.cooks - SWAP_IN) return { o: 0 };
    if (t < out) return SC.merge(SC.SLOT.cooks, { o: seg(t, CUE.cooks - SWAP_IN, CUE.cooks) });
    if (t < mid) return SC.merge(SC.SLOT.cooks, { o: 1 - seg(t, out, mid) });
    return SC.merge(SC.SLOT.knife, { o: seg(t, mid, CUE.knife) });
  }
  function render(t) {
    if (t >= HOLD) { kit.draw(null, SC.state(B, { chop: 0 })); return; }
    const closeO = 1 - seg(t, CUE.process - 0.2, CUE.process);
    const tagO = seg(t, CUE.costs - 0.2, CUE.costs) * (1 - seg(t, T.start, T.start + 0.2));
    const split = 1 - io(seg(t, T.start, CUE.kitchen));          // the panel unsplits as the kitchen grows back
    const half = 1 - io(seg(t, T.start, CUE.kitchen));
    const hand = io(seg(t, T.hand, CUE.kitchen));                // the knife hops from cook 2 to cook 1, cook 1 unfolds, cook 2 folds
    const snapped = t >= T.snap;                                 // fresh carrots for cooks 2 and 3 while the kitchen is in motion
    const walk = seg(t, T.start, T.start + 0.5);                 // cook 4 walks from the appliance to the counter
    const pulse = 0.4 * SC.pulse(t, CUE.cooks, 0.4);             // cooks 2-4 unfold a little on "cooks"
    const open = SC.chopAt(t, 0.2, CUE.process - 0.2, 2);        // both holders keep chopping from beat 1 until the close lines fade
    // the new Thread 1 row grows in from nothing once the split is past its midpoint; the split rows show until then
    const rows = split >= 0.5 ? SC.CLOSE_ROWS : [[{ a: 0, b: 0.3 * seg(1 - split, 0.5, 1), k: "py" }], [], [], []];
    const S = SC.state(A, {
      K: { half },
      close: { a: closeO, b: closeO },
      tag: { o: tagO },
      twin: { o: 1 - seg(t, T.start, T.start + 0.2), chop: open },
      panel: { split, rows: rows[0].length && rows[0][0].b <= 0 ? [[], [], [], []] : rows },
      panel2: { rows: split >= 0.5 ? SC.CLOSE_ROWS2 : [[], [], [], []] },
      knife: { holder: lerp(1, 0, hand) },
      slot: slotAt(t),
      cooks: [                                                   // arrays replace, so carry A's cooks
        { ...A.cooks[0], wait: 1 - hand },
        { ...A.cooks[1], wait: hand - (hand >= 1 ? pulse : 0), cut: snapped ? 0.5 : 1 },
        { ...A.cooks[2], wait: 1 - pulse, cut: snapped ? 0.5 : 0.8 },
        { ...A.cooks[3], at: walk >= 1 ? "counter" : "appl", u: walk >= 1 ? 1 : 1 - walk, wait: seg(t, T.snap, CUE.kitchen) - pulse },
      ],
      chop: open + SC.chopAt(t, CUE.knife, HOLD, 2),     // cook 2 at the open, one stroke by cook 1 on "knife"
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
