<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_recap (6.160, 7.890 s): SEAM2[1] -> SEAM2[2]. Cook 3 and the row cooks keep chopping;
         the price tag grows in on the row on "costs" (the only new element); the kitchen, cooks
         and knife labels pulse on their words. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.89" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 7.89;
  const HOLD = 7.59;                 // still from here
  const STROKE = 0.5;
  const LAST_STROKE = Math.floor(HOLD / STROKE) * STROKE;   // 7.50: strokes end on a phase-0 boundary before HOLD
  const PULSE = 0.3;
  const TAG_IN = 0.25;               // the price tag grows in over 0.25 s
  const CUE = {
    costs: 2.74,     /* "costs."   the price tag grows in on the row */
    kitchen: 4.70,   /* "kitchen." kitchen / process pulses ("process as a full kitchen") */
    cooks: 5.98,     /* "cooks,"   cooks / threads pulses */
    knife: 7.16,     /* "knife."   knife / GIL pulses; done by 7.46 < HOLD */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const S1 = SC.SEAM2[1];
  const dip = (t, at, depth) => 1 - depth * SC.pulse(t, at, PULSE);
  // local helper: the kit only fades the tag (tag.o); scale it about its centre so it grows in
  const tagGrow = (u) => { const s = SC.lerp(0.4, 1, SC.io(u)); kit.tag.setAttribute("transform", kit.tag.getAttribute("transform") + ` translate(95 40) scale(${s}) translate(-95 -40)`); };
  function render(t) {
    const chop = t < LAST_STROKE ? (t % STROKE) / STROKE : 0;
    const tagU = SC.seg(t, CUE.costs, CUE.costs + TAG_IN);
    const S = SC.state(S1, {
      chop,
      tag: { o: tagU },
      K: { lab: S1.K.lab * dip(t, CUE.kitchen, 0.5) },
      cooksLab: S1.cooksLab * dip(t, CUE.cooks, 0.5),
      knife: { lab: S1.knife.lab * dip(t, CUE.knife, 0.5) },
    });
    kit.draw(null, S);
    tagGrow(tagU);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
