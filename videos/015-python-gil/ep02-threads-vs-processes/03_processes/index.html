<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 03_processes (015 ep 2, 14.050 s, 10.470 s): SEAM2[2] -> SEAM2[3].
         "Multiprocessing builds more kitchens. Each process has its own interpreter and its own
         GIL, so Python actually runs in parallel. PyTorch's data loader workers are new processes."
         The big move: on "builds" the price tag, the close lines and the one kitchen fade while the
         small row rises and grows into the kitchen's place (row.big 0 -> 1, 0.9 s). The row label
         lands on "kitchens", the four knives go magenta as one group on "GIL", all four cooks chop
         from "runs", the DataLoader card lands on "data". Still from HOLD. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.47" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 10.47;
  // beat-local cues (master - 14.050), from words.json
  const CUE = {
    builds: 0.89,     /* "builds": the tag and close lines are gone, the kitchen fades, the row rises */
    kitchens: 1.37,   /* "kitchens": the row label "kitchens / processes" ramps in */
    gil: 4.81,        /* "GIL": the four knives go magenta as one group */
    runs: 6.39,       /* "runs": all four row cooks chop, a stroke every 0.5 s */
    data: 8.25,       /* "data": the DataLoader(ds, num_workers=4) card ramps in */
    HOLD: 10.17,      /* still from here: the hold into beat 4 */
  };
  const RISE = 0.9;      // the row's move the viewer tracks (>= S.BEAT)
  const FADE_K = 0.5;    // the one kitchen (and its labels) fade
  const RAMP = 0.2;      // a label / card ramp
  const STROKE = 0.5;    // one chop stroke
  const N_STROKES = Math.floor((CUE.HOLD - CUE.runs) / STROKE);   // 7: the last stroke ends at 9.89, before HOLD

  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM[2], B = SC.SEAM[3];
  const { seg, io, lerp, clamp01 } = SC;

  // a colour lerp for the knives' group swap (the kit's row.hero is a switch)
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const INK = hex(SC.PAL.ink), HERO = hex(SC.PAL.hero);
  const mixHex = (u) => "#" + INK.map((a, i) => Math.round(lerp(a, HERO[i], u)).toString(16).padStart(2, "0")).join("");

  function render(t) {
    const kFade = seg(t, CUE.builds, CUE.builds + FADE_K);                 // 0 -> 1: the kitchen going
    const gone = seg(t, CUE.builds - RAMP, CUE.builds);                    // the tag and the close lines, gone by "builds"
    const big = io(seg(t, CUE.builds, CUE.builds + RISE));
    const heroU = seg(t, CUE.gil, CUE.gil + RAMP);
    // chop phase: strokes from "runs", N_STROKES of them, 0 at and after HOLD
    let chop = 0;
    if (t >= CUE.runs && t < CUE.runs + N_STROKES * STROKE) chop = ((t - CUE.runs) / STROKE) % 1;
    // Base A (the kitchen with every label, cook 2 at the oven, cook 4 at the appliance) while the kitchen is
    // still visible; base B once it is gone, so S(end) is SEAM2[3] field for field.
    const base = kFade < 1 ? A : B;
    const S = SC.state(base, {
      K: { o: 1 - kFade },
      tag: { o: 1 - gone },
      close: { o: 1 - gone },
      row: { o: 1, big, lab: seg(t, CUE.kitchens, CUE.kitchens + RAMP), hero: heroU > 0 ? 1 : 0, chop: 1 },
      code: { o: seg(t, CUE.data, CUE.data + RAMP), text: "loader" },
      chop,
    });
    kit.draw(null, S);
    // the knives' swap blends ink -> magenta over RAMP (the kit snaps)
    if (heroU > 0 && heroU < 1) {
      const c = mixHex(heroU);
      kit.rowKnives.forEach((k) => Array.from(k.querySelectorAll("*")).forEach((el, i) => {
        if (i === 0) { el.setAttribute("fill", c); el.setAttribute("stroke", c); } else el.setAttribute("stroke", c);
      }));
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
