<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 04_cost (015 ep 2, beat 4): SEAM2[3] -> SEAM2[4]. The code card fades and the knives
         go ink on "cost"; the wall and pipe grow in between kitchens 2 and 3 and the bowl
         appears on counter 2 on "don't share counter space"; "wall / separate memory" on
         "memory"; the pickle box draws on "pickled"; the boxed bowl rides the pipe on "pushed
         through a pipe"; the box fades on "unpickled"; the timer appears on "big array" and
         fills only to 0.55 by "compute". The row cooks are still throughout. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="13.84" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 13.84;
  // beat-local seconds (master - 24.520), from words.json
  const CUE = {
    cost: 0.46,       /* "cost": code card fades, knives go ink, cooks stop */
    dont: 2.10,       /* "don't" (share counter space): wall + pipe grow in */
    share: 2.56,      /* "share": the bowl appears on counter 2 */
    memory: 5.70,     /* "memory": "wall / separate memory" lands */
    pickled: 8.92,    /* "pickled": the box draws around the bowl */
    pushed: 9.40,     /* "pushed" (through a pipe): the boxed bowl travels, 1.0 s */
    unpickled: 10.18, /* "unpickled": the box fades */
    big: 11.48,       /* "big" (array): the timer bar appears */
    copy: 12.04,      /* "copy": the bar starts filling */
    compute: 13.26,   /* "compute": the bar stops at 0.55 */
  };
  const HOLD = 13.54;   // from here the last frame is SEAM2[4] exactly
  const RAMP = 0.2;

  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM[3], B = SC.SEAM[4];
  const { seg, io, lerp } = SC;

  function render(t) {
    if (t >= HOLD) { kit.draw(null, B); return; }
    const S = SC.state(A, {
      chop: 0,
      code: { o: 1 - seg(t, CUE.cost, CUE.cost + 0.3) },
      row: { hero: 1 - seg(t, CUE.cost, CUE.cost + RAMP), chop: 1 - seg(t, CUE.cost, CUE.cost + 0.3) },
      wall: {
        o: seg(t, CUE.dont, CUE.dont + 0.3),
        bowlO: seg(t, CUE.share, CUE.share + RAMP),
        lab: seg(t, CUE.memory - RAMP, CUE.memory),
        boxed: seg(t, CUE.pickled, CUE.pickled + 0.25) * (1 - seg(t, CUE.unpickled, CUE.unpickled + 0.25)),
        bowl: io(seg(t, CUE.pushed, CUE.pushed + 1.0)),
      },
      timer: { o: seg(t, CUE.big, CUE.big + RAMP), fill: 0.55 * io(seg(t, CUE.copy, CUE.compute)) },
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
