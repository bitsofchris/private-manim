<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_close: 015 ep 2, beat 6 (SEAM2[5] -> SEAM2[6]). The panel fades on "Think", knives go
         magenta again and both holders chop; the three close lines land where the panel was on
         "threads", "processes", "memory". Last frame = the end of the Short. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.694" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 10.694;
  // Cues: beat-local seconds (master - 47.850), from words.json.
  const CUE = {
    think: 0.29,      /* "Think": panel + slot fade out, note dims, knives magenta, chop starts */
    threads: 1.95,    /* "threads." : close.a lands */
    processes: 5.51,  /* "processes." : close.b lands */
    memory: 9.81,     /* "memory." : close.c lands, chop stops; HOLD */
  };
  const RAMP = 0.2;                   // a close line grows in over 0.2 s, landing on its word
  const HOLD = 9.81;                  // still from here to the end
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM2[5];
  function render(t) {
    const fade = SC.seg(t, 0, CUE.think);                 // panel / slot out, note 1 -> 0.5, ending on "Think"
    const hero = t >= CUE.think ? 1 : 0;                  // knives magenta again (snap on "Think")
    const chop = SC.chopAt(t, CUE.think, CUE.memory, 2);  // both holders, 0 at both ends
    const S = SC.state(A, {
      panel: { o: 1 - fade },
      slot: { o: 1 - fade },
      note: { o: SC.lerp(1, 0.5, fade) },
      knife: { hero },
      twin: { knife: { hero }, chop },
      chop,
      close: {
        panel: t > 0 ? 1 : 0,                             // the lines sit where the panel was (from the first frame after the cut)
        a: SC.seg(t, CUE.threads - RAMP, CUE.threads),
        b: SC.seg(t, CUE.processes - RAMP, CUE.processes),
        c: SC.seg(t, CUE.memory - RAMP, CUE.memory),
      },
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
