<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_layout: the prototype frames for 015 ep 2 on kit v2. Not in the Short. Cycles
         SC.PROTO2 (the seam states of SC.SEAM2 plus the moments between them) one second
         each (frame k at k..k+1 s), knives chopping for the first half of each second. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 14;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  ISO.guides(root);
  function render(t) {
    const k = Math.min(SC.PROTO2.length - 1, Math.floor(t));
    const u = t - k, chop = u < 0.5 ? u * 2 : 0;
    const S = SC.state(SC.PROTO2[k], { chop, twin: { chop }, k3: { chop }, k4: { chop } });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
