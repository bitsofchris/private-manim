<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_hook (0.000, 6.160 s): SEAM2[0] -> SEAM2[1]. Ep 1's close with the small row real.
         Cook 3 and the four row cooks chop from frame 0 (a stroke every 0.5 s, phase 0 at
         both seams); the labels pulse on their words. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.16" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM2;
  const BEAT_SECONDS = 6.16;
  const HOLD = 5.86;                 // "do." — still from here
  const STROKE = 0.5;                // one chop stroke
  const LAST_STROKE = Math.floor(HOLD / STROKE) * STROKE;   // 5.50: strokes end on a phase-0 boundary before HOLD
  const PULSE = 0.3;                 // a label pulse: lab 1 -> 0.5 -> 1
  const CUE = {
    threads: 1.20,   /* "threads"    cooks / threads pulses */
    waiting: 2.08,   /* "waiting"    oven / I/O pulses */
    processes: 3.42, /* "processes"  the small row dips to 0.6 and back */
    cpu: 4.50,       /* "CPU"        knife / GIL pulses ("CPU work in Python") */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const S0 = SC.SEAM2[0];
  const dip = (t, at, depth) => 1 - depth * SC.pulse(t, at, PULSE);
  function render(t) {
    const chop = t < LAST_STROKE ? (t % STROKE) / STROKE : 0;
    const S = SC.state(S0, {
      chop,
      cooksLab: S0.cooksLab * dip(t, CUE.threads, 0.5),
      oven: { lab: S0.oven.lab * dip(t, CUE.waiting, 0.5) },
      row: { o: S0.row.o * dip(t, CUE.processes, 0.4) },
      knife: { lab: S0.knife.lab * dip(t, CUE.cpu, 0.5) },
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
