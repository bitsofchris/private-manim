<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_appliance (32.300, 3.580 s): SEAM1[4] -> SEAM1[5]. "Same for an appliance. Think of NumPy, image decoding, a
         tokenizer." Cook 2, back from the oven with the knife, chops the whole beat and Thread 2's magenta bar grows on
         (the round trip's second half). On "appliance" the food processor fades in, cook 4 unfolds and walks to it; when it
         arrives Thread 4's teal bar grows; three chips on their words. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block; src: url("vendor/Inter-ExtraBold.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.58" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.58;
  const HOLD = 3.28;                                   // still from here: SEAM1[5] exactly
  // Beat-local cues (master - 32.300), from words.json.
  const CUE = {
    appl:   0.66,  /* "appliance." */
    arrive: 1.26,  /* "Think": cook 4 reaches the appliance, Thread 4's bar starts */
    numpy:  1.52,  /* "NumPy," */
    decode: 2.20,  /* "decoding," */
    token:  2.84,  /* "tokenizer." */
  };
  const CHIPS = [
    [CUE.numpy,  "np.dot(a, b)"],
    [CUE.decode, "Image.open(f)"],
    [CUE.token,  "tokenizer(text)"],
  ];
  const root = document.getElementById("root");
  SC.SEAM = SC.SEAM1;
  const kit = SC.mount(root);
  const { seg, io, lerp, clamp01 } = SC;

  // A label swap landing ON `at`: fade out over `out` s, change the text, fade back in over `inn` s ending at `at`.
  // Returns { o, next } where next is true once the new text should show.
  function swap(t, at, out = 0.15, inn = 0.15) {
    const t0 = at - inn - out, t1 = at - inn;
    if (t < t0) return { o: 1, next: false };
    if (t < t1) return { o: 1 - seg(t, t0, t1), next: false };
    return { o: seg(t, t1, at), next: true };
  }

  function render(t) {
    const S = SC.state(SC.SEAM1[4]);                   // a deep copy; mutate it
    // cook 2 chops the whole beat, back from the oven; Thread 2's magenta bar grows on
    S.chop = SC.chopAt(t, 0, HOLD, 2);
    S.cooks[1].cut = lerp(0.5, 0.8, seg(t, 0, HOLD));
    S.panel.rows[1][1] = { a: 0.6, b: lerp(0.64, 1, seg(t, 0, HOLD)), k: "py" };
    // "appliance": the food processor fades in, the slot swaps, cook 4 unfolds and walks to it
    S.appl.o = seg(t, CUE.appl - 0.2, CUE.appl);
    const sl = swap(t, CUE.appl, 0.15, 0.2);
    S.slot = Object.assign({}, sl.next ? SC.SLOT.appl : SC.SLOT.oven, { o: sl.o });
    S.cooks[3].wait = 1 - seg(t, CUE.appl - 0.2, CUE.appl);
    if (t >= CUE.appl) { S.cooks[3].at = "appl"; S.cooks[3].u = io(seg(t, CUE.appl, CUE.arrive)); }
    // when it arrives, Thread 4's teal bar grows
    if (t >= CUE.arrive) S.panel.rows[3] = [{ a: 0.7, b: lerp(0.7, 1, seg(t, CUE.arrive, HOLD)), k: "nat" }];
    // the chip: none at the seam, then np.dot -> Image.open -> tokenizer, each on its word
    let text = "", o = 0;
    for (const [at, s] of CHIPS) { const c = swap(t, at); if (c.next) { text = s; o = 1; } if (t >= at - 0.3 && t < at) o = text ? c.o : seg(t, at - 0.15, at); }
    S.chip.text = text; S.chip.o = o;
    if (t >= HOLD) { const E = SC.state(SC.SEAM1[5]); kit.draw(null, E); return; }
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
