<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 05_appliance: "Same for an appliance. Think of NumPy, image decoding, a tokenizer."
         SEAM1[4] -> SEAM1[5]: the appliance comes in on "appliance", cook 4 walks to it and works
         there without the knife while cook 3 chops: two cooks working at once. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.11" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM1;
  const BEAT_SECONDS = 4.11;
  const HOLD = 3.81;                    // still from here: SEAM1[5] exactly, chop 0
  const CUE = {
    appliance: 1.19,  /* "appliance": the label; the appliance itself from 0.2 s before; cook 4 sets off */
    numpy: 2.05,      /* "NumPy": cook 4 is at the appliance and working (it arrives at 1.99) */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg, io } = SC;
  const SEAM_OUT = SC.SEAM[5];
  const WALK = 0.8;
  // cook 3 chops the whole beat (carrying on from 04): a whole number of strokes by HOLD, ~2 a second
  const RATE = 8 / HOLD;
  const frac = (x) => x - Math.floor(x);
  const chopAt = (t) => (t >= HOLD ? 0 : frac(t * RATE));
  function render(t) {
    const walking = t >= CUE.appliance;
    const u4 = io(seg(t, CUE.appliance, CUE.appliance + WALK));
    const cook4 = walking ? { at: "appl", wait: 0 }
                          : { at: "counter", wait: 1 - seg(t, CUE.appliance - 0.2, CUE.appliance) };   // unfolds, then sets off
    if (walking && u4 < 1) cook4.u = u4;
    const S = SC.state(SEAM_OUT, {
      cooks: [{ at: "counter", wait: 1 }, { at: "oven", wait: 1 }, { at: "counter", wait: 0 }, cook4],
      appl: { o: seg(t, CUE.appliance - 0.2, CUE.appliance + 0.1), lab: seg(t, CUE.appliance, CUE.appliance + 0.2) },
      chop: chopAt(t),
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
