<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 01_kitchen (0.000, 7.250 s): SEAM1[0] -> SEAM1[1]. The hook: cook 1 chops from frame 0,
         "kitchen / process" pulses on "process", "cooks / threads" ramps in on "cooks". -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.25" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM1;
  const BEAT_SECONDS = 7.25;
  const CUE = {
    process: 1.78,   // "process": the kitchen label pulses once
    cooks: 4.60,     // "cooks": the "cooks / threads" label ramps in
    HOLD: 6.95,      // still from here (chop 0, SEAM1[1])
  };
  const STROKE = 0.5;                                        // one chop every 0.5 s from frame 0
  const CHOP_END = Math.floor(CUE.HOLD / STROKE) * STROKE;   // last whole stroke ends here (6.5), so chop lands on 0
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM1[0], B = SC.SEAM1[1];
  function render(t) {
    const chop = t < CHOP_END ? (t / STROKE) % 1 : 0;
    const cooksLab = SC.seg(t, CUE.cooks, CUE.cooks + 0.2);
    const kLab = 1 - 0.4 * SC.pulse(t, CUE.process, 0.3);   // dips to 0.6 and back over 0.3 s
    const S = SC.state(SC.tween(A, B, cooksLab), { K: { lab: kLab }, chop });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
