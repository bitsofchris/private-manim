<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_close (35.880, 10.210 s): SEAM1[5] -> SEAM1[6]. "But when threads don't help, ask one
         thing. Is this thread waiting, or is it running Python? If it's waiting, then threads work.
         But if it's running Python, you need a second kitchen or another process."
         The timer fades on "ask one thing", the oven label pulses on "waiting", the knife label on
         "running Python", "waiting -> threads" lands on "then threads work", the ghost kitchen grows
         in on "second kitchen" and reveals "running Python -> processes". Cook 3 chops to the hold;
         the last frame is the episode's takeaway and is still. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.21" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM1;
  const BEAT_SECONDS = 10.21;
  // beat-local seconds (master - 35.880), from words.json
  const CUE = {
    ask: 1.60,       /* "ask" (one thing): the timer bar fades */
    waiting: 2.94,   /* "waiting," : the oven label pulses */
    running: 3.80,   /* "running" (Python?): the knife label pulses */
    then: 5.62,      /* "then" (threads work): "waiting -> threads" appears */
    second: 7.92,    /* "second" (kitchen): the ghost kitchen grows in */
    chopEnd: 9.50,   /* last whole stroke ends here (strokes every 0.5 s from 0), so no mid-swing snap */
    HOLD: 9.90,      /* the last 0.3 s hold SEAM1[6] exactly */
  };
  const FADE = 0.3, POP = 0.2, PULSE = 0.3;
  const A = SC.SEAM1[5], B = SC.SEAM1[6];
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  // a label dips to 0.5 and back over PULSE s from `at`
  const dip = (t, at) => 1 - 0.5 * SC.pulse(t, at, PULSE);
  function render(t) {
    const S = SC.state(A, {
      timer: { o: 1 - SC.seg(t, CUE.ask, CUE.ask + FADE) },
      oven: { lab: dip(t, CUE.waiting) },
      knife: { lab: dip(t, CUE.running) },
      close: { o: SC.seg(t, CUE.then, CUE.then + POP) },
      ghost: { o: SC.io(SC.seg(t, CUE.second, CUE.second + FADE)) },
      chop: t < CUE.chopEnd ? (t * 2) % 1 : 0,
    });
    kit.draw(null, t >= CUE.HOLD ? SC.state(B, { chop: 0 }) : S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
