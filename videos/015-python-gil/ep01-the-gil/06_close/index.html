<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 06_close (35.880 s, 10.210 s): SEAM1[5] -> SEAM1[6]. "But when threads don't help, ask one thing. Is this thread
         waiting, or is it running Python? If it's waiting, then threads work. But if it's running Python, you need a
         second kitchen or another process." Cook 2 keeps chopping, the bars pulse on their words, the two close lines land inside the kitchen above the cooks. Just before "second kitchen" the kitchen shrinks to half size, left, and the close lines slide down into the gap; the panel splits into "process 1" / "process 2" and a second kitchen draws in at right; its cooks walk in, a knife lands, cook 1 chops, and the two magenta bars grow
         side by side (Chris, 10/29: show the second kitchen running, with its own four threads). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block; src: url("vendor/Inter-ExtraBold.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.21" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 10.21;
  // Beat-local cues (master - 35.880), from words.json.
  const CUE = {
    threads: 0.50,   /* "threads" (don't help): the chop stops, the chip and slot fade */
    help:    1.16,   /* "help" */
    waiting: 2.94,   /* "waiting": the dashed bar pulses */
    running: 3.80,   /* "running" (Python?): the magenta bars pulse */
    work:    5.76,   /* "threads" (work): "waiting -> threads" lands */
    python:  7.08,   /* "Python" (running Python,): "running Python -> processes" lands */
    kitchen: 8.16,   /* "kitchen" (second kitchen): the dashed second kitchen is drawn */
    process: 8.82,   /* "process" (another process): slot "second kitchen / another process" */
  };
  const HOLD = 9.91;                 // still from here (VO ends 9.34)
  const SHRINK = 0.6, SWAP_OUT = 0.15, SWAP_IN = 0.2;
  const T = { shrink: 7.26, split: 7.86, draw: 7.86, walk: 8.16, knife: 8.76, chop: 8.80 };   // the second kitchen comes alive on "second kitchen"
  // the kitchen shrinks only to make room for it (7.26 -> 7.86, landing on "second"); the close lines sit inside the kitchen until then
  const WALK = 0.5, STAGGER = 0.12;

  const root = document.getElementById("root");
  SC.SEAM = SC.SEAM1;
  const kit = SC.mount(root);
  const A = SC.SEAM1[5], B = SC.SEAM1[6];
  const { seg, io, pulse, lerp } = SC;

  // the left half's rows at half width, then the running bars (T2 py, T4 nat) grow on from `b0` to `b1` as process 2's do
  function leftRows(split, grow) {
    const rows = SC.APPL_ROWS.map((row) => row.map((sg) => ({ a: lerp(sg.a, sg.a * 0.5, split), b: lerp(sg.b, sg.b * 0.5, split), k: sg.k })));
    rows[1][1].b = lerp(rows[1][1].b, 0.75, grow); rows[3][0].b = lerp(rows[3][0].b, 0.75, grow);
    return rows;
  }
  function render(t) {
    if (t >= HOLD) t = HOLD;
    const split = io(seg(t, T.split, T.split + 0.4));
    const grow = seg(t, T.chop, HOLD);
    const twinCooks = [0, 1, 2, 3].map((i) => ({ in: seg(t, T.walk + i * STAGGER, T.walk + i * STAGGER + WALK), at: "counter", u: 1,
      wait: i === 0 ? 0 : seg(t, T.knife, T.chop), cut: i === 0 ? 0.3 * grow : 0 }));
    // the slot: appliance fades out from "threads", the twin label fades in landing on "process"
    const outA = 1 - seg(t, CUE.threads, CUE.threads + SWAP_OUT);
    const inB = seg(t, CUE.process - SWAP_IN, CUE.process);
    const slot = inB > 0 ? SC.merge(SC.SLOT.twin, { o: inB }) : SC.merge(SC.SLOT.appl, { o: outA });
    const S = SC.state(A, {
      K: { half: io(seg(t, T.shrink, T.shrink + SHRINK)) },
      chip: { o: 1 - seg(t, CUE.threads, CUE.threads + 0.2) },
      slot,
      panel: { pulse: { io: pulse(t, CUE.waiting, 0.6), py: pulse(t, CUE.running, 0.6) }, split, rows: leftRows(split, grow) },
      panel2: { rows: t >= T.chop ? [[{ a: 0.5, b: lerp(0.5, 0.75, grow), k: "py" }], [], [], []] : [[], [], [], []] },
      close: { a: seg(t, CUE.work - 0.2, CUE.work), b: seg(t, CUE.python - 0.2, CUE.python) },
      twin: { o: t >= T.draw ? 1 : 0, draw: seg(t, T.draw, T.draw + 0.3), cooks: twinCooks, veg: seg(t, T.walk, T.walk + 0.2),
              knife: { o: seg(t, T.knife, T.knife + 0.1), holder: t >= T.knife ? 0 : -1 }, chop: SC.chopAt(t, T.chop, HOLD, 2) },
      chop: SC.chopAt(t, 0.2, HOLD, 2),               // cook 2 keeps chopping through the close (still for 0.2 s so the cut encodes clean)
    });
    S.cooks[1].cut = lerp(0.8, 1, seg(t, 0, HOLD));
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
