<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 02_knife (7.250, 7.550 s): SEAM1[1] -> SEAM1[2]. Cook 1 keeps chopping; "knife / GIL" ramps in
         on "knife"; on "everyone else waits" cooks 2-4 fold their arms and dim, staggered. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.55" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM1;
  const BEAT_SECONDS = 7.55;
  const CUE = {
    knife: 0.37,     // "knife": the "knife / GIL" label ramps in
    holds: 3.59,     // "holds": cook 1 chops a little harder (same stroke period)
    everyone: 6.43,  // "everyone": cooks 2, 3, 4 fold their arms and dim, 0.1 s apart
    HOLD: 7.25,      // still from here (chop 0, SEAM1[2])
  };
  const STROKE = 0.5;                                        // chopping carries on from beat 1
  const CHOP_END = Math.floor(CUE.HOLD / STROKE) * STROKE;   // last whole stroke ends at 7.0
  const WAIT_RAMP = 0.4, WAIT_STAGGER = 0.1;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM1[1];
  function render(t) {
    const phase = t < CHOP_END ? (t / STROKE) % 1 : 0;
    const chop = t >= CUE.holds ? SC.io(phase) : phase;      // same period; from "holds" the swing is snappier (the kit has no amplitude field)
    const knifeLab = SC.seg(t, CUE.knife, CUE.knife + 0.2);
    const cooks = A.cooks.map((c, i) => {
      if (i === 0) return c;
      const t0 = CUE.everyone + (i - 1) * WAIT_STAGGER;
      return { at: c.at, wait: SC.io(SC.seg(t, t0, t0 + WAIT_RAMP)) };
    });
    const S = SC.state(A, { knife: { lab: knifeLab }, cooks, chop });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
