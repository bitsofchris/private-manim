<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 04_oven: "But a cook puts the knife down to wait on the oven ... so another thread can run."
         SEAM1[3] -> SEAM1[4]: the code card fades, cook 4 passes the knife back to cook 2, cook 2 walks
         to the oven as the knife hops to cook 3, the oven comes in on "oven", the timer empties and
         refills faster on "another thread can run". -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
    <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.94" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  SC.SEAM = SC.SEAM1;
  const BEAT_SECONDS = 9.94;
  const HOLD = 9.64;                    // still from here: SEAM1[4] exactly, chop 0
  const CUE = {
    cook: 0.43,     /* "cook": the code card fades */
    puts: 0.75,     /* "puts the knife down": cook 4 hands the knife back, holder 3 -> 1 over 0.6 s */
    wait: 1.79,     /* "wait on the oven": cook 2 walks to the oven; the knife hops 1 -> 2 */
    oven: 2.25,     /* "oven": the oven label (the oven itself from 0.2 s before) */
    gil: 6.27,      /* "GIL is released": the knife label pulses */
    another: 8.25,  /* "another thread can run": cook 3 chops harder, the timer empties and refills */
    refilled: 9.3,  /* the timer is full again (after "run" 9.05) */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg, io, lerp, clamp01 } = SC;
  const SEAM_IN = SC.SEAM[3], SEAM_OUT = SC.SEAM[4];
  const HOP = 0.6, WALK = 0.8, FADE = 0.3;
  const LAND2 = CUE.wait + HOP;         // the knife lands with cook 3
  // cook 3's chop phase: a stroke every 0.5 s from the landing, faster from "another", and a whole
  // number of strokes by HOLD so the last frame is still (chop 0).
  const RATE = 2;
  const N_AT_ANOTHER = (CUE.another - LAND2) * RATE;
  const N_END = Math.ceil(N_AT_ANOTHER) + 4;                       // ~3 strokes per second to the hold
  const RATE2 = (N_END - N_AT_ANOTHER) / (HOLD - CUE.another);
  const frac = (x) => x - Math.floor(x);
  function chopAt(t) {
    if (t >= HOLD - 0.01) return 0;        // (−0.01: the seek at end − 0.3 lands a hair before HOLD)
    if (t < 0.5) return frac(t * RATE);                            // cook 4's last stroke before the pass
    if (t < CUE.puts) return 0;
    if (t < CUE.puts + HOP) return 0;
    if (t < CUE.wait) return seg(t, CUE.puts + HOP, CUE.wait);     // cook 2: one stroke, then it is called away
    if (t < LAND2) return 0;                                       // the knife is in the air
    if (t < CUE.another) return frac((t - LAND2) * RATE);
    return frac(N_AT_ANOTHER + (t - CUE.another) * RATE2);
  }
  function render(t) {
    // the knife: 3 -> 1 on "puts", then 1 -> 2 on "wait"
    const holder = t < CUE.wait ? lerp(3, 1, io(seg(t, CUE.puts, CUE.puts + HOP)))
                                : lerp(1, 2, io(seg(t, CUE.wait, LAND2)));
    // cook 2's walk to the oven
    const walking = t >= CUE.wait;
    const u2 = io(seg(t, CUE.wait, CUE.wait + WALK));
    const cook2 = walking ? { at: "oven", wait: seg(t, CUE.wait + WALK, CUE.wait + WALK + 0.3) }
                          : { at: "counter", wait: 1 - seg(t, 0.95, 1.25) };   // unfolds as the knife reaches it
    if (walking && u2 < 1) cook2.u = u2;
    const cooks = [
      { at: "counter", wait: 1 },
      cook2,
      { at: "counter", wait: 1 - seg(t, CUE.wait, CUE.wait + 0.3) },           // takes the knife
      { at: "counter", wait: seg(t, 0.96, 1.3) },                              // let it go, folds its arms
    ];
    const fill = t < CUE.another ? 1
               : t < CUE.another + 0.2 ? 1 - seg(t, CUE.another, CUE.another + 0.2)
               : seg(t, CUE.another + 0.2, CUE.refilled);
    const S = SC.state(SEAM_OUT, {
      cooks,
      knife: { holder, lab: 1 - 0.5 * Math.sin(Math.PI * seg(t, CUE.gil, CUE.gil + FADE)) },
      code: { o: 1 - seg(t, CUE.cook, CUE.cook + FADE), text: "threads" },
      oven: { o: seg(t, CUE.oven - 0.2, CUE.oven + 0.1), lab: seg(t, CUE.oven, CUE.oven + 0.2) },
      timer: { o: 1, fill },
      chop: chopAt(t),
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
