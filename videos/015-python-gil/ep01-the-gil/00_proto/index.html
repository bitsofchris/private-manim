<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_proto: prototype frames for the 015 ep 1 redo (kit v2). Not in the Short. Shows SC.PROTO[k]
         at k..k+1 s, the knife rocking for the first half of each second, still for the second half. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="kit/kitchen2.js"></script>
    <script src="cast/cast.js"></script>
    <style>
      @font-face { font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block; src: url("vendor/Inter-ExtraBold.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="12" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 12;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  ISO.guides(root);
  function render(t) {
    const k = Math.min(SC.PROTO.length - 1, Math.floor(t));
    const u = t - k;
    const S = SC.state(SC.PROTO[k], { chop: u < 0.5 ? u * 2 : 0 });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
