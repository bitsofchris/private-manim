<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 03_loss: "We compare that prediction to the target, and that's the loss."
         Opens on SC.SEAM[2] (the glyph beside forward, forward lit). Still until "compare"
         (1.13 s): the glyph rides from forward to loss over 0.8 s, the batch the hero,
         forward muted. "loss" (3.13 s): loss lights. Still from then on: SC.SEAM[3]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.705" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.705, MASTER = 13.555;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg, lerp } = SC, EZ = SC.E();
  // cues, beat-local (master − 13.555): compare@14.68, target,@15.86, loss.@16.68
  const T = { compare: 1.125, rideFor: 0.8, loss: 3.125 };
  const U_FROM = LOOP.at("ring", "forward"), U_TO = LOOP.at("ring", "loss");
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= 0 || t < T.compare) return kit.draw(null, SC.SEAM[2]);
    if (t >= T.loss) return kit.draw(null, SC.SEAM[3]);
    const u = lerp(U_FROM, U_TO, EZ.io(seg(t, T.compare, T.compare + T.rideFor)));
    kit.draw(null, Object.assign({}, SC.LOOP_ONLY, { loop: { o: 1, take: "ring", u, batch: 1, slot: 0, lit: "batch" } }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
