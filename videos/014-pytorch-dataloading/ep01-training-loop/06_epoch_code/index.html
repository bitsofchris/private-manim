<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 06_epoch_code (MASTER 26.000, 8.410 s): "An epoch is one pass through the whole dataset. So this
         inner loop runs once per epoch, and the outer loop runs for as many epochs as you set."
         Opens on SC.SEAM[5] (the loop, the batch in the slot, lit batch); holds until "An epoch" (0.26),
         then S.flip 0 -> 1 over 0.4 s (the kit's crossfade: loop out, code card in). Typing starts at 0.8
         (SC_typedAt at 22 cps lands all six lines at 6.86). The hero is the line the cursor is on until
         "inner loop" (3.54: inner), then "outer loop" (5.78: outer). Cursor off when typing ends; the
         state is SC.SEAM[6] from there (typed Infinity, lit outer, cursor 0). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.41" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.41, MASTER = 26.0;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg } = SC, C = LOOP.CODE;
  // cues, beat-local (master - 26.000): An@26.26 epoch@26.44 inner@29.54 loop@29.80 outer@31.78 loop@32.12 set.@33.86
  const T = {
    flip: 0.26,                                 // "An" (epoch): the loop flips to the code card over 0.4 s
    type: 0.80,                                 // typing starts
    inner: 3.54,                                // "inner" (loop): for batch in loader: is the hero
    outer: 5.78,                                // "outer" (loop): for epoch in range(epochs): is the hero
  };
  T.done = T.type + SC_typingSeconds(C);        // 6.86 at 22 cps: every line landed, before "set." (7.86)
  const TOTAL = C.reduce((a, l) => a + l.t.length, 0);
  // the line the cursor is on: the last line with at least one character typed (line 0 before any)
  function cursorLit(typed) {
    let n = 0, lit = C[0].lit;
    C.forEach((ln) => { if (typed > n) lit = ln.lit; n += ln.t.length; });
    return lit;
  }
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= T.flip) { kit.draw(null, SC.SEAM[5]); return; }
    if (t >= T.done) { kit.draw(null, SC.SEAM[6]); return; }
    const flip = seg(t, T.flip, T.flip + 0.4);
    const typed = SC_typedAt(C, t - T.type);
    const lit = t >= T.outer ? "outer" : t >= T.inner ? "inner" : cursorLit(typed);
    const cursor = typed < TOTAL ? 1 : 0;
    kit.draw(null, Object.assign({}, SC.LOOP_ONLY, {
      flip, hero: null,
      loop: SC.SEAM[5].loop,                      // the loop fades out through the kit's crossfade
      code: { o: 1, lines: C, typed, lit, cursor, blink: t },
    }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
