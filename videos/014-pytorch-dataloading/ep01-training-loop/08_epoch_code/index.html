<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 08_epoch_code: "An epoch is one pass through the whole dataset. So this inner loop runs once per
         epoch, and the outer loop runs for as many epochs as you set." Opens on SEAM[7] (the loop, the glyph in
         the slot), flips to the six-line card with the four body lines already there; the two `for` headers type
         in above them (typedLines), inner then outer become the hero. Ends on SEAM[8]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.37" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.37, MASTER = 24.400;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg } = SC, C = LOOP.CODE, H = C.slice(0, 2), LEN0 = C[0].t.length, LEN1 = C[1].t.length;
  // cues, beat-local (master - 24.400): An@24.66 epoch@24.80 dataset.@26.68 inner@27.97 loop@28.14 outer@30.12 loop@30.48 set.@32.22
  const T = {
    flip: 0.26,                                 // "An" (epoch): the loop flips to the six-line card over 0.4 s
    type: 0.70,                                 // the two `for` headers start typing (line 0 then line 1, ~22 cps)
    inner: 3.57,                                // "inner" (loop): for batch in loader: is the hero
    outer: 5.72,                                // "outer" (loop): for epoch in range(epochs): is the hero
    still: 6.0,                                 // SEAM[8] itself from here (well before "set." at 7.82)
  };
  T.done = T.type + SC_typingSeconds(H);        // ~3.3 at 22 cps: both headers landed before "inner loop" (3.57)
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= T.flip) { kit.draw(null, SC.SEAM[7]); return; }
    if (t >= T.still) { kit.draw(null, SC.SEAM[8]); return; }
    const flip = seg(t, T.flip, T.flip + 0.4);
    const n = SC_typedAt(H, t - T.type);
    const h0 = Math.min(n, LEN0), h1 = Math.max(0, n - LEN0);
    const typing = h1 < LEN1;
    const cursorLine = h0 < LEN0 ? 0 : 1;
    const lit = t >= T.outer ? "outer" : t >= T.inner ? "inner" : cursorLine === 0 ? "outer" : "inner";
    kit.draw(null, Object.assign({}, SC.LOOP_ONLY, {
      flip, hero: null,
      loop: SC.SEAM[7].loop,                      // the loop fades out through the kit's crossfade
      code: { o: 1, lines: C, typedLines: [h0, h1, Infinity, Infinity, Infinity, Infinity],
              lit, cursor: typing ? 1 : 0, cursorLine, blink: t },
    }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
