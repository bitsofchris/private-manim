<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 08_check_batch: "So if your loss isn't moving, check the batch first. Everything downstream of it is the same four lines every time."
         The machine at rest with the batch hero throughout (SEAM[7] -> SEAM[8]); "check the batch" pulses the batch card once,
         "four lines" dims the DataLoader box slightly and returns; still from 5.3 s. The last frame is ep 2's frame 0. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.127" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.127, MASTER = 38.61;
  // cues (beat-local = master - MASTER): check@39.90 batch@40.22 four@43.06 lines@43.34 time.@43.84
  const T = { pulse: 1.29, pulseW: 0.5, dim: 4.45, dimW: 0.6, still: 5.3 };   // "check the batch" / "four lines" / hold
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg, pulse, G } = SC;
  const bt = G.batch, CX = bt.x + bt.w / 2, CY = bt.y + bt.h / 2;   // the batch card's centre (395, 1045)
  const P = kit.parts.batch;
  // the pulse is a transform on the card's own elements, set after draw and removed exactly after
  function setPulse(s) {
    if (s === 1) {
      P.svg.forEach((el) => { if (el.removeAttribute) el.removeAttribute("transform"); else el.setAttribute("transform", ""); });
      P.dom.forEach((el) => { el.style.transform = ""; el.style.transformOrigin = ""; });
      return;
    }
    const tr = `translate(${CX} ${CY}) scale(${s.toFixed(4)}) translate(${-CX} ${-CY})`;
    P.svg.forEach((el) => el.setAttribute("transform", tr));
    P.dom.forEach((el) => {
      const left = parseFloat(el.style.left) || 0, top = parseFloat(el.style.top) || 0;
      el.style.transformOrigin = `${CX - left}px ${CY - top}px`;   // about the card's centre, not the label's
      el.style.transform = `scale(${s.toFixed(4)})`;
    });
  }
  function state(t) {
    if (t <= 0) return SC.SEAM[7];
    if (t >= T.still) return SC.SEAM[8];
    const S = { hero: "batch", flip: 0, loop: { o: 0 } };
    const dip = pulse(t, T.dim, T.dimW);                       // "four lines": the DataLoader box dims to 0.7 and returns
    if (dip > 0) S.loader = 1 - 0.3 * dip;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(null, state(t));
    setPulse(1 + 0.06 * pulse(t, T.pulse, T.pulseW));          // "check the batch": the card swells once and settles
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
