<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 beat 3, 03_forward (master 8.000–12.750): the loader yields the batch, it rides to forward.
         Opens on SC.SEAM[2] (the loop, the glyph in the slot, lit batch) and holds until "yields it"; the
         glyph rides to beside forward (power2.inOut), arriving on "forward pass", and forward lights.
         "prediction": forward pulses once (lit off 0.25 s, back on). Still from 4.45 on SC.SEAM[3]
         (hf_state_check wants the last 0.3 s still, so the pulse is 0.25 s, not 0.3). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.75" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.750, MASTER = 8.000;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg } = SC, E = SC.E();
  // beat-local cues (master − 8.000), from words.json
  const CUE = {
    yields: 0.82,     /* "yields" (it): the glyph leaves the slot */
    forward: 2.64,    /* "forward" (pass): the glyph arrives beside forward, forward lights */
    prediction: 4.18, /* "prediction.": forward pulses once */
  };
  const PULSE = 0.25;                                  // the forward pulse: lit off and back (0.25 s: the last 0.3 s must be still)
  const U_FWD = LOOP.at("ring", "forward");
  const HOLD = CUE.prediction + PULSE;                 // 4.43: still from here (SC.SEAM[3]); BEAT_SECONDS − 0.3 = 4.45
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= 0) { kit.draw(null, SC.SEAM[2]); return; }
    if (t >= HOLD) { kit.draw(null, SC.SEAM[3]); return; }
    const ride = E.io(seg(t, CUE.yields, CUE.forward));   // slot → beside forward, one tracked move
    const arrived = t >= CUE.forward;
    const pulsing = t >= CUE.prediction && t < CUE.prediction + PULSE;
    const lit = !arrived ? "batch" : pulsing ? null : "forward";
    const S = Object.assign({}, SC.LOOP_ONLY, {
      loop: { o: 1, take: "ring", u: arrived ? U_FWD : U_FWD * ride, batch: 1, slot: 0, lit },
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
