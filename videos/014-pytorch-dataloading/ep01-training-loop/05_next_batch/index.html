<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 beat 5 "Next batch" (master 23.600, 2.400 s). Opens on SC.SEAM[4] (glyph beside
         update, the four boxes lit), ends on SC.SEAM[5] (glyph in the slot, u 0, lit batch).
         "go back" 0.42: the glyph leaves update along the dashed return (under update, up the
         left gutter, into the slot), the boxes go muted and the glyph is the hero as it leaves;
         it arrives on "next batch" 1.64 with an ease-out and holds still to the end. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.4" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 2.4, MASTER = 23.6;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg, lerp } = SC, E = SC.E(), R = "ring";
  // cues, beat-local seconds (master - 23.6)
  const T = {
    go:   0.42,   // "go" @24.02 ("go back"): the glyph leaves update along the dashed return
    next: 1.64,   // "next" @25.24 ("next batch"): it arrives in the slot
  };
  const U_UPDATE = LOOP.at(R, "update");
  const loop = (u, lit) => Object.assign({}, SC.LOOP_ONLY, { loop: { o: 1, take: R, u, batch: 1, slot: 0, lit } });

  function state(t) {
    if (t < T.go) return SC.SEAM[4];
    const p = E.out(seg(t, T.go, T.next));
    if (p >= 1) return SC.SEAM[5];               // u 1 == u 0 on the track; the seam says 0
    return loop(lerp(U_UPDATE, 1, p), "batch");  // the boxes go muted as it leaves; the batch is the hero
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(null, state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
