<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 beat 1 "Hook: the batch" (master 0.000–5.120): the machine at rest, samples hopping from frame 0.
         "packed into one tensor" (2.26): the [32, 512] batch card swells once (scale 1.06, 0.5 s) and settles.
         Opens on SC.SEAM[0], ends on SC.SEAM[1] (both: REST, hero batch, flip 0, loop off). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.12" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.120, MASTER = 0.000;
  // cues (beat-local = master - MASTER): packed@2.26 tensor@3.00 parallelize.@4.18
  const T = { pulse: 2.26, pulseW: 0.5 };   // "packed into one tensor": the batch card pulses once
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { pulse, G } = SC;
  const bt = G.batch, CX = bt.x + bt.w / 2, CY = bt.y + bt.h / 2;   // the batch card's centre (395, 1045)
  const P = kit.parts.batch;
  // the pulse is a transform on the card's own elements, set after draw and removed exactly after (as 08_check_batch did)
  function setPulse(s) {
    if (s === 1) {
      P.svg.forEach((el) => { if (el.removeAttribute) el.removeAttribute("transform"); else el.setAttribute("transform", ""); });
      P.dom.forEach((el) => { el.style.transform = ""; el.style.transformOrigin = ""; });
      return;
    }
    const tr = `translate(${CX} ${CY}) scale(${s.toFixed(4)}) translate(${-CX} ${-CY})`;
    P.svg.forEach((el) => el.setAttribute("transform", tr));
    P.dom.forEach((el) => {
      const left = parseFloat(el.style.left) || 0, top = parseFloat(el.style.top) || 0;
      el.style.transformOrigin = `${CX - left}px ${CY - top}px`;   // about the card's centre, not the label's
      el.style.transform = `scale(${s.toFixed(4)})`;
    });
  }
  function state(t) {
    if (t <= 0) return SC.SEAM[0];
    return SC.SEAM[1];                                           // state-wise still: the machine at rest, hero batch
  }
  function render(t) {
    SC.clock = MASTER + t;                                       // master seconds: the samples hop from frame 0
    kit.draw(null, state(t));
    setPulse(1 + 0.06 * pulse(t, T.pulse, T.pulseW));          // "packed into one tensor": the card swells once and settles
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
