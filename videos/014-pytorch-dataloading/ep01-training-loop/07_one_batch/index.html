<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 07_one_batch: "The model never sees your dataset, it only ever sees one batch at a time."
         Opens on the typed code card (SEAM[6]); "The model" flips back onto the machine at rest, the chip the hero;
         "one batch" passes the hero to the [32, 512] batch card; still from 3.6 s (SEAM[7]). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.2, MASTER = 34.41;
  // cues (beat-local = master - MASTER): The@34.64 model@34.74 one@37.48 batch@37.68 time.@38.14
  const T = { flipOut: 0.23, oneBatch: 3.27, still: 3.6 };   // "The model" / "one batch" / hold
  const FLIP = 0.4;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg } = SC;
  function state(t) {
    if (t <= T.flipOut) return SC.SEAM[6];                       // the typed code card, outer lit, cursor off
    if (t >= T.still) return SC.SEAM[7];                         // the machine at rest, the batch hero
    const flip = 1 - seg(t, T.flipOut, T.flipOut + FLIP);       // card fades out as typed, the machine fades in
    const S = { hero: t < T.oneBatch ? "model" : "batch", flip, loop: { o: 0 } };
    if (flip > 0) S.code = SC.SEAM[6].code;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(null, state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
