<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 00_layout: the canonical frame of the training-loop episode, in four states. Not in the Short.
         0–3 s  take "ring": the batch rides the loop, forward lit as it passes
         3–6 s  take "column": the same, boxes stacked (the alternate)
         6–8 s  the code card typing the loop (ep 1's code beat)
         8–9 s  the machine at rest, the batch hero: ep 1's last frame = ep 2's frame 0 -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 9;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg } = SC, C = LOOP.CODE;
  const T = { flipIn: 6.0, typeFrom: 6.3, flipOut: 8.0 };
  function render(t) {
    SC.clock = t;
    if (t < 6) {
      const take = t < 3 ? "ring" : "column", u = (t % 3) / 3 * 0.55;   // the first half of a lap in 3 s
      const uF = LOOP.at(take, "forward");
      const lit = u > uF - 0.04 && u < uF + 0.08 ? "forward" : "batch";
      kit.draw(null, Object.assign({}, SC.LOOP_ONLY, { loop: { o: 1, take, u, batch: 1, slot: 0, lit } }));
    } else {
      const flip = seg(t, T.flipIn, T.flipIn + 0.4) * (1 - seg(t, T.flipOut, T.flipOut + 0.4));
      const typed = SC_typedAt(C, t - T.typeFrom);
      let n = 0, lit = "outer";
      C.forEach((ln) => { if (typed > n) lit = ln.lit || lit; n += ln.t.length; });
      kit.draw(null, { hero: "batch", flip, loop: { o: 0 }, code: { lines: C, typed, lit, cursor: 1, blink: t } });
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
