<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <!-- ep01 09_one_batch: "The model never sees your dataset, it only ever sees one batch at a time."
         Opens on SEAM[8] (the six-line card, outer lit); "The model" flips back to the machine at rest
         with the model chip the hero; "one batch" passes the hero to the batch card; still: SEAM[9]. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.175" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.175, MASTER = 32.770;
  // cues (beat-local = master - MASTER): The@33.0 model@33.08 one@35.82 batch@36.02 time.@36.46
  const T = { flipOut: 0.23, oneBatch: 3.05, still: 3.4 };   // "The" / "one batch" / hold
  const FLIP = 0.4;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg } = SC;
  function state(t) {
    if (t <= T.flipOut) return SC.SEAM[8];                       // the typed six-line card, outer lit, cursor off
    if (t >= T.still) return SC.SEAM[9];                         // the machine at rest, the batch hero
    const flip = 1 - seg(t, T.flipOut, T.flipOut + FLIP);       // the card fades out, the machine fades in
    const S = { hero: t < T.oneBatch ? "model" : "batch", flip, loop: { o: 0 } };
    if (flip > 0) S.code = SC.SEAM[8].code;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(null, state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
