<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep01 beat 1, 01_hook (master 0.000–8.050): the batch rides one lap of the training loop.
         Frame 0 = SC.SEAM[0] (in the slot, lit batch) and the glyph is already moving from that frame.
         "packed into one tensor": the glyph dips and returns. "training loop": the track goes magenta once.
         The lap ends in the slot by 7.5 s with an ease-out; still to the end (= SC.SEAM[1]). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/loop.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.050" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.050, MASTER = 0.000;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { pulse } = SC;
  // beat-local cues (master − 0.000), from words.json
  const CUE = {
    packed: 2.26,   /* "packed" (into one tensor): the glyph pulses */
    training: 6.00, /* "training" (loop): the track pulses magenta */
    loopWord: 6.28, /* "loop" */
    parked: 7.50,   /* the lap is done: parked in the slot, still to the end */
  };
  const LAP = CUE.parked, COAST = 6.3;             // even speed to COAST, then ease out into the slot
  const V = 1 / (COAST + (LAP - COAST) / 2);        // so the lap is exactly 1 at LAP
  const HOLD = LAP;
  function uAt(t) {
    if (t <= 0) return 0;
    if (t >= LAP) return 0;                         // 1 ≡ 0: in the slot
    if (t <= COAST) return V * t;
    const d = t - COAST, D = LAP - COAST;
    return V * COAST + V * d - V * d * d / (2 * D); // decelerates to speed 0 at LAP
  }
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= 0) { kit.draw(null, SC.SEAM[0]); return; }
    if (t >= HOLD) { kit.draw(null, SC.SEAM[1]); return; }
    const dip = pulse(t, CUE.packed, 0.6);          // "packed into one tensor": a quick opacity dip-and-return
    const trackHot = t >= CUE.training && t < CUE.training + 0.5;   // "training loop": the whole track magenta once
    const S = Object.assign({}, SC.LOOP_ONLY, {
      loop: { o: 1, take: "ring", u: uAt(t), batch: 1 - 0.55 * dip, slot: 0, lit: trackHot ? "track" : "batch" },
    });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
