<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 09_next_code (starter: holds SEAM[8] then SEAM[9]; replace this comment with the beat's cue plan)
         was 00_layout: frame 0 of the IterableDataset episode and the takes on its new prop. Not in the Short.
         0–2 s  frame 0 (SEAM[0]): iterable, the sampler struck, __iter__ the hero, samples hopping
         2–4 s  the shards, take "row" (under the Dataset card), the hero
         4–6 s  the shards, take "column" (left of the Dataset card), the hero
         6–8 s  the code card: the stream class and len(stream) # TypeError (SEAM[4])
         8–10 s the code card of beat 9: __iter__ over __getitem__, the hero on getitem (SEAM[9]) -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.980" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.980, MASTER = 37.060;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  SC.E();
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(t < BEAT_SECONDS - 0.001 ? SC.SEAM[8] : SC.SEAM[9]);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
