<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 09_next_code: "The only thing that changes the data loader is asking for the next sample,
         not for the sample at index i."  SEAM[8] -> SEAM[9].
         The (0.18): the machine (SEAM[8]: workers 2, shards shuffled, batch the hero) flips to the EP4.CMP
           card over 0.4 s; once flip >= 0.6 the hidden machine fields take SEAM[9]'s (workers 0, shards off).
         0.40-2.21: def __iter__(self): then def __getitem__(self, i): type at cps 26, the typed line lit,
           cursor on; done 39.27 master.
         next (2.44): the __iter__ line the hero (from 2.32).
         index (4.16): the hero passes to the __getitem__ line (from 4.06); SEAM[9] from there, cursor off, still. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.980" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.980, MASTER = 37.060;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  SC.E();
  const { seg } = SC, C = EP4.CMP;
  // beat-local cues (master − 37.060), from words.json
  const CUE = {
    the: 0.18,       /* "The": flip to the card */
    next: 2.44,      /* "next": the __iter__ line the hero */
    index: 4.16,     /* "index": the __getitem__ line the hero */
  };
  const FLIP = 0.4, T_FLIP = CUE.the - 0.08;            // flip 0.10–0.50; machine gone (flip 0.6) at 0.34
  const T_TYPE = 0.40, CPS = 26;                        // SC_typingSeconds(C, 26) = 1.81: done at 2.21 (39.27 master)
  const TOTAL = C.reduce((a, l) => a + l.t.length, 0);
  const T_ITER = CUE.next - 0.12, T_GET = CUE.index - 0.10;   // hero lands on the word
  // the line being typed: the last line with a character typed (line 0 before any)
  function cursorLit(typed) {
    let n = 0, lit = C[0].lit;
    C.forEach((ln) => { if (typed > n) lit = ln.lit; n += ln.t.length; });
    return lit;
  }
  function state(t) {
    if (t <= 0) return SC.SEAM[8];
    if (t >= T_GET) return SC.SEAM[9];                  // still: both typed, getitem lit, cursor off
    const flip = seg(t, T_FLIP, T_FLIP + FLIP);
    // the machine's hidden fields change only once it is gone (flip >= 0.6)
    const base = flip >= 0.6 ? SC.SEAM[9] : SC.SEAM[8];
    const typed = SC_typedAt(C, t - T_TYPE, CPS);
    const done = typed >= TOTAL;
    const lit = t >= T_ITER ? "iter" : done ? C[1].lit : cursorLit(typed);
    return Object.assign({}, base, {
      flip,
      code: { o: 1, lines: C, typed: done ? Infinity : typed, lit, cursor: done ? 0 : 1, blink: t },
    });
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
