<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 06_shuffle: beat 6, "So shuffling is now your problem. You pre-shuffle the data into shards, load one shard into memory, and yield from it."
         Opens on SEAM[5], ends on SEAM[6] (shards [2,0,1], shard 2 in memory, __iter__ the hero).
         beat-local cues (master − 21.74): shuffling@22.08 pre-shuffle@23.74 load@25.42 memory@26.16 yield@26.62
         0.10–0.40  the next() arrow fades; "shuffling" (0.34): the shards the hero
         1.85–2.85  "pre-shuffle": the shards reorder to [2,0,1] (card 2 lifts over, 0 and 1 dip under)
         3.55–4.45  "load one shard into memory": card 2 drops into the memory box, the hero; its rows leave shuffled
         4.78       "yield": __iter__ the hero; 5.30–end SEAM[6] -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/stream.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.620" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.620, MASTER = 21.740;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  const E = SC.E(), { seg } = SC;
  const CUE = { shuffling: 0.34, pre: 2.00, load: 3.68, yield: 4.88 };
  const T = { move: 1.85, load: 3.55, still: 5.30 };
  function state(t) {
    if (t <= 0) return SC.SEAM[5];
    if (t >= T.still) return SC.SEAM[6];
    const u = E.io(seg(t, T.move, T.move + 1.0)), h = Math.sin(Math.PI * u);
    const moving = u > 0 && u < 1;
    const hero = t < CUE.shuffling - 0.1 ? "iter" : t < T.load ? "shards" : t < CUE.yield - 0.1 ? "memory" : "iter";
    const stream = { o: 1, hero, ask: 1 - seg(t, 0.1, 0.4), load: E.io(seg(t, T.load, T.load + 0.9)),
                     order: u >= 1 ? [2, 0, 1] : [0, 1, 2] };
    if (moving) { stream.pos = [u, 1 + u, 2 - 2 * u]; stream.lift = [-30 * h, -30 * h, 56 * h]; }
    return Object.assign({}, SC.SEAM[6], { stream });
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
