<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 05_no_sampler: beat 5, SEAM[4] (the LEN card, yield lit) -> SEAM[5] (machine, iter hero, shards at rest).
         Cues (master, words.json; beat-local = master - 17.030):
           This@17.24 (0.21)     the card flips back to the machine over 0.4 s (0.10-0.50), shards on at rest,
                                 __iter__ the hero (continuing the card's lit yield line)
           sampler@17.92 (0.89)  the struck sampler station the hero (swap at 0.79)
           calls@19.06 (2.03)    the Dataset card the hero (swap at 1.93)
           yields@20.54 (3.51)   __iter__ the hero (swap at 3.41) = SEAM[5], held to the end
         Samples keep hopping throughout (SC.clock). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.710" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.710, MASTER = 17.030;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  SC.E();
  const CUE = { flip: 0.10 /* "This" 17.24 */, sampler: 0.79 /* "sampler" 17.92 */,
                calls: 1.93 /* "calls" 19.06 */, yields: 3.41 /* "yields" 20.54 */ };
  const FLIP = 0.4;
  const { seg } = SC;
  function state(t) {
    if (t <= CUE.flip) return SC.SEAM[4];                        // the LEN card, yield lit, cursor off
    if (t >= CUE.yields) return SC.SEAM[5];                      // the machine, __iter__ the hero, shards at rest
    const flip = 1 - seg(t, CUE.flip, CUE.flip + FLIP);          // the card fades out, the machine fades in
    const hero = t < CUE.sampler ? "iter" : t < CUE.calls ? "sampler" : "dataset";
    const S = Object.assign({}, SC.SEAM[5], { hero, flip });
    if (flip > 0) S.code = SC.SEAM[4].code;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
