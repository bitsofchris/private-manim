<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 05_no_sampler: beat 5, "This means there's no sampler. The loader just calls your dataset over and over and it yields the next sample."
         Opens on SEAM[4] (the EP4.LEN card), ends on SEAM[5] (the stream, next() asked, __iter__ the hero).
         beat-local cues (master − 17.03): This@17.24 sampler.@17.92 loader@18.60 calls@19.06 over@19.70 over@20.08 yields@20.54 next@20.98
         0.10–0.50  the card flips to the stream (flowing), __iter__ the hero
         0.60–1.70  "no sampler": a struck `sampler` tag left of the gate, the hero, then gone
         1.47       "loader": the DataLoader bar the hero
         1.90       "calls": the dashed next() arrow up to __iter__, the hero; it dips on each "over"
         3.40       "yields": __iter__ the hero; 4.40–end SEAM[5] -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/stream.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.710" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.710, MASTER = 17.030;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  const E = SC.E(), { seg, pulse } = SC;
  const CUE = { sampler: 0.89, loader: 1.57, calls: 2.03, over1: 2.67, over2: 3.05, yields: 3.51 };
  const T = { flip: 0.10, still: 4.40 };
  function state(t) {
    if (t <= T.flip) return SC.SEAM[4];
    if (t >= T.still) return SC.SEAM[5];
    const flip = 1 - seg(t, T.flip, T.flip + 0.4);
    const hero = t < CUE.sampler - 0.1 ? "iter" : t < CUE.loader - 0.1 ? "sampler" : t < CUE.calls - 0.1 ? "loader"
               : t < CUE.yields - 0.1 ? "next" : "iter";
    const ask = seg(t, CUE.calls - 0.15, CUE.calls + 0.2) * (1 - 0.5 * pulse(t, CUE.over1 - 0.12, 0.35)) * (1 - 0.5 * pulse(t, CUE.over2 - 0.12, 0.35));
    const S = Object.assign({}, SC.SEAM[5], { flip, stream: {
      o: 1, hero, ask, nosampler: seg(t, 0.6, 0.85) * (1 - seg(t, 1.45, 1.75)) } });
    if (flip > 0) S.code = SC.SEAM[4].code;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
