<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 08_same_loader (beat 8, machine; SEAM[7] -> SEAM[8]). Master 32.559, 4.501 s.
         0.00        SEAM[7]: fetch the hero, workers 2, shards [2,0,1] with card 2 loaded
         0.15-0.65   "data loader" (32.96): the Dataset card and shards dim 1 -> 0.45 (S.dataset); hero null at 0.30,
                     the loader box stands alone
         2.50        "batch" (35.16): batching the hero
         3.16        "collate," (35.82): collate the hero
         3.74        "batch out" (36.40): the batch card the hero
         3.60-4.05   dataset back to 1 (by ~36.6)
         4.10 - end  still on SEAM[8] (hero batch) -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.501" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.501, MASTER = 32.559;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  const E = SC.E();
  const CUE = {
    data: 0.401,       /* "data"      32.96 */
    batch: 2.601,      /* "batch"     35.16 (size) */
    collate: 3.261,    /* "collate,"  35.82 */
    out: 3.841,        /* "batch"     36.40 (out) */
    back: 4.050,       /* ~36.61: the Dataset card back to 1 */
    still: 4.100,
  };
  const DIM = 0.45;
  function state(t) {
    if (t <= 0) return SC.SEAM[7];
    if (t >= CUE.still) return SC.SEAM[8];
    const S = Object.assign({}, SC.SEAM[7]);
    S.dataset = 1 - (1 - DIM) * E.io(SC.seg(t, CUE.data - 0.25, CUE.data + 0.25))
                  + (1 - DIM) * E.io(SC.seg(t, CUE.back - 0.45, CUE.back));
    S.hero = t < CUE.data - 0.1 ? "fetch"
           : t < CUE.batch - 0.1 ? null
           : t < CUE.collate - 0.1 ? "batching"
           : t < CUE.out - 0.1 ? "collate" : "batch";
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
