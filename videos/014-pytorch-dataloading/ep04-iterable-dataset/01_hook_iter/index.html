<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 01_hook_iter: beat 1, the hook (master 0.000–3.750; SEAM[0] -> SEAM[1]).
         Frame 0 is the iterable machine already running: sampler struck, __iter__ the magenta hero,
         samples hopping (SC.clock = master seconds, continuous into beat 2).
         2.46–2.76 __iter__ dips to no hero (0.3 s) and re-lights on "iterable" (2.76). Otherwise still.
         Last 0.3 s: SEAM[1] (identical to SEAM[0]). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/stream.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.750" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.750, MASTER = 0.000;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  SC.E();
  // beat-local cues (= master; MASTER is 0), from words.json + the RMS envelope of vo_final.wav
  const CUE = {
    iterable: 2.76,  /* "iterable": __iter__ re-lights (the end of its 0.3 s dip) */
  };
  const DIP = 0.30;                                  // the pulse: hero null for 0.3 s before the word
  const HOLD = BEAT_SECONDS - 0.3;                   // 3.45: SEAM[1] itself from here
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= 0) { ep.draw(SC.SEAM[0]); return; }
    if (t >= HOLD) { ep.draw(SC.SEAM[1]); return; }
    const dip = t >= CUE.iterable - DIP && t < CUE.iterable;
    ep.draw(dip ? Object.assign({}, SC.SEAM[0], { hero: null }) : SC.SEAM[0]);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
