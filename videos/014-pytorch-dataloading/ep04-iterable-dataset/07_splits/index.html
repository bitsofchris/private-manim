<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 07_splits (beat 7, machine; SEAM[6] -> SEAM[7]). Master 27.360, 5.199 s.
         0.00        SEAM[6]: __iter__ the hero, shards [2,0,1] with card 2 loaded, workers 0
         0.12        "Splits" (27.58): the shards the hero (machine hero null), one opacity dip 1 -> 0.5 -> 1 (0.12-0.82)
         1.96        "multiple" (29.42): fetch the hero, shards back to ink; 2.06 workers 1 (first photocopy)
         2.36        "workers," (29.72): workers 2, the second photocopy and x2
         3.14 - end  still on SEAM[7] (hero fetch, workers 2); samples keep hopping (SC.clock) -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.199" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.199, MASTER = 27.360;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  const E = SC.E();
  const CUE = {
    splits: 0.220,     /* "Splits"    27.58 */
    multiple: 2.060,   /* "multiple"  29.42 */
    workers: 2.360,    /* "workers,"  29.72 */
    still: 3.140,      /* ~30.50: SEAM[7] from here */
  };
  function state(t) {
    if (t <= 0) return SC.SEAM[6];
    if (t >= CUE.still) return SC.SEAM[7];
    const A = SC.SEAM[6];
    const sh = Object.assign({}, A.shards);
    const S = Object.assign({}, A, { shards: sh });
    if (t >= CUE.splits - 0.1 && t < CUE.multiple - 0.1) {
      S.hero = null; sh.hero = 1;                                    // the one hero: the shards
      sh.o = 1 - 0.5 * E.sine(SC.pulse(t, CUE.splits - 0.1, 0.7));   // one dip on "Splits"
    }
    if (t >= CUE.multiple - 0.1) S.hero = "fetch";
    S.workers = t >= CUE.workers ? 2 : t >= CUE.multiple ? 1 : 0;   // the photocopies one at a time
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
