<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 07_splits: beat 7, "Splits are also your problem, too. If you run multiple workers, splitting the stream between them is up to you to determine."
         Opens on SEAM[6], ends on SEAM[7] (forked to two workers' __iter__, the "?" the hero; machine hidden: workers 2).
         beat-local cues (master − 27.36): Splits@27.58 multiple@29.42 workers@29.72 splitting@30.30 determine.@31.98
         0.12       "Splits": the shards the hero
         0.30–1.10  the shard in memory goes back up to its slot (the shards are the source again)
         1.90–2.60  "multiple workers": the pipe forks under the shards into two __iter__ gates, both the hero
         2.85       "splitting the stream": the "?" between them the hero (which shard goes where is yours)
         4.85–end   SEAM[7] -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/stream.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.199" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.199, MASTER = 27.360;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  const E = SC.E(), { seg } = SC;
  const CUE = { splits: 0.22, multiple: 2.06, splitting: 2.94 };
  const T = { fork: 1.90, still: 4.85 };
  function state(t) {
    if (t <= 0) return SC.SEAM[6];
    if (t >= T.still) return SC.SEAM[7];
    const hero = t < CUE.splits - 0.1 ? "iter" : t < CUE.multiple - 0.1 ? "shards" : t < CUE.splitting - 0.1 ? "iter" : "split";
    return Object.assign({}, SC.SEAM[7], { stream: { o: 1, hero, order: [2, 0, 1],
      load: 1 - E.io(seg(t, 0.3, 1.1)), lanes: E.io(seg(t, T.fork, T.fork + 0.7)) } });
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
