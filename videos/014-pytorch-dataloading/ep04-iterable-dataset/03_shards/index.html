<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 03_shards: beat 3, "I most frequently use this when training bigger models. You pack the data into shards and just stream them through."
         Opens on SEAM[2] (the EP4.ITER card), ends on SEAM[3] (the stream, flowing, the shards the hero).
         beat-local cues (master − 7.285), from words.json: I@7.61 pack@9.80 shards@10.62 stream@11.46 through.@11.94
         0.15–0.55  the card flips to the stream: an empty pipe, __iter__ the hero, the DataLoader bar
         2.45–3.10  "pack the data into shards": the three shards drop in at the top; the hero on "shards" (3.335)
         3.95–4.80  "stream them through": samples fill the pipe from the top, one at a time
         4.85–end   SEAM[3] itself -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/stream.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.150" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.150, MASTER = 7.285;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  const E = SC.E(), { seg } = SC;
  const CUE = { i: 0.325, pack: 2.515, shards: 3.335, stream: 4.175 };
  const T = { flip: 0.15, srcIn: CUE.pack - 0.07, flowIn: CUE.stream - 0.225, still: 4.85 };
  function state(t) {
    if (t <= T.flip) return SC.SEAM[2];
    if (t >= T.still) return SC.SEAM[3];
    const flip = 1 - seg(t, T.flip, T.flip + 0.4);
    const S = Object.assign({}, SC.SEAM[3], { flip, stream: {
      o: 1, hero: t >= CUE.shards - 0.1 ? "shards" : "iter",
      src: E.out(seg(t, T.srcIn, T.srcIn + 0.65)), flow: seg(t, T.flowIn, T.flowIn + 0.85) } });
    if (flip > 0) S.code = SC.SEAM[2].code;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
