<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 03_shards: beat 3, "I most frequently use this when training bigger models. You pack the data into shards and just stream them through."
         Opens on SEAM[2] (the EP4.ITER card, yield lit, cursor off), ends on SEAM[3] (the machine, shards on, the shards the hero).
         beat-local cues (master − 7.285), from words.json: I@7.61 shards@10.62 stream@11.46 through.@11.94
         0.15–0.55  the card flips back to the machine (machine in from flip 0.6, i.e. by ~0.31, on "I"); __iter__ the hero
         3.20–3.45  the shards fade in under the Dataset card; on "shards" (3.335) they become the magenta hero, machine hero null
         4.10–4.45  "stream": one opacity dip of the shards (1 → 0.5 → 1); samples keep hopping (SC.clock)
         4.60–end   SEAM[3] itself -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.150" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.150, MASTER = 7.285;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  SC.E();
  const { seg } = SC;
  // beat-local cues (master − 7.285)
  const CUE = {
    i: 0.325,       /* "I": the machine is back */
    shards: 3.335,  /* "shards": the shards in, the hero */
    stream: 4.175,  /* "stream": one opacity dip */
  };
  const T = {
    flipOut: 0.15,               // the card starts to fade, the machine is in from ~0.31
    shardsIn: CUE.shards - 0.135, // fade in over 0.25 s, arriving just after the word
    dip: CUE.stream - 0.075,     // the dip, 0.35 s wide, lowest just after "stream"
    still: 4.6,                  // SEAM[3] from here (BEAT_SECONDS − 0.3 = 4.85)
  };
  const FLIP = 0.4;
  function state(t) {
    if (t <= T.flipOut) return SC.SEAM[2];
    if (t >= T.still) return SC.SEAM[3];
    const flip = 1 - seg(t, T.flipOut, T.flipOut + FLIP);
    const shardsHero = t >= CUE.shards;
    const o = seg(t, T.shardsIn, T.shardsIn + 0.25) * (1 - 0.5 * SC.pulse(t, T.dip, 0.35));
    const S = { mode: "iterable", strike: 1, workers: 0, hero: shardsHero ? null : "iter", flip,
                shards: { o, order: [0, 1, 2], load: 0, hero: shardsHero ? 1 : 0 } };
    if (flip > 0) S.code = SC.SEAM[2].code;
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    ep.draw(state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
