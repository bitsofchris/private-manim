<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep04 02_iter_code: beat 2, one function (master 3.750–7.285; SEAM[1] -> SEAM[2]).
         0.00       SEAM[1]: the iterable machine, __iter__ the hero, samples hopping.
         0.15–0.55  flip to the EP4.ITER card (the card comes in on "Here", 0.33), the class line
                    already typed (30 characters would not fit the window at a readable cps).
         0.60–2.32  the other three lines type at cps 34; def __iter__(self): is the line being
                    typed and the hero from 0.60, done by 1.20, held through "iter," (1.61).
         2.33       the yield line typed and the hero ("yields", 2.41), cursor off: SEAM[2], still. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep4.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.535" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.535, MASTER = 3.750;   // master seconds of t = 0
  const root = document.getElementById("root");
  const ep = EP4.mount(root);
  SC.E();
  const L = EP4.ITER, HEAD = L[0].t.length, REST = L.slice(1);
  // beat-local cues (master − 3.750), from words.json + the RMS envelope of vo_final.wav:
  // Here,@4.08 iter,@5.36 (onset ~5.27) yields@6.16 (onset ~6.19)
  const CUE = {
    here: 0.33,      /* "Here": the card is in (flip 0.15–0.55) */
    iter: 1.61,      /* "iter,": def __iter__(self): the hero (typed by 1.20) */
    yields: 2.41,    /* "yields": the yield line typed and the hero */
  };
  const FLIP0 = 0.15, FLIP1 = 0.55;
  const T0 = 0.60, CPS = 34;                         // SC_typingSeconds(REST, 34) = 1.72: line 2 by 1.20, all by 2.32
  const T_DONE = T0 + SC_typingSeconds(REST, CPS);
  const HOLD = Math.min(CUE.yields - 0.08, BEAT_SECONDS - 0.3);   // 2.33: SEAM[2] itself from here
  const TOTAL = L.reduce((a, l) => a + l.t.length, 0);
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= 0) { ep.draw(SC.SEAM[1]); return; }
    if (t >= HOLD && t >= T_DONE) { ep.draw(SC.SEAM[2]); return; }
    const flip = SC.seg(t, FLIP0, FLIP1);
    const typed = HEAD + SC_typedAt(REST, t - T0, CPS);
    const lit = t < T0 ? null : "iter";
    ep.draw(Object.assign({}, SC.SEAM[1], {
      flip,
      code: { o: 1, lines: L, typed, lit, cursor: typed < TOTAL ? 1 : 0, blink: t },
    }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
