<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 beat 9, map style: "This" flips the machine (collate) to the Dataset card, class Series(Dataset) lit; "random access" passes the hero to the slice. SEAM[8] -> SEAM[9]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.165" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const START = 41.970, BEAT_SECONDS = 4.165;
  const CUE = {
    flip: 42.22 - START,   /* "This": flip machine -> Dataset card */
    map: 42.78 - START,    /* "map style dataset": class Series(Dataset) lit (lit from the flip) */
    slice: 44.64 - START,  /* "random access": the hero passes to the slice */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const E = SC.E();
  const A = SC.SEAM[8], B = SC.SEAM[9];
  function render(t) {
    SC.clock = START + t;
    const flip = E.io(SC.seg(t, CUE.flip, CUE.flip + 0.4));
    const lit = t >= CUE.slice - 0.05 ? "slice" : "dataset";
    let S;
    if (flip <= 0) S = A;
    else if (lit === "slice") S = B;
    else S = Object.assign({}, B, { flip, hero: flip < 1 ? A.hero : null, code: Object.assign({}, B.code, { lit }) });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
