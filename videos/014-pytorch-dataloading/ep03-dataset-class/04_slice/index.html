<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 beat 4 "Just a slice" (master 13.750–20.650): opens on the machine (SEAM[3], getitem the hero).
         "Here" (14.02): flip to the Dataset card (EP.MAP fully typed, __getitem__ lit), 0.4 s.
         "slice" (18.16): the hero passes to `return self.series[i]`. "index" (19.50): back to __getitem__.
         Still from then: SEAM[4]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.9" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.9;
  const START = 13.75;                      // master start
  const CUE = {
    here: 14.02 - START,                    /* "Here" */
    slice: 18.16 - START,                   /* "slice" */
    index: 19.50 - START,                   /* "index" */
  };
  const LEAD = 0.05;                        // changes land just before their word
  const FLIP = { at: CUE.here - LEAD, w: 0.4 };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const ease = SC.E().io;
  const M = SC.SEAM[3], C = SC.SEAM[4];
  const card = (lit) => Object.assign({}, C, { code: Object.assign({}, C.code, { lit }) });
  function state(t) {
    const f = ease(SC.seg(t, FLIP.at, FLIP.at + FLIP.w));
    if (f <= 0) return M;                                                         // the machine, getitem the hero
    if (f < 1) return Object.assign({}, M, { flip: f, code: C.code });            // the kit's crossfade
    if (t < CUE.slice - LEAD) return C;                                           // __getitem__ lit
    if (t < CUE.index - LEAD) return card("slice");                               // return self.series[i]
    return C;                                                                     // __getitem__ again: SEAM[4]
  }
  function render(t) {
    SC.clock = START + t;                   // master seconds (the machine shows only through the flip)
    kit.draw(null, state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
