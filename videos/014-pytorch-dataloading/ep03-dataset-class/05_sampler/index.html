<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 05_sampler: "the sampler owns the order. It uses the length to make a random
         sequence of indices and calls __getitem__ on each one." Opens on the Dataset card
         (SEAM[4]), flips to the machine over the first 0.4 s; sampler -> len -> sampler -> getitem.
         Ends on SEAM[5]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.57" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.57;
  const START = 20.65;
  const CUE = {
    sampler: 20.92 - START,      /* "sampler" (lands under the flip) */
    len: 23.34 - START - 0.05,   /* "length" */
    random: 24.02 - START - 0.05,/* "random" */
    getitem: 25.80 - START,      /* "calls"@25.44 / "__getitem__"@25.86 */
  };
  const FLIP = 0.4;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const E = SC.E();
  const A = SC.SEAM[4], B = SC.SEAM[5];
  function heroAt(t) {
    if (t >= CUE.getitem) return "getitem";
    if (t >= CUE.random) return "sampler";
    if (t >= CUE.len) return "len";
    return "sampler";
  }
  function render(t) {
    SC.clock = START + t;
    let S;
    if (t <= 0) S = A;
    else if (t >= BEAT_SECONDS - 0.3) S = B;
    else if (t < FLIP) {
      const flip = 1 - E.io(SC.seg(t, 0, FLIP));
      S = Object.assign({}, A, { flip, hero: flip < 1 ? heroAt(t) : null });
    } else S = Object.assign({}, B, { hero: heroAt(t) });
    kit.draw(null, S);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
