<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 01_hook (0.000–6.050): "A PyTorch dataset class has two functions. How many samples and how do I get sample i?"
         Opens on SEAM[0] (the Dataset card typing its last line), ends on SEAM[1]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6.05" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6.05;
  const START = 0.0;
  const CUE = {
    two: 2.20 - START - 0.05,   /* "two" (functions) */
    how: 3.36 - START - 0.05,   /* "How" (many samples) */
    get: 4.98 - START - 0.05,   /* "get" (sample i) */
    cursorOff: 5.50 - START,    /* after "i?" (5.52): cursor off, still to the end */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const S0 = SC.SEAM[0], S1 = SC.SEAM[1];
  const REST_OF_LINE = [{ t: EP.MAP[4].t.slice(S0.code.typed - EP.chars(EP.MAP.slice(0, 4))) }];
  const TYPE_END = SC_typingSeconds(REST_OF_LINE);   // ~0.86 s at the default 22 cps
  function render(t) {
    SC.clock = START + t;
    if (t >= CUE.cursorOff) { kit.draw(null, S1); return; }
    // the last line finishes typing from SEAM[0]; __getitem__ stays the hero while it lands
    const typed = t < TYPE_END ? S0.code.typed + SC_typedAt(REST_OF_LINE, t) : Infinity;
    const lit = t >= CUE.get ? "getitem" : t >= CUE.how ? "len" : t >= CUE.two ? EP.TWO : "getitem";
    kit.draw(null, Object.assign({}, S0, { code: Object.assign({}, S0.code, { typed, lit, cursor: 1, blink: t }) }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
