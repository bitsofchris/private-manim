<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 00_layout: the Dataset-class episode on the shared kit, in four states. Not in the Short.
         0–2 s  take A, frame 0: the Dataset card typing its last line, __getitem__ the hero
         2–4 s  take B, the alternate frame 0: the machine running, __getitem__ lit on the Dataset card
         4–6 s  the hand-rolled loop typing (beat 7's card)
         6–8 s  beat 8: "the slice is getitem plus collate", the collate station the hero -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const S0 = SC.SEAM[0];
  function render(t) {
    SC.clock = t;
    if (t < 2) {
      const typed = S0.code.typed + SC_typedAt([{ t: EP.MAP[4].t.slice(6) }], t);
      kit.draw(null, Object.assign({}, S0, { code: Object.assign({}, S0.code, { typed, blink: t }) }));
    } else if (t < 4) {
      kit.draw(null, SC.SEAM[3]);
    } else if (t < 6) {
      const typed = SC_typedAt(EP.HAND, t - 4, 30);
      kit.draw(null, { flip: 1, hero: null, code: { o: 1, lines: EP.HAND, typed, lit: EP.litAt(EP.HAND, typed), cursor: 1, blink: t } });
    } else {
      kit.draw(null, SC.SEAM[8]);
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
