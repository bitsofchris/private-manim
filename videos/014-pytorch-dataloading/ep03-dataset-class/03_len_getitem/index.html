<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 beat 3 "len, getitem" (master 8.310–13.750): the machine, samples hopping (SC.clock).
         "__len__" (8.54): len the hero. "__getitem__" (10.94): getitem the hero.
         "index" (12.80): the __getitem__ label swells once (≤1.10×, from its right edge), restored by ~13.35. Still from then: SEAM[3]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.44" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.44;
  const START = 8.31;                       // master start
  const CUE = {
    len: 8.54 - START,                      /* "__len__" */
    getitem: 10.94 - START,                 /* "__getitem__" */
    index: 12.80 - START,                   /* "index" (i) */
  };
  const LEAD = 0.05;                        // hero lands just before its word
  const SWELL = { at: CUE.index - LEAD, w: 0.6, k: 0.10 };   // ends at local 5.04 (master 13.35)
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const getLabel = kit.parts.getitem.dom[0];
  function state(t) {
    if (t < CUE.len - LEAD) return SC.SEAM[2];                                  // hero none (beat 2's end)
    if (t < CUE.getitem - LEAD) return Object.assign({}, SC.SEAM[2], { hero: "len" });
    return Object.assign({}, SC.SEAM[3]);                                       // hero getitem
  }
  function render(t) {
    SC.clock = START + t;                   // master seconds: the hop carries on across the cut
    kit.draw(null, state(t));
    const p = SC.pulse(t, SWELL.at, SWELL.w);
    if (p > 0) {
      getLabel.style.transformOrigin = "right center";   // grows left, into the space by "Dataset": at rest the label already meets the card's right edge
      getLabel.style.transform = `scale(${(1 + SWELL.k * p).toFixed(4)})`;
    } else {
      getLabel.style.transform = "";
      getLabel.style.transformOrigin = "";
    }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
