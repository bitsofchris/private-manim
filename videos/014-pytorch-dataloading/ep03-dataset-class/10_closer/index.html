<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 beat 10, closer: the Dataset card stays; "two functions" lights both methods (EP.TWO) to the end. SEAM[9] -> SEAM[10]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.365" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const START = 46.135, BEAT_SECONDS = 4.365;
  const CUE = {
    two: 46.96 - START,  /* "two functions": both method lines lit (EP.TWO), held to the end */
  };
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const A = SC.SEAM[9], B = SC.SEAM[10];
  function render(t) {
    SC.clock = START + t;
    kit.draw(null, t >= CUE.two - 0.05 ? B : A);
    // the two method lines swell once as they light (the one DOM change; restored by ~CUE.two + 0.6)
    const p = SC.pulse(t, CUE.two - 0.05, 0.6);
    [1, 3].forEach((r) => {   // EP.MAP rows: 1 = def __len__, 3 = def __getitem__
      const el = kit.code.rows[r];
      el.style.transformOrigin = "left center";
      el.style.transform = p > 0 ? `scale(${(1 + 0.05 * p).toFixed(4)})` : "";
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
