<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep03 02_loader_job (6.050–8.310): "Everything else is the data loader's job."
         Opens on SEAM[1] (the Dataset card), flips to the machine, sweeps the stations, ends on SEAM[2]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.26" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 2.26;
  const START = 6.05;
  const CUE = {
    everything: 6.32 - START - 0.02,   /* "Everything": the flip to the machine starts */
    data: 7.34 - START - 0.05,         /* "data" (loader's): the station sweep starts */
  };
  const FLIP = 0.4;
  const STEP = 0.17;                   // per station: 1.24 + 4 × 0.17 = 1.92, before the seam window (BEAT_SECONDS − 0.3 = 1.96)
  const SWEEP = ["sampler", "fetch", "batching", "collate"];
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const E = SC.E();
  const S1 = SC.SEAM[1], S2 = SC.SEAM[2];
  const SWEEP_END = Math.min(CUE.data + SWEEP.length * STEP, BEAT_SECONDS - 0.3);
  function render(t) {
    SC.clock = START + t;
    const u = SC.seg(t, CUE.everything, CUE.everything + FLIP);
    if (u <= 0) { kit.draw(null, S1); return; }
    if (u < 1) {
      // mid-flip: the card's code rides along so the crossfade is the kit's
      kit.draw(null, Object.assign({}, S2, { flip: 1 - E.io(u), hero: null, code: S1.code }));
      return;
    }
    let hero = null;
    if (t >= CUE.data && t < SWEEP_END) hero = SWEEP[Math.min(SWEEP.length - 1, Math.floor((t - CUE.data) / STEP))];
    kit.draw(null, Object.assign({}, S2, { hero }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
