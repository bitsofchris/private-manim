<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep05 beat 1 "Hook: the twins" (master 0.000–4.390): SEAM[0] -> SEAM[1].
         Frame 0: the trap already running (samples hopping), the twin [4, 512] pair the hero.
         "num_workers" (1.56): hero -> fetch (the two photocopies, x2). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep5.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.390" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 4.390, MASTER = 0.000;
  // cues, beat-local (master - MASTER); onset checked on the vo_final.wav envelope
  const CUE = {
    workers: 1.48,   /* "num_workers" 1.56 (envelope onset 1.48, after the gap following "PyTorch,") */
  };
  const root = document.getElementById("root");
  const kit = EP5.mount(root);
  // SEAM[0] (the trap, the twin pair the hero, samples already hopping) -> SEAM[1] (the trap, fetch the hero)
  function state(t) {
    return t < CUE.workers ? SC.SEAM[0] : SC.SEAM[1];
  }
  function render(t) {
    SC.clock = MASTER + t;   // master seconds: the hop runs from frame 0 and carries on across the cut
    EP5.draw(kit, state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
