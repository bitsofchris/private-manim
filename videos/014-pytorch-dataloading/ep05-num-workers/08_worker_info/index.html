<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep05 08_worker_info (beat 8, master 39.130–44.855): "Ask for the worker info and have worker k take
         every nth sample, starting at k." Opens on SEAM[7] (the trap, hero iter); "Ask" flips to the shard
         card (the machine under it switches to fixed, hero fetch, once hidden); the first three shard lines
         type one per window, each landing on the word that names it; "starting" lights k and step together.
         Ends on SEAM[8]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep5.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5.725" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 5.725, MASTER = 39.130;
  const root = document.getElementById("root");
  const kit = EP5.mount(root);
  const { seg } = SC, L = EP5.LINES.shard, FROM = SC.SEAM[7], TO = SC.SEAM[8];
  // beat-local cues (master − 39.130), from words.json, checked on a 20 ms RMS envelope of vo_final.wav
  const CUE = {
    ask: 0.29,       /* "Ask" (39.42): flip to the shard card over 0.4 s */
    info: 1.17,      /* "info" (40.30): line 0 `info = get_worker_info()` in, lit fetch */
    k: 2.79,         /* "k" (41.92): line 1 `start = info.id        # k` in, lit k */
    nth: 3.77,       /* "nth" (42.90): line 2 `step = info.num_workers` in, lit step */
    starting: 4.83,  /* "starting" (43.96): k and step lit together, cursor off: SEAM[8] from here */
  };
  // each line types in its own window, ending LEAD before its cue; the typist's rhythm (SC_typedAt) inside it.
  // Line 0 has only the flip's tail to land in (0.5 → 1.12), so it types faster.
  const LEAD = 0.05;
  const WIN = [{ end: CUE.info, cps: 38 }, { end: CUE.k, cps: 28 }, { end: CUE.nth, cps: 28 }].map((w, i) => {
    const dur = SC_typingSeconds([L[i]], w.cps);
    return { i, cps: w.cps, from: w.end - LEAD - dur, before: L.slice(0, i).reduce((a, l) => a + l.t.length, 0) };
  });
  // starts 0.49 / 2.05 / 2.89 (master 39.62 / 41.18 / 42.02): line 0 as the card comes in, each later line after the one before is in
  function typedAt(t) {
    let n = 0;
    WIN.forEach((w) => { if (t > w.from) n = w.before + SC_typedAt([L[w.i]], t - w.from, w.cps); });
    return n;
  }
  // the hero follows the line being typed: the last line with a character in (line 0 before any)
  function cursorLit(typed) {
    let n = 0, lit = L[0].lit;
    L.forEach((ln) => { if (typed > n && ln.lit) lit = ln.lit; n += ln.t.length; });
    return lit;
  }
  function render(t) {
    SC.clock = MASTER + t;
    if (t <= CUE.ask) { EP5.draw(kit, FROM); return; }
    if (t >= CUE.starting) { EP5.draw(kit, TO); return; }
    const flip = seg(t, CUE.ask, CUE.ask + 0.4);
    const typed = typedAt(t);
    // the machine under the card: the trap until it is hidden (flip >= 0.6), then fixed, hero fetch
    const machine = flip >= 0.6 ? TO : FROM;
    EP5.draw(kit, Object.assign({}, machine, {
      flip,
      code: { o: 1, lines: L, typed, lit: cursorLit(typed), cursor: 1, blink: t },
    }));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
