<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep05 06_true_code (master 33.320, 3.700 s): "Two workers, batch size 4, the first two batches will be identical."
         Opens on SEAM[5] (the trap, twins hero). "Two": flip to the workers card, typed at ~40 cps with the
         hero following the line being typed (dataset -> batching -> fetch -> twins). "identical": the
         # True line is the hero, cursor off, still. Ends on SEAM[6]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep5.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.7" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.700, MASTER = 33.320;
  // beat-local cues (master − 33.320), from words.json, checked on a 20 ms RMS envelope of vo_final.wav:
  // Two@33.58 workers,@33.74 batch@34.32 size@34.52 4,@34.74 the@35.20 first@35.28 two@35.54 batches@35.68 will@36.11 be@36.18 identical.@36.32
  const CUE = {
    two: 0.26,        /* "Two" (33.58; onset 33.56): flip 0 -> 1 over 0.4 s */
    type: 0.45,       /* typing starts as the card comes up */
    identical: 2.94,  /* "identical" (36.32; onset 36.26): # True is the hero, cursor off, still */
  };
  const L = EP5.LINES.workers, CPS = 40;          // SC_typingSeconds(L, 40) = 2.20: line 1 by 1.49, line 2 by 1.93, all by 2.65
  const TOTAL = L.reduce((a, l) => a + l.t.length, 0);
  const root = document.getElementById("root");
  const kit = EP5.mount(root);
  const { seg } = SC, FROM = SC.SEAM[5], TO = SC.SEAM[6];
  // the line being typed: the last line with at least one character typed (line 0 before any)
  function cursorLit(typed) {
    let n = 0, lit = L[0].lit;
    L.forEach((ln) => { if (typed > n && ln.lit) lit = ln.lit; n += ln.t.length; });
    return lit;
  }
  function state(t) {
    if (t <= CUE.two) return FROM;
    if (t >= CUE.identical) return TO;
    const typed = SC_typedAt(L, t - CUE.type, CPS);
    return Object.assign({}, FROM, {                 // the trap stays under the card (SEAM[5] == SEAM[6]'s machine)
      flip: seg(t, CUE.two, CUE.two + 0.4),
      code: { o: 1, lines: L, typed, lit: cursorLit(typed), cursor: typed < TOTAL ? 1 : 0, blink: t },
    });
  }
  function render(t) {
    SC.clock = MASTER + t;
    EP5.draw(kit, state(t));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
