<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep05 beat 2 "Full copy" (master 4.390–8.360): SEAM[1] -> SEAM[2].
         "full copy" (5.48): the two worker photocopies in fetch pulse once, in turn (fetch stays the hero).
         "collating" (7.26): hero -> collate; still to the end. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/ep5.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.970" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.970, MASTER = 4.390;
  // cues, beat-local (master - MASTER); onsets checked on the vo_final.wav envelope
  const CUE = {
    full: 1.07,      /* "full" 5.48 (the f starts ~5.46) */
    copy: 1.41,      /* "copy" 5.80 */
    collate: 2.85,   /* "collating" 7.26 (the k burst at 7.24) */
  };
  const PULSE = 0.5, PEAK = 0.18;   // each photocopy swells to 1.18x and back over 0.5 s
  const root = document.getElementById("root");
  const kit = EP5.mount(root);
  const workers = Array.from(kit.stations.fetch.glyph.children);   // the two worker photocopies (150 x 56 each)
  // SEAM[1] (fetch the hero) -> SEAM[2] (collate the hero); still (bar the sample hop) from "collating"
  function state(t) {
    return t < CUE.collate ? SC.SEAM[1] : SC.SEAM[2];
  }
  // scale a photocopy about its centre; the kit rewrote its translate this draw, so this is undone next draw
  function swell(g, s) {
    g.setAttribute("transform", `${g.getAttribute("transform")} translate(75 28) scale(${s.toFixed(4)}) translate(-75 -28)`);
  }
  function render(t) {
    SC.clock = MASTER + t;   // master seconds: the hop carries on across the cut
    EP5.draw(kit, state(t));
    // "full copy": the two photocopies pulse once, in turn (fetch stays the hero)
    [CUE.full, CUE.copy].forEach((at, k) => {
      const p = SC.pulse(t, at, PULSE);
      if (p > 0) swell(workers[k], 1 + PEAK * p);
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
