<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep02 05_sampler: SEAM[4] -> SEAM[5]. "sampler": hero -> sampler; "order" and "random sequence of indices": the indices pulse. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7.13" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 7.13, START = 18.75;
  // cues, beat-local (master - START); onsets checked on the vo_final.wav envelope
  const CUE = {
    sampler: 1.13,   /* "sampler." 19.88 */
    order: 2.47,     /* "order." 21.22 (envelope onset; words.json 21.18) */
    random: 5.57,    /* "random sequence of indices" 24.32 */
  };
  const PULSE_W = 0.6, PULSE_S = 0.14;   // the indices swell 14 % and settle; still from 6.17
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const IDX = SC.D.indices.join(" ");
  const idx = kit.parts.sampler.dom.find((el) => el.textContent === IDX);
  function setPulse(el, s) {
    if (s === 1) { el.style.transform = ""; el.style.transformOrigin = ""; return; }
    el.style.transformOrigin = "50% 50%";
    el.style.transform = `scale(${s.toFixed(4)})`;
  }
  function state(t) {
    return t < CUE.sampler ? SC.SEAM[4] : SC.SEAM[5];
  }
  function render(t) {
    SC.clock = START + t;
    kit.draw(null, state(t));
    const p = Math.max(SC.pulse(t, CUE.order, PULSE_W), SC.pulse(t, CUE.random, PULSE_W));
    setPulse(idx, p > 0 ? 1 + PULSE_S * p : 1);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
