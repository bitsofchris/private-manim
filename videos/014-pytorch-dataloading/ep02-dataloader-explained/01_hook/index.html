<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep02 beat 1 "Hook" (master 0.000–8.470): the machine running from frame 0 (samples hopping, SC.clock), the batch the hero.
         "dataset's" (1.40): hero -> Dataset card. "call it n number of times" (5.40): hero -> batching, its ×32 pulses on "n" (6.31).
         "a batch" (7.78): hero -> the batch card, which pulses once. Still (state-wise) from 8.18. Opens SC.SEAM[0], ends SC.SEAM[1]. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.47" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 8.470, MASTER = 0.000;
  // cues (beat-local = master - MASTER; checked on the vo_final envelope)
  const CUE = {
    dataset: 1.40,   /* "dataset's" (1.40): hero -> Dataset card */
    call: 5.40,      /* "call it n number of times" (5.40): hero -> batching */
    n: 6.31,         /* "n" (6.31, sharp onset): the ×32 pulses once */
    batch: 7.78,     /* "a batch" (7.78): hero -> batch card, which pulses once */
  };
  const PW = 0.4;    // pulse width: the batch pulse ends at 8.18, the still hold (SEAM[1]) runs 8.18–8.47
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { pulse, G } = SC;
  // scale a part's elements about a centre (cx, cy); s === 1 clears exactly (as ep01 01_hook_batch)
  function scaleAbout(svgEls, domEls, cx, cy, s) {
    if (s === 1) {
      svgEls.forEach((el) => el.removeAttribute("transform"));
      domEls.forEach((el) => { el.style.transform = ""; el.style.transformOrigin = ""; });
      return;
    }
    const tr = `translate(${cx} ${cy}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})`;
    svgEls.forEach((el) => el.setAttribute("transform", tr));
    domEls.forEach((el) => {
      const left = parseFloat(el.style.left) || 0, top = parseFloat(el.style.top) || 0;
      el.style.transformOrigin = `${cx - left}px ${cy - top}px`;
      el.style.transform = `scale(${s.toFixed(4)})`;
    });
  }
  const bt = G.batch, BCX = bt.x + bt.w / 2, BCY = bt.y + bt.h / 2;          // the batch card's centre
  const PB = kit.parts.batch;
  const x32 = kit.parts.batching.dom.find((el) => el.textContent.startsWith("×"));   // the ×32 label
  function state(t) {
    if (t <= 0) return SC.SEAM[0];
    if (t >= CUE.batch) return SC.SEAM[1];                                     // hero batch, held to the end
    const hero = t < CUE.dataset ? "batch" : t < CUE.call ? "dataset" : "batching";
    return Object.assign({}, SC.SEAM[1], { hero });
  }
  function render(t) {
    SC.clock = MASTER + t;                                                     // master seconds: the hop runs from frame 0
    kit.draw(null, state(t));
    scaleAbout(PB.svg, PB.dom, BCX, BCY, 1 + 0.06 * pulse(t, CUE.batch, PW)); // "a batch": the card swells once and settles
    const s = 1 + 0.18 * pulse(t, CUE.n, 0.5);                                // "n number of times": ×32 swells once
    if (s === 1) { x32.style.transform = ""; x32.style.transformOrigin = ""; }
    else { x32.style.transformOrigin = "50% 50%"; x32.style.transform = `scale(${s.toFixed(4)})`; }
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
