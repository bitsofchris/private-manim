<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep02 beat 2 "Stations" (master 8.470–11.100): the machine running, the batch the hero (SEAM[1]).
         "machine" (9.48): hero off (null). "four" (10.04): the four stations light in turn, top to bottom, 0.19 s each,
         one at a time (sampler, fetch, batching, collate); the last back to rest at 10.80. Ends SC.SEAM[2] (hero null). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2.63" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 2.630, MASTER = 8.470;
  // cues (beat-local = master - MASTER; checked on the vo_final envelope)
  const CUE = {
    machine: 9.48 - MASTER,   /* "machine" (9.48): hero -> null */
    four: 10.04 - MASTER,     /* "four" (words.json 10.08; envelope onset ~10.0): the ripple starts, sampler first */
  };
  const STEP = 0.19;          // each station lit 0.19 s; collate back to rest at master 10.80, so the last 0.3 s hold still
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { STATIONS } = SC;
  // the station labels swell a little while lit (one honest DOM change besides the colour)
  const labs = STATIONS.map((n) => kit.stations[n].lab);
  function state(t) {
    if (t <= 0) return SC.SEAM[1];
    if (t < CUE.machine) return SC.SEAM[1];                                    // the batch still the hero
    const k = Math.floor((t - CUE.four) / STEP);
    if (t >= CUE.four && k < STATIONS.length) return Object.assign({}, SC.SEAM[2], { hero: STATIONS[k] });
    return SC.SEAM[2];                                                         // hero null: before the ripple and after it
  }
  function render(t) {
    SC.clock = MASTER + t;                                                     // master seconds: the hop carries on across the cut
    kit.draw(null, state(t));
    labs.forEach((el, i) => {
      const s = 1 + 0.06 * SC.pulse(t, CUE.four + i * STEP, STEP);
      if (s === 1) { el.style.transform = ""; el.style.transformOrigin = ""; }
      else { el.style.transformOrigin = "0% 50%"; el.style.transform = `scale(${s.toFixed(4)})`; }
    });
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
