<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- ep02 beat 4, 04_dataset (master 15.020–18.750): "All it knows is how to go get one sample wherever that data lives."
         Opens on SC.SEAM[3] (the typed loader card, dataset lit; the machine under it has the Dataset card lit). On
         "All" (0.18) S.flip 1 -> 0 over 0.4 s: the machine back with the Dataset card the hero. On "one sample" (1.46)
         the Dataset card (with its two method labels) swells once (6 %, 0.6 s) and settles; still on SC.SEAM[4] from 2.06. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <script src="ep/seam.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.73" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 3.730, MASTER = 15.020;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const { seg, pulse, G } = SC;
  // beat-local cues (master − 15.020), from words.json: All@15.20 knows@15.48 one@16.48 sample@16.82 lives.@18.22
  const CUE = {
    all: 0.18,       /* "All": the card flips back to the machine over 0.4 s */
    one: 1.46,       /* "one sample": the Dataset card pulses once */
  };
  const PW = 0.6, FLIP = 0.4;
  const STILL = CUE.one + PW;                      // 2.06: SC.SEAM[4] from here, untouched
  const ds = G.dataset, CX = ds.x + ds.w / 2, CY = ds.y + ds.h / 2;   // the Dataset card's centre (507.5, 325)
  // the card, its "Dataset" label and the two map-style methods on it move as one
  const PARTS = [kit.parts.dataset, kit.parts.len, kit.parts.getitem];
  function setPulse(s) {
    PARTS.forEach((P) => {
      if (s === 1) {
        P.svg.forEach((el) => el.removeAttribute("transform"));
        P.dom.forEach((el) => { el.style.transform = ""; el.style.transformOrigin = ""; });
        return;
      }
      const tr = `translate(${CX} ${CY}) scale(${s.toFixed(4)}) translate(${-CX} ${-CY})`;
      P.svg.forEach((el) => el.setAttribute("transform", tr));
      P.dom.forEach((el) => {
        const left = parseFloat(el.style.left) || 0, top = parseFloat(el.style.top) || 0;
        el.style.transformOrigin = `${CX - left}px ${CY - top}px`;   // about the card's centre, not the label's
        el.style.transform = `scale(${s.toFixed(4)})`;
      });
    });
  }
  function state(t) {
    if (t <= CUE.all) return SC.SEAM[3];
    if (t >= STILL) return SC.SEAM[4];
    const flip = 1 - seg(t, CUE.all, CUE.all + FLIP);
    const S = { hero: "dataset", workers: 0, flip };
    if (flip > 0) S.code = SC.SEAM[3].code;       // the card fades out through the kit's crossfade
    return S;
  }
  function render(t) {
    SC.clock = MASTER + t;
    kit.draw(null, state(t));
    setPulse(t >= STILL ? 1 : 1 + 0.06 * pulse(t, CUE.one, PW));
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
