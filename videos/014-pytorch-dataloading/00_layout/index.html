<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- 00_layout: the canonical frame of the PyTorch Dataloading series, in three states. Not in any Short.
         0–2 s  ep 2's frame 0: map-style, the sampler named, the loader call typed in the band
         2–4 s  ep 5's twin batches: iterable, the sampler struck, two workers, [4, 512] twice, equal → True
         4–6 s  ep 3's look: __getitem__ the hero, the Dataset class typed in the band -->
    <script src="vendor/gsap.min.js"></script>
    <script src="kit/data.js"></script>
    <script src="kit/machine.js"></script>
    <script src="kit/code.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920"></div>
    <script>
(() => {
  const BEAT_SECONDS = 6;
  const root = document.getElementById("root");
  const kit = SC.mount(root);
  const C = SC.D.code;
  const LOOKS = [
    { mode: "map", workers: 0, hero: "sampler", code: { o: 1, lines: C.loader, lit: "sampler" } },
    { mode: "iterable", strike: 1, workers: 2, twins: 1, shape: SC.D.series.smallShape, hero: "twins",
      code: { o: 1, lines: C.workers, lit: "twins" } },
    { mode: "map", workers: 0, hero: "getitem", code: { o: 1, lines: C.mapStyle, lit: "getitem" } },
  ];
  function render(t) {
    SC.clock = t;
    kit.draw(null, LOOKS[Math.min(2, Math.floor(t / 2))]);
  }
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = SC.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
