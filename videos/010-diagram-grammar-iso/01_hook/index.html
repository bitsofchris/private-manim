<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 1 Hook (3.99 s): the figure is there faint at frame 0 and draws in bottom to top. Ends on CANON. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="diagram/diagram.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.99" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 3.99;
  // VO (beat-local = master): "Here's how you can understand AI architecture diagrams" 0.35-2.99, "like a pro" 2.99-3.99
  const CUE = {
    draw: 0.0,   /* frame 0, before "Here's": the draw-in is already climbing */
    done: 2.9,   /* end of "diagrams": the figure is complete */
  };
  const GHOST = 0.32;        // the faint complete figure under the draw-in
  const GHOST_LABEL = 0.42;  // its labels: readable, dim
  const R0 = 0.09;           // reveal at frame 0: Embed is already partly drawn
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const labels = DG.makeLabels(root);
  const { seg, lerp, clamp01 } = ISO;
  ISO.guides(root);
  // the same soft edge DG.draw uses for `reveal`, so a label brightens with its box
  const vis = (rev, z) => clamp01((rev * (DG.TOP + 60) - z) / 60);
  function render(t) {
    if (t >= CUE.done) { DG.canon(g, labels); return; }           // CANON, held through "like a pro"
    const u = seg(t, CUE.draw, CUE.done);
    const rev = lerp(R0, 1, u);                                    // bottom to top, steady climb
    const ghost = GHOST * (1 - seg(rev, 0.93, 1));                 // the faint copy is gone as the top lands
    ISO.ground(g, DG.BASE_Y + 8);
    DG.draw(g, { alpha: ghost });                                  // the whole figure, faint
    DG.draw(g, { reveal: rev });                                   // the drawn-in part, full strength, on top
    DG.styleLabels(labels, { reveal: rev });
    const gl = GHOST_LABEL * (ghost / GHOST);
    DG.BOXES.forEach(([n]) => { const v = vis(rev, DG.Z[n] + DG.BOX_H / 2); labels[n].style.opacity = lerp(gl, 1, v).toFixed(3); });
    labels.n.style.opacity = lerp(gl, 1, vis(rev, (DG.BRACKET_Z[0] + DG.BRACKET_Z[1]) / 2)).toFixed(3);
  }
  // HyperFrames' static lint looks for this registration in the beat file itself.
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
