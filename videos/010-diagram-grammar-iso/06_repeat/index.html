<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 6, Repeat: the bracket and N× are the hero; ghost copies of the block stack back in depth. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="diagram/diagram.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.7" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  // Beat 6, Repeat. Opens on CANON; its last frame is the last frame of the Short.
  const BEAT_SECONDS = 4.70;
  // VO (beat-local = master - 43.65): "A bracket with N× means this block repeats N times." then ~1.0 s of silence, frame held.
  const CUE = {
    bracket: 0.04,   /* "A bracket": bracket and N× turn magenta (hero), full by "bracket" ~0.7 */
    nx: 1.11,        /* "N×": the N× label swells once */
    repeats: 2.20,   /* "block repeats": ghost copies of the block stamp back in depth, one after another */
    still: 3.75,     /* end of "N times": ghosts stacked, bracket magenta; held to the end */
  };
  const GHOSTS = 2, STEP = 118, STAGGER = 0.45, STAMP = 0.6;   // copies, world-y spacing, s between stamps, s per stamp
  const GHOST_ALPHA = [0.55, 0.34];                             // nearest copy first
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const labels = DG.makeLabels(root);
  const E = ISO.E(), seg = ISO.seg;
  const bump = (u) => Math.sin(Math.PI * ISO.clamp01(u));
  ISO.guides(root);

  function render(tRaw) {
    const t = Math.min(tRaw, CUE.still);
    const st = { bracket: E.out(seg(t, CUE.bracket - 0.04, CUE.bracket + 0.66)) };
    ISO.ground(g, DG.BASE_Y + 8);
    // ghost copies of the repeated block, farthest first, all behind the main figure
    for (let k = GHOSTS; k >= 1; k--) {
      const u = seg(t, CUE.repeats + (k - 1) * STAGGER, CUE.repeats + (k - 1) * STAGGER + STAMP);
      if (u <= 0) continue;
      // each copy leaves from the copy in front of it and settles one step further back
      DG.draw(g, { only: "block", yOff: -STEP * (k - 1 + E.out(u)), alpha: GHOST_ALPHA[k - 1] * seg(u, 0, 0.35) });
    }
    DG.draw(g, st);
    DG.styleLabels(labels, st);
    // the N× label swells once on its word (same shear as DG.makeLabels, scaled about its centre)
    const s = 1 + 0.14 * bump(seg(t, CUE.nx, CUE.nx + 0.6));
    labels.n.style.transform = `matrix(${s.toFixed(4)}, ${(DG.SHEAR * s).toFixed(4)}, 0, ${s.toFixed(4)}, 0, 0)`;
  }
  // HyperFrames' static lint looks for this registration in the beat file itself.
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
