<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 2 Grammar (8.27 s): CANON, one pulse, the paper's Figure 1 replaces ours, zooms to its decoder column, ours fades back. Ends on CANON. -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <script src="diagram/diagram.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene, #fig { position: absolute; left: 0; top: 0; }
      /* the paper may not enter the caption band: clipped at y 1100, faded out just above it */
      #paperclip { position: absolute; left: 0; top: 0; width: 1080px; height: 1100px; overflow: hidden;
                   -webkit-mask-image: linear-gradient(to bottom, #000 0px, #000 1050px, transparent 1100px);
                   mask-image: linear-gradient(to bottom, #000 0px, #000 1050px, transparent 1100px); }
      #paper { position: absolute; left: 0; top: 0; width: 739px; height: 1060px; background: #d9d8d0; border-radius: 14px;
               transform-origin: 0 0; opacity: 0; }
      #paper img { position: absolute; left: 30px; top: 30px; width: 679px; height: 1000px; mix-blend-mode: multiply; }
      #figure { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8.27" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
      <div id="paperclip" data-layout-allow-overflow data-layout-allow-occlusion>
        <div id="paper" data-layout-allow-overflow data-layout-allow-occlusion>
          <img src="figure1_aiayn.png" alt="Figure 1 of Attention Is All You Need (Vaswani et al., 2017)" data-layout-allow-overflow data-layout-allow-occlusion />
        </div>
      </div>
      <div id="figure" data-layout-allow-overflow>
        <canvas id="fig" width="1080" height="1920" data-layout-allow-overflow></canvas>
      </div>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 8.27;
  // VO, beat-local (master - 3.99), read off a 50 ms RMS envelope of vo_final.wav:
  // "Now there's no formal standard" 0.03-1.27 | "but there is a de facto" 1.66-2.55 | "visual grammar" 2.6-3.3 |
  // "Almost" 3.71 | "every paper figure inherits it" 4.1-5.6 | "from figure one" 5.7-6.5 | "in Attention Is All You Need" 6.51-7.67
  const CUE = {
    grammar: 2.62, /* "visual grammar": one pulse of the whole figure, peak on "grammar" */
    paper: 3.71,   /* "Almost every paper figure": the paper's Figure 1 replaces ours */
    fig1: 5.9,     /* "figure one": zoom to the decoder column */
    ours: 6.7,     /* "Attention Is All You Need": our figure fades back in over it */
    still: 7.7,    /* everything at rest: CANON */
  };
  const PULSE = 0.045, PULSE_LEN = 0.7;   // scale-only pulse, no colour change (no hero in this beat)
  const FADE = 0.6;
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const figure = document.getElementById("figure"), gf = document.getElementById("fig").getContext("2d");
  const paper = document.getElementById("paper");
  const labels = DG.makeLabels(figure);   // labels live with the figure canvas, so the two fade and pulse as one
  const { seg, lerp } = ISO, E = ISO.E();
  ISO.guides(root);

  // ---- the paper, as a sheet standing on the figure plane (same shear as the labels) ----
  // Image box inside the sheet: 679 x 1000 px at (PAD, PAD). A view is { s, ax, ay }: scale, and the image
  // fraction (ax, ay) that sits on the screen point `at`.
  const IMG_W = 679, IMG_H = 1000, PAD = 30;
  const centre = DG.pt(0, DG.TOP / 2);                     // middle of our column
  // paper's decoder column (image fractions x 0.52-0.90, y 0.06-0.88). Its main line is at x 0.677; its
  // Linear box is centred at y 0.1715 and its Output Embedding box at y 0.844.
  const P_LINEAR = 0.1715, P_EMBED = 0.844, P_MAIN_X = 0.677;
  const ourSpan = DG.Z.head - DG.Z.embed;                  // our Embed centre to our Linear centre, screen px
  const FULL = { s: 0.66, ax: 0.5, ay: 0.5, dy: -30 };     // the whole sheet, inside the stage (y 270-1050)
  // zoomed: the paper's Linear lies over our Linear, its Output Embedding over our Embed, main line on main line
  const ZOOM = { s: ourSpan / ((P_EMBED - P_LINEAR) * IMG_H), ax: P_MAIN_X, ay: (P_LINEAR + P_EMBED) / 2 };
  function placePaper(u, opacity) {
    const s = lerp(FULL.s, ZOOM.s, u), ax = lerp(FULL.ax, ZOOM.ax, u), ay = lerp(FULL.ay, ZOOM.ay, u);
    const lx = PAD + ax * IMG_W, ly = PAD + ay * IMG_H;    // the anchor, in the sheet's own px
    const tx = centre[0] - s * lx, ty = centre[1] + lerp(FULL.dy, 0, u) - s * (DG.SHEAR * lx + ly);
    paper.style.transform = `matrix(${s.toFixed(5)}, ${(s * DG.SHEAR).toFixed(5)}, 0, ${s.toFixed(5)}, ${tx.toFixed(2)}, ${ty.toFixed(2)})`;
    paper.style.opacity = opacity.toFixed(3);
  }
  figure.style.transformOrigin = `${centre[0].toFixed(1)}px ${centre[1].toFixed(1)}px`;

  function render(t) {
    const pulse = Math.sin(Math.PI * seg(t, CUE.grammar, CUE.grammar + PULSE_LEN));
    const paperIn = E.io(seg(t, CUE.paper, CUE.paper + FADE)), paperOut = E.io(seg(t, CUE.ours + 0.2, CUE.still));
    const oursOut = E.io(seg(t, CUE.paper, CUE.paper + FADE - 0.2)), oursIn = E.io(seg(t, CUE.ours, CUE.ours + FADE));
    const a = t < CUE.fig1 ? 1 - oursOut : oursIn;        // our figure's opacity
    const pa = paperIn * (1 - paperOut);
    placePaper(E.io(seg(t, CUE.fig1, CUE.fig1 + 0.75)), pa);
    if (a >= 1 && pa <= 0 && pulse < 1e-6) {               // at rest: exactly CANON on the one canvas
      gf.clearRect(0, 0, 1080, 1920); figure.style.opacity = "1"; figure.style.transform = "none";
      DG.canon(g, labels); return;
    }
    // otherwise the ground stays below, the paper sits on it, and the figure is drawn on its own layer on top
    ISO.ground(g, DG.BASE_Y + 8);
    gf.clearRect(0, 0, 1080, 1920); DG.draw(gf, {}); DG.styleLabels(labels, {});
    figure.style.opacity = a.toFixed(3);
    figure.style.transform = `scale(${(1 + PULSE * pulse).toFixed(5)})`;
  }
  // HyperFrames' static lint looks for this registration in the beat file itself.
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
