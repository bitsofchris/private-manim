<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <!-- Beat 5, feed-forward: three separate machines, one per token line.
         Opens on CANON(afterAttn), ends on CANON(afterFfn). -->
    <script src="vendor/gsap.min.js"></script>
    <script src="iso/iso.js"></script>
    <style>
      @font-face {
        font-family: "Inter"; font-style: normal; font-weight: 800; font-display: block;
        src: url("vendor/Inter-ExtraBold.woff2") format("woff2");
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0b14;
              font-family: "Inter", sans-serif; font-weight: 800; color: #ecebe4; }
      #scene { position: absolute; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.45" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="scene" width="1080" height="1920" data-layout-allow-overflow></canvas>
    </div>
    <script>
(() => {
  const BEAT_SECONDS = 11.45;
  // Beat-local cues, checked against vo_final.wav 34.50-45.95 (silencedetect + captions.json).
  const CUE = {
    first: 0.0,      /* "A feed forward (network)": the first machine rises */
    others: 1.0,     /* "network then works": the other two rise, apart */
    alone: 2.3,      /* "each token alone" (2.46-2.75): each line drops its three numbers into its own machine */
    combine: 3.85,   /* "combinations of features" */
    amplify: 5.2,    /* "amplifying" */
    kink: 7.45,      /* "a non-linearity" (7.50-8.33) */
    depend: 8.85,    /* "that lets the choice": the signal runs through every machine */
    back: 9.45,      /* "choice depend on": results rise back to the tray */
    tick: 9.85,      /* "depend on the input": tiles and digits tick to afterFfn */
    leave: 10.35,    /* the machines go */
    still: 11.05,    /* everything at rest from here */
  };
  const { P, COL, css, mix, seg, lerp, VALUES } = ISO;
  const E = ISO.E();
  const root = document.getElementById("root"), g = document.getElementById("scene").getContext("2d");
  const card = ISO.makeCard(root);
  ISO.guides(root);

  // ---- the three machines: upright panels standing on the floor ----
  const PAN = { w: 215, gap: 45, y: 17, depth: 14, h: 175 };
  const RISE_AT = [CUE.first, CUE.others, CUE.others + 0.35];
  const ROWS = [{ n: 3, z: 140, step: 60, r: 13 }, { n: 5, z: 88, step: 42, r: 11 }, { n: 3, z: 36, step: 60, r: 13 }];
  const HERO = { machine: 2, hidden: 4, inputs: [0, 1] };   // the "is" machine learns one combination
  const panelX0 = (i) => -(3 * PAN.w + 2 * PAN.gap) / 2 + i * (PAN.w + PAN.gap);
  // a point on machine i's front face: u along the panel, z up from the floor
  const face = (i, u, z) => P(panelX0(i) + u, PAN.y + PAN.depth, z, ISO.GROUND_Y);
  const node = (i, layer, k) => { const R = ROWS[layer]; return face(i, PAN.w / 2 + (k - (R.n - 1) / 2) * R.step, R.z); };
  const tileTop = (c, r, vals) => ISO.tilePoint(c, r, ISO.PLATE + ISO.tileHeight(vals[c][r]));
  const along = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];

  function line(a, b, style, width) {
    g.strokeStyle = style; g.lineWidth = width; g.lineCap = "round";
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  function dot(p, r, fill, stroke) {
    g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI * 2); g.fillStyle = fill; g.fill();
    if (stroke) { g.strokeStyle = stroke; g.lineWidth = 3; g.stroke(); }
  }
  function panel(i, h) {
    const x0 = panelX0(i), x1 = x0 + PAN.w, yb = PAN.y, yf = PAN.y + PAN.depth, oy = ISO.GROUND_Y;
    ISO.poly(g, [P(x0 - 10, yf, 0, oy), P(x1 + 10, yf, 0, oy), P(x1 + 10, yf + 46, 0, oy), P(x0 - 10, yf + 46, 0, oy)], css(COL.data, 1, 0.07 * h / PAN.h));
    ISO.poly(g, [P(x1, yb, h, oy), P(x1, yf, h, oy), P(x1, yf, 0, oy), P(x1, yb, 0, oy)], css(COL.slabA));
    ISO.poly(g, [P(x0, yb, h, oy), P(x1, yb, h, oy), P(x1, yf, h, oy), P(x0, yf, h, oy)], css(COL.slabTop));
    ISO.poly(g, [P(x0, yf, 0, oy), P(x1, yf, 0, oy), P(x1, yf, h, oy), P(x0, yf, h, oy)], css([24, 25, 56]), css(COL.slabEdge, 1, 0.75));
  }
  // a bright dash travelling along a -> b as u goes 0 -> 1
  function flashEdge(a, b, u, style, width) {
    if (u <= 0 || u >= 1) return;
    line(along(a, b, Math.max(0, u - 0.35)), along(a, b, u), style, width);
  }
  function traveller(a, b, u, r) {
    if (u <= 0 || u >= 1) return;
    const p = along(a, b, u);
    line(along(a, b, Math.max(0, u - 0.22)), p, css(COL.data, 1, 0.45), 5);
    dot(p, r, css(mix(COL.data, COL.text, 0.35)));
  }

  function machine(i, t, valsNow) {
    const leave = E.inn(seg(t, CUE.leave + 0.2, CUE.leave + 0.65));
    const h = PAN.h * E.out(seg(t, RISE_AT[i], RISE_AT[i] + 0.7)) * (1 - leave);
    if (h < 0.5) return;
    panel(i, h);
    const a = seg(t, RISE_AT[i] + 0.5, RISE_AT[i] + 0.9) * (1 - seg(t, CUE.leave, CUE.leave + 0.3));
    if (a <= 0) return;
    const isHero = i === HERO.machine;
    const landed = seg(t, CUE.alone + 0.55 + 0.05 * i, CUE.alone + 0.75 + 0.05 * i);      // inputs hold the token's numbers
    const run = seg(t, CUE.depend, CUE.depend + 0.6);                                     // the signal runs down
    const outLit = seg(t, CUE.depend + 0.45, CUE.depend + 0.7);
    const combo = (k) => (isHero ? E.io(seg(t, CUE.combine + 0.25 * k, CUE.combine + 0.6 + 0.25 * k)) : 0);
    const grow = isHero ? E.back(seg(t, CUE.amplify + 0.05, CUE.amplify + 0.7)) : 0;
    const carry = isHero ? E.io(seg(t, CUE.amplify + 0.55, CUE.amplify + 1.15)) : 0;       // the amplified unit drives the outputs
    g.save(); g.globalAlpha = a;
    // edges, input -> hidden -> output
    for (let layer = 0; layer < 2; layer++)
      for (let p = 0; p < ROWS[layer].n; p++)
        for (let q = 0; q < ROWS[layer + 1].n; q++)
          line(node(i, layer, p), node(i, layer + 1, q), css(COL.dim, 1, 0.42), 2.5);
    if (isHero) {
      const hid = node(i, 1, HERO.hidden);
      for (let q = 0; q < 3; q++) if (carry > 0) line(hid, along(hid, node(i, 2, q), carry), css(COL.hero, 1, 0.75), 4);
      HERO.inputs.forEach((p, k) => { const u = combo(k); if (u > 0) line(node(i, 0, p), along(node(i, 0, p), hid, u), css(COL.hero), 6 + 2 * grow); });
    }
    for (let layer = 0; layer < 2; layer++) {
      const u = seg(run, layer * 0.5, layer * 0.5 + 0.5) * 1.35;
      for (let p = 0; p < ROWS[layer].n; p++)
        for (let q = 0; q < ROWS[layer + 1].n; q++)
          flashEdge(node(i, layer, p), node(i, layer + 1, q), u, css(mix(COL.data, COL.text, 0.3), 1, 0.9), 4);
    }
    // nodes
    const pop = 1 + 0.35 * Math.sin(Math.PI * landed);
    for (let k = 0; k < 3; k++) dot(node(i, 0, k), ROWS[0].r * pop, css(mix(COL.muted, COL.tokens[i], landed)), css(COL.bg));
    const hidGlow = Math.sin(Math.PI * seg(run, 0.35, 0.75));
    for (let k = 0; k < 5; k++) {
      const hero = isHero && k === HERO.hidden, c2 = hero ? combo(1) : 0;
      const col = mix(mix(COL.dim, COL.data, hidGlow * 0.8), COL.hero, c2);
      const r = ROWS[1].r * (1 + (hero ? 0.8 * grow : 0));
      if (hero) {
        const ring = seg(t, CUE.amplify + 0.1, CUE.amplify + 0.9);
        if (ring > 0 && ring < 1) { g.beginPath(); g.arc(...node(i, 1, k), r + 30 * ring, 0, Math.PI * 2); g.strokeStyle = css(COL.hero, 1, 0.8 * (1 - ring)); g.lineWidth = 4; g.stroke(); }
      }
      dot(node(i, 1, k), r, css(col), css(COL.bg));
    }
    const outPop = 1 + 0.35 * Math.sin(Math.PI * outLit);
    for (let k = 0; k < 3; k++) dot(node(i, 2, k), ROWS[2].r * outPop, css(mix(COL.muted, COL.tokens[i], outLit)), css(COL.bg));
    g.restore();
  }

  // the ReLU kink: a chip above the hero machine, tied to the amplified unit
  function kink(t) {
    const a = seg(t, CUE.kink, CUE.kink + 0.2) * (1 - seg(t, CUE.leave, CUE.leave + 0.3));
    if (a <= 0) return;
    const unit = node(HERO.machine, 1, HERO.hidden), top = face(HERO.machine, PAN.w / 2 + 2 * ROWS[1].step, PAN.h);
    const cx = unit[0], cy = top[1] - 70, w = 124, h = 88, s = 0.6 + 0.4 * E.back(seg(t, CUE.kink, CUE.kink + 0.4));
    g.save(); g.globalAlpha = a;
    const lead = E.out(seg(t, CUE.kink, CUE.kink + 0.35));
    const from = [unit[0], unit[1] - ROWS[1].r * 1.8 - 4];
    line(from, along(from, [cx, cy + h / 2], lead), css(COL.hero, 1, 0.9), 4);
    g.translate(cx, cy); g.scale(s, s);
    g.beginPath(); g.roundRect(-w / 2, -h / 2, w, h, 16); g.fillStyle = css(COL.panel); g.fill();
    g.strokeStyle = css(COL.hero); g.lineWidth = 5; g.stroke();
    // two segments: flat, then rising
    const pts = [[-40, 20], [-4, 20], [40, -24]], u = E.io(seg(t, CUE.kink + 0.2, CUE.kink + 0.85)) * 2;
    g.strokeStyle = css(COL.hero); g.lineWidth = 9; g.lineCap = "round"; g.lineJoin = "round"; g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
    if (u > 0) { const p = along(pts[0], pts[1], Math.min(1, u)); g.lineTo(p[0], p[1]); }
    if (u > 1) { const p = along(pts[1], pts[2], u - 1); g.lineTo(p[0], p[1]); }
    g.stroke();
    g.restore();
  }

  function render(t) {
    t = Math.min(t, CUE.still);
    const A = VALUES.afterAttn, B = VALUES.afterFfn;
    const u = E.io(seg(t, CUE.tick, CUE.tick + 0.75));
    const vals = u <= 0 ? A : u >= 1 ? B : ISO.lerpVals(A, B, u);
    ISO.ground(g);
    ISO.shadow(g, ISO.P2);
    ISO.tray(g, vals);
    card.set(vals, { flash: 0.6 * Math.sin(Math.PI * u) });
    for (let i = 0; i < 3; i++) machine(i, t, vals);
    kink(t);
    for (let i = 0; i < 3; i++) for (let r = 0; r < 3; r++) {
      // down: each token line hands its three numbers to its own machine
      traveller(tileTop(i, r, A), node(i, 0, r), E.io(seg(t, CUE.alone + 0.05 * i, CUE.alone + 0.65 + 0.05 * i)), 10);
      // back up: each machine's three results return to its own line
      traveller(node(i, 2, r), tileTop(i, r, A), E.io(seg(t, CUE.back + 0.06 * i, CUE.back + 0.6 + 0.06 * i)), 10);
    }
  }
  // HyperFrames' static lint looks for this registration in the beat file itself.
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = ISO.start(BEAT_SECONDS, render);
})();
    </script>
  </body>
</html>
